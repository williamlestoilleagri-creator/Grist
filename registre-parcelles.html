<!DOCTYPE html>
<html lang="fr" data-fr-scheme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registre des parcelles</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.12.1/dist/dsfr.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.12.1/dist/utility/icons/icons.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root { --bf: #000091; --bf-975: #f5f5fe; --bf-950: #ececfe; --titre: #161616; --texte: #3a3a3a; --mention: #666; --bord: #ddd; --alt: #f6f6f6; --gris: #eee; }
  body { background: #fff; }
  .mast { padding: 1.25rem 0 1rem; border-bottom: 1px solid var(--bord); }
  .mention { color: var(--mention); }
  .cartes { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: .6rem; margin: 1.25rem 0; }
  .carte { text-align: left; border: 1px solid var(--bord); border-top: 4px solid var(--bf); background: #fff; padding: .6rem .8rem; cursor: pointer; font: inherit; color: inherit; }
  .carte:hover, .carte:focus-visible { box-shadow: 0 4px 12px rgba(0,0,18,.16); }
  .carte.on { background: var(--bf-975); outline: 2px solid var(--bf); }
  .carte .val { font-size: 1.6rem; font-weight: 700; color: var(--titre); line-height: 1.15; display: block; font-variant-numeric: tabular-nums; }
  .carte .lib { font-size: .8rem; color: var(--titre); display: block; font-weight: 500; }
  .carte .det { font-size: .72rem; color: var(--mention); display: block; }
  .filtres { background: var(--alt); padding: .75rem 1rem .25rem; margin-bottom: 1rem; border-left: 4px solid var(--bf); }
  .filtres .fr-select-group, .filtres .fr-input-group { margin-bottom: .6rem; }
  .filtres .fr-label { font-size: .78rem; }
  .barre { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; margin-bottom: .75rem; }
  .vues { display: inline-flex; }
  .vues button { border: 1px solid var(--bf); background: #fff; color: var(--bf); padding: .4rem 1rem; font-weight: 700; cursor: pointer; }
  .vues button + button { margin-left: -1px; }
  .vues button[aria-pressed="true"] { background: var(--bf); color: #fff; }
  .compte { color: var(--mention); font-size: .85rem; margin-left: auto; }
  .tab-wrap { overflow-x: auto; border: 1px solid var(--bord); }
  table.tb { width: 100%; border-collapse: collapse; font-size: .84rem; }
  .tb th { background: var(--gris); color: var(--titre); text-align: left; padding: .5rem .55rem; border-bottom: 2px solid var(--texte); white-space: nowrap; }
  .tb td { padding: .4rem .55rem; border-bottom: 1px solid var(--bord); vertical-align: top; }
  .tb tr.farm { cursor: pointer; } .tb tr.farm:hover td { background: var(--bf-975); }
  .tb tr.ouvert > td { background: var(--bf-950); }
  .tb tr.sous > td { background: var(--alt); padding: .5rem .75rem 1rem 2rem; }
  .tb .num { text-align: right; font-variant-numeric: tabular-nums; }
  .tb .cle { font-weight: 700; color: var(--titre); white-space: nowrap; }
  .coord { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .8rem; white-space: nowrap; }
  .geo { white-space: nowrap; }
  .geo a, .geo button { font-size: .72rem; margin-right: .4rem; }
  .geo button { background: none; border: 0; padding: 0; color: var(--bf); text-decoration: underline; cursor: pointer; font: inherit; font-size: .72rem; }
  .sans { color: #b34000; font-size: .78rem; font-style: italic; }
  .b { display: inline-block; font-size: .68rem; font-weight: 700; text-transform: uppercase; padding: 0 .4rem; line-height: 1.35rem; border-radius: 4px; white-space: nowrap; }
  .sub { font-size: .75rem; color: var(--mention); }
  .plus { margin: .75rem 0; }
  #carte { height: 620px; border: 1px solid var(--bord); }
  .legende { display: flex; flex-wrap: wrap; gap: .25rem 1rem; font-size: .78rem; margin: .5rem 0; }
  .legende i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: .3rem; vertical-align: -1px; }
  .vide { color: var(--mention); font-style: italic; padding: 1rem; }
</style>
</head>
<body>
<div class="fr-container fr-py-3w">
  <div class="mast">
    <div class="fr-grid-row fr-grid-row--gutters fr-grid-row--middle">
      <div class="fr-col-12 fr-col-md-8">
        <p class="fr-badge fr-badge--sm fr-badge--info fr-mb-2w">Campagne reliquats azotés 2026</p>
        <h1 class="fr-h3 fr-mb-1v">Registre des parcelles</h1>
        <p class="fr-text--sm fr-mb-0 mention">Parcelles des dossiers reçus retenues pour un prélèvement, avec leurs coordonnées géographiques.</p>
      </div>
      <div class="fr-col-12 fr-col-md-4" style="text-align:right">
        <p class="fr-text--sm fr-mb-1w mention" id="maj">Connexion à Grist…</p>
        <button type="button" class="fr-btn fr-btn--secondary fr-btn--sm fr-btn--icon-left fr-icon-refresh-line" id="rafraichir">Rafraîchir</button>
      </div>
    </div>
  </div>
  <div id="avis"></div>
  <div class="cartes" id="cartes"></div>
  <div class="filtres">
    <div class="fr-grid-row fr-grid-row--gutters">
      <div class="fr-col-12 fr-col-md-4"><div class="fr-input-group"><label class="fr-label" for="fq">Recherche</label><input class="fr-input" type="search" id="fq" placeholder="CLE, PACAGE, exploitation, commune…"></div></div>
      <div class="fr-col-6 fr-col-md-2"><div class="fr-select-group"><label class="fr-label" for="fDpt">Département</label><select class="fr-select" id="fDpt"></select></div></div>
      <div class="fr-col-6 fr-col-md-2"><div class="fr-select-group"><label class="fr-label" for="fPre">Prélèvement</label><select class="fr-select" id="fPre"></select></div></div>
      <div class="fr-col-6 fr-col-md-2"><div class="fr-select-group"><label class="fr-label" for="fCtl">Contrôle</label><select class="fr-select" id="fCtl"></select></div></div>
      <div class="fr-col-6 fr-col-md-2"><div class="fr-select-group"><label class="fr-label" for="fGeo">Coordonnées</label><select class="fr-select" id="fGeo"><option value="">Toutes</option><option value="oui">Avec</option><option value="non">Sans</option></select></div></div>
    </div>
  </div>
  <div class="barre">
    <div class="vues" role="group" aria-label="Vue"><button type="button" data-vue="parc" aria-pressed="true">Par parcelle</button><button type="button" data-vue="expl" aria-pressed="false">Par exploitation</button><button type="button" data-vue="carte" aria-pressed="false">Carte</button></div>
    <button type="button" class="fr-btn fr-btn--sm fr-btn--tertiary-no-outline fr-icon-close-line fr-btn--icon-left" id="raz">Effacer les filtres</button>
    <button type="button" class="fr-btn fr-btn--sm fr-btn--secondary fr-icon-download-line fr-btn--icon-left" id="csv">Exporter (CSV)</button>
    <span class="compte" id="compte"></span>
  </div>
  <div id="vue"><p class="mention">Chargement des données…</p></div>
  <div id="vueCarte" hidden><div class="legende" id="legende"></div><div id="carte"></div></div>
  <p class="fr-text--xs fr-mt-3w mention" id="pied"></p>
</div>

<script>
(function () {
'use strict';

/* ============================================================
   PARAMÈTRES
   ============================================================ */
const T_REL = 'DATA_RELIQUATCLEAN';          // dossiers reçus : une ligne par parcelle
const T_RDV = 'RDV_Prelevements', T_SUITE = 'Suites_RDV', T_PREL = 'DATA_Preleveur', T_INSP = 'DATA_Inspecteur';
const GRILLES = ['Q_QUADHYDRO', 'Q_TAR_MANUELLE'];
// tables où chercher les coordonnées, par ordre de priorité : [table, colonne clé]
const GEO = [['DATA_Parcelles_DEF', ['CLE', 'Cle2_2']], ['Parc_REF_coord', ['CLE']], ['Plan_prelevements_labos', ['CLELAB']], ['Centrodes', ['CLE']],
  ['Parcelles_Reliquats', ['CLE_CALCULEE', 'CLE']], ['DATA_Parcelle_10aout', ['CLE']], [T_REL, ['CLELAB']]];
const DPT = {'22': 'Côtes-d’Armor', '29': 'Finistère', '35': 'Ille-et-Vilaine', '56': 'Morbihan'};
const PRE = [{k: 'Prélevée', hex: '#18753c'}, {k: 'Non prélevable', hex: '#ce0500'}, {k: 'RDV pris', hex: '#0063cb'}, {k: 'À planifier', hex: '#929292'}];
const CTL = [{k: 'Contrôlée', hex: '#18753c'}, {k: 'Contrôle prévu', hex: '#6a6af4'}, {k: 'Non prévu', hex: '#929292'}];

/* ============================================================
   OUTILS
   ============================================================ */
const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const isErr = v => Array.isArray(v) && v[0] === 'E';
const clean = v => (v === null || v === undefined || isErr(v)) ? '' : String(v).trim();
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const fmt = n => (n ?? 0).toLocaleString('fr-FR');
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const keyNorm = s => String(s || '').trim().replace(/[\s|/_.;,]+/g, '-').split('-').filter(Boolean).map(p => p.replace(/^0+(?=\d)/, '')).join('-').toLowerCase();
const pacNorm = v => { const s = clean(v).replace(/\s+/g, '').replace(/\.0+$/, ''); return /^\d{1,9}$/.test(s) ? s.padStart(9, '0') : s; };
const keyAff = k => { const [p, ...r] = k.split('-'); return [pacNorm(p)].concat(r).join('-'); };
const dptOf = pac => { const m = /^0([1-9]\d)\d{6}$/.exec(pac); return m ? m[1] : ''; };
const dptLib = d => d ? (DPT[d] ? d + ' · ' + DPT[d] : d) : 'Inconnu';
const dateHeure = sec => sec ? new Date(sec * 1000).toLocaleString('fr-FR', {timeZone: 'Europe/Paris', dateStyle: 'short', timeStyle: 'short'}) : '';
const dateFr = sec => sec ? new Date(sec * 1000).toLocaleDateString('fr-FR', {timeZone: 'UTC'}) : '';
const personne = p => p ? [clean(p.Prenom), clean(p.Nom)].filter(Boolean).join(' ') || clean(p.Nom_complet) : '';
const ouiNon = v => { if (v === true) return 'oui'; if (v === false) return 'non'; const n = norm(v).trim(); if (!n) return '';
  if (/^(non|n|0|false|pas|impossible|refus|non preleve)/.test(n)) return 'non'; if (/^(oui|o|x|1|true|fait|preleve|realise)/.test(n)) return 'oui'; return ''; };
function rows(col) { if (!col || !col.id) return []; const ks = Object.keys(col); return col.id.map((_, i) => { const r = {}; ks.forEach(k => { r[k] = col[k][i]; }); return r; }); }
const badge = (list, k) => { const e = list.find(x => x.k === k) || {hex: '#929292'}; return `<span class="b" style="background:${e.hex}1f;color:${e.hex}">${esc(k)}</span>`; };
const filled = v => v !== null && v !== undefined && v !== '' && v !== 0 && !isErr(v);
// coordonnées d'une ligne : colonnes latitude / longitude, ou « lat, lon » dans une colonne GPS
const numFr = v => typeof v === 'number' ? v : parseFloat(String(v ?? '').trim().replace(',', '.'));
function latLon(r) {
  if (!r) return null;
  let lat = NaN, lon = NaN;
  for (const c in r) { const n = c.toLowerCase(); if (/^(lat|latitude)$/.test(n)) lat = numFr(r[c]); else if (/^(lon|lng|long|longitude)$/.test(n)) lon = numFr(r[c]); }
  if (!(isFinite(lat) && isFinite(lon))) for (const c in r) if (/^(gps|coord|coordonnees|coordonnees_gps)$/i.test(c)) {
    const m = /(-?\d+[.,]\d+)\s*[;, ]\s*(-?\d+[.,]\d+)/.exec(clean(r[c])); if (m) { lat = numFr(m[1]); lon = numFr(m[2]); break; } }
  return isFinite(lat) && isFinite(lon) && lat && lon && Math.abs(lat) <= 90 && Math.abs(lon) <= 180 ? {lat, lon} : null;
}
const coordTxt = g => g ? g.lat.toFixed(6) + ', ' + g.lon.toFixed(6) : '';

/* ============================================================
   DONNÉES
   ============================================================ */
const D = {meta: {}, parcs: [], farms: [], exclues: 0, filtreGarder: false};
const F = {q: '', dpt: '', pre: '', ctl: '', geo: '', carte: ''};
let vue = 'parc', limite = 300, ouverts = new Set();
try { vue = localStorage.getItem('registre-vue') || 'parc'; } catch (e) { /* stockage indisponible */ }

async function lire(t) { if (!D.meta[t]) return []; try { return rows(await grist.docApi.fetchTable(t)); } catch (e) { console.warn('Table indisponible :', t, e); return []; } }
async function lireMeta() {
  const T = await grist.docApi.fetchTable('_grist_Tables'), C = await grist.docApi.fetchTable('_grist_Tables_column'), byRow = {}, meta = {};
  T.id.forEach((rid, i) => { const t = T.tableId[i]; if (t && !t.startsWith('_grist')) { byRow[rid] = t; meta[t] = {}; } });
  C.id.forEach((cid, i) => { const t = byRow[C.parentId[i]]; if (t) meta[t][C.colId[i]] = {type: C.type[i] || 'Any'}; });
  return meta;
}

async function charger() {
  $('rafraichir').disabled = true; $('maj').textContent = 'Actualisation…';
  D.meta = await lireMeta();
  if (!D.meta[T_REL]) { $('avis').innerHTML = `<div class="fr-alert fr-alert--error fr-alert--sm"><p>Table ${T_REL} introuvable.</p></div>`; return; }
  const geoT = GEO.map(g => g[0]).filter((t, i, a) => a.indexOf(t) === i);
  const noms = [T_REL, T_RDV, T_SUITE, T_PREL, T_INSP].concat(GRILLES, geoT).filter((t, i, a) => a.indexOf(t) === i);
  const res = await Promise.all(noms.map(lire)), tb = {}; noms.forEach((t, i) => { tb[t] = res[i]; });
  construire(tb);
  remplirFiltres(); afficher();
  $('avis').innerHTML = D.exclues ? `<div class="fr-alert fr-alert--info fr-alert--sm fr-mb-2w"><p>${fmt(D.exclues)} parcelle(s) de ${T_REL} ne sont pas affichées : « A garder dans la campagne » = non.</p></div>` : '';
  $('maj').textContent = 'Mis à jour à ' + new Date().toLocaleTimeString('fr-FR', {hour: '2-digit', minute: '2-digit'});
  $('rafraichir').disabled = false;
}

function construire(tb) {
  const prelById = new Map(tb[T_PREL].map(p => [p.id, p])), inspById = new Map(tb[T_INSP].map(p => [p.id, p]));
  const relById = new Map(tb[T_REL].map(r => [r.id, r])), defById = new Map((tb.DATA_Parcelles_DEF || []).map(r => [r.id, r]));
  // coordonnées par clé, de la table la plus fiable à la moins fiable
  const geo = new Map();
  for (const [t, kcs] of GEO) for (const r of tb[t] || []) { const g = latLon(r); if (!g) continue;
    for (const kc of kcs) { const k = keyNorm(clean(r[kc])); if (k && !geo.has(k)) geo.set(k, Object.assign({src: t}, g)); } }
  // rendez-vous : la ligne la plus renseignée par parcelle (évite les doublons vides des parcelles de référence)
  const keyRdv = r => { const v = r.Cle_parcelle; if (typeof v === 'number') { const d = defById.get(v) || relById.get(v); return d ? clean(d.CLE) || clean(d.CLELAB) : ''; } return clean(v); };
  const score = r => (filled(r.Date_RDV) ? 100 : 0) + (filled(r.Statut) ? 50 : 0) + (filled(r.Preleveur) ? 20 : 0) + (filled(r.Inspecteur) ? 10 : 0);
  const rdvBy = new Map();
  tb[T_RDV].forEach(r => { const k = keyNorm(keyRdv(r)), ex = rdvBy.get(k); if (k && (!ex || score(r) > score(ex) || (score(r) === score(ex) && r.id > ex.id))) rdvBy.set(k, r); });
  const suiBy = new Map(); tb[T_SUITE].forEach(r => { const k = keyNorm(r.CLE_pacage_ilot_parcelle_); if (k) (suiBy.get(k) || suiBy.set(k, []).get(k)).push(r); });
  const ctlBy = new Map();
  GRILLES.forEach(t => (tb[t] || []).forEach(r => { const v = r.Cle_PACAGE_ilot_parcelle, d = typeof v === 'number' ? relById.get(v) : null, k = keyNorm(d ? clean(d.CLELAB) : clean(v));
    if (k) (ctlBy.get(k) || ctlBy.set(k, []).get(k)).push({t, date: r.Date, insp: personne(inspById.get(r.Controleur))}); }));
  // périmètre : dossiers reçus, hors parcelles explicitement retirées de la campagne
  const garderCol = (D.meta[T_REL] || {}).A_garder_dans_la_campagne ? 'A_garder_dans_la_campagne' : '';
  D.filtreGarder = !!garderCol && tb[T_REL].some(r => ouiNon(r[garderCol]) === 'oui');
  D.exclues = 0;
  const vus = new Map(), now = Date.now() / 1000;
  for (const r of tb[T_REL]) {
    const k = keyNorm(clean(r.CLELAB)); if (!/^\d+-\d+-\d+/.test(k)) continue;
    if (D.filtreGarder && ouiNon(r[garderCol]) === 'non') { D.exclues++; continue; }
    if (vus.has(k)) continue;
    const pac = pacNorm(r.PACAGE || k.split('-')[0]), rdv = rdvBy.get(k) || null, su = suiBy.get(k) || [], on = su.map(s => ouiNon(s.Prelevement_fait)), ct = ctlBy.get(k) || [];
    const P = {k, key: keyAff(k), pac, dpt: dptOf(pac), nom: clean(r.Nom_exploitation) || clean(r.Raison_sociale) || '', commune: clean(r.Ville) || clean(r.Commune),
      culture: clean(r.Culture_2026), geo: geo.get(k) || null, rdv, date: rdv && typeof rdv.Date_RDV === 'number' ? rdv.Date_RDV : null,
      prel: rdv ? personne(prelById.get(rdv.Preleveur)) : '', inspPrevu: rdv ? personne(inspById.get(rdv.Inspecteur)) : '', ctls: ct,
      raisonNP: su.map(s => clean(s.raison_de_non_prelevement)).filter(Boolean).join(' ; ')};
    P.pre = on.includes('oui') ? 'Prélevée' : on.includes('non') ? 'Non prélevable' : P.date ? 'RDV pris' : 'À planifier';
    P.ctl = ct.length ? 'Contrôlée' : P.inspPrevu ? 'Contrôle prévu' : 'Non prévu';
    P.txt = norm([P.key, P.k, P.pac, P.nom, P.commune, P.prel, P.culture].join(' '));
    vus.set(k, P);
  }
  D.parcs = [...vus.values()].sort((a, b) => a.pac.localeCompare(b.pac) || a.k.localeCompare(b.k, 'fr', {numeric: true}));
  const fm = new Map();
  D.parcs.forEach(P => { let f = fm.get(P.pac); if (!f) fm.set(P.pac, f = {pac: P.pac, dpt: P.dpt, nom: P.nom, commune: P.commune, parcs: []}); f.parcs.push(P); if (!f.nom) f.nom = P.nom; });
  D.farms = [...fm.values()].map(f => { const g = f.parcs.filter(P => P.geo); if (!f.nom) f.nom = 'PACAGE ' + f.pac;
    f.centre = g.length ? {lat: g.reduce((s, P) => s + P.geo.lat, 0) / g.length, lon: g.reduce((s, P) => s + P.geo.lon, 0) / g.length} : null; return f; })
    .sort((a, b) => a.dpt.localeCompare(b.dpt) || a.nom.localeCompare(b.nom, 'fr'));
}

/* ============================================================
   FILTRES ET VUES
   ============================================================ */
const CARTES = [
  ['', 'Parcelles à prélever', () => true, '#000091'],
  ['geo', 'Avec coordonnées', P => !!P.geo, '#18753c'],
  ['nogeo', 'Sans coordonnées', P => !P.geo, '#b34000'],
  ['pre', 'Prélevées', P => P.pre === 'Prélevée', '#18753c'],
  ['rdv', 'RDV pris', P => P.pre === 'RDV pris', '#0063cb'],
  ['plan', 'À planifier', P => P.pre === 'À planifier', '#929292'],
  ['prev', 'Contrôle prévu', P => P.ctl === 'Contrôle prévu', '#6a6af4'],
  ['ctl', 'Contrôlées', P => P.ctl === 'Contrôlée', '#18753c']
];
const ok = (P, sansCarte) => (!F.q || P.txt.includes(norm(F.q.trim()))) && (!F.dpt || P.dpt === F.dpt) && (!F.pre || P.pre === F.pre) && (!F.ctl || P.ctl === F.ctl)
  && (!F.geo || (F.geo === 'oui') === !!P.geo) && (sansCarte || !F.carte || CARTES.find(c => c[0] === F.carte)[2](P));
function remplirFiltres() {
  const opt = (id, vals, cur, tous, lib) => { $(id).innerHTML = `<option value="">${tous}</option>` + vals.map(v => `<option value="${esc(v)}"${v === cur ? ' selected' : ''}>${esc(lib ? lib(v) : v)}</option>`).join(''); };
  opt('fDpt', [...new Set(D.parcs.map(P => P.dpt).filter(Boolean))].sort(), F.dpt, 'Tous', dptLib);
  opt('fPre', PRE.map(e => e.k), F.pre, 'Tous'); opt('fCtl', CTL.map(e => e.k), F.ctl, 'Tous');
}
const geoCell = g => g ? `<span class="coord">${g.lat.toFixed(6)}<br>${g.lon.toFixed(6)}</span>` : '<span class="sans">non renseignées</span>';
const geoLiens = g => g ? `<span class="geo"><a href="https://www.google.com/maps?q=${g.lat},${g.lon}" target="_blank" rel="noopener">Google Maps</a><a href="https://www.geoportail.gouv.fr/carte?c=${g.lon},${g.lat}&z=17&l0=ORTHOIMAGERY.ORTHOPHOTOS::GEOPORTAIL:OGC:WMTS(1)&l1=CADASTRALPARCELS.PARCELLAIRE_EXPRESS::GEOPORTAIL:OGC:WMTS(1)&permalink=yes" target="_blank" rel="noopener">Géoportail</a><button type="button" data-copie="${esc(coordTxt(g))}">Copier</button></span>` : '';
function tableParcelles(list, avecExpl) {
  return `<div class="tab-wrap"><table class="tb"><thead><tr><th>Parcelle (CLE)</th>${avecExpl ? '<th>Exploitation</th>' : ''}<th>Latitude<br>Longitude</th><th>Carte</th><th>Culture 2026</th><th>Prélèvement</th><th>Contrôle</th></tr></thead><tbody>
    ${list.map(P => `<tr><td class="cle">${esc(P.key)}</td>
      ${avecExpl ? `<td>${esc(P.nom)}<div class="sub">PACAGE ${esc(P.pac)}${P.commune ? ' · ' + esc(P.commune) : ''}</div></td>` : ''}
      <td>${geoCell(P.geo)}</td><td>${geoLiens(P.geo)}</td><td>${esc(P.culture)}</td>
      <td>${badge(PRE, P.pre)}${P.date ? `<div class="sub">${esc(dateHeure(P.date))}${P.prel ? ' · ' + esc(P.prel) : ''}</div>` : ''}${P.raisonNP ? `<div class="sub">${esc(P.raisonNP)}</div>` : ''}</td>
      <td>${badge(CTL, P.ctl)}${P.ctls.length ? P.ctls.map(c => `<div class="sub">${esc(dateFr(c.date))}${c.insp ? ' · ' + esc(c.insp) : ''}</div>`).join('') : P.inspPrevu ? `<div class="sub">${esc(P.inspPrevu)}</div>` : ''}</td></tr>`).join('')
      || `<tr><td colspan="7" class="vide">Aucune parcelle.</td></tr>`}</tbody></table></div>`;
}
function afficher() {
  document.querySelectorAll('[data-vue]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.vue === vue)));
  const base = D.parcs.filter(P => ok(P, true)), list = base.filter(P => ok(P));
  $('cartes').innerHTML = CARTES.map(([k, lib, f, c]) => { const n = base.filter(f).length;
    return `<button type="button" class="carte${F.carte === k && k ? ' on' : ''}" data-carte="${k}" style="border-top-color:${c}"><span class="val">${fmt(n)}</span><span class="lib">${esc(lib)}</span>
      <span class="det">${k ? pct(n, base.length) + ' %' : fmt(new Set(base.map(P => P.pac)).size) + ' exploitation(s)'}</span></button>`; }).join('');
  const pacs = new Set(list.map(P => P.pac)), farms = D.farms.filter(f => pacs.has(f.pac));
  $('vueCarte').hidden = vue !== 'carte'; $('vue').hidden = vue === 'carte';
  if (vue === 'parc') {
    $('compte').textContent = `${fmt(list.length)} parcelle(s) · ${fmt(pacs.size)} exploitation(s)`;
    $('vue').innerHTML = tableParcelles(list.slice(0, limite), true) + (list.length > limite ? `<p class="plus"><button type="button" class="fr-btn fr-btn--sm fr-btn--secondary" id="plus">Afficher ${fmt(Math.min(300, list.length - limite))} de plus (${fmt(list.length - limite)} restantes)</button></p>` : '');
  } else if (vue === 'expl') {
    $('compte').textContent = `${fmt(farms.length)} exploitation(s) · ${fmt(list.length)} parcelle(s)`;
    $('vue').innerHTML = `<div class="tab-wrap"><table class="tb"><thead><tr><th>Exploitation</th><th>Dpt</th><th class="num">Parcelles</th><th>Coordonnées (centre des parcelles)</th><th>Carte</th><th class="num">Géolocalisées</th><th class="num">Prélevées</th><th class="num">RDV pris</th><th class="num">Contrôlées</th></tr></thead><tbody>
      ${farms.slice(0, limite).map(f => { const ps = f.parcs.filter(P => ok(P)), open = ouverts.has(f.pac), n = t => ps.filter(t).length;
        return `<tr class="farm${open ? ' ouvert' : ''}" data-farm="${esc(f.pac)}"><td><b>${open ? '▾' : '▸'} ${esc(f.nom)}</b><div class="sub">PACAGE ${esc(f.pac)}${f.commune ? ' · ' + esc(f.commune) : ''}</div></td><td>${esc(f.dpt)}</td>
          <td class="num"><b>${ps.length}</b></td><td>${geoCell(f.centre)}</td><td>${geoLiens(f.centre)}</td><td class="num">${n(P => P.geo)} / ${ps.length}</td>
          <td class="num">${n(P => P.pre === 'Prélevée')}</td><td class="num">${n(P => P.pre === 'RDV pris')}</td><td class="num">${n(P => P.ctl === 'Contrôlée')}</td></tr>
          ${open ? `<tr class="sous"><td colspan="9">${tableParcelles(ps, false)}</td></tr>` : ''}`; }).join('') || '<tr><td colspan="9" class="vide">Aucune exploitation.</td></tr>'}</tbody></table></div>`
      + (farms.length > limite ? `<p class="plus"><button type="button" class="fr-btn fr-btn--sm fr-btn--secondary" id="plus">Afficher ${fmt(Math.min(300, farms.length - limite))} de plus</button></p>` : '');
  } else {
    const g = list.filter(P => P.geo);
    $('compte').textContent = `${fmt(g.length)} parcelle(s) placée(s) sur ${fmt(list.length)}`;
    dessinerCarte(g);
  }
  if ($('plus')) $('plus').onclick = () => { limite += 300; afficher(); };
  $('pied').textContent = `Périmètre : parcelles de ${T_REL} (dossiers reçus)${D.filtreGarder ? ', hors « A garder dans la campagne » = non' : ''}, une ligne par CLE. `
    + `Coordonnées prises dans : ${GEO.map(g => g[0]).filter(t => D.meta[t]).join(', ')} (dans cet ordre). Prélèvement : ${T_RDV} et ${T_SUITE} ; contrôle prévu : inspecteur du RDV ; contrôlée : grille d’évaluation saisie.`;
}

/* ---------- Carte (Leaflet / OpenStreetMap) ---------- */
let carte = null, couche = null;
function dessinerCarte(list) {
  $('legende').innerHTML = PRE.map(e => `<span><i style="background:${e.hex}"></i>${esc(e.k)}</span>`).join('') + '<span class="sub">Cliquez sur un point pour le détail.</span>';
  if (!window.L) { $('carte').innerHTML = '<p class="vide">La bibliothèque de carte n’a pas pu être chargée (cdnjs.cloudflare.com).</p>'; return; }
  if (!carte) {
    carte = L.map('carte', {preferCanvas: true}).setView([48.2, -2.9], 8);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 19, attribution: '© OpenStreetMap'}).addTo(carte);
  }
  setTimeout(() => carte.invalidateSize(), 50);
  if (couche) couche.remove();
  couche = L.layerGroup(list.map(P => L.circleMarker([P.geo.lat, P.geo.lon], {radius: 6, weight: 1, color: '#fff', fillOpacity: .9, fillColor: (PRE.find(e => e.k === P.pre) || {}).hex})
    .bindPopup(`<b>${esc(P.key)}</b><br>${esc(P.nom)}<br><span class="coord">${esc(coordTxt(P.geo))}</span><br>${esc(P.pre)}${P.date ? ' · ' + esc(dateHeure(P.date)) : ''}<br>${geoLiens(P.geo)}`))).addTo(carte);
  if (list.length) carte.fitBounds(L.latLngBounds(list.map(P => [P.geo.lat, P.geo.lon])).pad(.05), {maxZoom: 15});
}

/* ---------- Export ---------- */
function exporter() {
  const list = D.parcs.filter(P => ok(P));
  const H = ['CLE', 'PACAGE', 'Exploitation', 'Commune', 'Département', 'Latitude', 'Longitude', 'Source des coordonnées', 'Culture 2026', 'Prélèvement', 'Date RDV', 'Préleveur', 'Raison non prélèvement', 'Contrôle', 'Inspecteur'];
  const L2 = list.map(P => [P.key, P.pac, P.nom, P.commune, P.dpt, P.geo ? P.geo.lat.toFixed(6).replace('.', ',') : '', P.geo ? P.geo.lon.toFixed(6).replace('.', ',') : '', P.geo ? P.geo.src : '',
    P.culture, P.pre, dateHeure(P.date), P.prel, P.raisonNP, P.ctl, P.ctls.map(c => c.insp).join(', ') || P.inspPrevu]);
  const csv = '﻿' + [H].concat(L2).map(l => l.map(x => '"' + String(x ?? '').replace(/"/g, '""') + '"').join(';')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv;charset=utf-8'})); a.download = 'registre-parcelles.csv';
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ---------- Événements ---------- */
const relancer = () => { limite = 300; afficher(); };
let tq; $('fq').addEventListener('input', e => { F.q = e.target.value; clearTimeout(tq); tq = setTimeout(relancer, 250); });
[['fDpt', 'dpt'], ['fPre', 'pre'], ['fCtl', 'ctl'], ['fGeo', 'geo']].forEach(([id, k]) => { $(id).onchange = e => { F[k] = e.target.value; relancer(); }; });
$('raz').onclick = () => { Object.assign(F, {q: '', dpt: '', pre: '', ctl: '', geo: '', carte: ''}); $('fq').value = ''; $('fGeo').value = ''; remplirFiltres(); relancer(); };
$('csv').onclick = exporter;
$('rafraichir').onclick = () => charger().catch(err => console.error(err));
document.addEventListener('click', e => {
  const cp = e.target.closest('[data-copie]'); if (cp) { e.stopPropagation(); const t = cp.dataset.copie;
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => { cp.textContent = 'Copié ✓'; setTimeout(() => { cp.textContent = 'Copier'; }, 1200); }).catch(() => prompt('Coordonnées :', t)); return; }
  if (e.target.closest('a')) return;
  const c = e.target.closest('[data-carte]'); if (c) { F.carte = F.carte === c.dataset.carte ? '' : c.dataset.carte; relancer(); return; }
  const v = e.target.closest('[data-vue]'); if (v) { vue = v.dataset.vue; try { localStorage.setItem('registre-vue', vue); } catch (err) { /* stockage indisponible */ } relancer(); return; }
  const f = e.target.closest('[data-farm]'); if (f) { const k = f.dataset.farm; ouverts.has(k) ? ouverts.delete(k) : ouverts.add(k); afficher(); }
});

if (window.grist) {
  grist.ready({requiredAccess: 'full'});
  let t; grist.onRecords(() => { clearTimeout(t); t = setTimeout(() => charger().catch(err => console.error(err)), 800); });
  charger().catch(err => { console.error(err); $('avis').innerHTML = `<div class="fr-alert fr-alert--error fr-alert--sm"><p>Impossible de charger les données : ${esc(err.message || err)}. Réglez l'accès du widget sur « Accès complet au document ».</p></div>`; });
} else {
  $('avis').innerHTML = '<div class="fr-alert fr-alert--info fr-alert--sm"><p>Ouvrez cette page comme widget personnalisé dans Grist (accès complet au document) pour afficher les données.</p></div>';
  $('vue').innerHTML = ''; $('maj').textContent = 'API Grist non détectée';
}
})();
</script>
</body>
