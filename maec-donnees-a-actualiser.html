<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Données à actualiser</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #ffffff;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: clamp(12px, 4vw, 40px);
  }

  .page {
    width: 100%;
    max-width: 900px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: clamp(18px, 4vh, 44px);
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(16px, 4vw, 40px);
    flex-wrap: wrap;
    width: 100%;
  }

  .logo {
    height: clamp(70px, 14vw, 160px);
    width: auto;
    flex-shrink: 0;
  }

  .brand-block {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    text-align: left;
    min-width: 0;
  }

  .brand-title {
    font-size: clamp(28px, 7vw, 64px);
    font-weight: bold;
    line-height: 1;
    margin: 0;
    white-space: nowrap;
  }
  .blue { color: #003399; }
  .red { color: #E1000F; }

  .brand-subtitle {
    font-size: clamp(12px, 2.2vw, 22px);
    color: #4a4a4a;
    margin: 8px 0 0;
    white-space: nowrap;
  }

  .headline {
    font-size: clamp(30px, 8vw, 72px);
    font-weight: bold;
    letter-spacing: clamp(1px, 0.4vw, 4px);
    line-height: 1;
    width: 100%;
  }

  .headline .line { display: block; white-space: nowrap; }
  .headline .line + .line { margin-top: 0.12em; }

  .stats {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: clamp(8px, 2vw, 20px);
    width: 100%;
  }

  .stat {
    border-top: 4px solid #003399;
    background: #f4f6fb;
    padding: clamp(10px, 2vw, 18px) 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 0;
  }
  .stat:nth-child(even) { border-top-color: #E1000F; }

  .stat-value {
    font-size: clamp(18px, 3.6vw, 32px);
    font-weight: bold;
    color: #003399;
    line-height: 1;
  }
  .stat:nth-child(even) .stat-value { color: #E1000F; }

  .stat-label {
    font-size: clamp(11px, 1.6vw, 15px);
    color: #4a4a4a;
  }

  .context {
    width: 100%;
    text-align: left;
    border-left: 4px solid #003399;
    padding: 4px 0 4px clamp(12px, 2.5vw, 24px);
  }

  .context h2 {
    font-size: clamp(16px, 2.8vw, 26px);
    margin: 0 0 10px;
    color: #003399;
  }

  .context p {
    font-size: clamp(13px, 1.9vw, 18px);
    line-height: 1.55;
    color: #2a2a2a;
    margin: 0 0 10px;
  }
  .context p:last-child { margin-bottom: 0; }

  .context strong { color: #003399; }

  /* Medium widgets: stats on 2 columns */
  @media (max-width: 640px) {
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }

  /* Very narrow widgets: stack logo above text and shrink subtitle */
  @media (max-width: 420px) {
    .header {
      flex-direction: column;
      text-align: center;
    }
    .brand-block {
      align-items: center;
      text-align: center;
    }
    .brand-title, .brand-subtitle {
      white-space: normal;
    }
  }
</style>
</head>
