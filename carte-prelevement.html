<!doctype html>
<html lang="fr" data-fr-scheme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carte des prélèvements</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.12.1/dist/dsfr.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.12.1/dist/utility/icons/icons.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  /* Couleurs DSFR */
  :root {
    --bleu-france: #000091;
    --bleu-france-clair: #e3e3fd;
    --rouge-marianne: #e1000f;
    --gris-texte: #3a3a3a;
    --gris-mention: #666;
    --gris-bordure: #ddd;
  }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: #fff; color: var(--gris-texte); }

  /* Bandeau */
  #bandeau {
    display: flex; align-items: center; gap: 12px; padding: 6px 12px;
    border-bottom: 3px solid var(--bleu-france); background: #fff; flex-wrap: wrap;
  }
  #bandeau .marque { font-weight: 700; font-size: 15px; line-height: 1.1; color: #161616; display: flex; align-items: center; }
  #bandeau .marque small { display: block; font-weight: 400; font-size: 11px; color: var(--gris-mention); }
  #bandeau .marque::before {
    content: ""; display: inline-block; width: 6px; height: 30px; margin-right: 8px;
    background: linear-gradient(var(--bleu-france) 0 33%, #fff 33% 66%, var(--rouge-marianne) 66%);
    border: 1px solid #eee;
  }
  #chiffres { display: flex; gap: 14px; margin-left: auto; flex-wrap: wrap; }
  #chiffres div { text-align: center; line-height: 1.1; }
  #chiffres b { display: block; font-size: 18px; color: var(--bleu-france); }
  #chiffres span { font-size: 11px; color: var(--gris-mention); }

  /* Corps : panneau + carte */
  #corps { flex: 1; display: flex; min-height: 0; }
  #panneau {
    width: 380px; max-width: 45%; display: flex; flex-direction: column; border-right: 1px solid var(--gris-bordure);
    background: #fff; min-height: 0;
  }
  #outils { padding: 10px 12px; border-bottom: 1px solid var(--gris-bordure); }
  #outils .fr-input { font-size: 14px; }
  #outils textarea.fr-input { min-height: 40px; max-height: 110px; resize: vertical; font-family: monospace; }
  .ligne-btn { display: flex; gap: 6px; margin-top: 6px; }
  .ligne-btn .fr-btn { flex: 1; justify-content: center; }
  #legende { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  #legende button {
    display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; font-size: 12px; border-radius: 12px;
    border: 1px solid var(--gris-bordure); background: #fff; cursor: pointer;
  }
  #legende button i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  #legende button.masque { opacity: .4; text-decoration: line-through; }
  #contenu { flex: 1; overflow: auto; padding: 8px 12px 16px; }
  #carte { flex: 1; min-width: 0; position: relative; }

  /* Listes */
  .titre-vue { display: flex; align-items: center; gap: 6px; margin: 4px 0 8px; }
  .titre-vue h2 { font-size: 17px; margin: 0; line-height: 1.3; }
  .mention { font-size: 12px; color: var(--gris-mention); }
  .item-commune {
    display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 10px; margin-bottom: 4px;
    border: 1px solid var(--gris-bordure); border-left: 4px solid var(--bleu-france); background: #fff;
    text-align: left; cursor: pointer; font-size: 14px;
  }
  .item-commune:hover, .item-commune.survol { background: var(--bleu-france-clair); }
  .item-commune .nom { flex: 1; font-weight: 600; }
  .barre { display: flex; height: 6px; width: 70px; border-radius: 3px; overflow: hidden; background: #eee; }
  .compteur {
    min-width: 26px; padding: 1px 7px; border-radius: 12px; background: var(--bleu-france); color: #fff;
    font-size: 12px; font-weight: 700; text-align: center;
  }
  details.exploitation { border: 1px solid var(--gris-bordure); margin-bottom: 6px; background: #fff; }
  details.exploitation > summary {
    list-style: none; cursor: pointer; padding: 8px 10px; display: flex; gap: 8px; align-items: center; font-weight: 600;
  }
  details.exploitation > summary::-webkit-details-marker { display: none; }
  details.exploitation > summary::before { content: "▸"; color: var(--bleu-france); transition: transform .15s; }
  details.exploitation[open] > summary::before { transform: rotate(90deg); }
  details.exploitation[open] > summary { background: var(--bleu-france-clair); }
  details.exploitation > summary .nom { flex: 1; }
  .pacage { font-weight: 400; font-size: 12px; color: var(--gris-mention); }
  .rdv { border-top: 1px solid var(--gris-bordure); padding: 8px 10px; }
  .rdv.actif { background: #fff8e6; box-shadow: inset 4px 0 0 var(--rouge-marianne); }
  .rdv-entete { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; cursor: pointer; }
  .rdv-entete .cle { font-family: monospace; font-weight: 700; font-size: 13px; }
  .pastille { display: inline-block; padding: 0 8px; border-radius: 4px; font-size: 11px; font-weight: 700; color: #fff; }
  .rdv-corps { display: none; margin-top: 8px; }
  .rdv.ouvert .rdv-corps { display: block; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  table.champs { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.champs th { text-align: left; font-weight: 600; color: var(--gris-mention); padding: 3px 6px 3px 0; vertical-align: top; width: 42%; }
  table.champs td { padding: 3px 0; word-break: break-word; }
  table.champs tr + tr { border-top: 1px dashed #eee; }
  .sous-titre { font-size: 12px; font-weight: 700; color: var(--bleu-france); text-transform: uppercase; margin: 10px 0 2px; }
  .absent { color: var(--rouge-marianne); font-size: 13px; margin: 2px 0; }
  .vide { color: var(--gris-mention); font-style: italic; padding: 12px 0; }

  /* Carte */
  .leaflet-container { font-family: Marianne, arial, sans-serif; }
  .leaflet-container a { background-image: none; }
  .bulle-commune {
    display: flex; align-items: center; justify-content: center; border-radius: 50%;
    background: var(--bleu-france); color: #fff; font-weight: 700; border: 3px solid #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,.35); transition: transform .15s, background .15s;
  }
  .bulle-commune:hover, .bulle-commune.survol { transform: scale(1.18); background: var(--rouge-marianne); }
  .leaflet-tooltip.etiquette { font-size: 12px; font-weight: 600; }
  #chargement {
    position: absolute; inset: 0; z-index: 2000; display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.85); font-size: 15px; color: var(--bleu-france); font-weight: 600; text-align: center; padding: 20px;
  }

  @media (max-width: 700px) {
    #corps { flex-direction: column; }
    #panneau { width: auto; max-width: none; height: 48%; border-right: none; border-bottom: 1px solid var(--gris-bordure); }
    #chiffres { margin-left: 0; }
  }
</style>
</head>
<body>
<header id="bandeau">
  <div class="marque"><div>Carte des prélèvements<small>Reliquats azotés – regroupement par commune</small></div></div>
  <div id="chiffres"></div>
</header>

<div id="corps">
  <aside id="panneau">
    <div id="outils">
      <label class="fr-label fr-text--sm fr-mb-1v" for="cles">Rechercher une ou plusieurs parcelles (identifiant)</label>
      <textarea id="cles" class="fr-input" rows="1" placeholder="029161227-151-2, 029161227-151-3 …"
        title="Séparez les clés par des espaces, virgules, points-virgules ou retours à la ligne"></textarea>
      <div class="ligne-btn">
        <button id="chercher" type="button" class="fr-btn fr-btn--sm fr-icon-search-line fr-btn--icon-left">Rechercher</button>
        <button id="effacer" type="button" class="fr-btn fr-btn--sm fr-btn--secondary fr-icon-close-line fr-btn--icon-left">Effacer</button>
      </div>
      <input id="filtre" class="fr-input fr-mt-1w" type="search" placeholder="Filtrer : commune, exploitation, PACAGE…">
      <div id="legende"></div>
    </div>
    <div id="contenu"><p class="vide">Chargement…</p></div>
  </aside>
  <div id="carte"><div id="chargement">Chargement des données…</div></div>
</div>

<script>
  // ---------- Paramètres (noms des colonnes du document) ----------
  const TABLE_PAR_DEFAUT = 'RDV_Prelevements';
  const COL_PARCELLE = 'Cle_parcelle';   // Référence vers DATA_Parcelles_DEF
  const COL_LAT = 'latitude';
  const COL_LON = 'longitude';
  const COL_STATUT = 'Statut';
  const COL_DATE = 'Date_RDV';
  const ZOOM_PARCELLES = 12;             // en dessous : bulles par commune ; au-dessus : parcelles
  const COLONNES_MASQUEES = new Set(['id', 'manualSort', 'Description', COL_LAT, COL_LON]);
  const COULEURS = ['#000091', '#18753c', '#b34000', '#6a6af4', '#009081', '#a558a0', '#c3992a', '#ce0500', '#7d4e5b', '#417dc4'];
  const COULEUR_SANS_STATUT = '#929292';

  // ---------- État ----------
  let tableId = TABLE_PAR_DEFAUT;
  let colonnes = [];              // colonnes de la table source (ordre Grist)
  const tablesRef = {};           // tableId -> Map(id -> ligne)
  const colAffichee = {};         // type "Ref:X" -> colonne affichée
  let metaPret = null;
  let rdvs = [];                  // lignes enrichies
  let parId = new Map();
  let communes = new Map();       // nom -> { nom, cp, rdvs: [] }
  let couleurStatut = new Map();
  const statutsMasques = new Set();
  let vue = { type: 'communes' };
  let rdvActif = null;
  let curseurParMoi = null;
  let premierCadrage = true;

  // ---------- Carte ----------
  const carte = L.map('carte', { preferCanvas: true }).setView([48.2, -2.9], 8);
  const ign = function (couche, format) {
    return L.tileLayer('https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=' + couche +
      '&STYLE=normal&TILEMATRIXSET=PM&FORMAT=' + format + '&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}',
      { maxZoom: 19, attribution: '&copy; IGN – Géoplateforme' });
  };
  const fonds = {
    'Plan IGN': ign('GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2', 'image/png'),
    'Photographies aériennes': ign('ORTHOIMAGERY.ORTHOPHOTOS', 'image/jpeg'),
    'OpenStreetMap': L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }),
  };
  fonds['Plan IGN'].addTo(carte);
  L.control.layers(fonds, null, { position: 'topright' }).addTo(carte);
  L.control.scale({ imperial: false }).addTo(carte);

  const coucheCommunes = L.featureGroup().addTo(carte);
  const coucheParcelles = L.featureGroup();
  const coucheSurbrillance = L.featureGroup().addTo(carte);
  const bullesCommunes = new Map();

  carte.on('zoomend', majCouches);
  function majCouches() {
    if (carte.getZoom() >= ZOOM_PARCELLES) { carte.removeLayer(coucheCommunes); coucheParcelles.addTo(carte); }
    else { carte.removeLayer(coucheParcelles); coucheCommunes.addTo(carte); }
  }

  // ---------- Outils ----------
  const $ = function (id) { return document.getElementById(id); };
  function esc(t) {
    return String(t ?? '').replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function nombre(v) {
    if (v === null || v === undefined || v === '') return NaN;
    return Number(String(v).trim().replace(',', '.'));
  }
  function normaliser(v) { return String(v ?? '').toLowerCase().replace(/\s+/g, ''); }
  function sansAccents(v) { return String(v ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }

  function versDate(v) {
    if (v instanceof Date) return v;
    if (typeof v === 'number') return new Date(v * 1000);
    if (Array.isArray(v) && (v[0] === 'D' || v[0] === 'd')) return new Date(v[1] * 1000);
    return null;
  }
  function idRef(v) {
    if (typeof v === 'number') return v;
    if (Array.isArray(v) && v[0] === 'R') return v[2];
    if (v && typeof v === 'object' && 'rowId' in v) return v.rowId;
    return v ? Number(v) : 0;
  }
  function liste(v) {
    if (Array.isArray(v)) return v[0] === 'L' ? v.slice(1) : v;
    return v ? [v] : [];
  }
  function dateHeure(d) {
    return d.toLocaleString('fr-FR', { timeZone: 'Europe/Paris', dateStyle: 'short', timeStyle: 'short' });
  }

  // Valeur lisible selon le type de colonne Grist
  function formater(valeur, type) {
    if (valeur === null || valeur === undefined || valeur === '') return '';
    type = type || '';
    if (type.startsWith('Ref:')) {
      const id = idRef(valeur);
      if (!id) return '';
      const t = tablesRef[type.slice(4)];
      const ligne = t && t.get(id);
      const col = colAffichee[type];
      return ligne ? String(col ? ligne[col] ?? '' : id) : '#' + id;
    }
    if (type.startsWith('RefList:')) {
      return liste(valeur).map(function (id) { return formater(id, 'Ref:' + type.slice(8)); }).join(', ');
    }
    if (type.startsWith('DateTime')) {
      const d = versDate(valeur);
      return d ? dateHeure(d) : String(valeur);
    }
    if (type === 'Date') {
      const d = versDate(valeur);
      return d ? d.toLocaleDateString('fr-FR', { timeZone: 'UTC' }) : String(valeur);
    }
    if (type === 'Bool') return valeur ? 'Oui' : 'Non';
    if (type === 'ChoiceList') return liste(valeur).join(', ');
    if (type === 'Numeric' || type === 'Int') return typeof valeur === 'number' ? valeur.toLocaleString('fr-FR') : String(valeur);
    if (Array.isArray(valeur)) return liste(valeur).join(', ');
    return String(valeur);
  }

  function enLignes(colonnaire) {
    const m = new Map();
    const ids = colonnaire.id || [];
    const cles = Object.keys(colonnaire);
    for (let i = 0; i < ids.length; i++) {
      const l = {};
      for (const k of cles) l[k] = colonnaire[k][i];
      m.set(ids[i], l);
    }
    return m;
  }

  // ---------- Métadonnées : colonnes, types et tables référencées ----------
  async function chargerMeta() {
    try {
      if (grist.selectedTable && grist.selectedTable.getTableId) tableId = await grist.selectedTable.getTableId();
      else if (grist.getSelectedTableId) tableId = await grist.getSelectedTableId();
    } catch (e) { /* table par défaut */ }
    const tables = enLignes(await grist.docApi.fetchTable('_grist_Tables'));
    const cols = enLignes(await grist.docApi.fetchTable('_grist_Tables_column'));
    let idTable = null;
    for (const [id, t] of tables) if (t.tableId === tableId) idTable = id;
    colonnes = [...cols.values()]
      .filter(function (c) { return c.parentId === idTable && !c.colId.startsWith('gristHelper_'); })
      .sort(function (a, b) { return a.parentPos - b.parentPos; });
    const aCharger = new Set();
    for (const c of colonnes) {
      const m = /^Ref(?:List)?:(.+)$/.exec(c.type);
      if (!m) continue;
      aCharger.add(m[1]);
      const visibleCol = c.visibleCol && cols.get(c.visibleCol);
      colAffichee[c.type] = visibleCol ? visibleCol.colId : null;
      if (!colAffichee['Ref:' + m[1]]) colAffichee['Ref:' + m[1]] = colAffichee[c.type];
    }
    await Promise.all([...aCharger].map(async function (t) {
      try { tablesRef[t] = enLignes(await grist.docApi.fetchTable(t)); } catch (e) { tablesRef[t] = new Map(); }
    }));
  }
  function typeDe(colId) {
    const c = colonnes.find(function (x) { return x.colId === colId; });
    return c ? c.type : '';
  }

  // ---------- Données ----------
  function preparer(records) {
    const typeParcelle = typeDe(COL_PARCELLE);
    const tableParcelles = typeParcelle.startsWith('Ref:') ? tablesRef[typeParcelle.slice(4)] : null;
    rdvs = records.map(function (r) {
      const parcelle = (tableParcelles && tableParcelles.get(idRef(r[COL_PARCELLE]))) || {};
      const lat = nombre(r[COL_LAT]), lon = nombre(r[COL_LON]);
      return {
        id: r.id, brut: r, parcelle: parcelle,
        cle: String(parcelle.CLE || ''),
        commune: String(parcelle.Commune || '').trim() || 'Commune non renseignée',
        cp: String(parcelle.Code_Postal || '').split('.')[0],
        pacage: String(r.PACAGE || parcelle.PACAGE || ''),
        exploitation: String(r.Raison_sociale || r.Nom_exploitation || parcelle.Nom || 'Exploitation sans nom'),
        statut: String(r[COL_STATUT] || ''),
        date: versDate(r[COL_DATE]),
        lat: lat, lon: lon, localise: isFinite(lat) && isFinite(lon),
      };
    });
    parId = new Map(rdvs.map(function (r) { return [r.id, r]; }));
    const statuts = [...new Set(rdvs.map(function (r) { return r.statut; }).filter(Boolean))].sort();
    couleurStatut = new Map(statuts.map(function (s, i) { return [s, COULEURS[i % COULEURS.length]]; }));
  }
  function couleur(statut) { return couleurStatut.get(statut) || COULEUR_SANS_STATUT; }
  function visible(r) {
    if (statutsMasques.has(r.statut)) return false;
    const f = sansAccents($('filtre').value.trim());
    if (!f) return true;
    return sansAccents([r.commune, r.cp, r.exploitation, r.pacage, r.cle, formater(r.brut.Preleveur, typeDe('Preleveur'))].join(' ')).includes(f);
  }
  function cleExploitation(r) { return r.pacage || r.exploitation; }

  function regrouper() {
    communes = new Map();
    for (const r of rdvs) {
      if (!visible(r)) continue;
      if (!communes.has(r.commune)) communes.set(r.commune, { nom: r.commune, cp: r.cp, rdvs: [] });
      communes.get(r.commune).rdvs.push(r);
    }
  }

  // ---------- Dessin de la carte ----------
  function dessinerCarte() {
    coucheCommunes.clearLayers();
    coucheParcelles.clearLayers();
    bullesCommunes.clear();
    for (const c of communes.values()) {
      const loc = c.rdvs.filter(function (r) { return r.localise; });
      if (!loc.length) continue;
      const lat = loc.reduce(function (s, r) { return s + r.lat; }, 0) / loc.length;
      const lon = loc.reduce(function (s, r) { return s + r.lon; }, 0) / loc.length;
      const n = c.rdvs.length;
      const taille = Math.round(26 + 7 * Math.log2(n));
      const bulle = L.marker([lat, lon], {
        icon: L.divIcon({
          className: '', iconSize: [taille, taille],
          html: '<div class="bulle-commune" style="width:' + taille + 'px;height:' + taille + 'px;font-size:' + (n > 99 ? 11 : 13) + 'px">' + n + '</div>',
        }),
        riseOnHover: true,
      }).bindTooltip(esc(c.nom) + ' – ' + n + ' parcelle(s)', { direction: 'top', className: 'etiquette', offset: [0, -taille / 2] })
        .on('click', function () { ouvrirCommune(c.nom, true); })
        .on('mouseover', function () { survolCommune(c.nom, true); })
        .on('mouseout', function () { survolCommune(c.nom, false); });
      bulle.addTo(coucheCommunes);
      bullesCommunes.set(c.nom, bulle);

      for (const r of loc) {
        L.circleMarker([r.lat, r.lon], {
          radius: 7, color: '#fff', weight: 2, fillColor: couleur(r.statut), fillOpacity: 0.95,
        }).bindTooltip(esc(r.exploitation) + '<br>' + esc(r.cle), { direction: 'top', className: 'etiquette' })
          .on('click', function () { ouvrirRdv(r.id, false); })
          .addTo(coucheParcelles);
      }
    }
    majCouches();
  }

  function survolCommune(nom, actif) {
    const b = bullesCommunes.get(nom);
    const el = b && b.getElement() && b.getElement().firstChild;
    if (el) el.classList.toggle('survol', actif);
    const li = document.querySelector('.item-commune[data-commune="' + CSS.escape(nom) + '"]');
    if (li) li.classList.toggle('survol', actif);
  }

  function surbrillance(liste) {
    coucheSurbrillance.clearLayers();
    for (const r of liste) {
      if (!r.localise) continue;
      L.circleMarker([r.lat, r.lon], {
        radius: 16, color: '#e1000f', weight: 3, fillColor: '#e1000f', fillOpacity: 0.15, interactive: false,
      }).addTo(coucheSurbrillance);
    }
  }

  function cadrer(liste, zoomMax) {
    const pts = liste.filter(function (r) { return r.localise; }).map(function (r) { return [r.lat, r.lon]; });
    if (!pts.length) return;
    if (pts.length === 1) carte.flyTo(pts[0], Math.max(carte.getZoom(), zoomMax), { duration: 0.8 });
    else carte.flyToBounds(L.latLngBounds(pts), { padding: [40, 40], maxZoom: zoomMax, duration: 0.8 });
  }

  // ---------- Panneau ----------
  function chiffres() {
    const vis = rdvs.filter(visible);
    const nbExpl = new Set(vis.map(cleExploitation)).size;
    const nonLoc = vis.filter(function (r) { return !r.localise; }).length;
    $('chiffres').innerHTML =
      '<div><b>' + vis.length + '</b><span>parcelles</span></div>' +
      '<div><b>' + nbExpl + '</b><span>exploitations</span></div>' +
      '<div><b>' + communes.size + '</b><span>communes</span></div>' +
      (nonLoc ? '<div title="Sans latitude / longitude"><b style="color:var(--rouge-marianne)">' + nonLoc + '</b><span>non localisées</span></div>' : '');
  }

  function legende() {
    const comptes = new Map();
    for (const r of rdvs) comptes.set(r.statut, (comptes.get(r.statut) || 0) + 1);
    $('legende').innerHTML = [...comptes.keys()].sort().map(function (s) {
      return '<button type="button" data-statut="' + esc(s) + '" class="' + (statutsMasques.has(s) ? 'masque' : '') +
        '" title="Afficher / masquer"><i style="background:' + couleur(s) + '"></i>' + esc(s || 'Sans statut') +
        ' (' + comptes.get(s) + ')</button>';
    }).join('');
  }

  function barreStatuts(liste) {
    const comptes = new Map();
    for (const r of liste) comptes.set(r.statut, (comptes.get(r.statut) || 0) + 1);
    return '<span class="barre">' + [...comptes.entries()].map(function (e) {
      return '<i style="width:' + (100 * e[1] / liste.length) + '%;background:' + couleur(e[0]) + '" title="' + esc(e[0] || 'Sans statut') + ' : ' + e[1] + '"></i>';
    }).join('') + '</span>';
  }

  function vueCommunes() {
    const tri = [...communes.values()].sort(function (a, b) { return b.rdvs.length - a.rdvs.length || a.nom.localeCompare(b.nom, 'fr'); });
    if (!tri.length) return '<p class="vide">Aucune parcelle à afficher.</p>';
    return '<div class="titre-vue"><h2>Communes</h2><span class="mention">(' + tri.length + ')</span></div>' +
      tri.map(function (c) {
        return '<button type="button" class="item-commune" data-commune="' + esc(c.nom) + '">' +
          '<span class="nom">' + esc(c.nom) + (c.cp ? ' <span class="pacage">' + esc(c.cp) + '</span>' : '') + '</span>' +
          barreStatuts(c.rdvs) + '<span class="compteur">' + c.rdvs.length + '</span></button>';
      }).join('');
  }

  function blocExploitations(liste, ouvrirTout) {
    const groupes = new Map();
    for (const r of liste) {
      const k = cleExploitation(r);
      if (!groupes.has(k)) groupes.set(k, { nom: r.exploitation, pacage: r.pacage, rdvs: [] });
      groupes.get(k).rdvs.push(r);
    }
    return [...groupes.values()].sort(function (a, b) { return a.nom.localeCompare(b.nom, 'fr'); }).map(function (g) {
      const ouvert = ouvrirTout || g.rdvs.some(function (r) { return r.id === rdvActif; });
      return '<details class="exploitation"' + (ouvert ? ' open' : '') + '><summary><span class="nom">' + esc(g.nom) +
        (g.pacage ? ' <span class="pacage">PACAGE ' + esc(g.pacage) + '</span>' : '') + '</span>' +
        '<span class="compteur">' + g.rdvs.length + '</span></summary>' +
        g.rdvs.map(carteRdv).join('') + '</details>';
    }).join('');
  }

  function carteRdv(r) {
    const actif = r.id === rdvActif;
    // Format Google Maps, arrondi à 6 décimales (~10 cm)
    const coords = r.localise ? +r.lat.toFixed(6) + ', ' + +r.lon.toFixed(6) : '';
    let lignes = '';
    for (const c of colonnes) {
      if (COLONNES_MASQUEES.has(c.colId)) continue;
      const v = formater(r.brut[c.colId], c.type);
      if (!v) continue;
      lignes += '<tr><th>' + esc(c.label || c.colId.replace(/_/g, ' ')) + '</th><td>' + esc(v) + '</td></tr>';
    }
    const p = r.parcelle;
    const ilot = [p.NUM_ILOT, p.NUM_PARCEL].filter(function (x) { return x !== undefined && x !== null && x !== ''; }).join(' - ');
    const infosParcelle = [
      ['Identifiant', p.CLE], ['Commune', [r.cp, p.Commune].filter(Boolean).join(' ')], ['Îlot - parcelle', ilot],
      ['Surface (ha)', p.SURF_CALC], ['Culture 2026', p.CULT_2026], ['Culture 2025', p.CULT_2025],
      ['Raison de la sélection', p.Raison_de_la_selection], ['Téléphone portable', p.Telephone_portable],
      ['Téléphone fixe', p.Telephone_Fixe], ['Coordonnées GPS', coords],
    ].filter(function (x) { return x[1] !== undefined && x[1] !== null && x[1] !== ''; })
      .map(function (x) { return '<tr><th>' + esc(x[0]) + '</th><td>' + esc(x[1]) + '</td></tr>'; }).join('');

    return '<div class="rdv' + (actif ? ' actif ouvert' : '') + '" data-id="' + r.id + '">' +
      '<div class="rdv-entete"><span class="cle">' + esc(r.cle || 'Parcelle #' + r.id) + '</span>' +
      '<span class="pastille" style="background:' + couleur(r.statut) + '">' + esc(r.statut || 'Sans statut') + '</span>' +
      (r.date ? '<span class="mention">' + esc(dateHeure(r.date)) + '</span>' : '') +
      (r.localise ? '' : '<span class="mention" style="color:var(--rouge-marianne)">non localisée</span>') +
      '</div><div class="rdv-corps">' +
      (coords ? '<div class="actions">' +
        '<button type="button" class="fr-btn fr-btn--sm fr-icon-clipboard-line fr-btn--icon-left copier" data-coords="' + esc(coords) + '">Copier pour Google Maps</button>' +
        '<a class="fr-btn fr-btn--sm fr-btn--secondary fr-icon-external-link-line fr-btn--icon-left" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(r.lat + ',' + r.lon) + '">Google Maps</a>' +
        '</div>' : '') +
      '<div class="sous-titre">Parcelle</div><table class="champs">' + infosParcelle + '</table>' +
      '<div class="sous-titre">Rendez-vous de prélèvement</div><table class="champs">' + lignes + '</table>' +
      '</div></div>';
  }

  const BOUTON_RETOUR = '<button type="button" class="fr-btn fr-btn--sm fr-btn--tertiary-no-outline fr-icon-arrow-left-line fr-btn--icon-left retour">Retour</button>';

  function vueCommune(nom) {
    const c = communes.get(nom);
    const l = c ? c.rdvs : [];
    return '<div class="titre-vue">' + BOUTON_RETOUR + '<h2>' + esc(nom) + '</h2></div>' +
      '<p class="mention">' + l.length + ' parcelle(s) – ' + new Set(l.map(cleExploitation)).size + ' exploitation(s)</p>' +
      (l.length ? blocExploitations(l, false) : '<p class="vide">Aucune parcelle visible dans cette commune.</p>');
  }

  function vueRecherche() {
    const res = vue.trouves.filter(visible);
    return '<div class="titre-vue">' + BOUTON_RETOUR + '<h2>Résultats</h2></div>' +
      '<p class="mention">' + res.length + ' parcelle(s) trouvée(s)</p>' +
      vue.absents.map(function (k) { return '<p class="absent">❌ ' + esc(k) + ' : introuvable</p>'; }).join('') +
      blocExploitations(res, true);
  }

  function afficher() {
    let html;
    if (vue.type === 'commune') html = vueCommune(vue.nom);
    else if (vue.type === 'recherche') html = vueRecherche();
    else html = vueCommunes();
    $('contenu').innerHTML = html;
    const actif = document.querySelector('.rdv.actif');
    if (actif) actif.scrollIntoView({ block: 'nearest' });
  }

  function toutRafraichir() {
    regrouper();
    dessinerCarte();
    chiffres();
    legende();
    if (vue.type === 'commune') surbrillance(communes.has(vue.nom) ? communes.get(vue.nom).rdvs : []);
    else if (vue.type === 'recherche') surbrillance(vue.trouves.filter(visible));
    afficher();
  }

  // ---------- Navigation ----------
  function ouvrirCommune(nom, cadrage) {
    vue = { type: 'commune', nom: nom };
    const c = communes.get(nom);
    surbrillance(c ? c.rdvs : []);
    if (cadrage && c) cadrer(c.rdvs, 15);
    afficher();
    $('contenu').scrollTop = 0;
  }

  function ouvrirRdv(id, cadrage) {
    const r = parId.get(id);
    if (!r) return;
    rdvActif = id;
    if (vue.type !== 'recherche' || !vue.trouves.some(function (x) { return x.id === id; })) {
      vue = { type: 'commune', nom: r.commune };
      surbrillance([r]);
    }
    if (cadrage) cadrer([r], 16);
    afficher();
    if (curseurParMoi !== id) {
      curseurParMoi = id;
      Promise.resolve(grist.setCursorPos({ rowId: id })).catch(function () {});
    }
  }

  function rechercher() {
    const cles = [...new Set($('cles').value.split(/[\s,;]+/).map(normaliser).filter(Boolean))];
    if (!cles.length) { effacer(); return; }
    const trouves = [], absents = [], vus = new Set();
    for (const cle of cles) {
      let res = rdvs.filter(function (r) { return normaliser(r.cle) === cle; });
      if (!res.length) res = rdvs.filter(function (r) { return r.cle && normaliser(r.cle).includes(cle); });
      if (!res.length) { absents.push(cle); continue; }
      for (const r of res) if (!vus.has(r.id)) { vus.add(r.id); trouves.push(r); }
    }
    vue = { type: 'recherche', trouves: trouves, absents: absents };
    rdvActif = trouves.length === 1 ? trouves[0].id : null;
    surbrillance(trouves);
    cadrer(trouves, 16);
    afficher();
  }

  function effacer() {
    $('cles').value = '';
    vue = { type: 'communes' };
    rdvActif = null;
    coucheSurbrillance.clearLayers();
    afficher();
  }

  // ---------- Copie ----------
  async function copier(texte, bouton) {
    let ok = false;
    try { await navigator.clipboard.writeText(texte); ok = true; }
    catch (e) {
      const zone = document.createElement('textarea');
      zone.value = texte; zone.style.position = 'fixed'; zone.style.opacity = '0';
      document.body.appendChild(zone); zone.select();
      try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
      zone.remove();
    }
    bouton.textContent = ok ? 'Copié : ' + texte : 'Copie refusée';
    if (!ok) window.prompt('Copiez avec Ctrl+C :', texte);
    setTimeout(function () { bouton.textContent = 'Copier pour Google Maps'; }, 2500);
  }

  // ---------- Événements ----------
  $('chercher').addEventListener('click', rechercher);
  $('effacer').addEventListener('click', effacer);
  $('cles').addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); rechercher(); }
  });
  let minuterie;
  $('filtre').addEventListener('input', function () {
    clearTimeout(minuterie);
    minuterie = setTimeout(toutRafraichir, 200);
  });
  $('legende').addEventListener('click', function (ev) {
    const b = ev.target.closest('button[data-statut]');
    if (!b) return;
    const s = b.dataset.statut;
    if (statutsMasques.has(s)) statutsMasques.delete(s); else statutsMasques.add(s);
    toutRafraichir();
  });
  $('contenu').addEventListener('click', function (ev) {
    const t = ev.target;
    const commune = t.closest('.item-commune');
    if (commune) { ouvrirCommune(commune.dataset.commune, true); return; }
    if (t.closest('.retour')) {
      vue = { type: 'communes' }; rdvActif = null; coucheSurbrillance.clearLayers(); afficher(); return;
    }
    const bouton = t.closest('.copier');
    if (bouton) { copier(bouton.dataset.coords, bouton); return; }
    const entete = t.closest('.rdv-entete');
    if (entete) {
      const bloc = entete.parentElement;
      const id = Number(bloc.dataset.id);
      if (bloc.classList.contains('ouvert') && rdvActif === id) { bloc.classList.remove('ouvert'); return; }
      ouvrirRdv(id, true);
    }
  });
  $('contenu').addEventListener('mouseover', function (ev) {
    const c = ev.target.closest('.item-commune');
    if (c) survolCommune(c.dataset.commune, true);
  });
  $('contenu').addEventListener('mouseout', function (ev) {
    const c = ev.target.closest('.item-commune');
    if (c) survolCommune(c.dataset.commune, false);
  });

  // ---------- Grist ----------
  grist.ready({ requiredAccess: 'full' });

  grist.onRecords(async function (records) {
    try {
      if (!metaPret) metaPret = chargerMeta();
      await metaPret;
    } catch (e) {
      metaPret = null;
      $('chargement').textContent = 'Réglez le niveau d’accès du widget sur « Accès complet au document ».';
      return;
    }
    preparer(records);
    toutRafraichir();
    $('chargement').style.display = 'none';
    if (premierCadrage && rdvs.some(function (r) { return r.localise; })) {
      premierCadrage = false;
      const pts = rdvs.filter(function (r) { return r.localise; }).map(function (r) { return [r.lat, r.lon]; });
      carte.fitBounds(L.latLngBounds(pts), { padding: [30, 30], maxZoom: 11 });
    }
  });

  // Ligne sélectionnée dans une autre vue Grist -> on l'affiche
  grist.onRecord(function (record) {
    if (!record || record.id === curseurParMoi || !parId.has(record.id)) return;
    curseurParMoi = record.id;
    ouvrirRdv(record.id, true);
  });
</script>
</body>
</html>
