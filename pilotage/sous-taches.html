<!DOCTYPE html>
<html lang="fr" data-fr-scheme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sous-tâches</title>
<link rel="stylesheet" href="socle.css">
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<script src="socle.js"></script>
<style>
  .st{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
  .st-liste{border:1px solid var(--border);position:sticky;top:76px;max-height:calc(100vh - 96px);display:flex;flex-direction:column}
  .st-liste .tete{padding:8px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
  .st-liste ul{list-style:none;margin:0;padding:0;overflow:auto}
  .st-liste li button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--contrast);padding:7px 10px 7px 12px;cursor:pointer;position:relative}
  .st-liste li button:hover{background:var(--alt)}
  .st-liste li button[aria-current=true]{background:var(--bf-975)}
  .st-liste li button[aria-current=true]::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;background:var(--bf)}
  .st-liste .nom{font-size:.83rem;color:var(--title);display:block}
  .st-liste .meta{font-size:.7rem;color:var(--mention);display:flex;gap:6px;align-items:center}
  .st-liste .mini{display:inline-block;width:40px;height:4px;background:var(--contrast);position:relative}
  .st-liste .mini span{position:absolute;inset:0 auto 0 0;background:var(--success)}
  .st-tete{border-bottom:3px solid var(--bf);padding-bottom:10px;display:flex;flex-direction:column;gap:6px}
  .st-tete h2{font-size:1.3rem}
  .st-items{list-style:none;margin:0;padding:0;border:1px solid var(--border)}
  .st-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid var(--contrast);background:var(--surface)}
  .st-item:last-child{border-bottom:0}
  .st-item.fait .lib{text-decoration:line-through;color:var(--mention)}
  .st-item .poignee{cursor:grab;color:var(--disabled);display:flex}
  .st-item .poignee svg{width:16px;height:16px}
  .st-item input[type=checkbox]{width:1.15rem;height:1.15rem;accent-color:var(--success);flex:0 0 auto}
  .st-item .lib{flex:1;min-width:0;font-size:.9rem;padding:3px 4px;border:1px solid transparent;cursor:text}
  .st-item .lib:hover{border-color:var(--border)}
  .st-item .lib:focus{outline:2px solid var(--focus);background:var(--alt)}
  .st-item select,.st-item input[type=date]{width:auto;max-width:160px}
  .st-item.survol{box-shadow:inset 0 3px 0 var(--bf)}
  .st-item.glisse{opacity:.4}
  .st-ajout{display:flex;gap:8px;margin-top:8px}
  @media (max-width:820px){.st{grid-template-columns:1fr}.st-liste{position:static;max-height:260px}}
</style>
</head>
<body>
<script>
(function () {
  const P = Pilotage, esc = P.esc;
  const ui = {sel: null, q: '', ouvertes: true, projet: ''};
  try { ui.sel = +localStorage.getItem('sous-taches-sel') || null; } catch (e) { /* ignoré */ }

  P.demarrer({
    id: 'sous-taches',
    titre: 'Sous-tâches',
    sousTitre: 'Découper une tâche en étapes à cocher',
    entites: ['tache', 'sous_tache', 'projet'],
    optionnelles: ['sous_tache', 'projet'],
    reglagesHtml: () => `<label class="case"><input type="checkbox" id="rg-av" ${P.reglage('majAvancement', true) ? 'checked' : ''}> Mettre à jour l’avancement de la tâche selon les sous-tâches cochées</label>`,
    lireReglages: (el, r) => { r.majAvancement = el.querySelector('#rg-av').checked; },
    init: () => P.surCurseur((tableId, id) => { if (tableId === P.table('tache') && id !== ui.sel) { ui.sel = id; dessiner(); } }),
    rendu: () => dessiner(),
  });

  const sousTaches = tid => P.liste('sous_tache').filter(s => s.tache === tid).sort((a, b) => (a.ordre ?? 1e9) - (b.ordre ?? 1e9) || a.id - b.id);

  function dessiner() {
    const corps = P.$('#pl-corps');
    if (!P.table('sous_tache')) {
      corps.innerHTML = `<div class="carte" style="max-width:640px"><h2>Table des sous-tâches</h2>
        <p>Aucune table de sous-tâches n’a été trouvée dans ce document. Le widget peut la créer pour vous, liée à la table <strong>${esc(P.table('tache'))}</strong> :</p>
        <ul class="small"><li><code>Tache</code> : référence vers la tâche</li><li><code>Libelle</code>, <code>Fait</code> (case à cocher), <code>Ordre</code></li><li><code>Responsable</code> et <code>Echeance</code> (facultatifs)</li></ul>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" id="st-creer">Créer la table</button><button class="btn sec" id="st-assoc">Associer une table existante</button></div></div>`;
      P.$('#st-creer').addEventListener('click', () => P.creerStructure('sous_tache'));
      P.$('#st-assoc').addEventListener('click', P.ouvrirConfig);
      return;
    }
    const taches = P.liste('tache');
    if (!ui.sel || !P.get('tache', ui.sel)) { const t = taches.find(x => sousTaches(x.id).length && !P.estClos(x.statut)) || taches.find(x => !P.estClos(x.statut)) || taches[0]; ui.sel = t ? t.id : null; }
    const q = P.norm(ui.q);
    const visibles = taches.filter(t => (t.id === ui.sel || !ui.ouvertes || !P.estClos(t.statut)) && (!ui.projet || t.projet === ui.projet) && (!q || P.norm(t.titre + ' ' + P.libelle('projet', t.projet)).includes(q)))
      .sort((a, b) => (sousTaches(b.id).length > 0) - (sousTaches(a.id).length > 0) || P.urgence(a).rang - P.urgence(b).rang || a.titre.localeCompare(b.titre, 'fr'));
    const projets = P.liste('projet').filter(p => taches.some(t => t.projet === p.id)).sort((a, b) => a._libelle.localeCompare(b._libelle, 'fr'));
    corps.innerHTML = `<div class="st">
      <nav class="st-liste" aria-label="Tâches">
        <div class="tete"><input class="in sm" id="st-q" placeholder="Rechercher une tâche" value="${esc(ui.q)}" aria-label="Rechercher une tâche">
          ${projets.length ? `<select class="in sm" id="st-p" aria-label="Projet"><option value="">Tous les projets</option>${projets.map(p => `<option value="${p.id}" ${p.id === ui.projet ? 'selected' : ''}>${esc(p._libelle)}</option>`).join('')}</select>` : ''}
          <label class="case small"><input type="checkbox" id="st-o" ${ui.ouvertes ? 'checked' : ''}> Tâches ouvertes seulement</label></div>
        <ul>${visibles.map(t => { const s = sousTaches(t.id); const f = s.filter(x => x.fait).length; return `<li><button data-id="${t.id}" aria-current="${t.id === ui.sel}">
          <span class="nom">${esc(t.titre)}</span><span class="meta">${s.length ? `<span class="mini"><span style="width:${Math.round(f / s.length * 100)}%"></span></span>${f}/${s.length}` : 'aucune sous-tâche'}${t.projet ? ' · ' + esc(P.libelle('projet', t.projet)) : ''}</span></button></li>`; }).join('') || '<li class="muted small" style="padding:10px">Aucune tâche</li>'}</ul>
      </nav>
      <section id="st-detail"></section></div>`;
    P.$('#st-q').addEventListener('input', P.debounce(e => { ui.q = e.target.value; dessiner(); const i = P.$('#st-q'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }, 250));
    if (P.$('#st-p')) P.$('#st-p').addEventListener('change', e => { ui.projet = +e.target.value || ''; dessiner(); });
    P.$('#st-o').addEventListener('change', e => { ui.ouvertes = e.target.checked; dessiner(); });
    P.$('.st-liste ul').addEventListener('click', e => { const b = e.target.closest('[data-id]'); if (!b) return; ui.sel = +b.dataset.id; try { localStorage.setItem('sous-taches-sel', ui.sel); } catch (x) { /* ignoré */ } dessiner(); });
    detail();
  }

  function detail() {
    const zone = P.$('#st-detail'); const t = P.get('tache', ui.sel);
    if (!t) { zone.innerHTML = '<div class="vide">Sélectionnez une tâche.</div>'; return; }
    const items = sousTaches(t.id); const faits = items.filter(x => x.fait).length;
    const ratio = items.length ? faits / items.length : 0;
    const aResp = P.a('sous_tache', 'responsable'), aEch = P.a('sous_tache', 'echeance');
    const agents = P.liste('agent').slice().sort((a, b) => a._libelle.localeCompare(b._libelle, 'fr'));
    const termine = P.choixStatut('tache', 'statut', P.estTermine);
    const u = P.urgence(t);
    zone.innerHTML = `<div class="st-tete"><span class="muted small">${esc(P.libelle('projet', t.projet) || 'Sans projet')}</span><h2>${esc(t.titre)}</h2>
        <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">${t.statut ? `<span class="badge">${esc(t.statut)}</span>` : ''}<span class="badge ${u.classe}">${esc(u.libelle)}</span>
        ${t.responsable ? `<span class="small">👤 ${esc(P.libelle('agent', t.responsable))}</span>` : ''}${t.echeance ? `<span class="small">📅 ${P.fmtDate(t.echeance)}</span>` : ''}</div>
        <div style="display:flex;gap:10px;align-items:center"><div class="barre ok" style="flex:1;height:10px"><span style="width:${Math.round(ratio * 100)}%"></span></div><strong>${faits}/${items.length}</strong></div></div>
      ${items.length && faits === items.length && termine && !P.estTermine(t.statut) && P.modifiable('tache', 'statut') ? `<div class="alerte ok" style="margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">Toutes les sous-tâches sont faites.<button class="btn pri sm" id="st-clore">Passer la tâche à « ${esc(termine)} »</button></div>` : ''}
      <ul class="st-items" id="st-items" style="margin-top:12px">${items.map(s => `<li class="st-item ${s.fait ? 'fait' : ''}" data-id="${s.id}" draggable="true">
          <span class="poignee" title="Glisser pour réordonner">${P.ic('glisser')}</span>
          <input type="checkbox" ${s.fait ? 'checked' : ''} aria-label="Fait">
          <span class="lib" contenteditable="true" spellcheck="true">${esc(s.libelle)}</span>
          ${aResp ? `<select class="in sm" data-f="responsable" aria-label="Responsable"><option value="">—</option>${agents.map(a => `<option value="${a.id}" ${a.id === s.responsable ? 'selected' : ''}>${esc(a._libelle)}</option>`).join('')}</select>` : ''}
          ${aEch ? `<input class="in sm" type="date" data-f="echeance" value="${s.echeance ? P.iso(s.echeance) : ''}" aria-label="Échéance" style="${s.echeance && !s.fait && s.echeance < P.today() ? 'box-shadow:inset 0 -2px 0 var(--error)' : ''}">` : ''}
          <button class="btn ter sm ic" data-suppr title="Supprimer">${P.ic('supprimer')}<span class="sr">Supprimer</span></button></li>`).join('') || '<li class="st-item muted small" style="justify-content:center">Aucune sous-tâche : ajoutez la première ci-dessous.</li>'}</ul>
      <div class="st-ajout"><textarea class="in" id="st-new" rows="1" style="min-height:2.4rem" placeholder="Nouvelle sous-tâche (Entrée pour ajouter · coller plusieurs lignes pour en ajouter plusieurs)"></textarea><button class="btn pri" id="st-add">${P.ic('plus')} Ajouter</button></div>
      <p class="small muted">${P.reglage('majAvancement', true) && P.modifiable('tache', 'avancement') ? 'L’avancement de la tâche est mis à jour automatiquement.' : ''}</p>`;
    const ul = P.$('#st-items');
    const nouv = P.$('#st-new');
    const ajouter = async () => {
      const ls = nouv.value.split('\n').map(x => x.replace(/^\s*[-*•]\s*|^\s*\[ ?\]\s*/, '').trim()).filter(Boolean); if (!ls.length) return;
      let ordre = Math.max(0, ...items.map(x => x.ordre || 0));
      const acts = ls.map(l => P.actionAjout('sous_tache', {tache: t.id, libelle: l, fait: false, ordre: ++ordre}));
      acts.push(avancementAction(t, items.length + ls.length, faits));
      nouv.value = '';
      await P.appliquer(acts);
      setTimeout(() => { const n = P.$('#st-new'); if (n) n.focus(); }, 50);
    };
    P.$('#st-add').addEventListener('click', ajouter);
    nouv.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ajouter(); } });
    nouv.addEventListener('paste', () => setTimeout(() => { if (nouv.value.includes('\n')) ajouter(); }, 0));
    if (P.$('#st-clore')) P.$('#st-clore').addEventListener('click', () => P.modifier('tache', t.id, Object.assign({statut: termine}, P.modifiable('tache', 'avancement') ? {avancement: 1} : {}), 'Tâche terminée.'));
    ul.addEventListener('change', async e => {
      const li = e.target.closest('[data-id]'); if (!li) return; const id = +li.dataset.id;
      if (e.target.type === 'checkbox') {
        const nf = faits + (e.target.checked ? 1 : -1);
        await P.appliquer([P.actionMaj('sous_tache', id, {fait: e.target.checked}), avancementAction(t, items.length, nf)]);
      } else if (e.target.dataset.f === 'responsable') P.modifier('sous_tache', id, {responsable: +e.target.value || null});
      else if (e.target.dataset.f === 'echeance') P.modifier('sous_tache', id, {echeance: P.fromIso(e.target.value)});
    });
    ul.addEventListener('click', async e => {
      const b = e.target.closest('[data-suppr]'); if (!b) return;
      const li = b.closest('[data-id]'); const s = P.get('sous_tache', +li.dataset.id);
      await P.appliquer([P.actionSuppr('sous_tache', s.id), avancementAction(t, items.length - 1, faits - (s.fait ? 1 : 0))], 'Sous-tâche supprimée.');
    });
    ul.addEventListener('keydown', e => { if (e.target.classList.contains('lib') && e.key === 'Enter') { e.preventDefault(); e.target.blur(); } if (e.target.classList.contains('lib') && e.key === 'Escape') { e.target.textContent = P.get('sous_tache', +e.target.closest('[data-id]').dataset.id).libelle; e.target.blur(); } });
    ul.addEventListener('focusout', e => {
      if (!e.target.classList.contains('lib')) return;
      const id = +e.target.closest('[data-id]').dataset.id; const v = e.target.textContent.trim(); const s = P.get('sous_tache', id);
      if (s && v && v !== s.libelle) P.modifier('sous_tache', id, {libelle: v});
      else if (s && !v) e.target.textContent = s.libelle;
    });
    // Glisser-déposer pour réordonner
    let glisse = null;
    ul.addEventListener('dragstart', e => { const li = e.target.closest('[data-id]'); if (!li || document.activeElement && document.activeElement.classList.contains('lib')) { e.preventDefault(); return; } glisse = li; li.classList.add('glisse'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', li.dataset.id); });
    ul.addEventListener('dragover', e => { const li = e.target.closest('[data-id]'); if (!glisse || !li) return; e.preventDefault(); P.$$('.survol', ul).forEach(x => x.classList.remove('survol')); li.classList.add('survol'); });
    ul.addEventListener('dragend', () => { P.$$('.survol,.glisse', ul).forEach(x => x.classList.remove('survol', 'glisse')); glisse = null; });
    ul.addEventListener('drop', async e => {
      e.preventDefault(); const cible = e.target.closest('[data-id]'); if (!glisse || !cible || cible === glisse) return;
      ul.insertBefore(glisse, cible);
      const ids = P.$$('[data-id]', ul).map(li => +li.dataset.id);
      await P.appliquer(ids.map((id, i) => P.actionMaj('sous_tache', id, {ordre: i + 1})).filter((a, i) => (P.get('sous_tache', ids[i]) || {}).ordre !== i + 1));
    });
  }

  function avancementAction(t, total, faits) {
    if (!P.reglage('majAvancement', true) || !P.modifiable('tache', 'avancement') || P.estClos(t.statut)) return null;
    const v = total ? Math.round(faits / total * 100) / 100 : 0;
    return Math.abs((t.avancement || 0) - v) > 0.001 ? P.actionMaj('tache', t.id, {avancement: v}) : null;
  }
})();
</script>
</body>
</html>
