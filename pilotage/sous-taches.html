<!DOCTYPE html>
<html lang="fr" data-fr-scheme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sous-tâches</title>
<link rel="stylesheet" href="socle.css">
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<script src="socle.js"></script>
<script type="text/html" id="pl-aide"><!--AIDE--><p class="chapo">Les sous-tâches découpent une tâche en <strong>étapes à cocher</strong>. On voit d’un coup d’œil ce qui reste à faire, et l’avancement de la tâche se met à jour tout seul.</p>

<section>
  <h2>À quoi servent-elles ?</h2>
  <ul>
    <li><strong>Ne rien oublier</strong> dans une tâche longue : une checklist, une procédure, une liste de vérifications.</li>
    <li><strong>Mesurer l’avancement</strong> réel : 3 étapes faites sur 5 = 60 %, sans avoir à l’estimer.</li>
    <li><strong>Répartir le travail</strong> : chaque étape peut avoir son responsable et son échéance.</li>
  </ul>
</section>

<section>
  <h2>Mise en place</h2>
  <ol class="etapes">
    <li><span>Créez la <strong>table des étapes</strong> : paramètres (⚙), onglet <strong>Table ressource</strong>, « Créer la table dans ce document ». Si votre table de tâches est indiquée dans l’onglet Réglages, la colonne <em>Tâche</em> est créée en référence vers elle.</span></li>
    <li><span>Choisissez cette table comme <strong>données du widget</strong>, puis associez dans le <strong>panneau de droite</strong> : la <strong>tâche concernée</strong>, le <strong>libellé</strong>, la case <strong>Fait</strong>, et si besoin l’ordre, le responsable et l’échéance.</span></li>
    <li><span>Dans les paramètres (⚙), onglet <strong>Réglages</strong>, indiquez votre <strong>table de tâches</strong> : toutes les tâches apparaissent dans la liste et leur avancement est mis à jour.</span></li>
  </ol>
</section>

<section>
  <h2>Au quotidien</h2>
  <div class="blocs">
    <div><strong>➕ Ajouter</strong>Tapez une étape puis Entrée. Collez une liste (une étape par ligne) pour en ajouter plusieurs d’un coup.</div>
    <div><strong>☑️ Cocher</strong>La barre de progression et l’avancement de la tâche se mettent à jour.</div>
    <div><strong>✏️ Modifier</strong>Cliquez sur le libellé pour le corriger, choisissez un responsable ou une échéance.</div>
    <div><strong>↕️ Réordonner</strong>Faites glisser une étape par sa poignée ⋮⋮.</div>
  </div>
</section>

<div class="encart astuce"><strong>💡 Astuce</strong><p>Quand toutes les étapes sont cochées, le widget propose de <strong>passer la tâche à « Terminé »</strong> en un clic.</p></div>

<div class="encart attention"><strong>⚠️ Bon à savoir</strong><p>La mise à jour de l’avancement peut être désactivée dans les réglages, si vous préférez saisir l’avancement vous-même. Une étape en retard (échéance dépassée, non cochée) est soulignée en rouge.</p></div>

<p class="pied">Le bouton ? affiche ce mode d’emploi. Sans table de tâches indiquée, la liste de gauche reprend les valeurs de la colonne « Tâche concernée ».</p><!--FIN_AIDE--></script>
<style>
  .st{display:grid;grid-template-columns:320px 1fr;gap:32px;align-items:start;max-width:1240px;margin:0 auto;padding:8px 8px 40px;font-size:15px}
  .st-liste{border:1px solid var(--border);position:sticky;top:84px;max-height:calc(100vh - 110px);display:flex;flex-direction:column}
  .st-liste .tete{padding:12px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
  .st-liste ul{list-style:none;margin:0;padding:0;overflow:auto}
  .st-liste li button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--contrast);padding:12px 14px 12px 16px;cursor:pointer;position:relative}
  .st-liste li button:hover{background:var(--alt)}
  .st-liste li button[aria-current=true]{background:var(--bf-975)}
  .st-liste li button[aria-current=true]::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;background:var(--bf)}
  .st-liste .nom{font-size:.92rem;color:var(--title);display:block;font-weight:500}
  .st-liste .meta{font-size:.75rem;color:var(--mention);display:flex;gap:8px;align-items:center;margin-top:4px}
  .st-liste .mini{display:inline-block;width:48px;height:5px;background:var(--contrast);position:relative;border-radius:3px;overflow:hidden}
  .st-liste .mini span{position:absolute;inset:0 auto 0 0;background:var(--success)}
  .st-detail{display:flex;flex-direction:column;gap:20px;min-width:0}
  .st-tete{border-bottom:3px solid var(--bf);padding-bottom:16px;display:flex;flex-direction:column;gap:10px}
  .st-tete h2{font-size:1.7rem;line-height:1.25}
  .st-prog{display:flex;gap:14px;align-items:center}
  .st-prog .barre{flex:1;height:12px;border-radius:6px;overflow:hidden}
  .st-prog strong{font-size:1.2rem;color:var(--title)}
  .st-items{list-style:none;margin:0;padding:0;border:1px solid var(--border)}
  .st-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--contrast);background:var(--surface)}
  .st-item:last-child{border-bottom:0}
  .st-item.fait .lib{text-decoration:line-through;color:var(--mention)}
  .st-item .poignee{cursor:grab;color:var(--disabled);display:flex}
  .st-item .poignee svg{width:18px;height:18px}
  .st-item input[type=checkbox]{width:1.35rem;height:1.35rem;accent-color:var(--success);flex:0 0 auto;cursor:pointer}
  .st-item .lib{flex:1;min-width:0;font-size:1rem;padding:4px 6px;border:1px solid transparent;cursor:text;line-height:1.4}
  .st-item .lib:hover{border-color:var(--border)}
  .st-item .lib:focus{outline:2px solid var(--focus);background:var(--alt)}
  .st-item select,.st-item input[type=date],.st-item input.resp{width:auto;max-width:170px}
  .st-item.survol{box-shadow:inset 0 3px 0 var(--bf)}
  .st-item.glisse{opacity:.4}
  .st-ajout{display:flex;gap:10px}
  .st-ajout textarea{min-height:2.8rem;font-size:1rem}
  @media (max-width:860px){.st{grid-template-columns:1fr}.st-liste{position:static;max-height:300px}}
</style>
</head>
<body>
<script>
(function () {
  const P = Pilotage, L = P.L, esc = P.esc;
  const ui = {sel: null, q: '', ouvertes: true};
  try { ui.sel = JSON.parse(localStorage.getItem('sous-taches-sel2') || 'null'); } catch (e) { /* ignoré */ }

  P.demarrer({
    id: 'sous-taches',
    titre: 'Sous-tâches',
    sousTitre: 'Découper une tâche en étapes à cocher',
    entites: ['tache'], optionnelles: ['tache'], entitesSeules: true,
    ressource: 'sous_taches',
    colonnes: [
      {name: 'Parent', title: 'Tâche concernée', description: 'Référence vers la tâche, ou son intitulé', type: 'Any', ressource: ['Tache']},
      {name: 'Libelle', title: 'Libellé de l’étape', type: 'Text', ressource: ['Libelle']},
      {name: 'Fait', title: 'Fait', description: 'Case à cocher', type: 'Bool', ressource: ['Fait']},
      {name: 'Ordre', title: 'Ordre', description: 'Permet de réordonner les étapes à la souris', type: 'Numeric', optional: true, ressource: ['Ordre']},
      {name: 'Responsable', title: 'Responsable', type: 'Any', optional: true, ressource: ['Responsable']},
      {name: 'Echeance', title: 'Échéance', type: 'Date', optional: true, ressource: ['Echeance']},
    ],
    demo: {table: 'DATA_Sous_taches', mapping: {Parent: 'Tache', Libelle: 'Libelle', Fait: 'Fait', Ordre: 'Ordre', Responsable: 'Responsable', Echeance: 'Echeance'}},
    reglagesHtml: () => `<p class="small muted" style="margin:0">Table liée facultative ci-dessus : vos <strong>tâches</strong>. Elle affiche toutes les tâches (même sans étape) avec leur statut et leur échéance, et permet de mettre à jour leur avancement.</p>
      <label class="case" style="margin-top:8px"><input type="checkbox" id="rg-av" ${P.reglage('majAvancement', true) ? 'checked' : ''}> Mettre à jour l’avancement de la tâche selon les étapes cochées</label>`,
    lireReglages: (el, r) => { r.majAvancement = el.querySelector('#rg-av').checked; },
    rendu: () => dessiner(),
  });

  /* ---------- Rattachement des étapes à leur tâche ---------- */
  const colParent = () => L.col('Parent');
  const parRef = () => { const c = colParent(); return !!c && /^Ref(List)?:/.test(c.type); };
  const lienTache = () => { const c = colParent(); return parRef() && P.table('tache') && c.type.split(':')[1] === P.table('tache'); };
  function cleEtape(r) {
    const c = colParent(); const v = r[c.colId];
    if (parRef()) return Array.isArray(v) ? (v[1] || null) : (v || null);
    const t = L.texte('Parent', r); return t ? P.norm(t) : null;
  }
  /* Liste des tâches : table liée si elle existe, sinon valeurs de la colonne « Tâche concernée » */
  function taches() {
    if (P.table('tache') && (lienTache() || !parRef())) {
      return P.liste('tache').map(t => ({cle: lienTache() ? t.id : P.norm(t.titre), id: t.id, titre: t.titre, statut: t.statut, echeance: t.echeance, resp: P.libelle('agent', t.responsable), projet: P.libelle('projet', t.projet), t}));
    }
    if (parRef()) return [...(L.refs[colParent().colId] || new Map()).entries()].map(([id, l]) => ({cle: id, titre: l}));
    return P.uniq(L.recs.map(r => L.texte('Parent', r)).filter(Boolean)).map(l => ({cle: P.norm(l), titre: l}));
  }
  const etapes = cle => L.recs.filter(r => cleEtape(r) === cle).map(r => ({id: r.id, r, libelle: L.texte('Libelle', r), fait: L.bool('Fait', r), ordre: L.nombre('Ordre', r), resp: L.texte('Responsable', r), echeance: L.date('Echeance', r)}))
    .sort((a, b) => (a.ordre ?? 1e9) - (b.ordre ?? 1e9) || a.id - b.id);
  function valeurParent(tache) {
    const c = colParent(); if (!c) return undefined;
    if (/^RefList:/.test(c.type)) return ['L', tache.cle];
    if (/^Ref:/.test(c.type)) return tache.cle;
    return tache.titre;
  }

  function dessiner() {
    const corps = P.$('#pl-corps');
    const liste = taches();
    if (!liste.length && !L.recs.length) {
      corps.innerHTML = `<div class="carte" style="max-width:720px;margin:24px auto"><h2>Aucune tâche à découper</h2>
        <p>Indiquez votre table de tâches dans les paramètres (⚙, onglet Réglages) pour pouvoir ajouter des étapes à n’importe quelle tâche. Pas encore de table d’étapes ? Onglet <strong>Table ressource</strong>.</p>
        <button class="btn sec sm" id="st-cfg">Ouvrir les paramètres</button></div>`;
      P.$('#st-cfg').addEventListener('click', () => P.ouvrirConfig()); return;
    }
    const stat = t => { const e = etapes(t.cle); return {n: e.length, f: e.filter(x => x.fait).length}; };
    if (ui.sel == null || !liste.some(t => t.cle === ui.sel)) { const t = liste.find(x => stat(x).n && !P.estClos(x.statut)) || liste.find(x => !P.estClos(x.statut)) || liste[0]; ui.sel = t ? t.cle : null; }
    const q = P.norm(ui.q);
    const visibles = liste.filter(t => (t.cle === ui.sel || !ui.ouvertes || !P.estClos(t.statut)) && (!q || P.norm(t.titre + ' ' + (t.projet || '')).includes(q)))
      .sort((a, b) => (stat(b).n > 0) - (stat(a).n > 0) || String(a.titre).localeCompare(String(b.titre), 'fr'));
    corps.innerHTML = `<div class="st">
      <nav class="st-liste" aria-label="Tâches"><div class="tete"><input class="in sm" id="st-q" placeholder="Rechercher une tâche" value="${esc(ui.q)}" aria-label="Rechercher une tâche">
        ${P.table('tache') ? `<label class="case small"><input type="checkbox" id="st-o" ${ui.ouvertes ? 'checked' : ''}> Tâches en cours seulement</label>` : ''}</div>
        <ul>${visibles.map(t => { const s = stat(t); return `<li><button data-cle="${esc(JSON.stringify(t.cle))}" aria-current="${t.cle === ui.sel}"><span class="nom">${esc(t.titre)}</span>
          <span class="meta">${s.n ? `<span class="mini"><span style="width:${Math.round(s.f / s.n * 100)}%"></span></span>${s.f}/${s.n}` : 'aucune étape'}${t.projet ? ' · ' + esc(t.projet) : ''}</span></button></li>`; }).join('') || '<li class="muted small" style="padding:12px">Aucune tâche</li>'}</ul></nav>
      <section class="st-detail" id="st-detail"></section></div>`;
    P.$('#st-q').addEventListener('input', P.debounce(e => { ui.q = e.target.value; dessiner(); const i = P.$('#st-q'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }, 250));
    if (P.$('#st-o')) P.$('#st-o').addEventListener('change', e => { ui.ouvertes = e.target.checked; dessiner(); });
    P.$('.st-liste ul').addEventListener('click', e => { const b = e.target.closest('[data-cle]'); if (!b) return; ui.sel = JSON.parse(b.dataset.cle); try { localStorage.setItem('sous-taches-sel2', JSON.stringify(ui.sel)); } catch (x) { /* ignoré */ } dessiner(); });
    detail(liste.find(t => t.cle === ui.sel));
  }

  function detail(t) {
    const zone = P.$('#st-detail'); if (!t) { zone.innerHTML = '<div class="vide">Sélectionnez une tâche.</div>'; return; }
    const items = etapes(t.cle), faits = items.filter(x => x.fait).length, ratio = items.length ? faits / items.length : 0;
    const respRef = L.col('Responsable') && /^Ref:/.test(L.col('Responsable').type);
    const agents = respRef ? [...(L.refs[L.col('Responsable').colId] || new Map()).entries()].sort((a, b) => a[1].localeCompare(b[1], 'fr')) : [];
    const termine = t.t ? P.choixStatut('tache', 'statut', P.estTermine) : '';
    zone.innerHTML = `<div class="st-tete">${t.projet ? `<span class="muted">${esc(t.projet)}</span>` : ''}<h2>${esc(t.titre)}</h2>
        ${t.t ? `<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">${t.statut ? `<span class="badge">${esc(t.statut)}</span>` : ''}<span class="badge ${P.urgence(t.t).classe}">${esc(P.urgence(t.t).libelle)}</span>${t.resp ? `<span>👤 ${esc(t.resp)}</span>` : ''}${t.echeance ? `<span>📅 ${P.fmtDate(t.echeance)}</span>` : ''}</div>` : ''}
        <div class="st-prog"><div class="barre ok"><span style="width:${Math.round(ratio * 100)}%"></span></div><strong>${faits} / ${items.length}</strong></div></div>
      ${items.length && faits === items.length && termine && t.t && !P.estTermine(t.statut) && P.modifiable('tache', 'statut') ? `<div class="alerte ok" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">Toutes les étapes sont faites.<button class="btn pri sm" id="st-clore">Passer la tâche à « ${esc(termine)} »</button></div>` : ''}
      <ul class="st-items" id="st-items">${items.map(s => `<li class="st-item ${s.fait ? 'fait' : ''}" data-id="${s.id}" draggable="${L.ecrivable('Ordre')}">
          ${L.ecrivable('Ordre') ? `<span class="poignee" title="Glisser pour réordonner">${P.ic('glisser')}</span>` : ''}
          <input type="checkbox" ${s.fait ? 'checked' : ''} aria-label="Fait" ${L.ecrivable('Fait') ? '' : 'disabled'}>
          <span class="lib" ${L.ecrivable('Libelle') ? 'contenteditable="true"' : ''}>${esc(s.libelle)}</span>
          ${L.ecrivable('Responsable') ? (respRef ? `<select class="in sm" data-f="Responsable" aria-label="Responsable"><option value="">—</option>${agents.map(([id, n]) => `<option value="${id}" ${id === s.r[L.col('Responsable').colId] ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>`
            : `<input class="in sm resp" data-f="Responsable" value="${esc(s.resp)}" placeholder="Responsable" aria-label="Responsable">`) : (s.resp ? `<span class="small muted">${esc(s.resp)}</span>` : '')}
          ${L.ecrivable('Echeance') ? `<input class="in sm" type="date" data-f="Echeance" value="${s.echeance ? P.iso(s.echeance) : ''}" aria-label="Échéance" style="${s.echeance && !s.fait && s.echeance < P.today() ? 'box-shadow:inset 0 -2px 0 var(--error)' : ''}">` : ''}
          <button class="btn ter sm ic" data-suppr title="Supprimer l’étape">${P.ic('supprimer')}<span class="sr">Supprimer</span></button></li>`).join('') || '<li class="st-item muted" style="justify-content:center;padding:24px">Aucune étape : ajoutez la première ci-dessous.</li>'}</ul>
      <div class="st-ajout"><textarea class="in" id="st-new" rows="1" placeholder="Nouvelle étape (Entrée pour ajouter · collez une liste pour en ajouter plusieurs)"></textarea><button class="btn pri" id="st-add">${P.ic('plus')} Ajouter</button></div>`;
    const ul = P.$('#st-items'), nouv = P.$('#st-new');
    const avAction = (total, nf) => {
      if (!t.t || !P.reglage('majAvancement', true) || !P.modifiable('tache', 'avancement') || P.estClos(t.statut)) return null;
      const v = total ? Math.round(nf / total * 100) / 100 : 0; return Math.abs((t.t.avancement || 0) - v) > .001 ? P.actionMaj('tache', t.id, {avancement: v}) : null;
    };
    const ajouter = async () => {
      const ls = nouv.value.split('\n').map(x => x.replace(/^\s*[-*•]\s*|^\s*\[ ?\]\s*/, '').trim()).filter(Boolean); if (!ls.length) return;
      let o = Math.max(0, ...items.map(x => x.ordre || 0));
      const acts = ls.map(l => L.actionAjout({Parent: valeurParent(t), Libelle: l, Fait: false, Ordre: ++o}));
      acts.push(avAction(items.length + ls.length, faits)); nouv.value = '';
      await P.appliquer(acts); setTimeout(() => { const n = P.$('#st-new'); if (n) n.focus(); }, 60);
    };
    P.$('#st-add').addEventListener('click', ajouter);
    nouv.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ajouter(); } });
    nouv.addEventListener('paste', () => setTimeout(() => { if (nouv.value.includes('\n')) ajouter(); }, 0));
    if (P.$('#st-clore')) P.$('#st-clore').addEventListener('click', () => P.modifier('tache', t.id, Object.assign({statut: termine}, P.modifiable('tache', 'avancement') ? {avancement: 1} : {}), 'Tâche terminée.'));
    ul.addEventListener('change', async e => {
      const li = e.target.closest('[data-id]'); if (!li) return; const id = +li.dataset.id;
      if (e.target.type === 'checkbox') await P.appliquer([L.actionMaj(id, {Fait: e.target.checked}), avAction(items.length, faits + (e.target.checked ? 1 : -1))]);
      else if (e.target.dataset.f === 'Responsable') L.ecrire(id, {Responsable: respRef ? (+e.target.value || 0) : e.target.value});
      else if (e.target.dataset.f === 'Echeance') L.ecrire(id, {Echeance: P.fromIso(e.target.value)});
    });
    ul.addEventListener('click', async e => {
      const b = e.target.closest('[data-suppr]'); if (!b) return; const s = items.find(x => x.id === +b.closest('[data-id]').dataset.id);
      await P.appliquer([['RemoveRecord', L.tableId, s.id], avAction(items.length - 1, faits - (s.fait ? 1 : 0))], 'Étape supprimée.');
    });
    ul.addEventListener('keydown', e => { if (!e.target.classList.contains('lib')) return; if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } if (e.key === 'Escape') { e.target.textContent = items.find(x => x.id === +e.target.closest('[data-id]').dataset.id).libelle; e.target.blur(); } });
    ul.addEventListener('focusout', e => {
      if (!e.target.classList.contains('lib')) return; const s = items.find(x => x.id === +e.target.closest('[data-id]').dataset.id); const v = e.target.textContent.trim();
      if (s && v && v !== s.libelle) L.ecrire(s.id, {Libelle: v}); else if (s && !v) e.target.textContent = s.libelle;
    });
    let glisse = null;
    ul.addEventListener('dragstart', e => { const li = e.target.closest('[data-id]'); if (!li || (document.activeElement && document.activeElement.classList.contains('lib'))) { e.preventDefault(); return; } glisse = li; li.classList.add('glisse'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', li.dataset.id); });
    ul.addEventListener('dragover', e => { const li = e.target.closest('[data-id]'); if (!glisse || !li) return; e.preventDefault(); P.$$('.survol', ul).forEach(x => x.classList.remove('survol')); li.classList.add('survol'); });
    ul.addEventListener('dragend', () => { P.$$('.survol,.glisse', ul).forEach(x => x.classList.remove('survol', 'glisse')); glisse = null; });
    ul.addEventListener('drop', async e => {
      e.preventDefault(); const cible = e.target.closest('[data-id]'); if (!glisse || !cible || cible === glisse) return;
      ul.insertBefore(glisse, cible); const ids = P.$$('[data-id]', ul).map(li => +li.dataset.id);
      await P.appliquer(ids.map((id, i) => (items.find(x => x.id === id) || {}).ordre !== i + 1 ? L.actionMaj(id, {Ordre: i + 1}) : null));
    });
  }
})();
</script>
</body>
</html>
