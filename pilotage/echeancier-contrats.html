<!DOCTYPE html>
<html lang="fr" data-fr-scheme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Échéancier des marchés et contrats</title>
<link rel="stylesheet" href="socle.css">
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<script src="socle.js"></script>
<script type="text/html" id="pl-aide"><!--AIDE--><p class="chapo">L’échéancier rassemble <strong>tous vos marchés et contrats sur une frise</strong> et vous prévient <strong>avant</strong> qu’ils n’arrivent à échéance, pour avoir le temps de préparer leur renouvellement.</p>

<section>
  <h2>À quoi sert-il ?</h2>
  <ul>
    <li><strong>Ne plus rater un renouvellement</strong> : les contrats qui se terminent bientôt ou qui ont expiré sont signalés en tête de page.</li>
    <li><strong>Anticiper</strong> : la frise montre, en hachures, la période où il faut lancer la nouvelle consultation.</li>
    <li><strong>Savoir à qui l’on fait appel</strong> : marchés, contrats, prestataires ponctuels ou démarchés, et les projets concernés.</li>
  </ul>
</section>

<section>
  <h2>Mise en place</h2>
  <ol class="etapes">
    <li><span>Ajoutez un <strong>widget personnalisé</strong> avec votre <strong>table des prestataires</strong> (ou des contrats) comme données.</span></li>
    <li><span>Dans le <strong>panneau de droite</strong>, associez le <strong>Prestataire</strong> et la <strong>Fin du contrat</strong>, puis si possible le début, le type de relation, la référence, l’objet, le montant et le contact.</span></li>
    <li><span>Facultatif : dans les paramètres (⚙), indiquez votre <strong>table des projets</strong> pour voir quels projets font appel à chaque prestataire.</span></li>
  </ol>
</section>

<div class="encart"><strong>📦 Pas encore de table des prestataires ?</strong><p>Paramètres (⚙), onglet <strong>Table ressource</strong> : créez en un clic une table « Prestataires et contrats » prête à l’emploi (marché, contrat, ponctuel, démarché), ou téléchargez son modèle CSV.</p></div>

<section>
  <h2>Comment lire l’échéancier</h2>
  <div class="blocs">
    <div><strong>🟢 En cours</strong>Le contrat court encore longtemps.</div>
    <div><strong>🟠 Se termine bientôt</strong>Moins de 90 jours avant la fin (seuil réglable) : lancez le renouvellement.</div>
    <div><strong>⚪ Expiré</strong>La date de fin est passée : à régulariser.</div>
    <div><strong>▨ Hachures</strong>Les derniers mois du contrat, pendant lesquels préparer le nouveau marché (180 jours par défaut).</div>
  </div>
</section>

<section>
  <h2>Au quotidien</h2>
  <ol class="etapes">
    <li><span>Consultez l’encadré <strong>« À traiter »</strong> en haut de page.</span></li>
    <li><span><strong>Cliquez sur un prestataire</strong> (dans la liste ou sur la frise) pour mettre à jour ses dates, son montant ou son contact.</span></li>
    <li><span>Utilisez <strong>Exporter (CSV)</strong> pour transmettre l’échéancier, ou <strong>Imprimer</strong>.</span></li>
  </ol>
</section>

<div class="encart astuce"><strong>💡 Astuce</strong><p>Les étiquettes au-dessus de la frise filtrent par type de relation : cliquez sur « Ponctuel » ou « Démarché » pour les masquer et ne garder que les marchés et contrats.</p></div>

<div class="encart attention"><strong>⚠️ Bon à savoir</strong><p>Un marché ou un contrat <strong>sans date de fin</strong> est signalé « Date de fin à saisir » : sans elle, aucune alerte n’est possible.</p></div>

<p class="pied">Le bouton ⚙ règle le seuil d’alerte et la durée de préparation d’un renouvellement ; le bouton ? affiche ce mode d’emploi.</p><!--FIN_AIDE--></script>
<style>
  .ec-filtres{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .ec-frise{border:1px solid var(--border);overflow-x:auto}
  .ec-axe,.ec-ligne{display:flex;min-width:900px}
  .ec-axe{background:var(--alt);border-bottom:2px solid var(--text)}
  .ec-nom{flex:0 0 260px;position:sticky;left:0;background:var(--surface);z-index:2;padding:0 16px;border-right:1px solid var(--border);font-size:.92rem;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;display:flex;align-items:center;color:var(--title)}
  .ec-axe .ec-nom{background:var(--alt);font-weight:700;height:36px}
  .ec-trk{position:relative;flex:1}
  .ec-axe .ec-trk span{position:absolute;top:0;bottom:0;border-left:1px solid var(--border);font-size:.78rem;padding:9px 6px;color:var(--title);white-space:nowrap}
  .ec-ligne{border-bottom:1px solid #f0f0f0;height:48px}
  .ec-bar{position:absolute;top:14px;height:20px;background:var(--success);cursor:pointer;border-radius:5px}
  .ec-bar.warn{background:var(--warning)} .ec-bar.err{background:#929292}
  .ec-bar .fen{position:absolute;top:0;bottom:0;right:0;border-radius:0 5px 5px 0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.45) 0 4px,transparent 4px 8px)}
  .ec-auj{position:absolute;top:0;bottom:0;width:2px;background:var(--rm);z-index:1;pointer-events:none}
  .ec-an{position:absolute;top:0;bottom:0;border-left:1px dashed #ddd;pointer-events:none}
  .ec-ligne-liste{cursor:pointer}
  .ec-ligne-liste:hover{background:var(--bf-975)}
  .ec-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  @media print{.ec-frise{overflow:visible}}
</style>
</head>
<body>
<script>
(function () {
  const P = Pilotage, L = P.L, esc = P.esc;
  const ui = {types: null, q: ''};

  P.demarrer({
    id: 'echeancier-contrats',
    titre: 'Échéancier des marchés et contrats',
    sousTitre: 'Les renouvellements à anticiper, les prestataires mobilisés',
    entites: ['projet'], optionnelles: ['projet'], entitesSeules: true,
    ressource: 'contrats',
    colonnes: [
      {name: 'Nom', title: 'Prestataire', type: 'Any', ressource: ['Raison_sociale']},
      {name: 'Fin', title: 'Fin du contrat', type: 'Date', ressource: ['Fin_contrat']},
      {name: 'Debut', title: 'Début du contrat', type: 'Date', optional: true, ressource: ['Debut_contrat']},
      {name: 'Type', title: 'Type de relation', description: 'Ex. Marché, Contrat, Ponctuel, Démarché', type: 'Choice', optional: true, ressource: ['Type_relation']},
      {name: 'Reference', title: 'Référence', type: 'Any', optional: true, ressource: ['Reference']},
      {name: 'Objet', title: 'Objet / spécialité', type: 'Any', optional: true, ressource: ['Objet']},
      {name: 'Montant', title: 'Montant', type: 'Numeric', optional: true, ressource: ['Montant']},
      {name: 'Representant', title: 'Représentant', type: 'Any', optional: true, ressource: ['Representant']},
      {name: 'Telephone', title: 'Téléphone', type: 'Any', optional: true, ressource: ['Telephone']},
      {name: 'Mail', title: 'Mail', type: 'Any', optional: true, ressource: ['Mail']},
    ],
    demo: {table: 'DATA_Prestataires', mapping: {Nom: 'Raison_sociale', Fin: 'Fin_de_contrat', Debut: 'Debut_de_contrat', Type: 'Type_relation', Reference: 'Marche_ref', Objet: 'Specialite', Montant: 'Montant_du_marche', Representant: 'Representant', Telephone: 'Telephone', Mail: 'Mail'}},
    reglagesHtml: () => `<p class="small muted" style="margin:0">Table liée facultative ci-dessus : vos <strong>projets</strong>, pour afficher les projets qui font appel à chaque prestataire.</p>
      <div class="grille" style="margin-top:10px"><div class="champ"><label for="rg-seuil">Alerte de renouvellement (jours avant la fin)</label><input class="in" type="number" min="15" id="rg-seuil" value="${P.reglage('seuil', 90)}"></div>
      <div class="champ"><label for="rg-preavis">Délai pour préparer un nouveau marché (jours)</label><input class="in" type="number" min="0" id="rg-preavis" value="${P.reglage('preavis', 180)}"><span class="aide">Zone hachurée sur la frise</span></div></div>`,
    lireReglages: (el, r) => { r.seuil = +el.querySelector('#rg-seuil').value || 90; r.preavis = +el.querySelector('#rg-preavis').value || 0; },
    outils: () => `<button class="btn ter sm" id="ec-csv">Exporter (CSV)</button><button class="btn ter sm" id="ec-print">${P.ic('imprimer')} Imprimer</button>`,
    surOutils: el => { el.querySelector('#ec-print').addEventListener('click', () => window.print()); el.querySelector('#ec-csv').addEventListener('click', exporter); },
    rendu: () => dessiner(),
  });

  const fiche = r => ({id: r.id, r, nom: L.texte('Nom', r) || '(sans nom)', type: L.texte('Type', r), ref: L.texte('Reference', r), objet: L.texte('Objet', r),
    debut: L.date('Debut', r), fin: L.date('Fin', r), montant: L.nombre('Montant', r), contact: [L.texte('Representant', r), L.texte('Telephone', r)].filter(Boolean).join(' · '), mail: L.texte('Mail', r)});
  const nature = p => { const t = P.norm(p.type); if (/demarch|consult|prospect/.test(t)) return 'demarche'; if (/march|accord|ugap/.test(t)) return 'marche'; if (/contrat|convention|abonnement/.test(t)) return 'contrat'; if (/ponctuel|devis|commande/.test(t)) return 'ponctuel'; return p.fin || p.debut ? 'contrat' : 'ponctuel'; };
  const avecContrat = p => ['marche', 'contrat'].includes(nature(p));
  function etat(p) {
    if (!avecContrat(p)) return {c: '', l: 'Sans contrat', j: null};
    if (!p.fin) return {c: 'warn', l: 'Date de fin à saisir', j: null};
    const j = P.diffDays(p.fin, P.today());
    if (j < 0) return {c: 'err', l: `Expiré depuis ${-j} j`, j};
    if (j <= P.reglage('seuil', 90)) return {c: 'warn', l: `Se termine dans ${j} j`, j};
    return {c: 'ok', l: `En cours · ${j} j restants`, j};
  }
  /* Projets qui font appel au prestataire (référence vers cette table, ou nom en texte) */
  function projetsDe(p) {
    if (!P.table('projet')) return [];
    const col = P.colonne('projet', 'prestataires'); const parRef = col && /^Ref(List)?:/.test(col.type) && col.type.split(':')[1] === L.tableId;
    return P.liste('projet').filter(x => (x.prestataires || []).some(v => parRef ? v === p.id : P.norm(typeof v === 'object' ? v.texte : P.libelle('prestataire', v)) === P.norm(p.nom)));
  }

  function dessiner() {
    const corps = P.$('#pl-corps'); const auj = P.today();
    const tous = L.recs.map(fiche);
    const types = P.uniq(tous.map(p => p.type).filter(Boolean)).sort();
    if (!ui.types) ui.types = new Set(types);
    const q = P.norm(ui.q);
    const liste = tous.filter(p => (!p.type || ui.types.has(p.type)) && (!q || P.norm([p.nom, p.ref, p.objet, p.contact].join(' ')).includes(q)));
    const contrats = liste.filter(avecContrat).sort((a, b) => (etat(a).j ?? 1e6) - (etat(b).j ?? 1e6));
    const actifs = contrats.filter(p => etat(p).j != null && etat(p).j >= 0), aRen = contrats.filter(p => etat(p).c === 'warn' && etat(p).j != null);
    const expires = contrats.filter(p => etat(p).c === 'err'), sansFin = contrats.filter(p => !p.fin);
    const autres = liste.filter(p => !avecContrat(p)).sort((a, b) => a.nom.localeCompare(b.nom, 'fr'));
    // Frise
    const dates = contrats.flatMap(p => [p.debut, p.fin]).filter(Boolean);
    let deb = new Date(Math.min(P.addMonths(auj, -12).getTime(), ...dates.map(d => d.getTime()).filter(t => t > P.addMonths(auj, -36).getTime())));
    let fin = new Date(Math.max(P.addMonths(auj, 18).getTime(), ...dates.map(d => d.getTime())));
    deb = new Date(deb.getFullYear(), deb.getMonth(), 1); fin = new Date(fin.getFullYear(), fin.getMonth() + 2, 1);
    const jours = P.diffDays(fin, deb), pc = d => Math.max(0, Math.min(100, P.diffDays(d, deb) / jours * 100));
    const pas = jours > 1500 ? 12 : jours > 700 ? 6 : 3; const rep = [];
    for (let d = new Date(deb.getFullYear(), Math.ceil(deb.getMonth() / pas) * pas, 1); d < fin; d = new Date(d.getFullYear(), d.getMonth() + pas, 1)) rep.push(`<span style="left:${pc(d)}%">${d.toLocaleDateString('fr-FR', {month: 'short', year: 'numeric'})}</span>`);
    const ans = []; for (let y = deb.getFullYear() + 1; y <= fin.getFullYear(); y++) ans.push(`<i class="ec-an" style="left:${pc(new Date(y, 0, 1))}%"></i>`);
    const frise = contrats.filter(p => p.fin || p.debut).map(p => {
      const e = etat(p); const d0 = p.debut || P.addDays(p.fin, -365), d1 = p.fin || P.addMonths(p.debut, 12);
      const l = pc(d0), w = Math.max(.5, pc(d1) - l); const fen = p.fin ? Math.min(100, P.reglage('preavis', 180) / Math.max(1, P.diffDays(d1, d0)) * 100) : 0;
      return `<div class="ec-ligne"><div class="ec-nom" title="${esc(p.nom)}">${esc(p.nom)}</div><div class="ec-trk">${ans.join('')}
        <div class="ec-bar ${e.c === 'ok' ? '' : e.c}" data-id="${p.id}" style="left:${l}%;width:${w}%" data-bulle="<strong>${esc(p.nom)}</strong><br>${esc([p.type, p.ref].filter(Boolean).join(' · '))}<br>${p.debut ? P.fmtDate(p.debut) : '?'} → ${p.fin ? P.fmtDate(p.fin) : '?'}<br>${esc(e.l)}">${fen ? `<span class="fen" style="width:${fen}%"></span>` : ''}</div>
        <div class="ec-auj" style="left:${pc(auj)}%"></div></div></div>`;
    }).join('');
    const ligne = p => { const e = etat(p); const pj = projetsDe(p);
      return `<div class="ligne-liste ec-ligne-liste" data-id="${p.id}"><div class="t"><strong>${esc(p.nom)}</strong><span>${esc([p.type, p.ref, p.objet].filter(Boolean).join(' · '))}</span>
        ${pj.length ? `<div class="ec-tags">${pj.map(x => `<span class="tag">${esc(x.code || x.titre)}</span>`).join('')}</div>` : ''}${p.contact || p.mail ? `<span>${esc(p.contact)}${p.mail ? ` · <a href="mailto:${esc(p.mail)}" onclick="event.stopPropagation()">${esc(p.mail)}</a>` : ''}</span>` : ''}</div>
        <div class="m">${avecContrat(p) ? `<span class="badge ${e.c}">${esc(e.l)}</span><br>${p.fin ? 'fin le ' + P.fmtDate(p.fin) : ''}` : ''}${p.montant ? `<br><strong style="color:var(--title)">${P.fmtEuro(p.montant)}</strong>` : ''}</div></div>`; };

    corps.innerHTML = `<div class="aere">
      <div class="tuiles">
        <div class="tuile ok"><div class="v">${actifs.length}</div><div class="l">marché(s) et contrat(s) en cours</div></div>
        <div class="tuile ${aRen.length ? 'warn' : ''}"><div class="v">${aRen.length}</div><div class="l">à renouveler sous ${P.reglage('seuil', 90)} jours</div></div>
        <div class="tuile ${expires.length ? 'err' : ''}"><div class="v">${expires.length}</div><div class="l">expiré(s)</div></div>
        ${L.a('Montant') ? `<div class="tuile"><div class="v" style="font-size:1.5rem">${P.fmtEuro(P.somme(actifs.map(p => p.montant || 0)))}</div><div class="l">montant des contrats en cours</div></div>` : `<div class="tuile"><div class="v">${autres.length}</div><div class="l">prestataire(s) sans contrat</div></div>`}
      </div>
      ${expires.length || aRen.length || sansFin.length ? `<div class="alerte ${expires.length ? 'err' : 'warn'}" style="padding:14px 18px"><strong>À traiter :</strong>
        ${[...expires.map(p => `${esc(p.nom)} (expiré le ${P.fmtDate(p.fin)})`), ...aRen.map(p => `${esc(p.nom)} (fin le ${P.fmtDate(p.fin)})`), ...sansFin.map(p => `${esc(p.nom)} (date de fin à saisir)`)].join(' · ')}</div>` : ''}
      <div class="ec-filtres no-print">${types.map(t => `<button class="tag" data-type="${esc(t)}" aria-pressed="${ui.types.has(t)}">${esc(t)}</button>`).join('')}
        <input class="in sm" id="ec-q" placeholder="Rechercher un prestataire, une référence…" value="${esc(ui.q)}" style="max-width:320px" aria-label="Rechercher"></div>
      <section class="carte"><h2>Frise des contrats</h2>
        ${frise ? `<div class="ec-frise"><div class="ec-axe"><div class="ec-nom">Prestataire</div><div class="ec-trk">${rep.join('')}</div></div>${frise}</div>
        <p class="small muted" style="margin:10px 0 0">Vert : en cours · orange : se termine bientôt · gris : expiré · hachures : période pour préparer le renouvellement · trait rouge : aujourd’hui</p>` : '<p class="vide-doux">Aucun contrat daté.</p>'}</section>
      <section class="carte"><h2>Marchés et contrats</h2>${contrats.length ? contrats.map(ligne).join('') : '<p class="vide-doux">Aucun.</p>'}</section>
      ${autres.length ? `<section class="carte"><h2>Prestataires ponctuels et démarchés</h2>${autres.map(ligne).join('')}</section>` : ''}
    </div>`;
    corps.querySelector('.ec-filtres').addEventListener('click', e => { const b = e.target.closest('[data-type]'); if (!b) return; const t = b.dataset.type; ui.types.has(t) ? ui.types.delete(t) : ui.types.add(t); dessiner(); });
    P.$('#ec-q').addEventListener('input', P.debounce(e => { ui.q = e.target.value; dessiner(); const i = P.$('#ec-q'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }, 250));
    corps.onclick = e => { if (e.target.closest('a')) return; const r = e.target.closest('[data-id]'); if (r) editer(+r.dataset.id); };
  }

  function editer(id) {
    const r = L.recs.find(x => x.id === id); if (!r) return;
    const f = document.createElement('form'); f.className = 'grille'; f.onsubmit = () => false; f.style.gap = '18px 20px';
    f.innerHTML = ['Nom', 'Type', 'Reference', 'Debut', 'Fin', 'Montant', 'Objet', 'Representant', 'Telephone', 'Mail'].map(n => L.champForm(n, r, {large: n === 'Nom' || n === 'Objet'})).join('');
    P.modale({titre: L.texte('Nom', r) || 'Prestataire', contenu: f, large: true, boutons: [{libelle: 'Annuler', classe: 'ter'}, {libelle: 'Enregistrer', classe: 'pri', action: async () => {
      const v = L.lireForm(f); if (v.Debut && v.Fin && v.Fin < v.Debut) { P.toast('La fin du contrat précède son début.', 'warn'); return false; }
      await L.ecrire(id, v, 'Prestataire enregistré.');
    }}]});
  }

  function exporter() {
    const cols = ['Prestataire', 'Type', 'Référence', 'Début', 'Fin', 'Jours restants', 'État', 'Montant', 'Projets'];
    const l = L.recs.map(fiche).sort((a, b) => (etat(a).j ?? 1e6) - (etat(b).j ?? 1e6)).map(p => { const e = etat(p); return [p.nom, p.type, p.ref, P.fmtDate(p.debut), P.fmtDate(p.fin), e.j ?? '', e.l, p.montant ?? '', projetsDe(p).map(x => x.code || x.titre).join(', ')]; });
    const csv = [cols, ...l].map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(';')).join('\r\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], {type: 'text/csv;charset=utf-8'}));
    a.download = `echeancier-contrats-${P.iso(P.today())}.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
})();
</script>
</body>
</html>
