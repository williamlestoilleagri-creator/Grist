<!DOCTYPE html>
<html lang="fr" data-fr-scheme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Capacité et charge</title>
<link rel="stylesheet" href="socle.css">
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<script src="socle.js"></script>
<script type="text/html" id="pl-aide"><!--AIDE--><p class="chapo">Ce tableau compare, <strong>semaine par semaine et pour chaque personne</strong>, le travail prévu dans les tâches avec le temps réellement disponible. Il montre d’un coup d’œil <strong>qui est surchargé, quand, et à cause de quelles tâches</strong>.</p>

<section>
  <h2>À quoi sert-il ?</h2>
  <ul>
    <li><strong>Anticiper les surcharges</strong> avant qu’elles ne créent des retards.</li>
    <li><strong>Répartir le travail</strong> : confier une tâche à une personne moins chargée, ou décaler une échéance.</li>
    <li><strong>Répondre à une nouvelle demande</strong> : « avons-nous la place de lancer ce projet le mois prochain ? »</li>
  </ul>
</section>

<section>
  <h2>Mise en place</h2>
  <ol class="etapes">
    <li><span>Ajoutez un <strong>widget personnalisé</strong> avec votre <strong>table de tâches</strong> comme données.</span></li>
    <li><span>Dans le <strong>panneau de droite</strong>, associez l’<strong>Intitulé</strong>, le <strong>Responsable</strong> et l’<strong>Échéance</strong>, puis si possible la <strong>Charge (jours)</strong>, la date de début, l’avancement, le statut et le projet.</span></li>
    <li><span>Cliquez sur <strong>« Capacités… »</strong> pour indiquer la disponibilité de chacun (100 % temps plein, 80 % temps partiel…).</span></li>
    <li><span>Facultatif : dans les paramètres (⚙), indiquez votre table de <strong>temps passés</strong> pour voir le réalisé des semaines passées.</span></li>
  </ol>
</section>

<div class="encart"><strong>📦 Pas encore de table de tâches ?</strong><p>Paramètres (⚙), onglet <strong>Table ressource</strong> : créez en un clic une table « Tâches » prête à l’emploi (avec la charge en jours), ou téléchargez son modèle CSV.</p></div>

<section>
  <h2>Comment lire le tableau</h2>
  <div class="blocs">
    <div><strong>🟩 Vert : de la marge</strong>Moins de 85 % du temps disponible est occupé.</div>
    <div><strong>🟨 Jaune : semaine pleine</strong>Entre 85 et 100 % : attention aux imprévus.</div>
    <div><strong>🟧 🟥 Orange et rouge : surcharge</strong>Plus de travail prévu que de jours disponibles.</div>
    <div><strong>▨ Hachuré : le passé</strong>Le temps réellement déclaré, pour comparer prévu et réalisé.</div>
  </div>
</section>

<section>
  <h2>Rééquilibrer en trois gestes</h2>
  <ol class="etapes">
    <li><span>Repérez une case <strong>orange ou rouge</strong>.</span></li>
    <li><span><strong>Cliquez dessus</strong> : les tâches qui chargent cette semaine s’affichent, des plus lourdes aux plus légères.</span></li>
    <li><span>Changez le <strong>responsable</strong> ou l’<strong>échéance</strong> : le tableau se recalcule aussitôt.</span></li>
  </ol>
</section>

<div class="encart astuce"><strong>💡 Comment c’est calculé</strong><p>Prévu = charge × (1 − avancement), étalée sur les jours ouvrés jusqu’à l’échéance ; une tâche en retard compte sur la semaine en cours. Disponible = jours ouvrés (jours fériés déduits) × disponibilité × (1 − réserve hors projet). La réserve représente le support, la maintenance et les réunions ; elle est mesurée sur les temps passés ou réglée dans les paramètres.</p></div>

<div class="encart attention"><strong>⚠️ Bon à savoir</strong><p>Le tableau n’est fiable que si les tâches ont une <strong>charge</strong> et une <strong>échéance</strong> : les chiffres du haut indiquent combien n’en ont pas. Complétez-les en priorité.</p></div>

<p class="pied">Les personnes sont reconnues par leur nom dans la colonne Responsable. Le bouton ⚙ règle la réserve hors projet, la charge des tâches non estimées et la part confiée aux appuis ; le bouton ? affiche ce mode d’emploi.</p><!--FIN_AIDE--></script>
<style>
  .cc-wrap{overflow:auto;border:1px solid var(--border)}
  table.cc-t{border-collapse:separate;border-spacing:0;font-size:.85rem;min-width:100%}
  .cc-t th,.cc-t td{border-bottom:1px solid #f0f0f0;border-right:1px solid #f0f0f0;padding:0;text-align:center;background:var(--surface)}
  .cc-t thead th{position:sticky;top:0;background:var(--alt);border-bottom:2px solid var(--text);padding:10px 6px;font-weight:700;color:var(--title);white-space:nowrap;z-index:1}
  .cc-t thead th small{display:block;color:var(--mention);font-weight:400;margin-top:2px}
  .cc-t th.ag{position:sticky;left:0;text-align:left;padding:10px 16px;min-width:210px;z-index:2;font-weight:500;color:var(--title)}
  .cc-t thead th.ag{z-index:3}
  .cc-t th.ag small{display:block;color:var(--mention);font-weight:400;margin-top:2px}
  .cc-t td button{width:100%;min-width:76px;height:58px;border:0;cursor:pointer;font-variant-numeric:tabular-nums;line-height:1.25;background:transparent}
  .cc-t td button:hover{box-shadow:inset 0 0 0 2px var(--bf)}
  .cc-t td .r{display:block;font-weight:700;font-size:.95rem}
  .cc-t td .d{display:block;font-size:.72rem;opacity:.85;margin-top:2px}
  .n0{background:var(--surface)!important;color:#bbb}
  .n1{background:#e9f8ee!important;color:#0f5a2c}
  .n2{background:#c9f5d6!important;color:#0f5a2c}
  .n3{background:#fceeac!important;color:#5c4b1e}
  .n4{background:#ffd8bf!important;color:#8a2c00}
  .n5{background:#ffbdbd!important;color:#8a0000}
  .passe{background-image:repeating-linear-gradient(135deg,transparent 0 6px,rgba(0,0,0,.035) 6px 12px)}
  .cc-t tr.total th,.cc-t tr.total td{border-top:2px solid var(--text);font-weight:700}
  .cc-semcour{box-shadow:inset 0 -4px 0 var(--rm)}
  .cc-leg{display:flex;gap:18px;flex-wrap:wrap;font-size:.85rem;align-items:center}
  .cc-leg i{display:inline-block;width:22px;height:14px;vertical-align:middle;margin-right:6px;border:1px solid var(--border)}
  .cc-barre{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .cc-barre .in{width:auto}
</style>
</head>
<body>
<script>
(function () {
  const P = Pilotage, L = P.L, esc = P.esc;
  const ui = {semaines: 12, passe: 4, groupe: ''};
  try { Object.assign(ui, JSON.parse(localStorage.getItem('capacite-ui') || '{}')); } catch (e) { /* ignoré */ }
  const sauverUi = () => { try { localStorage.setItem('capacite-ui', JSON.stringify(ui)); } catch (e) { /* ignoré */ } };
  let calc = null;

  P.demarrer({
    id: 'capacite-charge',
    titre: 'Capacité et charge',
    sousTitre: 'Le travail prévu comparé au temps disponible, semaine par semaine',
    entites: ['temps'], optionnelles: ['temps'], entitesSeules: true,
    ressource: 'taches',
    colonnes: [
      {name: 'Titre', title: 'Intitulé', type: 'Any', ressource: ['Intitule']},
      {name: 'Responsable', title: 'Responsable', description: 'La personne qui porte la charge de la tâche', type: 'Any', ressource: ['Responsable']},
      {name: 'Echeance', title: 'Échéance', type: 'Date', ressource: ['Echeance']},
      {name: 'Charge', title: 'Charge (jours)', description: 'Nombre de jours de travail estimés', type: 'Numeric', optional: true, ressource: ['Charge']},
      {name: 'Debut', title: 'Date de début', type: 'Date', optional: true, ressource: ['Date_debut']},
      {name: 'Avancement', title: 'Avancement', description: 'Seul le reste à faire est compté', type: 'Numeric', optional: true, ressource: ['Avancement']},
      {name: 'Statut', title: 'Statut', description: 'Les tâches terminées ou abandonnées ne comptent plus', type: 'Choice', optional: true, ressource: ['Statut']},
      {name: 'Groupe', title: 'Projet (filtre)', type: 'Any', optional: true, ressource: ['Projet']},
      {name: 'Appuis', title: 'Personnes en appui', description: 'Peuvent recevoir une part de la charge (voir réglages)', type: 'Any', optional: true},
    ],
    demo: {table: 'DATA_Taches', mapping: {Titre: 'Action', Responsable: 'Responsable', Echeance: 'Echeance', Charge: 'Charge_estimee', Debut: 'Date_de_debut', Avancement: 'Avancement', Statut: 'Statut', Groupe: 'Projet', Appuis: 'Appuis'}},
    reglagesHtml: () => `<p class="small muted" style="margin:0">Table liée facultative ci-dessus : les <strong>temps passés</strong>. Elle affiche le réalisé des semaines passées et mesure la part de temps hors projet. Les agents sont reconnus par leur nom.</p>
      <div class="grille" style="margin-top:10px">
      <div class="champ"><label for="rg-res">Réserve hors projet (%)</label><input class="in" id="rg-res" type="number" min="0" max="90" placeholder="auto" value="${P.reglage('reserve', '') ?? ''}">
        <span class="aide">Temps consacré au support, à la maintenance, aux réunions… Vide = mesurée sur les temps passés (20 % sinon).</span></div>
      <div class="champ"><label for="rg-def">Charge d’une tâche non estimée (jours)</label><input class="in" id="rg-def" type="number" min="0" step="0.5" value="${P.reglage('chargeDefaut', 1)}"></div>
      <div class="champ"><label for="rg-app">Part de la charge confiée aux appuis (%)</label><input class="in" id="rg-app" type="number" min="0" max="90" value="${P.reglage('partAppuis', 0)}"></div></div>`,
    lireReglages: (el, r) => {
      const v = el.querySelector('#rg-res').value; r.reserve = v === '' ? '' : Math.min(90, Math.max(0, +v));
      r.chargeDefaut = Math.max(0, +el.querySelector('#rg-def').value || 0); r.partAppuis = Math.min(90, Math.max(0, +el.querySelector('#rg-app').value || 0));
    },
    outils: () => `<div class="cc-barre">
      <select class="in sm" id="cc-sem" aria-label="Horizon">${[6, 12, 26, 52].map(n => `<option value="${n}" ${n === ui.semaines ? 'selected' : ''}>${n} semaines</option>`).join('')}</select>
      <select class="in sm" id="cc-passe" aria-label="Semaines passées">${[0, 4, 8].map(n => `<option value="${n}" ${n === ui.passe ? 'selected' : ''}>${n ? n + ' sem. passées' : 'Sans le passé'}</option>`).join('')}</select>
      <button class="btn sec sm" id="cc-cap">Capacités…</button></div>`,
    surOutils: el => {
      el.querySelector('#cc-sem').addEventListener('change', e => { ui.semaines = +e.target.value; sauverUi(); dessiner(); });
      el.querySelector('#cc-passe').addEventListener('change', e => { ui.passe = +e.target.value; sauverUi(); dessiner(); });
      el.querySelector('#cc-cap').addEventListener('click', capacites);
    },
    rendu: () => dessiner(),
  });

  const noms = (nom, r) => L.texte(nom, r).split(/\s*,\s*/).filter(Boolean);
  const taux = n => { const c = (P.reglage('capacites', {}) || {})[n]; return c == null ? 1 : c / 100; };
  const NA = 'Non affecté';

  function reserve() {
    const r = P.reglage('reserve', '');
    if (r !== '' && r != null) return {v: r / 100, mode: 'réglée'};
    const deb = P.addDays(P.today(), -56);
    const t = P.liste('temps').filter(x => x.date && x.date >= deb && x.date <= P.today());
    const tot = P.somme(t.map(x => x.duree)), hors = P.somme(t.filter(x => !x.tache && !x.projet).map(x => x.duree));
    return tot >= 5 ? {v: Math.min(.8, hors / tot), mode: 'mesurée sur les temps passés'} : {v: .2, mode: 'valeur par défaut'};
  }

  function calculer() {
    const auj = P.today(), lundi0 = P.lundi(auj);
    const semaines = [];
    for (let i = -ui.passe; i < ui.semaines; i++) { const d = P.addDays(lundi0, 7 * i); semaines.push({i, debut: d, fin: P.addDays(d, 6), jours: P.joursOuvres(d, P.addDays(d, 6)), passe: i < 0}); }
    const finH = semaines[semaines.length - 1].fin;
    const res = reserve();
    const charge = new Map();
    const ajouter = (a, k, t, j) => { if (!charge.has(a)) charge.set(a, {}); const c = charge.get(a); (c[k] = c[k] || []).push({t, j}); };
    const stats = {nonEstimees: 0, sansEcheance: 0, retard: 0};
    const ech = L.echelle('Avancement');
    L.recs.forEach(r => {
      if (ui.groupe && L.texte('Groupe', r) !== ui.groupe) return;
      const statut = L.texte('Statut', r); if (P.estClos(statut)) return;
      const t = {id: r.id, r, titre: L.texte('Titre', r) || '(sans intitulé)', groupe: L.texte('Groupe', r), echeance: L.date('Echeance', r), debut: L.date('Debut', r), statut};
      const est = L.nombre('Charge', r);
      if (!(est > 0)) stats.nonEstimees++;
      const av = L.a('Avancement') ? Math.max(0, Math.min(1, (L.nombre('Avancement', r) || 0) / ech)) : 0;
      const total = Math.max(0, est > 0 ? est : P.reglage('chargeDefaut', 1)) * (1 - av);
      if (!total) return;
      const resp = noms('Responsable', r); const princ = resp[0] || NA;
      const appuis = resp.slice(1).concat(L.a('Appuis') ? noms('Appuis', r) : []).filter(n => n !== princ);
      const pa = appuis.length ? P.reglage('partAppuis', 0) / 100 : 0;
      const parts = [[princ, total * (1 - pa)], ...appuis.map(a => [a, total * pa / appuis.length])];
      if (!t.echeance) { stats.sansEcheance++; parts.forEach(([a, j]) => ajouter(a, 'np', t, j)); return; }
      let d0 = t.debut && t.debut > auj ? t.debut : auj; const f = t.echeance;
      if (f < auj) { stats.retard++; parts.forEach(([a, j]) => ajouter(a, 0, t, j)); return; }
      if (d0 > f) d0 = f;
      let jours = P.joursOuvres(d0, f); if (!jours.length) jours = [f];
      semaines.forEach(s => { if (s.passe) return; const n = jours.filter(d => d >= s.debut && d <= s.fin).length; if (n) parts.forEach(([a, j]) => ajouter(a, s.i, t, j * n / jours.length)); });
      const apres = jours.filter(d => d > finH).length; if (apres) parts.forEach(([a, j]) => ajouter(a, 'apres', t, j * apres / jours.length));
    });
    const realise = new Map();
    P.liste('temps').forEach(x => {
      if (!x.date) return; const s = semaines.find(w => w.passe && x.date >= w.debut && x.date <= w.fin); if (!s) return;
      const a = P.libelle('agent', x.agent) || NA; if (!realise.has(a)) realise.set(a, {}); const m = realise.get(a); m[s.i] = (m[s.i] || 0) + (x.duree || 0);
    });
    const agents = P.uniq([...charge.keys(), ...realise.keys()]).sort((a, b) => (a === NA) - (b === NA) || a.localeCompare(b, 'fr'));
    return {semaines, agents, charge, realise, res, stats};
  }

  const niveau = r => r == null || r === 0 ? 'n0' : r <= .5 ? 'n1' : r <= .85 ? 'n2' : r <= 1 ? 'n3' : r <= 1.2 ? 'n4' : 'n5';
  const cap = (a, s, res) => a === NA ? 0 : s.jours.length * taux(a) * (1 - res.v);
  const somme = (c, k) => c && c[k] ? P.somme(c[k].map(x => x.j)) : 0;

  function dessiner() {
    const corps = P.$('#pl-corps');
    calc = calculer();
    const {semaines, agents, charge, realise, res, stats} = calc;
    const fut = semaines.filter(s => !s.passe);
    const totC = P.somme(agents.map(a => P.somme(fut.map(s => somme(charge.get(a), s.i)))));
    const totK = P.somme(agents.map(a => P.somme(fut.map(s => cap(a, s, res)))));
    const surch = agents.filter(a => a !== NA && fut.some(s => { const k = cap(a, s, res); return k > 0 && somme(charge.get(a), s.i) > k * 1.0001; }));
    const groupes = L.a('Groupe') ? P.uniq(L.recs.map(r => L.texte('Groupe', r)).filter(Boolean)).sort((a, b) => a.localeCompare(b, 'fr')) : [];
    const cell = (a, s) => {
      if (s.passe) {
        const r = (realise.get(a) || {})[s.i] || 0; const k = a === NA ? 0 : s.jours.length * taux(a);
        return `<td class="passe ${niveau(k ? r / k : null)}"><button data-a="${esc(a)}" data-s="${s.i}" data-bulle="Réalisé : ${P.fmtNb(r)} jour(s) déclaré(s)"><span class="r">${r ? P.fmtNb(r) : '·'}</span><span class="d">${r ? 'réalisé' : ''}</span></button></td>`;
      }
      const c = somme(charge.get(a), s.i), k = cap(a, s, res), ratio = k ? c / k : (c ? 9 : 0);
      return `<td class="${niveau(ratio)} ${s.i === 0 ? 'cc-semcour' : ''}"><button data-a="${esc(a)}" data-s="${s.i}" data-bulle="${esc(a)} · semaine ${P.semaineIso(s.debut)}<br>Prévu : ${P.fmtNb(c)} j · disponible : ${P.fmtNb(k)} j">
        <span class="r">${c ? (k ? P.fmtPct(c / k) : P.fmtNb(c) + ' j') : '·'}</span><span class="d">${c ? P.fmtNb(c) + ' / ' + P.fmtNb(k) + ' j' : ''}</span></button></td>`;
    };
    corps.innerHTML = `<div class="aere" style="max-width:none">
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
        ${groupes.length ? `<select class="in sm" id="cc-g" style="width:auto" aria-label="Projet"><option value="">Tous les projets</option>${groupes.map(g => `<option ${g === ui.groupe ? 'selected' : ''}>${esc(g)}</option>`).join('')}</select>` : ''}
        <div class="cc-leg"><span><i class="n2"></i>Marge</span><span><i class="n3"></i>Plein</span><span><i class="n4"></i>Surcharge</span><span><i class="n5"></i>Forte surcharge</span><span><i class="passe" style="background:#fff"></i>Passé (réalisé)</span></div></div>
      <div class="tuiles">
        <div class="tuile ${totK && totC / totK > 1 ? 'err' : totK && totC / totK > .85 ? 'warn' : 'ok'}"><div class="v">${totK ? P.fmtPct(totC / totK) : '–'}</div><div class="l">occupation de l’équipe sur ${ui.semaines} semaines</div></div>
        <div class="tuile ${surch.length ? 'err' : 'ok'}"><div class="v">${surch.length}</div><div class="l">personne(s) en surcharge au moins une semaine</div></div>
        <div class="tuile ${stats.nonEstimees ? 'warn' : ''}"><div class="v">${stats.nonEstimees}</div><div class="l">tâche(s) sans charge estimée</div></div>
        <div class="tuile ${stats.sansEcheance ? 'warn' : ''}"><div class="v">${stats.sansEcheance}</div><div class="l">tâche(s) sans échéance</div></div>
      </div>
      ${agents.length ? `<div class="cc-wrap"><table class="cc-t"><thead><tr><th class="ag">Personne</th>
        ${semaines.map(s => `<th class="${s.i === 0 ? 'cc-semcour' : ''}">S${P.semaineIso(s.debut)}<small>${P.fmtDateCourt(s.debut)}${s.jours.length < 5 ? ` · ${s.jours.length} j` : ''}</small></th>`).join('')}
        <th>Sans échéance</th><th>Plus tard</th></tr></thead><tbody>
        ${agents.map(a => `<tr><th class="ag">${esc(a)}<small>${a === NA ? 'tâches sans responsable' : 'disponible à ' + P.fmtPct(taux(a))}</small></th>${semaines.map(s => cell(a, s)).join('')}
          <td><button data-a="${esc(a)}" data-s="np"><span class="r">${somme(charge.get(a), 'np') ? P.fmtNb(somme(charge.get(a), 'np')) + ' j' : '·'}</span></button></td>
          <td><button data-a="${esc(a)}" data-s="apres"><span class="r">${somme(charge.get(a), 'apres') ? P.fmtNb(somme(charge.get(a), 'apres')) + ' j' : '·'}</span></button></td></tr>`).join('')}
        <tr class="total"><th class="ag">Toute l’équipe</th>${semaines.map(s => {
          if (s.passe) return `<td class="passe"><span class="r" style="display:block;padding:18px 4px">${P.fmtNb(P.somme(agents.map(a => (realise.get(a) || {})[s.i] || 0)))}</span></td>`;
          const c = P.somme(agents.map(a => somme(charge.get(a), s.i))), k = P.somme(agents.map(a => cap(a, s, res)));
          return `<td class="${niveau(k ? c / k : null)}"><span class="r" style="display:block;padding:10px 4px 0">${k ? P.fmtPct(c / k) : '–'}</span><span class="d" style="display:block;padding-bottom:10px;font-weight:400">${P.fmtNb(c)} / ${P.fmtNb(k)} j</span></td>`; }).join('')}
          <td>${P.fmtNb(P.somme(agents.map(a => somme(charge.get(a), 'np'))))} j</td><td>${P.fmtNb(P.somme(agents.map(a => somme(charge.get(a), 'apres'))))} j</td></tr>
      </tbody></table></div>` : '<div class="vide">Aucune charge à afficher : vérifiez les colonnes Responsable, Échéance et Charge.</div>'}
      <p class="small muted" style="margin:0">Disponible = jours ouvrés (fériés déduits) × taux de disponibilité × (1 − réserve hors projet de ${P.fmtPct(res.v)}, ${res.mode}). Prévu = charge × (1 − avancement), étalée jusqu’à l’échéance ; une tâche en retard compte sur la semaine en cours. Cliquez une case pour voir et réaffecter les tâches.</p>
    </div>`;
    if (P.$('#cc-g')) P.$('#cc-g').addEventListener('change', e => { ui.groupe = e.target.value; dessiner(); });
    const w = P.$('.cc-wrap'); if (w) w.addEventListener('click', e => { const b = e.target.closest('button[data-a]'); if (b) detail(b.dataset.a, b.dataset.s); });
  }

  /* Valeur à écrire dans la colonne Responsable pour un nom donné (texte, référence ou liste) */
  function valeurResponsable(nom) {
    const c = L.col('Responsable'); if (!c || !nom) return null;
    if (/^Ref(List)?:/.test(c.type)) {
      const m = L.refs[c.colId]; const id = m ? [...m.entries()].find(([, v]) => v === nom)?.[0] : null;
      if (!id) return undefined;
      return /^RefList/.test(c.type) ? ['L', id] : id;
    }
    return nom;
  }
  function nomsConnus() {
    const c = L.col('Responsable');
    const base = c && /^Ref(List)?:/.test(c.type) && L.refs[c.colId] ? [...L.refs[c.colId].values()] : calc.agents.filter(a => a !== NA);
    return P.uniq(base.filter(Boolean)).sort((a, b) => a.localeCompare(b, 'fr'));
  }

  function detail(a, k) {
    const s = calc.semaines.find(x => String(x.i) === k);
    if (s && s.passe) {
      const t = P.liste('temps').filter(x => (P.libelle('agent', x.agent) || NA) === a && x.date >= s.debut && x.date <= s.fin);
      P.modale({titre: `${a} · réalisé semaine ${P.semaineIso(s.debut)}`, contenu: t.length ? t.map(x => `<div class="ligne-liste"><div class="t"><strong>${esc(P.libelle('tache', x.tache) || x.type || x.commentaire || 'Activité')}</strong><span>${esc(P.libelle('projet', x.projet) || '')}</span></div><div class="m">${P.fmtDate(x.date)}<br>${P.fmtNb(x.duree)} j</div></div>`).join('') : '<p class="muted">Aucun temps déclaré.</p>'});
      return;
    }
    const items = ((calc.charge.get(a) || {})[k === 'np' || k === 'apres' ? k : +k] || []).slice().sort((x, y) => y.j - x.j);
    const titre = k === 'np' ? 'tâches sans échéance' : k === 'apres' ? 'au-delà de l’horizon' : `semaine ${P.semaineIso(s.debut)} (${P.fmtDateCourt(s.debut)} – ${P.fmtDateCourt(s.fin)})`;
    const modR = L.ecrivable('Responsable'), modE = L.ecrivable('Echeance'); const liste = nomsConnus();
    const div = document.createElement('div');
    div.innerHTML = items.length ? `<p class="muted" style="margin:0 0 6px">${s ? `Disponible : ${P.fmtNb(cap(a, s, calc.res))} j · prévu : ${P.fmtNb(P.somme(items.map(x => x.j)))} j. ` : ''}Changez le responsable ou l’échéance pour rééquilibrer.</p>
      ${items.map(({t, j}) => `<div class="ligne-liste" data-id="${t.id}"><div class="t"><strong>${esc(t.titre)}</strong><span>${esc([t.groupe, t.statut, P.fmtNb(j, 2) + ' j sur la période'].filter(Boolean).join(' · '))}</span></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">${modR ? `<select class="in sm" data-f="resp" style="width:180px" aria-label="Responsable">${(a === NA ? ['<option value=""></option>'] : []).join('')}${liste.map(n => `<option ${n === a ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>` : ''}
        ${modE ? `<input class="in sm" type="date" data-f="ech" style="width:150px" value="${t.echeance ? P.iso(t.echeance) : ''}" aria-label="Échéance">` : ''}</div></div>`).join('')}` : '<p class="muted">Aucune tâche.</p>';
    div.addEventListener('change', async e => {
      const l = e.target.closest('[data-id]'); if (!l) return; const id = +l.dataset.id;
      if (e.target.dataset.f === 'resp') { const v = valeurResponsable(e.target.value); if (v === undefined) { P.toast('Personne introuvable dans la table liée.', 'warn'); return; } await L.ecrire(id, {Responsable: v}, `Tâche confiée à ${e.target.value}.`); }
      if (e.target.dataset.f === 'ech') await L.ecrire(id, {Echeance: P.fromIso(e.target.value)}, 'Échéance modifiée.');
    });
    P.modale({titre: `${a} · ${titre}`, contenu: div, large: true});
  }

  function capacites() {
    const agents = calc ? calc.agents.filter(a => a !== NA) : [];
    const div = document.createElement('div');
    div.innerHTML = `<p class="muted" style="margin:0">Taux de disponibilité de chaque personne : 100 % = temps plein, 80 % = temps partiel, 50 % = mi-temps sur ces projets.</p>
      <div class="grille" style="margin-top:12px">${agents.map((a, i) => `<div class="champ"><label for="cap-${i}">${esc(a)}</label><input class="in" type="number" min="0" max="100" step="5" id="cap-${i}" data-nom="${esc(a)}" value="${Math.round(taux(a) * 100)}"></div>`).join('') || '<p class="muted">Aucune personne trouvée dans la colonne Responsable.</p>'}</div>`;
    P.modale({titre: 'Disponibilité de l’équipe', contenu: div, boutons: [{libelle: 'Annuler', classe: 'ter'}, {libelle: 'Enregistrer', classe: 'pri', action: async () => {
      const c = {}; P.$$('input[data-nom]', div).forEach(i => { const v = Math.max(0, Math.min(100, +i.value)); if (v !== 100) c[i.dataset.nom] = v; });
      await P.setReglage('capacites', c); dessiner(); P.toast('Disponibilités enregistrées.', 'ok');
    }}]});
  }
})();
</script>
</body>
</html>
