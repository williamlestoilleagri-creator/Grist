<!DOCTYPE html>
<html lang="fr" data-fr-scheme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gantt</title>
<link rel="stylesheet" href="socle.css">
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<script src="socle.js"></script>
<script type="text/html" id="pl-aide"><!--AIDE--><p class="chapo">Le Gantt affiche vos tâches <strong>sur une frise, regroupées par projet</strong> : on voit d’un coup d’œil ce qui se chevauche, ce qui dérape et ce qui arrive. Les dates se modifient <strong>directement à la souris</strong>.</p>

<section>
  <h2>À quoi sert-il ?</h2>
  <ul>
    <li><strong>Visualiser le calendrier</strong> du pôle : quels projets tournent en même temps, et quand.</li>
    <li><strong>Repérer les dérapages</strong> : les tâches en retard sont en rouge et signalées par un point rouge.</li>
    <li><strong>Replanifier en quelques secondes</strong>, sans ressaisir les dates dans les tables.</li>
  </ul>
</section>

<section>
  <h2>Choisir ce que le Gantt affiche</h2>
  <p>Le Gantt s’appuie sur <strong>la table choisie comme données du widget</strong> (par exemple <em>DATA_Taches</em>). Les colonnes utilisées se choisissent dans le <strong>panneau de droite de Grist</strong>, onglet <strong>Widget</strong> :</p>
  <div class="blocs">
    <div><strong>Intitulé et Date de fin</strong>Obligatoires : le texte de la barre et sa date de fin (l’échéance).</div>
    <div><strong>Date de début</strong>Sans elle, la durée est estimée à partir de la charge : la barre est alors hachurée.</div>
    <div><strong>Regrouper par</strong>Une section par valeur, par exemple par projet, par responsable ou par thème.</div>
    <div><strong>Sous-titre</strong>Affiché sous l’intitulé, par exemple le responsable.</div>
    <div><strong>Avancement et Statut</strong>L’avancement se voit dans la barre ; le statut repère les tâches terminées.</div>
    <div><strong>Couleur et Jalon</strong>Une colonne Choix colore les barres avec les couleurs de Grist ; une case à cocher transforme une ligne en jalon ◆.</div>
  </div>
</section>

<div class="encart"><strong>📦 Pas encore de table adaptée ?</strong><p>Ouvrez les paramètres du widget (⚙), onglet <strong>Table ressource</strong> : créez en un clic une table « Tâches » prête à l’emploi (avec ou sans exemples), ou téléchargez son modèle CSV. Choisissez-la ensuite comme données du widget.</p></div>

<section>
  <h2>Replanifier à la souris</h2>
  <ol class="etapes">
    <li><span><strong>Glissez une barre</strong> pour la décaler : début et fin bougent ensemble.</span></li>
    <li><span><strong>Étirez son bord gauche ou droit</strong> pour changer seulement la date de début ou de fin.</span></li>
    <li><span><strong>Cliquez sur une barre ou sur son intitulé</strong> pour modifier les dates, le statut ou l’avancement.</span></li>
    <li><span>Pour une ligne <strong>« non planifiée »</strong>, cliquez dans la frise au jour voulu : elle y est placée.</span></li>
  </ol>
</section>

<div class="encart astuce"><strong>💡 Astuce</strong><p>Choisissez l’échelle (<strong>Jour, Semaine, Mois, Trimestre</strong>) et la densité : <strong>Confortable</strong> pour lire en détail, <strong>Compact</strong> pour voir beaucoup de lignes. Le champ <strong>Filtrer</strong> retrouve une tâche, une personne ou un projet ; <strong>Tout replier</strong> ne garde que les sections.</p></div>

<div class="encart attention"><strong>⚠️ Bon à savoir</strong><p>Chaque déplacement est <strong>enregistré immédiatement</strong> dans Grist. En cas d’erreur, utilisez la flèche « Annuler » de Grist, en haut à gauche de l’écran.</p></div>

<p class="pied">Les éléments terminés sont masqués : cochez « Terminés » pour les afficher. Le bouton « Aujourd’hui » ramène la frise à la date du jour. L’échelle, la densité et les sections repliées sont mémorisées sur votre poste. Le bouton ? affiche ce mode d’emploi.</p><!--FIN_AIDE--></script>
<style>
  .pl-corps{padding:0}
  .gt-outils{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .gt-leg{display:flex;gap:16px;flex-wrap:wrap;align-items:center;padding:8px 16px;font-size:.78rem;color:var(--text);border-bottom:1px solid var(--border);background:var(--alt)}
  .gt-leg i{display:inline-block;width:22px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
  .gt-leg .los{width:11px;height:11px;transform:rotate(45deg);border-radius:1px}
  .gt-wrap{overflow:auto;height:calc(100vh - 106px);position:relative}
  .gt{position:relative;--lw:360px;--rh:52px;--bh:24px;--gh:50px}
  .gt.compact{--lw:300px;--rh:34px;--bh:16px;--gh:38px}
  .gt-row{display:flex;height:var(--rh);border-bottom:1px solid #f0f0f0}
  .gt-row:nth-child(even) .gt-trk{background:rgba(0,0,145,.012)}
  .gt-row.grp{height:var(--gh);background:var(--bf-975);border-bottom:1px solid var(--bf-925);border-top:8px solid var(--surface)}
  .gt-lbl{position:sticky;left:0;z-index:3;width:var(--lw);flex:0 0 var(--lw);background:var(--surface);border-right:1px solid var(--border);padding:0 14px 0 18px;display:flex;flex-direction:column;justify-content:center;min-width:0;cursor:pointer}
  .gt-lbl:hover .t{color:var(--bf)}
  .gt-row.grp .gt-lbl{background:var(--bf-975);flex-direction:row;align-items:center;gap:8px;padding-left:8px;border-left:4px solid var(--bf)}
  .gt-lbl .t{font-size:.9rem;font-weight:500;color:var(--title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gt.compact .gt-lbl .t{font-size:.82rem}
  .gt-lbl .s{font-size:.74rem;color:var(--mention);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .gt.compact .gt-lbl .s{display:none}
  .gt-row.grp .gt-lbl .t{font-size:1rem;font-weight:700;flex:1}
  .gt-row.grp .gt-lbl .n{font-size:.72rem;background:var(--bf);color:#fff;border-radius:10px;padding:0 8px;line-height:1.5}
  .gt-lbl button.rep{background:none;border:0;cursor:pointer;padding:2px;color:var(--bf);display:flex}
  .gt-lbl button.rep svg{width:20px;height:20px;transition:transform .15s}
  .gt-lbl button.rep[aria-expanded=true] svg{transform:rotate(90deg)}
  .gt-trk{position:relative;flex:0 0 auto}
  .gt-head{position:sticky;top:0;z-index:6;background:var(--surface);box-shadow:0 2px 0 var(--text)}
  .gt-head .gt-row{height:56px;border:0}
  .gt-head .gt-lbl{z-index:7;cursor:default;font-weight:700;color:var(--title);font-size:.85rem}
  .gt-h1,.gt-h2{position:relative;height:28px}
  .gt-h1 span,.gt-h2 span{position:absolute;top:0;bottom:0;border-left:1px solid var(--border);padding:5px 6px;overflow:hidden;white-space:nowrap}
  .gt-h1 span{font-weight:700;color:var(--title);font-size:.82rem}
  .gt-h2 span{color:var(--mention);font-size:.75rem}
  .gt-h2 span.we{background:var(--alt)}
  .gt-h2 span.auj{color:#fff;background:var(--rm);font-weight:700}
  .gt-grid{position:absolute;top:0;bottom:0;pointer-events:none;z-index:0}
  .gt-grid i{position:absolute;top:0;bottom:0;border-left:1px solid #f1f1f1}
  .gt-grid i.m{border-left:1px solid #d6d6d6}
  .gt-grid i.we{background:rgba(0,0,0,.022);border:0}
  .gt-today{position:absolute;top:0;bottom:0;width:2px;background:var(--rm);z-index:2;pointer-events:none}
  .gt-bar{position:absolute;top:calc((var(--rh) - var(--bh)) / 2);height:var(--bh);border-radius:5px;color:#fff;font-size:.75rem;line-height:var(--bh);white-space:nowrap;cursor:grab;z-index:1;touch-action:none;user-select:none;box-shadow:0 1px 2px rgba(0,0,0,.18)}
  .gt.compact .gt-bar{font-size:.68rem;border-radius:3px}
  .gt-bar .pg{position:absolute;inset:0 auto 0 0;background:rgba(255,255,255,.28);border-radius:5px 0 0 5px;pointer-events:none}
  .gt-bar .gt-in{position:absolute;left:8px;right:8px;overflow:hidden;text-overflow:ellipsis;pointer-events:none;font-weight:500}
  .gt-bar .gt-out{position:absolute;left:calc(100% + 8px);color:var(--text);pointer-events:none;font-weight:500}
  .gt-bar .h{position:absolute;top:0;bottom:0;width:9px;cursor:ew-resize}
  .gt-bar .h.g{left:-4px} .gt-bar .h.d{right:-4px}
  .gt-bar .h::after{content:"";position:absolute;top:25%;bottom:25%;left:3px;width:2px;border-radius:1px;background:rgba(255,255,255,.7);opacity:0}
  .gt-bar:hover .h::after{opacity:1}
  .gt-bar.ro{cursor:pointer}
  .gt-bar.estime{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.3) 0 5px,transparent 5px 10px)}
  .gt-bar.drag{opacity:.8;cursor:grabbing;box-shadow:var(--shadow-lg);z-index:4}
  .gt-som{position:absolute;top:calc(var(--gh) / 2 - 4px);height:8px;background:var(--bf);border-radius:4px;opacity:.85;pointer-events:none}
  .gt-som::before,.gt-som::after{content:"";position:absolute;top:-3px;width:3px;height:14px;background:var(--bf);border-radius:1px}
  .gt-som::before{left:0} .gt-som::after{right:0}
  .gt-som-l{position:absolute;top:calc(var(--gh) / 2 - 22px);font-size:.7rem;color:var(--bf);font-weight:500;white-space:nowrap;pointer-events:none}
  .gt-jal{position:absolute;top:calc(var(--rh) / 2 - 9px);width:18px;height:18px;transform:translateX(-9px) rotate(45deg);border-radius:2px;z-index:2;cursor:grab;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3);touch-action:none}
  .gt-jal-l{position:absolute;top:0;bottom:0;display:flex;align-items:center;font-size:.75rem;font-weight:500;color:var(--text);pointer-events:none;white-space:nowrap}
  .gt-vide{position:absolute;inset:6px 0;cursor:copy;border:1px dashed transparent;border-radius:5px}
  .gt-vide:hover{border-color:var(--bf-850);background:var(--bf-975)}
  .gt-vide::after{content:"Non planifiée – cliquer sur un jour pour la placer";position:sticky;left:calc(var(--lw) + 12px);display:inline-block;margin-left:12px;font-size:.74rem;color:var(--mention);line-height:calc(var(--rh) - 14px);font-style:italic}
  .gt-msg{max-width:720px;margin:24px}
  .gt-msg ol li{margin-bottom:4px}
  @media print{.gt-wrap{height:auto;overflow:visible}.gt-leg{display:none}}
</style>
</head>
<body>
<script>
(function () {
  const P = Pilotage, esc = P.esc;
  const ZOOMS = {jour: 36, semaine: 16, mois: 5, trimestre: 1.9};
  const COULEURS = ['#000091', '#6a6af4', '#009081', '#c08c65', '#a558a0', '#417dc4', '#d1335b', '#5e2a2b', '#3a3a3a', '#716043'];
  const ROUGE = '#ce0500', ORANGE = '#c3592d', GRIS = '#929292', BLEU = '#000091';
  /* Colonnes à choisir dans le panneau de droite de Grist */
  const COLONNES = [
    {name: 'Titre', title: 'Intitulé', description: 'Texte affiché sur chaque barre (ex. Action, Intitulé)', type: 'Any', ressource: ['Intitule']},
    {name: 'Fin', title: 'Date de fin / échéance', description: 'Fin de la barre (ex. Échéance, Deadline)', type: 'Date', ressource: ['Echeance']},
    {name: 'Debut', title: 'Date de début', description: 'Début de la barre ; sans elle, la durée est estimée', type: 'Date', optional: true, ressource: ['Date_debut']},
    {name: 'Groupe', title: 'Regrouper par', description: 'Ex. Projet : une section par valeur', type: 'Any', optional: true, ressource: ['Projet']},
    {name: 'Responsable', title: 'Sous-titre', description: 'Affiché sous l’intitulé (ex. Responsable)', type: 'Any', optional: true, ressource: ['Responsable']},
    {name: 'Avancement', title: 'Avancement', description: 'Nombre entre 0 et 1 (ou en %), affiché dans la barre', type: 'Numeric', optional: true, ressource: ['Avancement']},
    {name: 'Statut', title: 'Statut', description: 'Sert à repérer les éléments terminés et en retard', type: 'Choice', optional: true, ressource: ['Statut']},
    {name: 'Couleur', title: 'Couleur des barres', description: 'Colonne Choix : les barres prennent la couleur de chaque choix', type: 'Choice', optional: true, ressource: ['Priorite']},
    {name: 'Jalon', title: 'Jalon', description: 'Case à cocher : la ligne s’affiche en losange', type: 'Bool', optional: true, ressource: ['Jalon']},
    {name: 'Charge', title: 'Charge (jours)', description: 'Sert à estimer la durée quand il manque une date', type: 'Numeric', optional: true, ressource: ['Charge']},
  ];
  /* Correspondance utilisée en mode démonstration */
  const DEMO = {table: 'DATA_Taches', mapping: {Titre: 'Action', Fin: 'Echeance', Debut: 'Date_de_debut', Groupe: 'Projet', Responsable: 'Responsable', Avancement: 'Avancement', Statut: 'Statut', Charge: 'Charge_estimee'}};

  const ui = {zoom: 'semaine', compact: false, clos: false, q: '', replies: [], allerAuj: true};
  try { Object.assign(ui, JSON.parse(localStorage.getItem('gantt2-ui') || '{}')); ui.allerAuj = true; } catch (e) { /* ignoré */ }
  const sauverUi = () => { try { localStorage.setItem('gantt2-ui', JSON.stringify(Object.assign({}, ui, {allerAuj: false}))); } catch (e) { /* ignoré */ } };
  const src = {tableId: null, mapping: null, recs: [], refs: {}};
  let geo = null, items = [];
  const redessiner = P.debounce(() => { if (!P.$('.pl-voile') && !P.$('.gt-bar.drag')) P.cfg.rendu(); }, 250);

  P.demarrer({
    id: 'gantt',
    titre: 'Gantt',
    sousTitre: 'Planning sur une frise – glisser pour replanifier',
    entites: [],
    sansDetection: true,
    ressource: 'taches',
    colonnes: COLONNES,
    demo: DEMO,
    texteConfig: 'Les colonnes du Gantt (intitulé, dates, regroupement, couleur…) se choisissent dans le panneau de droite de Grist : onglet « Widget », rubrique des colonnes. La table utilisée est celle choisie comme données du widget.',
    surLignes: (recs, mapping) => { src.recs = recs.map(normaliserLigne); src.mapping = mapping; redessiner(); },
    outils: () => `<div class="gt-outils">
      <div class="grp" role="group" aria-label="Échelle">${Object.keys(ZOOMS).map(z => `<button class="btn sm" data-zoom="${z}" aria-pressed="${z === ui.zoom}">${z[0].toUpperCase() + z.slice(1)}</button>`).join('')}</div>
      <button class="btn ter sm" id="gt-auj">Aujourd’hui</button>
      <div class="grp" role="group" aria-label="Densité"><button class="btn sm" data-dens="0" aria-pressed="${!ui.compact}">Confortable</button><button class="btn sm" data-dens="1" aria-pressed="${ui.compact}">Compact</button></div>
      <input class="in sm" id="gt-q" placeholder="Filtrer…" value="${esc(ui.q)}" style="width:150px" aria-label="Filtrer">
      <label class="case small"><input type="checkbox" id="gt-clos" ${ui.clos ? 'checked' : ''}> Terminés</label>
      <button class="btn ter sm" id="gt-tout">Tout replier</button></div>`,
    surOutils: el => {
      el.addEventListener('click', e => {
        const z = e.target.closest('[data-zoom]');
        if (z) { ui.zoom = z.dataset.zoom; P.$$('[data-zoom]', el).forEach(b => b.setAttribute('aria-pressed', b === z)); ui.allerAuj = true; sauverUi(); dessiner(); }
        const d = e.target.closest('[data-dens]');
        if (d) { ui.compact = d.dataset.dens === '1'; P.$$('[data-dens]', el).forEach(b => b.setAttribute('aria-pressed', b === d)); sauverUi(); dessiner(); }
        if (e.target.closest('#gt-auj')) allerAujourdhui();
        if (e.target.closest('#gt-tout')) { const g = P.uniq(items.map(i => i.groupe.cle)); ui.replies = g.every(x => ui.replies.includes(x)) ? [] : g; sauverUi(); dessiner(); }
      });
      el.querySelector('#gt-q').addEventListener('input', P.debounce(e => { ui.q = e.target.value; dessiner(); }, 250));
      el.querySelector('#gt-clos').addEventListener('change', e => { ui.clos = e.target.checked; sauverUi(); dessiner(); });
    },
    rendu: () => charger().then(dessiner).catch(e => { console.error(e); P.$('#pl-corps').innerHTML = `<div class="alerte err gt-msg">${esc(e.message || e)}</div>`; }),
  });

  /* ---------- Lecture des lignes et des colonnes ---------- */
  /* Grist peut transmettre les valeurs « décodées » (dates en objets Date, références en objets) :
     on les ramène toutes au format brut (dates en secondes, références en numéros de ligne). */
  function normaliserValeur(v) {
    if (v == null) return v;
    if (v instanceof Date) return v.getTime() / 1000;
    if (Array.isArray(v)) {
      if (v[0] === 'L' || v[0] === 'E') return v;
      if (v[0] === 'R' && v.length === 3) return v[2];
      if (v[0] === 'r' && v.length === 3) return ['L', ...(v[2] || [])];
      if (v[0] === 'd' || v[0] === 'D') return v[1];
      return ['L', ...v.map(x => (x && typeof x === 'object') ? (x.rowId ?? x.id ?? x) : x)];
    }
    if (typeof v === 'object') {
      if (Array.isArray(v.rowIds)) return ['L', ...v.rowIds];
      if (v.rowId != null) return v.rowId;
      if (v.id != null && typeof v.id === 'number') return v.id;
      if (typeof v.toISOString === 'function') return new Date(v.toISOString()).getTime() / 1000;
    }
    return v;
  }
  function normaliserLigne(r) { const o = {}; Object.keys(r).forEach(k => { o[k] = k === 'id' ? r[k] : normaliserValeur(r[k]); }); return o; }

  const colonne = nom => { const id = src.mapping && src.mapping[nom]; const t = P.etat.schema[src.tableId]; return id && t ? t.cols.find(c => c.colId === id) || null : null; };
  const ecrivable = nom => { const c = colonne(nom); return !!c && !(c.isFormula && c.formula); };

  async function charger() {
    if (P.etat.backend.nom === 'demo') {
      src.tableId = DEMO.table; src.mapping = DEMO.mapping;
      const raw = await P.etat.backend.fetch(DEMO.table);
      src.recs = raw.id.map((id, i) => { const r = {id}; Object.keys(raw).forEach(k => { r[k] = raw[k][i]; }); return r; });
    } else {
      if (!src.tableId) { try { src.tableId = await grist.selectedTable.getTableId(); } catch (e) { src.tableId = null; } }
      // Valeurs relues au format brut de Grist (dates en secondes, références en numéros de ligne) :
      // on garde les lignes transmises au widget (filtres et tri de la vue), avec leurs valeurs exactes.
      if (src.tableId && src.recs.length) {
        try {
          const raw = await P.etat.backend.fetch(src.tableId);
          const index = new Map(raw.id.map((id, i) => [id, i]));
          src.recs = src.recs.map(r => { const i = index.get(r.id); if (i == null) return r; const o = {id: r.id}; Object.keys(raw).forEach(k => { o[k] = raw[k][i]; }); return o; });
        } catch (e) { console.warn('Relecture brute impossible, valeurs transmises utilisées', e); }
      }
    }
    // Libellés des colonnes de référence (Projet, Responsable…)
    const besoins = ['Titre', 'Groupe', 'Responsable'].map(colonne).filter(c => c && /^Ref(List)?:/.test(c.type));
    await Promise.all(besoins.map(async c => {
      const cible = c.type.split(':')[1]; const t = P.etat.schema[cible]; if (!t) return;
      const vis = c.visibleCol || (t.cols.find(x => x.type === 'Text') || {}).colId;
      const raw = await P.etat.backend.fetch(cible);
      src.refs[c.colId] = new Map(raw.id.map((id, i) => [id, vis && raw[vis] ? String(raw[vis][i] ?? '') : '#' + id]));
    }));
  }

  function texte(nom, r) {
    const c = colonne(nom); if (!c) return '';
    const v = r[c.colId];
    if (v == null || v === '' || (Array.isArray(v) && v[0] === 'E')) return '';
    if (/^Ref:/.test(c.type)) return typeof v === 'string' ? v : v ? (src.refs[c.colId] && src.refs[c.colId].get(v)) || '' : '';
    if (/^RefList:/.test(c.type)) return Array.isArray(v) ? v.slice(1).map(id => (src.refs[c.colId] && src.refs[c.colId].get(id)) || '').filter(Boolean).join(', ') : '';
    if (Array.isArray(v) && v[0] === 'L') return v.slice(1).join(', ');
    if (/^Date/.test(c.type) && typeof v === 'number') return P.fmtDate(date(nom, r));
    return String(v);
  }
  function date(nom, r) {
    const c = colonne(nom); if (!c) return null; const v = r[c.colId];
    if (typeof v === 'number') { const d = new Date(v * 1000); return /^DateTime/.test(c.type) ? P.jour(d) : new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()); }
    if (typeof v === 'string') return P.parseDateTexte(v);
    return null;
  }
  function nombre(nom, r) { const c = colonne(nom); if (!c) return null; const v = r[c.colId]; return typeof v === 'number' ? v : (v ? parseFloat(String(v).replace(',', '.')) : null); }
  const echelleAvancement = () => { const c = colonne('Avancement'); if (!c) return 1; return src.recs.some(r => typeof r[c.colId] === 'number' && r[c.colId] > 1.5) ? 100 : 1; };

  function couleurChoix(nom, valeur) {
    const c = colonne(nom); if (!c || !valeur) return null;
    let wo = {}; try { wo = JSON.parse(c.widgetOptions || '{}'); } catch (e) { /* ignoré */ }
    const opt = (wo.choiceOptions || {})[valeur];
    if (opt && opt.fillColor) return {fond: opt.fillColor, texte: opt.textColor || null};
    const i = (wo.choices || []).indexOf(valeur);
    return {fond: COULEURS[(i >= 0 ? i : Math.abs([...valeur].reduce((s, ch) => s + ch.charCodeAt(0), 0))) % COULEURS.length]};
  }
  const clair = hex => { const m = /^#?([0-9a-f]{6})$/i.exec(hex || ''); if (!m) return false; const n = parseInt(m[1], 16); return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) > 170; };

  function construireItems() {
    const auj = P.today(); const ech = echelleAvancement();
    return src.recs.map(r => {
      const statut = texte('Statut', r);
      const clos = P.estClos(statut);
      let debut = date('Debut', r), fin = date('Fin', r), estime = false;
      if (debut && fin && fin < debut) { const x = debut; debut = fin; fin = x; }
      const duree = Math.max(1, Math.ceil((nombre('Charge', r) || 1) * 1.4));
      if (!debut && fin) { debut = P.addDays(fin, -duree + 1); estime = true; }
      if (debut && !fin) { fin = P.addDays(debut, duree - 1); estime = true; }
      const av = nombre('Avancement', r);
      const g = texte('Groupe', r);
      const jalon = colonne('Jalon') ? !!r[colonne('Jalon').colId] : false;
      let coul = colonne('Couleur') ? couleurChoix('Couleur', texte('Couleur', r)) : null;
      const retard = !clos && fin && date('Fin', r) && date('Fin', r) < auj;
      if (!coul) coul = {fond: clos ? GRIS : retard ? ROUGE : (fin && P.diffDays(fin, auj) <= 7 ? ORANGE : BLEU)};
      return {id: r.id, r, titre: texte('Titre', r) || '(sans intitulé)', sous: texte('Responsable', r), statut, clos, retard, debut, fin, estime: estime && !jalon,
        av: av == null ? null : Math.max(0, Math.min(1, av / ech)), groupe: {cle: g || '—', libelle: g || (colonne('Groupe') ? 'Sans regroupement' : '')}, jalon, coul};
    });
  }

  /* ---------- Dessin ---------- */
  function dessiner() {
    const corps = P.$('#pl-corps');
    const manque = ['Titre', 'Fin'].filter(n => !src.mapping || !src.mapping[n]);
    if (P.etat.backend.nom !== 'demo' && manque.length) {
      corps.innerHTML = `<div class="carte gt-msg"><h2>Choisissez les colonnes du Gantt</h2>
        <ol><li>Ouvrez le <strong>panneau de droite</strong> de Grist (onglet <strong>Widget</strong>).</li>
        <li>Dans la rubrique des <strong>colonnes</strong>, choisissez au minimum l’<strong>Intitulé</strong> et la <strong>Date de fin / échéance</strong>.</li>
        <li>Complétez si vous le souhaitez : date de début, regroupement (ex. Projet), sous-titre (ex. Responsable), avancement, statut, couleur, jalon.</li></ol>
        <p class="small muted">Colonnes manquantes : ${manque.map(n => COLONNES.find(c => c.name === n).title).join(', ')}.</p></div>`;
      return;
    }
    items = construireItems();
    const auj = P.today(), ppd = ZOOMS[ui.zoom];
    const q = P.norm(ui.q);
    const visibles = items.filter(i => (ui.clos || !i.clos) && (!q || P.norm(i.titre + ' ' + i.sous + ' ' + i.groupe.libelle + ' ' + i.statut).includes(q)));
    const groupes = new Map();
    visibles.forEach(i => { if (!groupes.has(i.groupe.cle)) groupes.set(i.groupe.cle, {cle: i.groupe.cle, libelle: i.groupe.libelle, items: []}); groupes.get(i.groupe.cle).items.push(i); });
    const ordreDate = i => i.debut ? i.debut.getTime() : 9e15;
    const listeG = Array.from(groupes.values());
    listeG.forEach(g => { g.items.sort((a, b) => ordreDate(a) - ordreDate(b) || a.titre.localeCompare(b.titre, 'fr')); const d = g.items.filter(i => i.debut); g.debut = d.length ? new Date(Math.min(...d.map(i => i.debut))) : null; g.fin = d.length ? new Date(Math.max(...d.map(i => i.fin))) : null; });
    listeG.sort((a, b) => (a.cle === '—') - (b.cle === '—') || (a.debut || 9e15) - (b.debut || 9e15) || a.libelle.localeCompare(b.libelle, 'fr'));

    // Étendue de l'axe
    const dates = [auj, ...visibles.flatMap(i => i.debut ? [i.debut, i.fin] : [])];
    let debut = P.addDays(P.lundi(new Date(Math.min(...dates))), -14), fin = P.addDays(new Date(Math.max(...dates)), 45);
    if (P.diffDays(fin, debut) < 120) fin = P.addDays(debut, 120);
    if (ui.zoom === 'mois' || ui.zoom === 'trimestre') debut = new Date(debut.getFullYear(), debut.getMonth(), 1);
    const W = Math.round((P.diffDays(fin, debut) + 1) * ppd);
    geo = {debut, ppd};
    const x = d => Math.round(P.diffDays(d, debut) * ppd);

    // En-têtes et grille
    const h1 = [], h2 = [], grille = [];
    const MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
    for (let d = new Date(debut.getFullYear(), debut.getMonth(), 1); d <= fin; d = new Date(d.getFullYear(), d.getMonth() + 1, 1)) {
      const a = Math.max(0, x(d)), b = Math.min(W, x(new Date(d.getFullYear(), d.getMonth() + 1, 1)));
      grille.push(`<i class="m" style="left:${a}px"></i>`);
      if (ui.zoom === 'jour' || ui.zoom === 'semaine') h1.push(`<span style="left:${a}px;width:${b - a}px">${MOIS[d.getMonth()]} ${d.getFullYear()}</span>`);
      else {
        if (ui.zoom === 'mois') h2.push(`<span style="left:${a}px;width:${b - a}px">${MOIS[d.getMonth()].slice(0, ui.zoom === 'mois' && ppd < 6 ? 4 : 20)}</span>`);
        else if (d.getMonth() % 3 === 0) h2.push(`<span style="left:${a}px;width:${Math.min(W, x(new Date(d.getFullYear(), d.getMonth() + 3, 1))) - a}px">T${d.getMonth() / 3 + 1}</span>`);
        if (d.getMonth() === 0 || a === 0) h1.push(`<span style="left:${a}px;width:${Math.min(W, x(new Date(d.getFullYear() + 1, 0, 1))) - a}px">${d.getFullYear()}</span>`);
      }
    }
    if (ui.zoom === 'jour') for (let d = debut; d <= fin; d = P.addDays(d, 1)) {
      const we = !P.estOuvre(d), today = +d === +auj;
      h2.push(`<span class="${we ? 'we' : ''} ${today ? 'auj' : ''}" style="left:${x(d)}px;width:${ppd}px;text-align:center;padding:5px 0">${d.getDate()}</span>`);
      if (we) grille.push(`<i class="we" style="left:${x(d)}px;width:${ppd}px"></i>`);
    }
    if (ui.zoom === 'semaine') for (let d = P.lundi(debut); d <= fin; d = P.addDays(d, 7)) {
      const cour = +d === +P.lundi(auj);
      h2.push(`<span class="${cour ? 'auj' : ''}" style="left:${x(d)}px;width:${7 * ppd}px">S${P.semaineIso(d)} · ${d.getDate()}</span>`);
      grille.push(`<i style="left:${x(d)}px"></i><i class="we" style="left:${x(P.addDays(d, 5))}px;width:${2 * ppd}px"></i>`);
    }

    const modD = ecrivable('Debut'), modF = ecrivable('Fin');
    const lignes = [];
    listeG.forEach(g => {
      const replie = ui.replies.includes(g.cle);
      const avs = g.items.filter(i => i.av != null);
      const avG = avs.length ? P.somme(avs.map(i => i.av)) / avs.length : null;
      if (colonne('Groupe') || listeG.length > 1) {
        lignes.push(`<div class="gt-row grp"><div class="gt-lbl" data-rep="${esc(g.cle)}"><button class="rep" aria-expanded="${!replie}" title="Replier / déplier">${P.ic('droite')}</button>
          <span class="t" title="${esc(g.libelle)}">${esc(g.libelle)}</span><span class="n">${g.items.length}</span></div>
          <div class="gt-trk" style="width:${W}px">${g.debut ? `<div class="gt-som" style="left:${x(g.debut)}px;width:${Math.max(4, x(P.addDays(g.fin, 1)) - x(g.debut))}px"></div>
            <div class="gt-som-l" style="left:${x(g.debut)}px">${P.fmtDateCourt(g.debut)} → ${P.fmtDateCourt(g.fin)}${avG != null ? ' · ' + P.fmtPct(avG) : ''}</div>` : ''}</div></div>`);
      }
      if (replie) return;
      g.items.forEach(i => {
        const sous = [i.sous, i.debut ? `${P.fmtDateCourt(i.debut)} → ${P.fmtDateCourt(i.fin)}` : 'non planifiée', i.statut].filter(Boolean).join(' · ');
        let piste;
        if (!i.debut) piste = `<div class="gt-vide" data-plan="${i.id}"></div>`;
        else if (i.jalon) {
          piste = `<div class="gt-jal" data-id="${i.id}" style="left:${x(i.fin) + ppd / 2}px;background:${i.clos ? GRIS : i.coul.fond}" data-bulle="◆ <strong>${esc(i.titre)}</strong><br>${P.fmtDateLong(i.fin)}"></div>
            <div class="gt-jal-l" style="left:${x(i.fin) + ppd / 2 + 16}px">${esc(i.titre)}</div>`;
        } else {
          const l = x(i.debut), w = Math.max(ppd, x(P.addDays(i.fin, 1)) - l);
          const dedans = w > Math.min(240, i.titre.length * 6.5 + 20);
          const txt = i.coul.texte || (clair(i.coul.fond) ? '#161616' : '#fff');
          piste = `<div class="gt-bar ${i.estime ? 'estime' : ''} ${modD || modF ? '' : 'ro'}" data-id="${i.id}" style="left:${l}px;width:${w}px;background:${i.coul.fond};color:${txt}"
            data-bulle="<strong>${esc(i.titre)}</strong><br>${esc(i.sous)}${i.sous ? '<br>' : ''}${P.fmtDateLong(i.debut)} → ${P.fmtDateLong(i.fin)}${i.estime ? '<br><em>durée estimée</em>' : ''}${i.statut ? '<br>' + esc(i.statut) : ''}${i.av != null ? ' · ' + P.fmtPct(i.av) : ''}${i.retard ? '<br>⚠️ échéance dépassée' : ''}">
            ${i.av != null ? `<span class="pg" style="width:${Math.round(i.av * 100)}%"></span>` : ''}${modD ? '<span class="h g"></span>' : ''}${modF ? '<span class="h d"></span>' : ''}
            ${dedans ? `<span class="gt-in">${esc(i.titre)}</span>` : `<span class="gt-out">${esc(i.titre)}</span>`}</div>`;
        }
        lignes.push(`<div class="gt-row"><div class="gt-lbl" data-ouvrir="${i.id}" style="padding-left:${colonne('Groupe') ? 36 : 18}px"><span class="t" title="${esc(i.titre)}">${i.retard ? '<span style="color:var(--error)">● </span>' : ''}${esc(i.titre)}</span><span class="s">${esc(sous)}</span></div>
          <div class="gt-trk" style="width:${W}px">${piste}</div></div>`);
      });
    });

    const coulLeg = colonne('Couleur')
      ? (() => { let wo = {}; try { wo = JSON.parse(colonne('Couleur').widgetOptions || '{}'); } catch (e) { /* ignoré */ } return (wo.choices || []).map(ch => `<span><i style="background:${couleurChoix('Couleur', ch).fond}"></i>${esc(ch)}</span>`).join(''); })()
      : `<span><i style="background:${BLEU}"></i>Dans les temps</span><span><i style="background:${ORANGE}"></i>Échéance sous 7 jours</span><span><i style="background:${ROUGE}"></i>En retard</span><span><i style="background:${GRIS}"></i>Terminé</span>`;
    const ancien = P.$('.gt-wrap'); const scroll = ancien ? {l: ancien.scrollLeft, t: ancien.scrollTop} : null;
    corps.innerHTML = `<div class="gt-leg no-print">${coulLeg}<span><i class="estime" style="background:${BLEU};background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.35) 0 4px,transparent 4px 8px)"></i>Durée estimée</span>
        ${colonne('Jalon') ? `<span><i class="los" style="background:${BLEU}"></i>Jalon</span>` : ''}<span><i style="background:var(--rm);width:3px"></i>Aujourd’hui</span>
        <span class="muted">${visibles.length} élément(s) · glisser une barre pour la décaler, étirer un bord pour changer une date, cliquer pour modifier</span></div>
      <div class="gt-wrap"><div class="gt ${ui.compact ? 'compact' : ''}" style="width:calc(var(--lw) + ${W}px)">
        <div class="gt-head"><div class="gt-row"><div class="gt-lbl">${esc(src.tableId || '')}</div>
          <div class="gt-trk" style="width:${W}px"><div class="gt-h1">${h1.join('')}</div><div class="gt-h2">${h2.join('')}</div></div></div></div>
        <div style="position:relative">
          <div class="gt-grid" style="left:var(--lw);width:${W}px">${grille.join('')}</div>
          <div class="gt-today" style="left:calc(var(--lw) + ${x(auj) + ppd / 2}px)"></div>
          ${lignes.join('') || '<div class="vide" style="margin:16px">Aucun élément à afficher.</div>'}
        </div></div></div>`;
    const wrap = P.$('.gt-wrap');
    if (ui.allerAuj) { ui.allerAuj = false; wrap.scrollLeft = Math.max(0, x(auj) - 240); }
    else if (scroll) { wrap.scrollLeft = scroll.l; wrap.scrollTop = scroll.t; }
    brancher(wrap);
  }

  function allerAujourdhui() { const w = P.$('.gt-wrap'); if (w && geo) w.scrollTo({left: Math.max(0, P.diffDays(P.today(), geo.debut) * geo.ppd - 240), behavior: 'smooth'}); }

  /* ---------- Écriture ---------- */
  function valeurDate(nom, d) {
    const c = colonne(nom); if (!c) return undefined;
    if (!d) return null;
    if (/^DateTime/.test(c.type)) return d.getTime() / 1000;
    if (/^Date/.test(c.type)) return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 1000;
    return P.fmtDate(d);
  }
  async function ecrire(id, vals, message) {
    const champs = {};
    Object.entries(vals).forEach(([nom, v]) => { if (ecrivable(nom)) champs[colonne(nom).colId] = v; });
    if (!Object.keys(champs).length) return;
    await P.appliquer([['UpdateRecord', src.tableId, id, champs]], message);
  }

  function brancher(wrap) {
    wrap.addEventListener('click', e => {
      const r = e.target.closest('[data-rep]');
      if (r) { const k = r.dataset.rep; ui.replies = ui.replies.includes(k) ? ui.replies.filter(x => x !== k) : ui.replies.concat([k]); sauverUi(); dessiner(); return; }
      const o = e.target.closest('[data-ouvrir]'); if (o) { ouvrir(+o.dataset.ouvrir); return; }
      const v = e.target.closest('[data-plan]');
      if (v && ecrivable('Fin')) {
        const it = items.find(i => i.id === +v.dataset.plan);
        const jour = P.addDays(geo.debut, Math.floor((e.clientX - v.parentNode.getBoundingClientRect().left) / geo.ppd));
        const duree = Math.max(1, Math.ceil((nombre('Charge', it.r) || 3) * 1.4));
        const vals = {Fin: valeurDate('Fin', P.addDays(jour, duree - 1))}; if (ecrivable('Debut')) vals.Debut = valeurDate('Debut', jour);
        ecrire(it.id, vals, `« ${it.titre} » planifiée à partir du ${P.fmtDate(jour)}.`);
      }
    });
    wrap.addEventListener('pointerdown', e => {
      const el = e.target.closest('.gt-bar,.gt-jal'); if (!el || e.button !== 0) return;
      const it = items.find(i => i.id === +el.dataset.id); if (!it) return;
      const mode = e.target.classList.contains('g') ? 'g' : e.target.classList.contains('d') ? 'd' : 'm';
      const peut = it.jalon ? ecrivable('Fin') : mode === 'g' ? ecrivable('Debut') : mode === 'd' ? ecrivable('Fin') : (ecrivable('Debut') || ecrivable('Fin'));
      const x0 = e.clientX, left0 = el.offsetLeft, w0 = el.offsetWidth;
      let delta = 0, bouge = false;
      if (peut) el.setPointerCapture(e.pointerId);
      const move = ev => {
        if (!peut) return;
        delta = Math.round((ev.clientX - x0) / geo.ppd);
        if (Math.abs(ev.clientX - x0) > 3) bouge = true;
        if (!bouge) return;
        el.classList.add('drag'); const px = delta * geo.ppd;
        if (mode === 'm' || it.jalon) el.style.left = (left0 + px) + 'px';
        else if (mode === 'g') { el.style.left = Math.min(left0 + px, left0 + w0 - geo.ppd) + 'px'; el.style.width = Math.max(geo.ppd, w0 - px) + 'px'; }
        else el.style.width = Math.max(geo.ppd, w0 + px) + 'px';
      };
      const up = async () => {
        el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up);
        if (!bouge) { ouvrir(it.id); return; }
        if (!delta) { dessiner(); return; }
        const vals = {};
        if (it.jalon) vals.Fin = valeurDate('Fin', P.addDays(it.fin, delta));
        else {
          if (mode !== 'd' && ecrivable('Debut') && (date('Debut', it.r) || mode === 'g')) vals.Debut = valeurDate('Debut', P.addDays(it.debut, delta));
          if (mode !== 'g' && ecrivable('Fin')) vals.Fin = valeurDate('Fin', P.addDays(it.fin, delta));
        }
        const nd = mode === 'd' ? it.debut : P.addDays(it.debut, delta), nf = mode === 'g' ? it.fin : P.addDays(it.fin, delta);
        try { await ecrire(it.id, vals, `« ${it.titre} » : ${P.fmtDate(nd)} → ${P.fmtDate(nf)}`); } catch (err) { dessiner(); }
      };
      el.addEventListener('pointermove', move); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
      e.preventDefault();
    });
  }

  /* Fenêtre de modification d'une ligne */
  function ouvrir(id) {
    const it = items.find(i => i.id === id); if (!it) return;
    const ech = echelleAvancement();
    const f = document.createElement('form'); f.className = 'grille'; f.onsubmit = () => false;
    const champ = (nom, html, large) => colonne(nom) ? `<div class="champ ${large ? 'large' : ''}"><label for="gt-f-${nom}">${esc(COLONNES.find(c => c.name === nom).title)}</label>${ecrivable(nom) ? html : `<div class="in" style="background:var(--alt);box-shadow:none">${esc(texte(nom, it.r)) || '–'}</div>`}</div>` : '';
    const titreSimple = colonne('Titre') && /^(Text|Any)$/.test(colonne('Titre').type);
    let choixStatut = []; try { choixStatut = JSON.parse((colonne('Statut') || {}).widgetOptions || '{}').choices || []; } catch (e) { /* ignoré */ }
    f.innerHTML = (titreSimple ? champ('Titre', `<input class="in" id="gt-f-Titre" value="${esc(texte('Titre', it.r))}">`, true) : `<p class="large" style="margin:0"><strong>${esc(it.titre)}</strong></p>`) +
      champ('Debut', `<input class="in" type="date" id="gt-f-Debut" value="${date('Debut', it.r) ? P.iso(date('Debut', it.r)) : ''}">`) +
      champ('Fin', `<input class="in" type="date" id="gt-f-Fin" value="${date('Fin', it.r) ? P.iso(date('Fin', it.r)) : ''}">`) +
      champ('Statut', `<select class="in" id="gt-f-Statut"><option value=""></option>${P.uniq(choixStatut.concat(it.statut ? [it.statut] : [])).map(c => `<option ${c === it.statut ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>`) +
      champ('Avancement', `<input class="in" type="number" min="0" max="100" step="5" id="gt-f-Avancement" value="${it.av != null ? Math.round(it.av * 100) : ''}"><span class="aide">En pourcentage</span>`) +
      (it.sous ? `<p class="large small muted" style="margin:0">${esc(COLONNES.find(c => c.name === 'Responsable').title)} : ${esc(it.sous)}${it.groupe.libelle ? ' · ' + esc(it.groupe.libelle) : ''}</p>` : '');
    P.modale({titre: 'Modifier', contenu: f, boutons: [{libelle: 'Annuler', classe: 'ter'}, {libelle: 'Enregistrer', classe: 'pri', action: async () => {
      const v = {}; const g = n => P.$('#gt-f-' + n, f);
      if (g('Titre')) v.Titre = g('Titre').value;
      if (g('Debut')) v.Debut = valeurDate('Debut', P.fromIso(g('Debut').value));
      if (g('Fin')) v.Fin = valeurDate('Fin', P.fromIso(g('Fin').value));
      if (g('Statut')) v.Statut = g('Statut').value;
      if (g('Avancement')) v.Avancement = g('Avancement').value === '' ? null : Math.max(0, Math.min(100, +g('Avancement').value)) / 100 * ech;
      if (g('Debut') && g('Fin') && g('Debut').value && g('Fin').value && g('Fin').value < g('Debut').value) { P.toast('La date de fin précède la date de début.', 'warn'); return false; }
      await ecrire(id, v, 'Modifications enregistrées.');
    }}]});
  }
})();
</script>
</body>
</html>
