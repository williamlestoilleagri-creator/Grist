<!DOCTYPE html>
<html lang="fr" data-fr-scheme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revue hebdomadaire</title>
<link rel="stylesheet" href="socle.css">
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<script src="socle.js"></script>
<script type="text/html" id="pl-aide"><!--AIDE--><p class="chapo">La revue hebdomadaire prépare votre point d’équipe en un clic : sur une seule page, <strong>ce qui a été terminé, ce qui est en retard et ce qui arrive</strong>. Elle fonctionne avec n’importe quelle liste de tâches, quel que soit le type de projet.</p>

<section>
  <h2>À quoi sert-elle ?</h2>
  <ul>
    <li><strong>Qu’avons-nous terminé ?</strong> Pour valoriser le travail fait.</li>
    <li><strong>Qu’est-ce qui bloque ?</strong> Pour décider ensemble des actions.</li>
    <li><strong>Qu’est-ce qui arrive ?</strong> Pour anticiper les échéances.</li>
  </ul>
</section>

<section>
  <h2>Mise en place</h2>
  <ol class="etapes">
    <li><span>Ajoutez un <strong>widget personnalisé</strong> et choisissez votre <strong>table de tâches</strong> comme données.</span></li>
    <li><span>Dans le <strong>panneau de droite</strong> (onglet Widget), associez au minimum l’<strong>Intitulé</strong>, l’<strong>Échéance</strong> et le <strong>Statut</strong>.</span></li>
    <li><span>Ajoutez les colonnes facultatives pour enrichir la revue : <strong>Regrouper par</strong> (ex. projet), Responsable, Date de réalisation, Dernière mise à jour, Date de création, Avancement, Suites données, Jalon.</span></li>
  </ol>
</section>

<div class="encart"><strong>📦 Pas encore de table de tâches ?</strong><p>Ouvrez les paramètres du widget (⚙), onglet <strong>Table ressource</strong> : créez en un clic une table « Tâches » prête à l’emploi, avec ou sans exemples, ou téléchargez son modèle au format CSV.</p></div>

<section>
  <h2>Ce que vous y trouvez</h2>
  <div class="blocs">
    <div><strong>📊 Les chiffres de la semaine</strong>Terminées, en retard, à rendre bientôt, sans nouvelles, nouvelles.</div>
    <div><strong>🌦️ La synthèse par groupe</strong>Pour chaque projet (ou autre regroupement) : état, avancement, tâches en cours et en retard, prochaine échéance.</div>
    <div><strong>✅ Terminé</strong>Les tâches terminées sur la période, avec les suites données.</div>
    <div><strong>🔴 En retard</strong>Les échéances dépassées, avec le responsable et le nombre de jours de retard.</div>
    <div><strong>📅 À rendre</strong>Les échéances des prochains jours.</div>
    <div><strong>💤 Points d’attention</strong>Les tâches qui ne bougent plus, celles sans responsable ou sans échéance, les nouvelles.</div>
  </div>
</section>

<section>
  <h2>En réunion</h2>
  <ol class="etapes">
    <li><span>Choisissez la <strong>période</strong> et, si besoin, filtrez par projet ou par responsable.</span></li>
    <li><span>Passez en revue la <strong>synthèse</strong>, puis les <strong>retards</strong> : décidez d’une action, d’une nouvelle échéance ou d’un autre responsable.</span></li>
    <li><span>Notez les <strong>décisions</strong>, puis cliquez sur <strong>Copier</strong> (pour un mail) ou <strong>Imprimer</strong>.</span></li>
  </ol>
</section>

<div class="encart astuce"><strong>💡 Astuce</strong><p>Une tâche en retard ou « sans nouvelles » n’est souvent qu’une tâche pas mise à jour : corriger son statut, son échéance ou ses suites dans Grist suffit à la faire sortir des alertes.</p></div>

<div class="encart attention"><strong>⚠️ Bon à savoir</strong><p>Les notes de la zone « Décisions » restent dans votre navigateur : pensez à les copier dans le compte rendu.</p></div>

<p class="pied">La revue ne modifie aucune donnée. Le bouton ⚙ règle le seuil « sans nouvelles » et l’horizon « à rendre » ; le bouton ? affiche ce mode d’emploi.</p><!--FIN_AIDE--></script>
<style>
  .rv-tete{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .rv-tete h2{font-size:1.6rem}
  .rv-filtres{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .rv-filtres .in{width:auto}
  .rv-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(460px,1fr));gap:28px}
  .rv-grp{display:grid;grid-template-columns:minmax(200px,2fr) 180px minmax(140px,1.2fr) minmax(200px,2fr);gap:18px;align-items:center;padding:14px 0;border-bottom:1px solid var(--contrast)}
  .rv-grp:last-child{border-bottom:0}
  .rv-grp .nom{font-weight:700;color:var(--title);font-size:1rem}
  .rv-grp .chiffres{font-size:.85rem;color:var(--mention)}
  .rv-grp .chiffres b{color:var(--title)}
  .rv-sous{font-weight:700;color:var(--bf);font-size:.85rem;margin:14px 0 2px;text-transform:uppercase;letter-spacing:.03em}
  .rv-sous:first-child{margin-top:0}
  .rv-notes{width:100%;min-height:110px}
  @media (max-width:700px){.rv-2{grid-template-columns:1fr}.rv-grp{grid-template-columns:1fr 1fr}}
  @media print{.rv-notes{display:none}.rv-2{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<script>
(function () {
  const P = Pilotage, L = P.L, esc = P.esc;
  const ui = {fin: P.today(), groupe: '', resp: ''};

  P.demarrer({
    id: 'revue-hebdo',
    titre: 'Revue hebdomadaire',
    sousTitre: 'Ce qui a été fait, ce qui bloque, ce qui arrive',
    entites: [], sansDetection: true,
    ressource: 'taches',
    colonnes: [
      {name: 'Titre', title: 'Intitulé', description: 'Nom de la tâche', type: 'Any', ressource: ['Intitule']},
      {name: 'Echeance', title: 'Échéance', description: 'Date limite de la tâche', type: 'Date', ressource: ['Echeance']},
      {name: 'Statut', title: 'Statut', description: 'Repère les tâches terminées ou abandonnées', type: 'Choice', ressource: ['Statut']},
      {name: 'Groupe', title: 'Regrouper par', description: 'Ex. Projet : une ligne de synthèse par valeur', type: 'Any', optional: true, ressource: ['Projet']},
      {name: 'Responsable', title: 'Responsable', type: 'Any', optional: true, ressource: ['Responsable']},
      {name: 'Realisation', title: 'Date de réalisation', description: 'Date à laquelle la tâche a été terminée', type: 'Date', optional: true, ressource: ['Date_realisation']},
      {name: 'MajLe', title: 'Dernière mise à jour', description: 'Repère les tâches qui ne bougent plus', type: 'DateTime', optional: true, ressource: ['Mis_a_jour_le']},
      {name: 'CreeLe', title: 'Date de création', description: 'Repère les nouvelles tâches', type: 'DateTime', optional: true, ressource: ['Cree_le']},
      {name: 'Avancement', title: 'Avancement', type: 'Numeric', optional: true, ressource: ['Avancement']},
      {name: 'Priorite', title: 'Priorité', type: 'Choice', optional: true, ressource: ['Priorite']},
      {name: 'Suites', title: 'Suites données', description: 'Commentaire repris dans la revue', type: 'Any', optional: true, ressource: ['Suites']},
      {name: 'Jalon', title: 'Jalon', description: 'Case à cocher : ligne affichée dans la rubrique Jalons', type: 'Bool', optional: true, ressource: ['Jalon']},
    ],
    demo: {table: 'DATA_Taches', mapping: {Titre: 'Action', Echeance: 'Echeance', Statut: 'Statut', Groupe: 'Projet', Responsable: 'Responsable', Realisation: 'Date_de_fin_reelle', MajLe: 'Derniere_mise_a_jour', CreeLe: 'Cree_le', Avancement: 'Avancement', Priorite: 'Priorite', Suites: 'Suite_donnees'}},
    reglagesHtml: () => `<div class="grille">
      <div class="champ"><label for="rg-dormant">Tâche « sans nouvelles » après (jours sans mise à jour)</label><input class="in" id="rg-dormant" type="number" min="3" value="${P.reglage('dormant', 14)}"></div>
      <div class="champ"><label for="rg-avenir">Horizon « à venir » (jours)</label><input class="in" id="rg-avenir" type="number" min="1" value="${P.reglage('avenir', 7)}"></div></div>`,
    lireReglages: (el, r) => { r.dormant = +el.querySelector('#rg-dormant').value || 14; r.avenir = +el.querySelector('#rg-avenir').value || 7; },
    outils: () => `<div class="grp no-print" role="group" aria-label="Période">
        <button class="btn sm" data-per="sem-prec">Semaine précédente</button><button class="btn sm" data-per="sem">Cette semaine</button><button class="btn sm" data-per="7j" aria-pressed="true">7 derniers jours</button></div>
      <button class="btn sec sm" id="rv-copier">${P.ic('copier')} Copier</button>
      <button class="btn pri sm" id="rv-imprimer">${P.ic('imprimer')} Imprimer</button>`,
    surOutils: el => {
      el.addEventListener('click', e => {
        const b = e.target.closest('[data-per]'); if (!b) return;
        P.$$('[data-per]', el).forEach(x => x.setAttribute('aria-pressed', x === b));
        const t = P.today();
        ui.fin = b.dataset.per === 'sem' ? P.addDays(P.lundi(t), 6) : b.dataset.per === 'sem-prec' ? P.addDays(P.lundi(t), -1) : t;
        dessiner();
      });
      el.querySelector('#rv-imprimer').addEventListener('click', () => window.print());
      el.querySelector('#rv-copier').addEventListener('click', copier);
    },
    rendu: () => dessiner(),
  });

  const fermee = s => P.estClos(s);

  function lignes() {
    const auj = P.today();
    return L.recs.map(r => {
      const statut = L.texte('Statut', r);
      const echeance = L.date('Echeance', r);
      const fini = P.estTermine(statut), clos = fermee(statut);
      return {r, id: r.id, titre: L.texte('Titre', r) || '(sans intitulé)', statut, fini, clos, echeance,
        groupe: L.texte('Groupe', r), resp: L.texte('Responsable', r), suites: L.texte('Suites', r),
        realise: L.date('Realisation', r) || (fini && L.instant('MajLe', r) ? P.jour(L.instant('MajLe', r)) : null),
        maj: L.instant('MajLe', r), cree: L.instant('CreeLe', r), av: L.a('Avancement') ? (fini ? 1 : L.fraction('Avancement', r) || 0) : null,
        prio: L.texte('Priorite', r), jalon: L.bool('Jalon', r),
        retard: !clos && echeance && echeance < auj};
    });
  }

  function dessiner() {
    const corps = P.$('#pl-corps'); const auj = P.today();
    const fin = ui.fin, debut = P.addDays(fin, -6);
    const dans = (d, a, b) => d && d >= a && d <= b;
    const avenir = P.reglage('avenir', 7), dormant = P.reglage('dormant', 14);
    const toutes = lignes();
    const groupes = P.uniq(toutes.map(t => t.groupe).filter(Boolean)).sort((a, b) => a.localeCompare(b, 'fr'));
    const resps = P.uniq(toutes.flatMap(t => t.resp ? t.resp.split(', ') : [])).sort((a, b) => a.localeCompare(b, 'fr'));
    const t = toutes.filter(x => (!ui.groupe || x.groupe === ui.groupe) && (!ui.resp || x.resp.split(', ').includes(ui.resp)));
    const ouvertes = t.filter(x => !x.clos);
    const terminees = t.filter(x => x.fini && dans(x.realise, debut, fin)).sort((a, b) => a.realise - b.realise);
    const retards = ouvertes.filter(x => x.retard).sort((a, b) => a.echeance - b.echeance);
    const prochaines = ouvertes.filter(x => dans(x.echeance, auj, P.addDays(auj, avenir))).sort((a, b) => a.echeance - b.echeance);
    const dormantes = L.a('MajLe') ? ouvertes.filter(x => x.maj && P.diffDays(auj, P.jour(x.maj)) > dormant).sort((a, b) => a.maj - b.maj) : [];
    const incompletes = ouvertes.filter(x => (L.a('Responsable') && !x.resp) || !x.echeance);
    const nouvelles = L.a('CreeLe') ? t.filter(x => dans(x.cree && P.jour(x.cree), debut, fin)) : [];
    const jalons = L.a('Jalon') ? t.filter(x => x.jalon) : [];

    const meta = x => [x.groupe && !ui.groupe ? x.groupe : '', x.resp].filter(Boolean).map(esc).join(' · ');
    const ligne = (x, droite, detail) => `<div class="ligne-liste"><div class="t"><strong>${esc(x.titre)}</strong>${meta(x) || detail ? `<span>${meta(x)}${meta(x) && detail ? ' · ' : ''}${detail ? esc(detail) : ''}</span>` : ''}</div><div class="m">${droite}</div></div>`;
    const vide = txt => `<p class="vide-doux">${txt}</p>`;

    const synthese = L.a('Groupe') && !ui.groupe ? groupes.map(g => {
      const gx = toutes.filter(x => x.groupe === g && (!ui.resp || x.resp.split(', ').includes(ui.resp)));
      const ouv = gx.filter(x => !x.clos); if (!ouv.length) return null;
      const ret = ouv.filter(x => x.retard).length;
      const proch = ouv.filter(x => x.echeance && x.echeance >= auj).sort((a, b) => a.echeance - b.echeance)[0];
      const avs = gx.filter(x => !P.estAbandon(x.statut) && x.av != null);
      const av = avs.length ? P.somme(avs.map(x => x.av)) / avs.length : null;
      const etat = ret ? {l: '⛈️ Retards', c: 'err'} : proch && P.diffDays(proch.echeance, auj) <= avenir ? {l: '🌥️ Échéance proche', c: 'jaune'} : {l: '☀️ OK', c: 'ok'};
      return {g, ouv: ouv.length, ret, proch, av, etat};
    }).filter(Boolean).sort((a, b) => b.ret - a.ret || a.g.localeCompare(b.g, 'fr')) : [];

    const cleNotes = 'revue-notes:' + P.etat.docName + ':' + P.iso(debut);
    let notes = ''; try { notes = localStorage.getItem(cleNotes) || ''; } catch (e) { /* ignoré */ }

    corps.innerHTML = `<div class="aere" id="rv-rapport">
      <div class="rv-tete"><h2>Semaine du ${P.fmtDate(debut)} au ${P.fmtDate(fin)}</h2>
        <div class="rv-filtres no-print" style="margin-left:auto">
          ${L.a('Groupe') ? `<select class="in sm" id="rv-g" aria-label="${esc(L.titreColonne('Groupe'))}"><option value="">Tous</option>${groupes.map(g => `<option ${g === ui.groupe ? 'selected' : ''}>${esc(g)}</option>`).join('')}</select>` : ''}
          ${L.a('Responsable') ? `<select class="in sm" id="rv-r" aria-label="Responsable"><option value="">Toute l’équipe</option>${resps.map(g => `<option ${g === ui.resp ? 'selected' : ''}>${esc(g)}</option>`).join('')}</select>` : ''}
          <input class="in sm" type="date" id="rv-fin" value="${P.iso(fin)}" aria-label="Dernier jour de la période"></div></div>

      <div class="tuiles">
        <div class="tuile ok"><div class="v">${terminees.length}</div><div class="l">terminée(s) cette semaine</div></div>
        <div class="tuile ${retards.length ? 'err' : 'ok'}"><div class="v">${retards.length}</div><div class="l">en retard</div></div>
        <div class="tuile ${prochaines.length ? 'warn' : ''}"><div class="v">${prochaines.length}</div><div class="l">à rendre sous ${avenir} jours</div></div>
        ${L.a('MajLe') ? `<div class="tuile ${dormantes.length ? 'warn' : ''}"><div class="v">${dormantes.length}</div><div class="l">sans nouvelles depuis ${dormant} jours</div></div>` : ''}
        ${L.a('CreeLe') ? `<div class="tuile"><div class="v">${nouvelles.length}</div><div class="l">nouvelle(s) tâche(s)</div></div>` : ''}
      </div>

      ${synthese.length ? `<section class="carte"><h2>Où en est chaque ${esc(((L.col('Groupe') || {}).label || 'groupe').toLowerCase())} ?</h2>
        ${synthese.map(s => `<div class="rv-grp"><span class="nom">${esc(s.g)}</span><span><span class="badge ${s.etat.c}">${s.etat.l}</span></span>
          <span>${s.av != null ? `<div class="barre ${s.av >= .8 ? 'ok' : ''}"><span style="width:${Math.round(s.av * 100)}%"></span></div><span class="small muted">${P.fmtPct(s.av)} d’avancement</span>` : ''}</span>
          <span class="chiffres"><b>${s.ouv}</b> en cours${s.ret ? ` · <b style="color:var(--error)">${s.ret}</b> en retard` : ''}${s.proch ? `<br>Prochaine échéance : ${P.fmtDateCourt(s.proch.echeance)}` : ''}</span></div>`).join('')}</section>` : ''}

      <div class="rv-2">
        <section class="carte"><h2>✅ Terminé cette semaine</h2>
          ${terminees.length ? terminees.map(x => ligne(x, P.fmtDateCourt(x.realise), x.suites)).join('') : vide(L.a('Realisation') || L.a('MajLe') ? 'Aucune tâche terminée sur la période.' : 'Associez la colonne « Date de réalisation » pour voir ce qui a été terminé.')}</section>
        <section class="carte"><h2>🔴 En retard</h2>
          ${retards.length ? retards.map(x => ligne(x, `<span class="badge err">${-P.diffDays(x.echeance, auj)} j de retard</span>`, x.suites)).join('') : vide('Aucune tâche en retard. 👏')}</section>
        <section class="carte"><h2>📅 À rendre dans les ${avenir} prochains jours</h2>
          ${prochaines.length ? prochaines.map(x => ligne(x, `${P.fmtDateCourt(x.echeance)}<br>${P.relatif(P.diffDays(x.echeance, auj))}`)).join('') : vide('Rien d’urgent à l’horizon.')}</section>
        <section class="carte"><h2>💤 Points d’attention</h2>
          ${L.a('MajLe') ? `<p class="rv-sous">Sans nouvelles depuis plus de ${dormant} jours</p>${dormantes.length ? dormantes.map(x => ligne(x, `${P.diffDays(auj, P.jour(x.maj))} j`)).join('') : vide('Aucune.')}` : ''}
          <p class="rv-sous">À compléter</p>${incompletes.length ? incompletes.map(x => ligne(x, `${L.a('Responsable') && !x.resp ? '<span class="badge warn">sans responsable</span><br>' : ''}${!x.echeance ? '<span class="badge warn">sans échéance</span>' : ''}`)).join('') : vide('Toutes les tâches ouvertes ont un responsable et une échéance.')}
          ${nouvelles.length ? `<p class="rv-sous">Nouvelles tâches</p>${nouvelles.map(x => ligne(x, P.fmtDateCourt(P.jour(x.cree)))).join('')}` : ''}</section>
        ${jalons.length ? `<section class="carte"><h2>🏁 Jalons</h2>${jalons.sort((a, b) => (a.echeance || 9e15) - (b.echeance || 9e15)).map(x => ligne(x, x.fini ? '<span class="badge ok">atteint</span>' : x.retard ? '<span class="badge err">dépassé</span>' : x.echeance ? P.fmtDate(x.echeance) : '–')).join('')}</section>` : ''}
      </div>

      <section class="carte"><h2>📝 Décisions et points à aborder</h2>
        <textarea class="in rv-notes" id="rv-notes" placeholder="Notes de la réunion (enregistrées dans ce navigateur pour cette semaine)">${esc(notes)}</textarea>
        <div class="print-only" id="rv-notes-print" style="white-space:pre-wrap">${esc(notes)}</div></section>
    </div>`;
    const sel = (id, k, num) => { const e = P.$(id); if (e) e.addEventListener('change', ev => { ui[k] = ev.target.value; dessiner(); }); };
    sel('#rv-g', 'groupe'); sel('#rv-r', 'resp');
    P.$('#rv-fin').addEventListener('change', e => { ui.fin = P.fromIso(e.target.value) || P.today(); P.$$('[data-per]').forEach(x => x.setAttribute('aria-pressed', 'false')); dessiner(); });
    const ta = P.$('#rv-notes');
    ta.addEventListener('input', P.debounce(() => { try { localStorage.setItem(cleNotes, ta.value); } catch (e) { /* ignoré */ } P.$('#rv-notes-print').textContent = ta.value; }, 300));
  }

  async function copier() {
    const src = P.$('#rv-rapport'); if (!src) return;
    const clone = src.cloneNode(true);
    clone.querySelectorAll('.no-print,textarea').forEach(x => x.parentNode.removeChild(x));
    clone.querySelectorAll('.print-only').forEach(x => { x.style.display = 'block'; });
    const html = `<div style="font-family:Marianne,Arial,sans-serif;font-size:14px">${clone.innerHTML}</div>`;
    try {
      await navigator.clipboard.write([new ClipboardItem({'text/html': new Blob([html], {type: 'text/html'}), 'text/plain': new Blob([clone.innerText], {type: 'text/plain'})})]);
      P.toast('Revue copiée : collez-la dans un mail ou un document.', 'ok');
    } catch (e) {
      try { await navigator.clipboard.writeText(clone.innerText); P.toast('Revue copiée (texte seul).', 'ok'); }
      catch (e2) { P.toast('Copie impossible dans ce navigateur : utilisez Imprimer.', 'warn'); }
    }
  }
})();
</script>
</body>
</html>
