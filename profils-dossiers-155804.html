<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profils de dossiers</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; font-family: Arial, sans-serif; background: #f5f7fb; color: #1f2937; }
    .container { width: 100%; }

    h1 { font-size: 18px; font-weight: 700; color: #111827; margin: 0 0 4px; }
    .subtitle { font-size: 12.5px; color: #6b7280; margin: 0 0 12px; }

    .warn-banner {
      background: #fef3c7; border: 1px solid #fde68a; color: #92400e; border-radius: 12px;
      padding: 8px 12px; font-size: 12px; margin-bottom: 10px; display: none;
    }
    .warn-banner.show { display: block; }
    .warn-banner p { margin: 0; }
    .warn-banner p + p { margin-top: 4px; }

    .toolbar-wrap { position: sticky; top: 0; z-index: 10; background: #f5f7fb; padding-bottom: 10px; }

    .criteria-panel { background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; padding: 10px 12px; margin-bottom: 10px; }
    .criteria-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .criteria-title { font-size: 12.5px; font-weight: 700; color: #374151; }
    .combo-toggle { display: flex; gap: 4px; background: #f3f4f6; border-radius: 999px; padding: 3px; }
    .combo-btn {
      border: none; background: transparent; color: #6b7280; font-size: 11.5px; font-weight: 700;
      padding: 5px 11px; border-radius: 999px; cursor: pointer;
    }
    .combo-btn.active { background: #2563eb; color: #fff; }
    .reset-link { background: none; border: none; color: #2563eb; font-size: 11.5px; font-weight: 700; cursor: pointer; padding: 4px 2px; }
    .reset-link:hover { text-decoration: underline; }

    .criteria-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .crit-chip {
      display: inline-flex; align-items: center; gap: 6px; border: 1px solid #d1d5db; background: #fff;
      border-radius: 999px; padding: 5px 6px 5px 10px; font-size: 12px; cursor: pointer; user-select: none;
    }
    .crit-chip:hover { border-color: #93c5fd; }
    .crit-chip.checked { background: #eff6ff; border-color: #2563eb; color: #1d4ed8; font-weight: 700; }
    .crit-chip input[type="checkbox"] { accent-color: #2563eb; cursor: pointer; }
    .crit-chip .crit-kind { font-size: 10px; opacity: 0.6; }
    .crit-chip .crit-count {
      font-size: 10.5px; font-weight: 700; background: #f3f4f6; color: #6b7280;
      border-radius: 999px; padding: 1px 7px;
    }
    .crit-chip.checked .crit-count { background: #dbeafe; color: #1d4ed8; }
    .crit-chip .commune-input {
      border: 1px solid #d1d5db; border-radius: 999px; padding: 3px 10px; font-size: 12px;
      width: 130px; font-family: inherit; cursor: text;
    }
    .crit-chip .commune-input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15); }
    .criteria-empty { font-size: 12px; color: #9ca3af; font-style: italic; }

    .search-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .search-input { flex: 1; padding: 10px 13px; border: 1px solid #d1d5db; border-radius: 14px; font-size: 14px; outline: none; background: #fff; }
    .search-input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12); }
    .refresh-btn {
      border: 1px solid #d1d5db; background: #fff; color: #374151; border-radius: 10px;
      padding: 9px 14px; font-size: 12.5px; font-weight: 700; cursor: pointer; white-space: nowrap;
    }
    .refresh-btn:hover { border-color: #93c5fd; }
    .refresh-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .meta { font-size: 12.5px; color: #6b7280; }

    /* ---------- Table ---------- */
    .table-wrap { background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; overflow: auto; margin-top: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th {
      position: sticky; top: 0; background: #f9fafb; text-align: left; padding: 10px 12px;
      font-size: 11.5px; font-weight: 700; color: #6b7280; text-transform: uppercase;
      letter-spacing: 0.03em; border-bottom: 1px solid #e5e7eb; white-space: nowrap;
    }
    tbody td { padding: 10px 12px; border-bottom: 1px solid #f0f1f4; vertical-align: top; }
    tbody tr { cursor: pointer; }
    tbody tr:hover { background: #f8faff; }
    tbody tr:last-child td { border-bottom: none; }
    .cell-name { font-weight: 600; color: #111827; }
    .cell-sub { font-size: 12px; color: #6b7280; margin-top: 2px; }

    .tag { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 3px 9px; white-space: nowrap; }
    .tag-flag { color: #4338ca; background: #eef2ff; border: 1px solid #c7d2fe; }
    .tag-warn { color: #b91c1c; background: #fef2f2; border: 1px solid #fecaca; }
    .tag-area { color: #075985; background: #e0f2fe; border: 1px solid #bae6fd; }
    .tag-gaec { color: #6b21a8; background: #f3e8ff; border: 1px solid #e9d5ff; }
    .tag-elevage { color: #166534; background: #dcfce7; border: 1px solid #bbf7d0; }
    .tag-legumes { color: #92400e; background: #fef3c7; border: 1px solid #fde68a; }

    .empty { background: #fff; border: 1px dashed #d1d5db; border-radius: 14px; padding: 24px; text-align: center; color: #6b7280; margin-top: 10px; }

    /* ---------- Fiche détail ---------- */
    .back-btn {
      display: inline-flex; align-items: center; gap: 6px; background: #fff; border: 1px solid #d1d5db;
      border-radius: 10px; padding: 8px 12px; font-size: 14px; cursor: pointer; margin-bottom: 14px;
    }
    .back-btn:hover { border-color: #93c5fd; }
    .fiche-header { background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; padding: 16px; margin-bottom: 14px; }
    .fiche-header .title { font-size: 20px; font-weight: 700; margin-bottom: 4px; color: #111827; }
    .fiche-header .sub { font-size: 13px; color: #6b7280; margin-bottom: 8px; }
    .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

    .fiche-layout { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; }
    .fiche-main { flex: 1 1 380px; min-width: 280px; }

    .section { background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; margin-bottom: 12px; overflow: hidden; }
    .section-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; background: #f9fafb; border-bottom: 1px solid #e5e7eb; font-weight: 700; font-size: 14px; color: #111827; }
    .section-count { font-size: 12px; font-weight: 600; color: #2563eb; background: #eff6ff; border-radius: 999px; padding: 2px 8px; }
    .section-body { padding: 10px 14px; }
    .row-block { border: 1px solid #f0f1f4; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; background: #fcfcfd; }
    .row-block:last-child { margin-bottom: 0; }
    .field { display: flex; gap: 6px; font-size: 13px; line-height: 1.5; padding: 4px 0; border-bottom: 1px dashed #eef0f3; }
    .field:last-child { border-bottom: none; }
    .field-label { color: #6b7280; min-width: 42%; flex-shrink: 0; }
    .field-value { color: #1f2937; font-weight: 500; word-break: break-word; }
    .section-empty { font-size: 13px; color: #9ca3af; font-style: italic; padding: 6px 0; }
  </style>
</head>
<body>
  <div class="container">
    <div id="listView">
      <h1>🏷️ Profils de dossiers</h1>
      <p class="subtitle">Démarche 155804 — critères : AREA, GAEC, Commune, Surface légumes (PACAGE), DATA_ELEVAGE2</p>
      <div class="warn-banner" id="warnBanner"></div>

      <div class="toolbar-wrap">
        <div class="criteria-panel">
          <div class="criteria-header">
            <span class="criteria-title">Critères (cochez-en un ou plusieurs)</span>
            <div style="display:flex;align-items:center;gap:10px;">
              <div class="combo-toggle" id="comboToggle">
                <button type="button" class="combo-btn" data-mode="or">Au moins un (OU)</button>
                <button type="button" class="combo-btn" data-mode="and">Tous (ET)</button>
              </div>
              <button type="button" class="reset-link" id="resetCriteriaBtn">Tout décocher</button>
            </div>
          </div>
          <div class="criteria-list" id="criteriaList"></div>
        </div>
        <div class="search-row">
          <input id="searchInput" class="search-input" type="text" placeholder="Rechercher un nom, un SIRET, une commune...">
          <button type="button" class="refresh-btn" id="refreshBtn">↻ Actualiser</button>
        </div>
        <div class="meta" id="meta">Chargement...</div>
      </div>

      <div id="tableWrap"></div>
    </div>

    <div id="ficheView" style="display:none;">
      <button class="back-btn" id="backBtn">&larr; Retour à la liste</button>
      <div id="ficheContent"></div>
    </div>
  </div>

  <script>
    // ================= Constantes =================
    const DOSSIERS_TABLE = "Demarche_155804_dossiers";
    const DEMANDEURS_TABLE = "Demarche_155804_demandeurs";
    const AREA_TABLE = "DATA_AREA";
    const ASSOCIES_TABLE = "DATA_ASSOCIES";
    const ELEVAGE_TABLE = "DATA_ELEVAGE2";
    const SURFACE_TABLE = "DATA_SURFACE_MAR";

    // ================= Utilitaires =================
    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
    function stripAccents(str) { return String(str ?? "").normalize("NFD").replace(/[̀-ͯ]/g, ""); }
    function normalize(value) { return stripAccents(String(value ?? "")).toLowerCase().trim(); }
    function normalizeCode(v) { return stripAccents(String(v ?? "")).toLowerCase().replace(/[^a-z0-9]/g, ""); }
    function fieldValueToText(val) {
      if (Array.isArray(val) && val[0] === "L") return val.slice(1).join(", ");
      if (Array.isArray(val)) return val.join(", ");
      if (typeof val === "boolean") return val ? "Oui" : "Non";
      return String(val ?? "");
    }
    // Une valeur Grist "vraie" au sens large : booléen, nombre non nul, texte non vide et
    // différent de "non"/"false", ou liste non vide (y compris une RecordSet lookupRecords()).
    function isTruthy(v) {
      if (v === null || v === undefined || v === "") return false;
      if (typeof v === "boolean") return v;
      if (typeof v === "number") return v !== 0;
      if (Array.isArray(v)) {
        const items = v[0] === "L" ? v.slice(1) : v;
        return items.length > 0;
      }
      const n = normalize(v);
      return n !== "" && n !== "non" && n !== "false" && n !== "0";
    }
    function numericSum(v) {
      if (typeof v === "number") return v;
      if (Array.isArray(v)) {
        const items = v[0] === "L" ? v.slice(1) : v;
        return items.filter(x => typeof x === "number").reduce((a, b) => a + b, 0);
      }
      const n = Number(v);
      return isNaN(n) ? 0 : n;
    }
    function formatAnyDate(value) {
      if (value === null || value === undefined || value === "") return "—";
      if (typeof value === "number") {
        try { return new Date(value * 1000).toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit", year: "numeric" }); }
        catch (e) { return String(value); }
      }
      const d = new Date(value);
      if (!isNaN(d.getTime())) return d.toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit", year: "numeric" });
      return String(value);
    }

    const FIELD_LABELS = {
      dossier_number: "N° de dossier", state: "État du dossier", date_depot: "Date de dépôt",
      date_derniere_modification: "Dernière modification", suivi_par: "Suivi par", motivation: "Motivation",
      type: "Type de déclarant", usager_email: "Email du déclarant", siret: "SIRET", siren: "SIREN",
      raison_sociale: "Raison sociale", nom_commercial: "Nom commercial", forme_juridique: "Forme juridique",
      street_address: "Adresse", ville: "Commune", code_postal: "Code postal",
      departement: "Département", region: "Région",
      AREA: "Bénéficiaire AREA", GAEC: "GAEC", Chorus: "État Chorus", MRC: "Présent dans DATA_MRC22",
      Etat: "État (tiers)", Etat_DN: "État de la DN", PACAGE_associe_au_SIRET: "N° PACAGE (via SIRET)",
      Montant_d_aide_total: "Montant d'aide total (AREA)", Beneficiaire_audit: "Bénéficiaire audit",
      Beneficiaire_aide_restructuration: "Bénéficiaire aide restructuration",
      Date_AE_AUDIT: "Date AE audit", Date_AE_AREA: "Date AE AREA",
      Portable_1: "Téléphone associé 1", Portable_2: "Téléphone associé 2", Adresse_mail: "Email associé",
      Pacage: "N° PACAGE", Pacage_enfant: "N° PACAGE (associé)", ordre: "Ordre",
      dep: "Département (élevage)", commune_adresse_postale: "Commune (élevage)", statut_siret: "Statut SIRET",
      ede: "N° EDE", nb_ede: "Nombre d'EDE", bovin: "Bovins", caprin: "Caprins", ovin: "Ovins",
      porcin: "Porcins", volailles: "Volailles", lapin: "Lapins", nbr_ua: "Nombre d'UA", nb_types_d_ua: "Nombre de types d'UA"
    };
    function labelFor(col) { return FIELD_LABELS[col] || String(col).replace(/_/g, " ").replace(/^./, c => c.toUpperCase()); }

    // ================= Accès Grist =================
    async function fetchTableRaw(tableId) { return await grist.docApi.fetchTable(tableId); }
    function columnsFromRaw(raw) { return Object.keys(raw).filter(c => c !== "id" && !c.startsWith("gristHelper")); }
    function rowsFromRaw(raw, cols) {
      const ids = raw.id || [];
      return ids.map((id, i) => {
        const row = { id };
        cols.forEach(c => (row[c] = raw[c][i]));
        return row;
      });
    }

    // ================= État global =================
    let allDossiers = [];
    let areaBySiret = new Map();
    let associesByPacage = new Map();
    let elevageBySiret = new Map();
    let surfaceLegumeByPacage = new Map();
    let elevageAvailable = false;
    let surfaceAvailable = false;
    let dataLoaded = false;
    let criteria = [];                  // les 5 critères stables (voir buildCriteria)
    let activeCriteriaKeys = new Set(); // vide = aucun filtre (tous les dossiers)
    let combinator = "or";              // "or" = au moins un critère coché, "and" = tous les critères cochés
    let communeQuery = "";              // texte tapé pour le critère "Commune"

    const searchInput = document.getElementById("searchInput");
    const metaEl = document.getElementById("meta");
    const tableWrap = document.getElementById("tableWrap");
    const criteriaListEl = document.getElementById("criteriaList");
    const comboToggleEl = document.getElementById("comboToggle");
    const resetCriteriaBtn = document.getElementById("resetCriteriaBtn");
    const warnBanner = document.getElementById("warnBanner");
    const listView = document.getElementById("listView");
    const ficheView = document.getElementById("ficheView");
    const ficheContent = document.getElementById("ficheContent");
    const backBtn = document.getElementById("backBtn");
    const refreshBtn = document.getElementById("refreshBtn");

    async function loadEverything() {
      metaEl.textContent = "Chargement des dossiers...";
      const [dossiersRaw, demandeursRaw, areaRaw, associesRaw, elevageRaw, surfaceRaw] = await Promise.all([
        fetchTableRaw(DOSSIERS_TABLE),
        fetchTableRaw(DEMANDEURS_TABLE),
        fetchTableRaw(AREA_TABLE).catch(err => { console.warn("Table DATA_AREA indisponible :", err); return null; }),
        fetchTableRaw(ASSOCIES_TABLE).catch(err => { console.warn("Table DATA_ASSOCIES indisponible :", err); return null; }),
        fetchTableRaw(ELEVAGE_TABLE).catch(err => { console.warn("Table DATA_ELEVAGE2 indisponible :", err); return null; }),
        fetchTableRaw(SURFACE_TABLE).catch(err => { console.warn("Table DATA_SURFACE_MAR indisponible :", err); return null; })
      ]);

      const dossiersCols = columnsFromRaw(dossiersRaw);
      const dossiersRows = rowsFromRaw(dossiersRaw, dossiersCols);
      const demandeursCols = columnsFromRaw(demandeursRaw);
      const demandeursRows = rowsFromRaw(demandeursRaw, demandeursCols);

      elevageAvailable = !!elevageRaw;
      surfaceAvailable = !!surfaceRaw;

      const warnLines = [];
      if (!elevageAvailable) warnLines.push(`⚠ La table "${escapeHtml(ELEVAGE_TABLE)}" est introuvable ou inaccessible — le critère "Présent dans ${escapeHtml(ELEVAGE_TABLE)}" n'est pas proposé tant qu'elle n'est pas disponible.`);
      if (!surfaceAvailable) warnLines.push(`⚠ La table "${escapeHtml(SURFACE_TABLE)}" est introuvable ou inaccessible — le critère "Surface légumes (PACAGE)" n'est pas proposé tant qu'elle n'est pas disponible.`);
      warnBanner.innerHTML = warnLines.map(l => `<p>${l}</p>`).join("");
      warnBanner.classList.toggle("show", warnLines.length > 0);

      const dossiersByNumber = new Map();
      dossiersRows.forEach(d => {
        const key = String(d.dossier_number || "").trim();
        if (key) dossiersByNumber.set(key, d);
      });

      areaBySiret = new Map();
      if (areaRaw) {
        const areaCols = columnsFromRaw(areaRaw);
        rowsFromRaw(areaRaw, areaCols).forEach(r => {
          const key = normalizeCode(r.SIRET);
          if (!key) return;
          if (!areaBySiret.has(key)) areaBySiret.set(key, []);
          areaBySiret.get(key).push(r);
        });
      }

      associesByPacage = new Map();
      if (associesRaw) {
        const assCols = columnsFromRaw(associesRaw);
        rowsFromRaw(associesRaw, assCols).forEach(r => {
          const key = normalizeCode(r.Pacage);
          if (!key) return;
          if (!associesByPacage.has(key)) associesByPacage.set(key, []);
          associesByPacage.get(key).push(r);
        });
      }

      elevageBySiret = new Map();
      if (elevageRaw) {
        const elevageCols = columnsFromRaw(elevageRaw);
        rowsFromRaw(elevageRaw, elevageCols).forEach(r => {
          const key = normalizeCode(r.siret);
          if (!key) return;
          if (!elevageBySiret.has(key)) elevageBySiret.set(key, []);
          elevageBySiret.get(key).push(r);
        });
      }

      surfaceLegumeByPacage = new Map();
      if (surfaceRaw) {
        const surfaceCols = columnsFromRaw(surfaceRaw);
        rowsFromRaw(surfaceRaw, surfaceCols).forEach(r => {
          const key = normalizeCode(r.pacage);
          if (!key) return;
          surfaceLegumeByPacage.set(key, (surfaceLegumeByPacage.get(key) || 0) + numericSum(r.surf_leg));
        });
      }

      allDossiers = demandeursRows.map(demandeur => {
        const key = String(demandeur.dossier_number || "").trim();
        const dossier = dossiersByNumber.get(key) || null;
        const siretKey = normalizeCode(demandeur.siret);
        const pacageKey = normalizeCode(demandeur.PACAGE_associe_au_SIRET);
        const surfaceLegume = surfaceLegumeByPacage.get(pacageKey) || 0;
        return {
          demandeurId: demandeur.id,
          dossier_number: demandeur.dossier_number,
          nom: demandeur.nom_commercial || demandeur.raison_sociale || "",
          siret: demandeur.siret,
          ville: demandeur.ville,
          code_postal: demandeur.code_postal,
          pacage: demandeur.PACAGE_associe_au_SIRET,
          state: dossier ? dossier.state : null,
          isArea: isTruthy(demandeur.AREA),
          isGaec: isTruthy(demandeur.GAEC),
          isElevage: elevageBySiret.has(siretKey),
          surfaceLegume,
          hasLegumes: surfaceLegume > 0,
          areaRows: areaBySiret.get(siretKey) || [],
          associesRows: associesByPacage.get(pacageKey) || [],
          elevageRows: elevageBySiret.get(siretKey) || [],
          demandeur,
          dossier
        };
      });

      criteria = buildCriteria();
      activeCriteriaKeys = new Set([...activeCriteriaKeys].filter(k => criteria.some(c => c.key === k)));

      dataLoaded = true;
    }

    // Les 5 critères stables demandés. "Commune" filtre par texte approximatif (le critère
    // n'est actif que si un texte a été saisi) ; "Présent dans DATA_ELEVAGE2" n'est proposé
    // que si cette table a bien été trouvée dans le document (voir warnBanner).
    function buildCriteria() {
      const list = [
        { key: "area", kind: "bool", label: "Présent dans AREA", test: d => d.isArea, display: d => (d.isArea ? "Oui" : "—") },
        { key: "gaec", kind: "bool", label: "GAEC", test: d => d.isGaec, display: d => (d.isGaec ? "Oui" : "—") },
        {
          key: "commune", kind: "commune", label: "Commune",
          test: d => normalize(communeQuery) !== "" && normalize(d.ville).includes(normalize(communeQuery)),
          display: d => d.ville || "—"
        }
      ];
      if (surfaceAvailable) {
        list.push({
          key: "legumes", kind: "bool", label: "Surface légumes (PACAGE)",
          test: d => d.hasLegumes,
          display: d => (d.surfaceLegume ? d.surfaceLegume.toLocaleString("fr-FR") + " ha" : "—")
        });
      }
      if (elevageAvailable) {
        list.push({
          key: "elevage", kind: "bool", label: `Présent dans ${ELEVAGE_TABLE}`,
          test: d => d.isElevage,
          display: d => (d.isElevage ? "Oui" : "—")
        });
      }
      return list;
    }

    // ================= Filtrage / rendu =================
    function activeCriteriaList() { return criteria.filter(c => activeCriteriaKeys.has(c.key)); }

    function renderCriteriaPanel() {
      comboToggleEl.querySelectorAll(".combo-btn").forEach(btn => btn.classList.toggle("active", btn.dataset.mode === combinator));
      if (!criteria.length) {
        criteriaListEl.innerHTML = `<div class="criteria-empty">Aucun critère disponible pour le moment.</div>`;
        return;
      }
      criteriaListEl.innerHTML = criteria.map(c => {
        const checked = activeCriteriaKeys.has(c.key);
        if (c.kind === "commune") {
          const count = allDossiers.filter(c.test).length;
          return `
            <label class="crit-chip commune-chip ${checked ? "checked" : ""}" data-key="${escapeHtml(c.key)}">
              <input type="checkbox" data-key="${escapeHtml(c.key)}" ${checked ? "checked" : ""}>
              <span class="crit-kind">🔎</span>
              <span>${escapeHtml(c.label)}</span>
              <input type="text" class="commune-input" placeholder="ex. Perpignan" value="${escapeHtml(communeQuery)}">
              <span class="crit-count">${count}</span>
            </label>
          `;
        }
        const count = allDossiers.filter(c.test).length;
        return `
          <label class="crit-chip ${checked ? "checked" : ""}">
            <input type="checkbox" data-key="${escapeHtml(c.key)}" ${checked ? "checked" : ""}>
            <span class="crit-kind">✓</span>
            <span>${escapeHtml(c.label)}</span>
            <span class="crit-count">${count}</span>
          </label>
        `;
      }).join("");

      criteriaListEl.querySelectorAll('input[type="checkbox"]').forEach(cb => {
        cb.addEventListener("change", () => {
          if (cb.checked) activeCriteriaKeys.add(cb.dataset.key);
          else activeCriteriaKeys.delete(cb.dataset.key);
          renderCriteriaPanel();
          renderTable();
        });
      });

      // Le champ texte de "Commune" ne doit pas provoquer un re-rendu complet du panneau à
      // chaque frappe (cela ferait perdre le focus) : on met juste à jour son compteur et
      // l'état coché/décoché, puis on ré-affiche le tableau.
      const communeInput = criteriaListEl.querySelector(".commune-input");
      if (communeInput) {
        communeInput.addEventListener("click", e => e.stopPropagation());
        communeInput.addEventListener("input", () => {
          communeQuery = communeInput.value;
          const communeCrit = criteria.find(c => c.key === "commune");
          const shouldBeActive = normalize(communeQuery) !== "";
          if (shouldBeActive) activeCriteriaKeys.add("commune");
          else activeCriteriaKeys.delete("commune");

          const chip = communeInput.closest(".crit-chip");
          chip.classList.toggle("checked", shouldBeActive);
          chip.querySelector('input[type="checkbox"]').checked = shouldBeActive;
          chip.querySelector(".crit-count").textContent = allDossiers.filter(communeCrit.test).length;

          renderTable();
        });
      }
    }

    function getFiltered() {
      const q = normalize(searchInput.value.trim());
      const activeCrits = activeCriteriaList();
      return allDossiers.filter(d => {
        if (activeCrits.length) {
          const matches = combinator === "and" ? activeCrits.every(c => c.test(d)) : activeCrits.some(c => c.test(d));
          if (!matches) return false;
        }
        if (!q) return true;
        const hay = normalize([d.nom, d.siret, d.ville, d.code_postal, d.dossier_number].join(" "));
        return hay.includes(q);
      });
    }

    function extraColumnHtml(d) {
      const activeCrits = activeCriteriaList();
      if (activeCrits.length === 1) {
        return `<td>${escapeHtml(activeCrits[0].display(d))}</td>`;
      }
      const matched = criteria.filter(c => c.test(d));
      if (!matched.length) return `<td>—</td>`;
      const shown = matched.slice(0, 4);
      const extra = matched.length - shown.length;
      const pills = shown.map(c => `<span class="tag tag-flag">${escapeHtml(c.label)}</span>`).join(" ");
      return `<td>${pills}${extra > 0 ? ` <span class="tag tag-flag">+${extra}</span>` : ""}</td>`;
    }

    function extraColumnLabel() {
      const activeCrits = activeCriteriaList();
      if (activeCrits.length === 1) return activeCrits[0].label;
      return "Critères correspondants";
    }

    function renderTable() {
      const filtered = getFiltered();
      const limited = filtered.slice(0, 300);
      const activeCrits = activeCriteriaList();
      const filterNote = activeCrits.length ? ` — ${activeCrits.length} critère(s) actif(s) (${combinator === "and" ? "ET" : "OU"})` : "";
      metaEl.textContent = `${filtered.length} dossier(s)${filtered.length > limited.length ? " (300 premiers affichés)" : ""} sur ${allDossiers.length} au total${filterNote}.`;

      if (!limited.length) {
        tableWrap.innerHTML = `<div class="empty">Aucun dossier ne correspond à ces critères</div>`;
        return;
      }

      const rows = limited.map(d => `
        <tr data-demandeurid="${d.demandeurId}">
          <td>
            <div class="cell-name">${escapeHtml(d.nom || "—")}</div>
            <div class="cell-sub">Dossier n° ${escapeHtml(d.dossier_number || "—")}</div>
          </td>
          <td>${escapeHtml(d.siret || "—")}</td>
          <td>${escapeHtml([d.code_postal, d.ville].filter(Boolean).join(" ") || "—")}</td>
          ${extraColumnHtml(d)}
        </tr>
      `).join("");

      tableWrap.innerHTML = `
        <div class="table-wrap">
          <table>
            <thead><tr><th>Nom / Raison sociale</th><th>SIRET</th><th>Commune</th><th>${escapeHtml(extraColumnLabel())}</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
      tableWrap.querySelectorAll("tbody tr").forEach(tr => {
        tr.addEventListener("click", () => openFiche(Number(tr.dataset.demandeurid)));
      });
    }

    function renderAll() {
      if (!dataLoaded) return;
      renderCriteriaPanel();
      renderTable();
    }

    comboToggleEl.querySelectorAll(".combo-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        combinator = btn.dataset.mode;
        renderCriteriaPanel();
        renderTable();
      });
    });
    resetCriteriaBtn.addEventListener("click", () => {
      activeCriteriaKeys.clear();
      communeQuery = "";
      renderCriteriaPanel();
      renderTable();
    });

    searchInput.addEventListener("input", renderTable);
    refreshBtn.addEventListener("click", async () => {
      refreshBtn.disabled = true;
      refreshBtn.textContent = "Actualisation...";
      try {
        await loadEverything();
        renderAll();
      } catch (err) {
        console.error("Erreur actualisation :", err);
        metaEl.textContent = "Erreur lors de l'actualisation : " + (err.message || err);
      } finally {
        refreshBtn.disabled = false;
        refreshBtn.textContent = "↻ Actualiser";
      }
    });

    // ================= Fiche détail =================
    function renderFieldRow(key, rawValue) {
      const val = fieldValueToText(rawValue);
      if (val === "" || val === "null" || val === "undefined") return "";
      return `<div class="field"><span class="field-label">${escapeHtml(labelFor(key))}</span><span class="field-value">${escapeHtml(val)}</span></div>`;
    }
    function renderSection(title, rows, keys) {
      const body = rows.length
        ? rows.map(r => `<div class="row-block">${keys.map(k => renderFieldRow(k, r[k])).filter(Boolean).join("") || '<div class="section-empty">Aucune donnée</div>'}</div>`).join("")
        : `<div class="section-empty">Aucune ligne trouvée</div>`;
      return `
        <div class="section">
          <div class="section-header"><span>${escapeHtml(title)}</span><span class="section-count">${rows.length}</span></div>
          <div class="section-body">${body}</div>
        </div>
      `;
    }

    function openFiche(demandeurId) {
      const d = allDossiers.find(x => x.demandeurId === demandeurId);
      if (!d) return;
      try { grist.setCursorPos({ tableId: DEMANDEURS_TABLE, rowId: demandeurId }); } catch (e) { /* facultatif */ }

      listView.style.display = "none";
      ficheView.style.display = "block";

      const header = `
        <div class="fiche-header">
          <div class="title">${escapeHtml(d.nom || "Dossier " + (d.dossier_number || ""))}</div>
          <div class="sub">Dossier n° ${escapeHtml(d.dossier_number || "—")} · SIRET ${escapeHtml(d.siret || "—")}</div>
          <div class="badges">
            ${d.isArea ? `<span class="tag tag-area">AREA</span>` : ""}
            ${d.isGaec ? `<span class="tag tag-gaec">GAEC</span>` : ""}
            ${d.hasLegumes ? `<span class="tag tag-legumes">Légumes — ${escapeHtml(d.surfaceLegume.toLocaleString("fr-FR"))} ha</span>` : ""}
            ${d.isElevage ? `<span class="tag tag-elevage">${escapeHtml(ELEVAGE_TABLE)}</span>` : ""}
          </div>
        </div>
      `;

      const dossierKeys = ["state", "date_depot", "date_derniere_modification", "suivi_par", "motivation"];
      const demandeurKeys = ["type", "usager_email", "siret", "siren", "raison_sociale", "nom_commercial", "forme_juridique", "street_address", "code_postal", "ville", "departement", "region"];
      const computedKeys = ["PACAGE_associe_au_SIRET", "AREA", "GAEC", "Chorus", "MRC", "Etat", "Etat_DN"];
      const areaKeys = ["Montant_d_aide_total", "Beneficiaire_audit", "Beneficiaire_aide_restructuration", "Date_AE_AUDIT", "Date_AE_AREA"];
      const associesKeys = ["Pacage_enfant", "ordre", "Portable_1", "Portable_2", "Adresse_mail"];
      const elevageKeys = ["dep", "code_postal", "commune_adresse_postale", "statut_siret", "ede", "nb_ede", "bovin", "caprin", "ovin", "porcin", "volailles", "lapin", "nbr_ua", "nb_types_d_ua"];

      let extraSections = "";
      if (d.isArea) extraSections += renderSection("Détail AREA (DATA_AREA)", d.areaRows, areaKeys);
      if (d.isGaec) extraSections += renderSection("Associés GAEC (DATA_ASSOCIES)", d.associesRows, associesKeys);
      if (d.isElevage) extraSections += renderSection(`Détail élevage (${ELEVAGE_TABLE})`, d.elevageRows, elevageKeys);

      ficheContent.innerHTML = `
        ${header}
        <div class="fiche-layout">
          <div class="fiche-main">
            ${d.dossier ? renderSection("Instruction du dossier", [d.dossier], dossierKeys) : `<div class="section"><div class="section-header">Instruction du dossier</div><div class="section-body"><div class="section-empty">Aucun dossier "${escapeHtml(DOSSIERS_TABLE)}" ne correspond à ce n° de dossier.</div></div></div>`}
            ${renderSection("Déclarant", [d.demandeur], demandeurKeys)}
            ${renderSection("Recoupements (formules)", [d.demandeur], computedKeys)}
            ${extraSections}
          </div>
        </div>
      `;
    }

    backBtn.addEventListener("click", () => {
      ficheView.style.display = "none";
      listView.style.display = "block";
    });

    // ================= Initialisation =================
    grist.ready({ requiredAccess: "full" });

    (async function init() {
      try {
        await loadEverything();
        renderAll();
      } catch (err) {
        console.error("Erreur chargement initial :", err);
        metaEl.textContent = "Erreur lors du chargement.";
        tableWrap.innerHTML = `<div class="empty">Échec du chargement (${escapeHtml(err.message || err)}).<br>Vérifie que les tables "${escapeHtml(DOSSIERS_TABLE)}" et "${escapeHtml(DEMANDEURS_TABLE)}" existent et que le widget a l'accès complet.</div>`;
      }
    })();
  </script>
</body>
</html>
