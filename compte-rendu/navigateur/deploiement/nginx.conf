# Exemple de configuration nginx pour héberger l'application sur un serveur web INTERNE.
# L'application est un ensemble de fichiers statiques : aucun traitement côté serveur,
# aucune donnée de réunion ne transite par ce serveur.
#
# 1. Copier le dossier « navigateur/ » (avec « modeles/ » si sourceModeles: "local") dans /srv/compte-rendu
# 2. Adapter server_name et les certificats, puis recharger nginx.

server {
    listen 443 ssl http2;
    server_name compte-rendu.intranet.exemple.gouv.fr;

    ssl_certificate     /etc/ssl/certs/compte-rendu.pem;
    ssl_certificate_key /etc/ssl/private/compte-rendu.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/compte-rendu;
    index index.html;

    # Journaux : pas de journal d'accès nominatif nécessaire (aucune donnée métier ne passe par ici)
    access_log off;

    # --- En-têtes de sécurité (complètent la CSP déclarée dans index.html)
    # Mode « tout interne » (sourceModeles: "local", seule IA autorisée : Ollama sur le poste).
    # Ajouter https://api.mistral.ai à connect-src si l'IA Mistral est autorisée dans config.js.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self' blob:; connect-src 'self' blob: data: http://localhost:11434 http://127.0.0.1:11434; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Isolation : protège la page et active le calcul multi-cœurs (transcription nettement plus rapide)
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Types MIME nécessaires
    types {
        text/html html;
        text/css css;
        application/javascript js mjs;
        application/wasm wasm;
        application/json json;
        text/plain txt;
        font/woff2 woff2;
        font/woff woff;
        font/ttf ttf;
        image/svg+xml svg;
        image/png png;
        image/x-icon ico;
        application/octet-stream onnx onnx_data;
    }

    # Les modèles et bibliothèques ne changent pas : mise en cache longue
    location ~* \.(onnx|onnx_data|wasm|ttf|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        try_files $uri =404;
    }

    location ~ /(outils|deploiement)/ { deny all; }

    location / {
        try_files $uri $uri/ =404;
    }
}
