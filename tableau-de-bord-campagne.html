<!DOCTYPE html>
<html lang="fr" data-fr-scheme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tableau de bord — campagne reliquats</title>

<!-- Système de Design de l'État (DSFR) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.12.1/dist/dsfr.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.12.1/dist/utility/icons/icons.min.css">

<!-- API du widget Grist -->
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

<style>
  :root {
    --bf: var(--blue-france-sun-113-625, #000091); --bf-clair: #e3e3fd; --bf-975: #f5f5fe; --rm: #e1000f;
    --titre: #161616; --texte: #3a3a3a; --mention: #666; --bord: #ddd; --alt: #f6f6f6;
    --c-rdv: #18753c; --c-inj: #b34000; --c-refus: #ce0500; --c-faux: #7b7b7b; --c-appeler: #0063cb;
    --c-prel: #18753c; --c-nonprel: #ce0500;
    --c-conf: #18753c; --c-res: #c3992a; --c-nc: #ce0500;
  }
  body { background: #fff; }
  .mast { padding: 1.25rem 0 1rem; border-bottom: 1px solid var(--bord); }
  .mention { color: var(--mention); }

  /* Filtres */
  .filtres { background: var(--alt); padding: .75rem 1rem .25rem; margin: 1rem 0; border-left: 4px solid var(--bf); }
  .filtres .fr-select-group { margin-bottom: .75rem; }
  .filtres .fr-label { font-size: .8rem; }
  .filtres .actif { color: var(--bf); font-weight: 700; font-size: .85rem; }

  /* Onglets */
  .onglets { display: flex; gap: 4px; border-bottom: 2px solid var(--bf); margin: 1.25rem 0 1.5rem; flex-wrap: wrap; }
  .onglet { border: 0; background: var(--bf-975); color: var(--titre); padding: .7rem 1.25rem; font-weight: 700; cursor: pointer; display: inline-flex; gap: .5rem; align-items: center; }
  .onglet:hover { background: var(--bf-clair); }
  .onglet[aria-selected="true"], .onglet[aria-selected="true"]:hover { background: var(--bf); color: #fff; }

  /* Encarts */
  .encart { border: 1px solid var(--bord); padding: 1rem 1.25rem 1.25rem; margin-bottom: 1.5rem; background: #fff; }
  .encart > h3 { font-size: 1.1rem; margin: 0 0 .25rem; display: flex; gap: .5rem; align-items: center; color: var(--bf); }
  .encart > .sous { font-size: .8rem; color: var(--mention); margin: 0 0 1rem; }

  /* Cartes de données */
  .cartes { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: .75rem; margin-bottom: 1.5rem; }
  .carte { text-align: left; border: 1px solid var(--bord); border-top: 4px solid var(--bf); background: #fff; padding: .75rem .9rem; cursor: pointer; font: inherit; color: inherit; transition: box-shadow .15s, transform .15s; }
  .carte:hover, .carte:focus-visible { box-shadow: 0 4px 12px rgba(0,0,18,.16); transform: translateY(-1px); }
  .carte[disabled] { cursor: default; }
  .carte .val { font-size: 2rem; font-weight: 700; color: var(--titre); line-height: 1.15; display: block; font-variant-numeric: tabular-nums; }
  .carte .lib { font-size: .85rem; color: var(--titre); display: block; font-weight: 500; }
  .carte .det { font-size: .75rem; color: var(--mention); display: block; margin-top: .15rem; }
  .carte .voir { font-size: .72rem; color: var(--bf); display: block; margin-top: .35rem; }

  /* Graphiques */
  .grille2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 1.5rem; }
  .donut-zone { display: flex; gap: 1.25rem; align-items: center; flex-wrap: wrap; }
  .donut-zone svg { flex: 0 0 auto; }
  .donut-zone path, .barres .seg, .colonnes rect.c { cursor: pointer; }
  .donut-zone path:hover, .barres .seg:hover, .colonnes rect.c:hover { opacity: .8; }
  .legende { list-style: none; padding: 0; margin: 0; font-size: .85rem; }
  .legende li { display: flex; align-items: center; gap: .5rem; padding: .2rem 0; cursor: pointer; }
  .legende li:hover { text-decoration: underline; }
  .legende i { width: 12px; height: 12px; border-radius: 2px; display: inline-block; flex: 0 0 auto; }
  .legende b { margin-left: auto; padding-left: 1rem; font-variant-numeric: tabular-nums; }
  .barres { display: flex; flex-direction: column; gap: .45rem; font-size: .85rem; }
  .barre-l { display: grid; grid-template-columns: minmax(90px, 32%) 1fr 70px; gap: .6rem; align-items: center; }
  .barre-l .nom { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--titre); cursor: pointer; }
  .barre-l .nom:hover { text-decoration: underline; color: var(--bf); }
  .piste { display: flex; height: 16px; background: var(--alt); border-radius: 3px; overflow: hidden; }
  .seg { height: 100%; }
  .barre-l .n { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
  .entonnoir .barre-l { grid-template-columns: minmax(150px, 34%) 1fr 110px; }
  .colonnes { width: 100%; overflow-x: auto; }
  .colonnes text { font-size: 10px; fill: var(--mention); }
  .vide { color: var(--mention); font-style: italic; }

  /* Textes d'analyse */
  .constats { list-style: none; margin: 0; padding: 0; }
  .constats li { padding: .5rem .75rem .5rem 2.2rem; position: relative; border-bottom: 1px solid var(--alt); font-size: .9rem; }
  .constats li::before { position: absolute; left: .6rem; top: .45rem; font-size: 1rem; }
  .constats li.ok::before { content: "✅"; } .constats li.att::before { content: "⚠️"; } .constats li.info::before { content: "ℹ️"; } .constats li.alerte::before { content: "🔴"; }

  /* Tableaux */
  .tab-wrap { overflow-x: auto; }
  table.tb { width: 100%; border-collapse: collapse; font-size: .85rem; }
  .tb th { background: #eee; color: var(--titre); text-align: left; padding: .55rem .6rem; border-bottom: 2px solid var(--texte); white-space: nowrap; }
  .tb td { padding: .5rem .6rem; border-bottom: 1px solid var(--bord); vertical-align: top; }
  .tb tr:nth-child(even) td { background: var(--alt); }
  .tb .num { text-align: right; font-variant-numeric: tabular-nums; }
  .tb tfoot td { font-weight: 700; border-top: 2px solid var(--texte); background: #fff !important; }
  .lien { color: var(--bf); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; background: none; border: 0; padding: 0; font: inherit; }
  .lien.zero { color: var(--mention); text-decoration: none; cursor: default; }
  .pct { font-size: .75rem; color: var(--mention); margin-left: .25rem; }
  .badge { display: inline-block; font-size: .7rem; font-weight: 700; text-transform: uppercase; padding: 0 .45rem; line-height: 1.4rem; border-radius: 4px; white-space: nowrap; }
  .chip { display: inline-block; background: var(--bf-975); color: var(--bf); border-radius: 99px; padding: 0 .5rem; font-size: .75rem; margin: 1px 2px 1px 0; }

  /* Fenêtre de détail */
  .voile { position: fixed; inset: 0; background: rgba(22,22,22,.6); z-index: 1000; display: flex; align-items: flex-start; justify-content: center; padding: 3vh 12px; overflow-y: auto; }
  .fenetre { background: #fff; width: min(1100px, 100%); padding: 0 1.5rem 1.5rem; box-shadow: 0 6px 24px rgba(0,0,18,.3); }
  .fenetre-tete { position: sticky; top: 0; background: #fff; display: flex; gap: 1rem; align-items: center; padding: 1rem 0 .75rem; border-bottom: 1px solid var(--bord); z-index: 1; flex-wrap: wrap; }
  .fenetre-tete h2 { font-size: 1.25rem; margin: 0; flex: 1 1 300px; }
  .fenetre-tete .fr-input { max-width: 260px; }
  @media (max-width: 700px) {
    .fenetre { padding: 0 .75rem 1rem; }
    .barre-l { grid-template-columns: 38% 1fr 54px; }
    .carte .val { font-size: 1.6rem; }
  }
</style>
</head>
<body>

<div class="fr-container fr-py-3w">

  <div class="mast">
    <div class="fr-grid-row fr-grid-row--gutters fr-grid-row--middle">
      <div class="fr-col-12 fr-col-md-8">
        <p class="fr-badge fr-badge--sm fr-badge--info fr-mb-2w">Campagne reliquats azotés 2026</p>
        <h1 class="fr-h3 fr-mb-1v">Tableau de bord de la campagne</h1>
        <p class="fr-text--sm fr-mb-0 mention">Prélèvements et inspections FranceAgriMer — DRAAF Bretagne</p>
      </div>
      <div class="fr-col-12 fr-col-md-4" style="text-align:right">
        <p class="fr-text--sm fr-mb-1w mention" id="maj">Connexion à Grist…</p>
        <button type="button" class="fr-btn fr-btn--secondary fr-btn--sm fr-btn--icon-left fr-icon-refresh-line" id="rafraichir">Rafraîchir</button>
      </div>
    </div>
  </div>

  <div class="filtres">
    <div class="fr-grid-row fr-grid-row--gutters">
      <div class="fr-col-12 fr-col-sm-6 fr-col-md-3"><div class="fr-select-group"><label class="fr-label" for="fDpt">Département</label><select class="fr-select" id="fDpt"></select></div></div>
      <div class="fr-col-12 fr-col-sm-6 fr-col-md-3"><div class="fr-select-group"><label class="fr-label" for="fOrg">Organisme préleveur</label><select class="fr-select" id="fOrg"></select></div></div>
      <div class="fr-col-12 fr-col-sm-6 fr-col-md-3"><div class="fr-select-group"><label class="fr-label" for="fPrel">Préleveur</label><select class="fr-select" id="fPrel"></select></div></div>
      <div class="fr-col-12 fr-col-sm-6 fr-col-md-3"><div class="fr-select-group"><label class="fr-label" for="fInsp">Inspecteur FranceAgriMer</label><select class="fr-select" id="fInsp"></select></div></div>
    </div>
    <p class="fr-mb-1w" style="display:flex;gap:1rem;align-items:center;flex-wrap:wrap"><span class="actif" id="filtresActifs"></span>
      <button type="button" class="fr-btn fr-btn--sm fr-btn--tertiary-no-outline fr-icon-close-line fr-btn--icon-left" id="raz">Effacer les filtres</button></p>
  </div>

  <div class="onglets" role="tablist">
    <button class="onglet" role="tab" aria-selected="true" data-onglet="prel"><span class="fr-icon-user-line" aria-hidden="true"></span>Campagne préleveurs</button>
    <button class="onglet" role="tab" aria-selected="false" data-onglet="insp"><span class="fr-icon-shield-line" aria-hidden="true"></span>Campagne inspecteurs</button>
  </div>

  <div id="avis"></div>
  <div id="vue"><p class="mention">Chargement des données…</p></div>

  <p class="fr-text--xs fr-mt-4w mention" id="pied"></p>
</div>
<div id="fenetre"></div>

<script>
(function () {
'use strict';

/* ============================================================
   PARAMÈTRES : tables et colonnes du document
   ============================================================ */
const T = {
  rel: 'DATA_RELIQUATCLEAN',            // parcelles à prélever issues des dossiers DN (= dossiers reçus)
  def: 'DATA_Parcelles_DEF',            // parcelles (CLE, nom, commune, coordonnées)
  rdv: 'RDV_Prelevements',              // appels et rendez-vous
  prel: 'DATA_Preleveur',
  insp: 'DATA_Inspecteur',
  suite: 'Suites_RDV',                  // prélèvement fait / non prélevable
  res: 'DATA_Resultat_controle',        // résultats des contrôles de préleveurs
  ctl: 'DATA_Controle_Stockage',        // contrôles inopinés des lieux de stockage
  stock: 'DATA_Stockage'
};
const DPT = {'022': 'Côtes-d’Armor', '029': 'Finistère', '035': 'Ille-et-Vilaine', '056': 'Morbihan'};
const ETATS = [   // statut d'une exploitation (le plus avancé de ses rendez-vous)
  {k: 'rdv', lib: 'Rendez-vous pris', c: 'var(--c-rdv)', hex: '#18753c'},
  {k: 'inj', lib: 'Injoignable', c: 'var(--c-inj)', hex: '#b34000'},
  {k: 'refus', lib: 'Refus', c: 'var(--c-refus)', hex: '#ce0500'},
  {k: 'faux', lib: 'Faux numéro', c: 'var(--c-faux)', hex: '#7b7b7b'},
  {k: 'appeler', lib: 'À appeler', c: 'var(--c-appeler)', hex: '#0063cb'}
];
const RESULTATS = [{k: 'Conforme', hex: '#18753c'}, {k: 'Avec réserves', hex: '#c3992a'}, {k: 'Non conforme', hex: '#ce0500'}, {k: '', lib: 'Non renseigné', hex: '#929292'}];
const PALETTE = ['#000091', '#18753c', '#b34000', '#6a6af4', '#009081', '#a558a0', '#c3992a', '#ce614a', '#7d4e5b', '#417dc4'];

/* ============================================================
   OUTILS
   ============================================================ */
const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const isErr = v => Array.isArray(v) && v[0] === 'E';
const clean = v => (v === null || v === undefined || isErr(v)) ? '' : String(v).trim();
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const fmt = n => (n ?? 0).toLocaleString('fr-FR');
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const pacNorm = v => { const s = clean(v).replace(/\s+/g, '').replace(/\.0+$/, ''); return /^\d{1,9}$/.test(s) ? s.padStart(9, '0') : s; };
const keyNorm = s => String(s || '').trim().replace(/[\s|/_.;]+/g, '-').split('-').filter(Boolean).map(p => p.replace(/^0+(?=\d)/, '')).join('-').toLowerCase();
const dptLib = d => d ? (DPT[d] ? d + ' · ' + DPT[d] : d) : 'Non renseigné';
const dateFr = sec => sec ? new Date(sec * 1000).toLocaleDateString('fr-FR', {timeZone: 'Europe/Paris'}) : '';
const dateHeure = sec => sec ? new Date(sec * 1000).toLocaleString('fr-FR', {timeZone: 'Europe/Paris', dateStyle: 'short', timeStyle: 'short'}) : '';
const jourKey = sec => new Intl.DateTimeFormat('en-CA', {timeZone: 'Europe/Paris', year: 'numeric', month: '2-digit', day: '2-digit'}).format(new Date(sec * 1000));
const personne = p => p ? [clean(p.Prenom), clean(p.Nom)].filter(Boolean).join(' ') || clean(p.Nom_complet) : '';
function rows(col) { if (!col || !col.id) return []; const ks = Object.keys(col); return col.id.map((_, i) => { const r = {}; ks.forEach(k => { r[k] = col[k][i]; }); return r; }); }
const ouiNon = v => { if (v === true) return 'oui'; if (v === false) return 'non'; const n = norm(v).trim(); if (!n) return ''; if (/^(oui|o|x|1|true|fait|preleve|realise)/.test(n)) return 'oui'; if (/^(non|n|0|false|pas|impossible|non preleve)/.test(n)) return 'non'; return ''; };

/* ============================================================
   DONNÉES
   ============================================================ */
const D = {tables: {}, farms: new Map(), rdv: [], res: [], prels: [], insps: [], ctl: [], stock: []};
const F = {dpt: '', org: '', prel: 0, insp: 0};
let onglet = 'prel';
try { onglet = localStorage.getItem('tdb-onglet') || 'prel'; } catch (e) { /* stockage indisponible */ }

async function lire(t) { try { return rows(await grist.docApi.fetchTable(t)); } catch (e) { console.warn('Table indisponible :', t, e); return null; } }

async function charger() {
  $('rafraichir').disabled = true; $('maj').textContent = 'Actualisation…';
  const noms = Object.keys(T), res = await Promise.all(noms.map(k => lire(T[k])));
  const manque = [];
  noms.forEach((k, i) => { D.tables[k] = res[i] || []; if (!res[i]) manque.push(T[k]); });
  construire();
  remplirFiltres();
  afficher();
  $('avis').innerHTML = manque.length ? `<div class="fr-alert fr-alert--warning fr-alert--sm fr-mb-3w"><p>Tables illisibles ou absentes : ${manque.map(esc).join(', ')}. Les indicateurs correspondants sont à zéro (vérifiez le nom des tables et l'accès complet du widget).</p></div>` : '';
  $('maj').textContent = 'Mis à jour à ' + new Date().toLocaleTimeString('fr-FR', {hour: '2-digit', minute: '2-digit'});
  $('rafraichir').disabled = false;
}

function construire() {
  const t = D.tables, defById = new Map(t.def.map(r => [r.id, r]));
  D.prels = t.prel; D.insps = t.insp;
  const prelById = D.prelById = new Map(t.prel.map(p => [p.id, p])), inspById = D.inspById = new Map(t.insp.map(p => [p.id, p]));
  const farms = D.farms = new Map();
  const farm = (pac, nom) => {
    let f = farms.get(pac);
    if (!f) farms.set(pac, f = {pac, nom: '', dpt: pac.slice(0, 3), recu: false, parcels: new Map(), rdvs: [], nonPrel: [], preleves: new Set(), results: [], prelIds: new Set(), orgs: new Set(), commune: '', tel: ''});
    if (!f.nom && nom) f.nom = nom;
    return f;
  };
  // dossiers reçus : parcelles à prélever (une exploitation = un PACAGE)
  for (const r of t.rel) {
    const key = clean(r.CLELAB), pac = pacNorm(r.PACAGE || key.split('-')[0]); if (!pac) continue;
    const f = farm(pac, clean(r.Nom_exploitation) || clean(r.Raison_sociale)); f.recu = true;
    if (key) f.parcels.set(keyNorm(key), key);
    if (!f.commune) f.commune = clean(r.Ville); if (!f.tel) f.tel = clean(r.Telephone_portable);
  }
  // rendez-vous et appels
  D.rdv = [];
  for (const r of t.rdv) {
    const d = typeof r.Cle_parcelle === 'number' ? defById.get(r.Cle_parcelle) : null;
    const key = d ? clean(d.CLE) || clean(d.Cle2_2) : clean(r.Cle_parcelle);
    const pac = pacNorm((d && d.PACAGE) || r.PACAGETEXTE || key.split('-')[0]); if (!pac) continue;
    const f = farm(pac, clean(d && d.Nom) || clean(r.Raison_sociale) || clean(r.Nom_exploitation));
    if (key && !f.parcels.has(keyNorm(key))) f.parcels.set(keyNorm(key), key);
    if (!f.commune) f.commune = clean(d && d.Commune);
    const p = prelById.get(r.Preleveur), org = clean(p && p.Organisme) || clean(r.Organisme);
    const x = {id: r.id, farm: f, key, statut: clean(r.Statut), date: typeof r.Date_RDV === 'number' ? r.Date_RDV : null, prel: r.Preleveur || 0, org,
      insp: r.Inspecteur || 0, appels: ['Date_heure_appel_1', 'Date_heure_appel_2', 'Date_heure_appel_3'].filter(c => typeof r[c] === 'number').length};
    f.rdvs.push(x); D.rdv.push(x);
    if (x.prel) f.prelIds.add(x.prel); if (org) f.orgs.add(org);
  }
  // suites des rendez-vous : prélevé / non prélevable
  for (const r of t.suite) {
    const key = clean(r.CLE_pacage_ilot_parcelle_); if (!key) continue;
    const pac = pacNorm(key.split(/[-|]/)[0]), f = farm(pac), k = keyNorm(key), on = ouiNon(r.Prelevement_fait);
    if (on === 'non') f.nonPrel.push({key, raison: clean(r.raison_de_non_prelevement) || clean(r.Raison) || ''});
    else if (on === 'oui') f.preleves.add(k);
  }
  // résultats des contrôles de préleveurs
  D.res = t.res.map(r => {
    const pac = pacNorm(r.PACAGE), p = prelById.get(r.Preleveur);
    const x = {id: r.id, pac, dpt: clean(r.Code_dpt) || pac.slice(0, 3), date: typeof r.Date_controle === 'number' ? r.Date_controle : null, insp: r.Inspecteur || 0, prel: r.Preleveur || 0,
      org: clean(p && p.Organisme) || clean(r.Laboratoire), lab: clean(r.Laboratoire), res: clean(r.Resultat), com: clean(r.Commentaire), expl: clean(r.Exploitation), parcelles: clean(r.Parcelles)};
    if (pac) { const f = farm(pac, x.expl); f.results.push(x); }
    return x;
  });
  // statut de chaque exploitation
  for (const f of farms.values()) {
    const s = f.rdvs.map(x => x.statut);
    f.etat = f.rdvs.some(x => x.statut === 'Rdv pris' || x.date) ? 'rdv' : s.includes('Injoignable') ? 'inj' : s.includes('Refus') ? 'refus' : s.includes('Faux numéro') ? 'faux' : 'appeler';
    f.appels = f.rdvs.reduce((m, x) => Math.max(m, x.appels), 0);
    f.prochain = f.rdvs.map(x => x.date).filter(Boolean).sort((a, b) => a - b);
    if (!f.nom) f.nom = 'PACAGE ' + f.pac;
  }
  D.ctl = t.ctl; D.stock = t.stock;
}

/* ---------- Filtres ---------- */
function remplirFiltres() {
  const dpts = [...new Set([...D.farms.values()].map(f => f.dpt).filter(Boolean))].sort();
  const orgs = [...new Set(D.prels.map(p => clean(p.Organisme)).concat(D.rdv.map(x => x.org)).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'fr'));
  const prels = D.prels.filter(p => !F.org || clean(p.Organisme) === F.org).map(p => [p.id, personne(p) + (clean(p.Organisme) ? ' — ' + clean(p.Organisme) : '')]).sort((a, b) => a[1].localeCompare(b[1], 'fr'));
  const insps = D.insps.map(p => [p.id, personne(p)]).sort((a, b) => a[1].localeCompare(b[1], 'fr'));
  const opts = (sel, list, cur, tous) => { $(sel).innerHTML = `<option value="">${tous}</option>` + list.map(([v, l]) => `<option value="${esc(v)}"${String(v) === String(cur) ? ' selected' : ''}>${esc(l)}</option>`).join(''); };
  opts('fDpt', dpts.map(d => [d, dptLib(d)]), F.dpt, 'Tous les départements');
  opts('fOrg', orgs.map(o => [o, o]), F.org, 'Tous les organismes');
  if (F.prel && !prels.some(p => p[0] === F.prel)) F.prel = 0;
  opts('fPrel', prels, F.prel, 'Tous les préleveurs');
  opts('fInsp', insps, F.insp, 'Tous les inspecteurs');
  const a = [F.dpt && dptLib(F.dpt), F.org, F.prel && personne(D.prelById.get(F.prel)), F.insp && 'Inspecteur : ' + personne(D.inspById.get(F.insp))].filter(Boolean);
  $('filtresActifs').textContent = a.length ? 'Filtres : ' + a.join(' · ') : 'Aucun filtre : toute la campagne';
  $('raz').hidden = !a.length;
}

function carte(val, lib, det, drill, couleur) {
  return `<button type="button" class="carte" ${drill ? `data-drill="${esc(drill)}"` : 'disabled'} style="${couleur ? 'border-top-color:' + couleur : ''}">
    <span class="val">${val}</span><span class="lib">${esc(lib)}</span>${det ? `<span class="det">${det}</span>` : ''}${drill ? '<span class="voir">Voir le détail ›</span>' : ''}</button>`;
}
function donut(parts, total, centre, sous) {
  const R = 70, r = 44, cx = 85, cy = 85; let a0 = -Math.PI / 2, paths = '';
  const tot = parts.reduce((s, p) => s + p.n, 0);
  if (!tot) return `<p class="vide">Aucune donnée.</p>`;
  parts.forEach(p => {
    if (!p.n) return;
    const a1 = a0 + p.n / tot * Math.PI * 2 - (p.n === tot ? 1e-4 : 0), big = a1 - a0 > Math.PI ? 1 : 0;
    const P = (a, rad) => [cx + rad * Math.cos(a), cy + rad * Math.sin(a)].map(v => v.toFixed(2)).join(' ');
    paths += `<path d="M ${P(a0, R)} A ${R} ${R} 0 ${big} 1 ${P(a1, R)} L ${P(a1, r)} A ${r} ${r} 0 ${big} 0 ${P(a0, r)} Z" fill="${p.hex}" data-drill="${esc(p.drill || '')}"><title>${esc(p.lib)} : ${fmt(p.n)} (${pct(p.n, tot)} %)</title></path>`;
    a0 = a1;
  });
  return `<div class="donut-zone"><svg width="170" height="170" viewBox="0 0 170 170" role="img" aria-label="${esc(sous)}">${paths}
    <text x="85" y="82" text-anchor="middle" style="font-size:26px;font-weight:700;fill:#161616">${esc(centre)}</text><text x="85" y="102" text-anchor="middle" style="font-size:11px;fill:#666">${esc(sous)}</text></svg>
    <ul class="legende">${parts.map(p => `<li data-drill="${esc(p.drill || '')}"><i style="background:${p.hex}"></i>${esc(p.lib)}<b>${fmt(p.n)} <span class="pct">${pct(p.n, tot)} %</span></b></li>`).join('')}</ul></div>`;
}
// barres horizontales, éventuellement empilées : lignes [{nom, drillNom, segs:[{n, hex, lib, drill}], total}]
function barres(lignes, opts = {}) {
  if (!lignes.length) return `<p class="vide">Aucune donnée.</p>`;
  const max = opts.max || Math.max(1, ...lignes.map(l => l.total ?? l.segs.reduce((s, x) => s + x.n, 0)));
  return `<div class="barres ${opts.cls || ''}">${lignes.map(l => { const tot = l.total ?? l.segs.reduce((s, x) => s + x.n, 0);
    return `<div class="barre-l"><span class="nom" ${l.drill ? `data-drill="${esc(l.drill)}"` : ''} title="${esc(l.nom)}">${esc(l.nom)}</span>
      <span class="piste">${l.segs.map(s => s.n ? `<span class="seg" style="width:${s.n / max * 100}%;background:${s.hex}" ${s.drill ? `data-drill="${esc(s.drill)}"` : ''} title="${esc(s.lib)} : ${fmt(s.n)}"></span>` : '').join('')}</span>
      <span class="n">${l.etiquette ?? fmt(tot)}</span></div>`; }).join('')}</div>`;

// histogramme en colonnes (rendez-vous par semaine)
function colonnes(items, hex) {

  const W = Math.max(520, items.length * 34), H = 190, b = 26, max = Math.max(1, ...items.map(i => i.n)), w = Math.min(64, (W - 20) / items.length);

    ${items.map((it, i) => { const h = (H - b - 18) * it.n / max, x = 10 + i * w, y = H - b - h;
      return `<rect class="c" x="${(x + 3).toFixed(1)}" y="${y.toFixed(1)}" width="${(w - 6).toFixed(1)}" height="${h.toFixed(1)}" fill="${it.hex || hex}" data-drill="${esc(it.drill)}"><title>${esc(it.titre)} : ${fmt(it.n)}</title></rect>
        <text x="${(x + w / 2).toFixed(1)}" y="${(y - 4).toFixed(1)}" text-anchor="middle" style="font-weight:700;fill:#161616">${it.n || ''}</text>
        <text x="${(x + w / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle">${esc(it.lib)}</text>`; }).join('')}</svg></div>`;

function detail(code) {
  const [quoi, dpt] = code.split('|'), [type, ...reste] = quoi.split(':'), arg = reste.join(':');

  if (type === 'etat') { const ks = arg.split('+'); return listeFarms(ks.map(k => ETATS.find(e => e.k === k).lib).join(' / ') + suf, farms.filter(f => ks.includes(f.etat))); }

  if (type === 'org') return listeFarms('Exploitations — ' + arg + suf, [...D.farms.values()].filter(f => f.rdvs.some(x => x.date && (x.org || 'Organisme non renseigné') === arg) && (!F.dpt || f.dpt === F.dpt)));

// Fenêtre de détail : tableau filtrable et export CSV
function fenetre(titre, items, cols, unite) {

    <div class="fenetre-tete"><h2>${esc(titre)} <span class="mention fr-text--sm">(${fmt(items.length)} ${esc(unite)})</span></h2>
      <input class="fr-input" type="search" id="fq" placeholder="Rechercher…" aria-label="Rechercher dans la liste">
      <button type="button" class="fr-btn fr-btn--sm fr-btn--secondary fr-icon-download-line fr-btn--icon-left" id="fcsv">CSV</button>

    <div class="tab-wrap fr-mt-2w"><table class="tb"><thead><tr>${cols.map(c => `<th>${esc(c[0])}</th>`).join('')}</tr></thead><tbody id="fcorps"></tbody></table></div></div></div>`;
  const dessiner = () => { const q = norm($('fq').value.trim());
    const l = items.filter(it => !q || norm(cols.map(c => c[2] ? c[2](it) : '').join(' ')).includes(q));
    $('fcorps').innerHTML = l.length ? l.map(it => `<tr>${cols.map(c => `<td>${c[1](it)}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${cols.length}" class="vide">Aucun élément.</td></tr>`; };

  const fermer = () => { $('fenetre').innerHTML = ''; };
  $('ffermer').onclick = fermer; $('voile').onclick = e => { if (e.target.id === 'voile') fermer(); };
  $('fcsv').onclick = () => {
    const csv = '﻿' + [cols.map(c => c[0])].concat(items.map(it => cols.map(c => c[2] ? c[2](it) : ''))).map(l => l.map(x => '"' + String(x ?? '').replace(/"/g, '""') + '"').join(';')).join('\r\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv;charset=utf-8'})); a.download = titre.replace(/[^\wÀ-ÿ -]+/g, '').trim().replace(/\s+/g, '-').toLowerCase() + '.csv';
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  };
  $('fq').focus();
}

/* ============================================================
   AFFICHAGE ET ÉVÉNEMENTS
   ============================================================ */
function afficher() {
  document.querySelectorAll('.onglet').forEach(b => b.setAttribute('aria-selected', String(b.dataset.onglet === onglet)));
  $('fInsp').closest('.fr-col-12').hidden = onglet !== 'insp';
  $('vue').innerHTML = onglet === 'insp' ? vueInspecteurs() : vuePreleveurs();
  $('pied').textContent = `Sources : ${T.rel} (dossiers reçus), ${T.rdv} (appels et rendez-vous), ${T.suite} (prélevé / non prélevable), ${T.res} (contrôles de préleveurs), ${T.ctl}. `
    + 'Une exploitation = un n° PACAGE ; elle n’est comptée qu’une fois quel que soit son nombre de parcelles.';
}
document.addEventListener('click', e => {
  const d = e.target.closest('[data-drill]');
  if (d && d.dataset.drill && !$('fenetre').contains(d)) { detail(d.dataset.drill); return; }
  const o = e.target.closest('.onglet');
  if (o) { onglet = o.dataset.onglet; try { localStorage.setItem('tdb-onglet', onglet); } catch (err) { /* stockage indisponible */ } afficher(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('fenetre').innerHTML = ''; });
$('fDpt').onchange = e => { F.dpt = e.target.value; remplirFiltres(); afficher(); };
$('fOrg').onchange = e => { F.org = e.target.value; remplirFiltres(); afficher(); };
$('fPrel').onchange = e => { F.prel = Number(e.target.value) || 0; remplirFiltres(); afficher(); };
$('fInsp').onchange = e => { F.insp = Number(e.target.value) || 0; remplirFiltres(); afficher(); };
$('raz').onclick = () => { F.dpt = ''; F.org = ''; F.prel = 0; F.insp = 0; remplirFiltres(); afficher(); };
$('rafraichir').onclick = () => charger().catch(err => console.error(err));

if (window.grist) {
  grist.ready({requiredAccess: 'full'});
  let t; grist.onRecords(() => { clearTimeout(t); t = setTimeout(() => charger().catch(err => console.error(err)), 500); });
  charger().catch(err => { console.error(err); $('avis').innerHTML = `<div class="fr-alert fr-alert--error fr-alert--sm"><p>Impossible de charger les données : ${esc(err.message || err)}. Réglez l'accès du widget sur « Accès complet au document ».</p></div>`; });
} else {
  $('avis').innerHTML = '<div class="fr-alert fr-alert--info fr-alert--sm"><p>Ouvrez cette page comme widget personnalisé dans Grist (accès complet au document) pour afficher les données.</p></div>';
  $('vue').innerHTML = ''; $('maj').textContent = 'API Grist non détectée';
}
})();
</script>
