  if (code === 'CC' && doc.Statut === 'Confirmée') { A('cancel', 'Annuler la commande', {cls: 'danger', tip: 'Annule la commande (aucun mouvement de stock)'}); A('deliver', 'Livrer', {cls: 'pri', ic: 'send', key: 'v', tip: 'Sortie des marchandises du stock, au coût moyen pondéré'}); }
  if (code === 'CC' && doc.Statut === 'Livrée') A('invoice', 'Facturer', {cls: 'pri', ic: 'euro', key: 'v', tip: 'Crée la facture client et passe les écritures comptables'});
  if (code === 'CF' && doc.Statut === 'Confirmée') { A('cancel', 'Annuler la commande', {cls: 'danger', tip: 'Annule la commande d\'achat'}); A('receive', 'Réceptionner', {cls: 'pri', ic: 'download', key: 'v', tip: 'Entrée des marchandises en stock, au prix de la commande'}); }
  if (code === 'CF' && doc.Statut === 'Réceptionnée') A('invoice', 'Saisir la facture', {cls: 'pri', ic: 'euro', key: 'v', tip: 'Enregistre la facture fournisseur et passe les écritures'});
  if (invoice && ['Comptabilisée', 'Partiellement réglée'].includes(doc.Statut)) A('pay', sale ? 'Enregistrer un encaissement' : 'Enregistrer un paiement', {cls: 'pri', ic: 'euro', key: 'v', tip: 'Règlement total ou partiel de la facture'});
  A('copy', 'Dupliquer', {ic: 'copy', key: 'd', tip: 'Créer un nouveau brouillon avec le même partenaire et les mêmes postes'});
  if (code !== 'FF') A('print', 'Imprimer', {ic: 'print', key: 'p', tip: 'Imprimer ou enregistrer en PDF'});
  const chain = [];
  let up = docByNumero(doc.Origine);
  while (up && chain.length < 6) { chain.unshift(up); up = docByNumero(up.Origine); }
  chain.push(doc);
  const down = d => DB.ERP_Documents.filter(x => x.Origine === d.Numero);
  let frontier = down(doc);
  while (frontier.length && chain.length < 10) { chain.push(...frontier); frontier = frontier.flatMap(down); }
  const entries = DB.ERP_Ecritures.filter(e => e.Document === doc.id), moves = DB.ERP_Mouvements.filter(m => m.Document === doc.id);
  main.innerHTML = page({
    title: `${esc(T.label)} <span class="mono">${esc(doc.Numero)}</span>`, crumb: crumb(`<a data-tc="${T.list}">${esc(T.plural)}</a>`, esc(doc.Numero)),
    sub: `${badge(doc.Statut)} <span class="muted">Document validé : il n'est plus modifiable. Utilisez « Dupliquer » pour repartir de son contenu.</span>`, actions: acts.join(''),
    body: `
      <div class="card"><div class="card-b"><div class="dl">
        <div><div class="k">${sale ? 'Client' : 'Fournisseur'}</div><div class="v">${partnerLink(doc.Partenaire)}</div></div>
        <div><div class="k">Date</div><div class="v">${fmtDate(doc.Date)}</div></div>
        <div><div class="k">${code === 'DV' ? 'Valable jusqu\'au' : invoice ? 'Échéance' : 'Livraison prévue'}</div><div class="v ${invoice && remaining(doc) > 0 && doc.Echeance && doc.Echeance < todayS() ? 'neg' : ''}">${fmtDate(doc.Echeance) || '—'}</div></div>
        <div><div class="k">${code === 'FF' ? 'N° facture fournisseur' : 'Référence'}</div><div class="v">${esc(doc.Reference) || '<span class="muted">—</span>'}</div></div>
        <div><div class="k">Total TTC</div><div class="v"><b>${fmtMoney(doc.Total_TTC)}</b></div></div>
        ${invoice ? `<div><div class="k">Reste dû ${hint('Total TTC − montants déjà réglés')}</div><div class="v"><b class="${remaining(doc) > 0 ? 'neg' : 'pos'}">${fmtMoney(remaining(doc))}</b></div></div>` : ''}
      </div>${doc.Notes ? `<p class="callout" style="margin:16px 0 0">${esc(doc.Notes)}</p>` : ''}</div></div>
      <div class="grid-3">
        <div class="card"><div class="card-h"><h2>Postes</h2></div><div class="table-wrap"><table class="grid">
          <thead><tr><th>Pos.</th><th>Article</th><th>Désignation</th><th class="r">Qté</th><th class="r">Prix unit.</th><th class="r">Remise</th><th class="r">TVA</th><th class="r">Montant HT</th></tr></thead>
          <tbody>${lines.map((l, i) => `<tr><td class="muted">${(i + 1) * 10}</td><td>${l.Article ? `<a data-article="${l.Article}" href="#">${esc(artCode(articleOf(l.Article)))}</a>` : ''}</td><td>${esc(l.Designation)}</td><td class="num">${fmtNum(l.Quantite, 3)} ${esc(l.Unite)}</td><td class="num">${fmtMoney(l.Prix_Unitaire)}</td><td class="num">${num(l.Remise) ? fmtPct(l.Remise) : ''}</td><td class="num">${fmtPct(l.Taux_TVA)}</td><td class="num">${fmtMoney(calcLine(l).ht)}</td></tr>`).join('')}</tbody></table></div>
          <div class="totals"><span class="muted">Total HT</span><span style="text-align:right">${fmtMoney(doc.Total_HT)}</span><span class="muted">TVA</span><span style="text-align:right">${fmtMoney(doc.Total_TVA)}</span><span class="big">Total TTC</span><span class="big" style="text-align:right">${fmtMoney(doc.Total_TTC)}</span>
          ${invoice ? `<span class="muted">Déjà réglé</span><span style="text-align:right">${fmtMoney(doc.Montant_Regle)}</span>` : ''}</div></div>
        <div class="card"><div class="card-h"><h2>Flux de documents ${hint('Chaîne des documents liés : d\'où vient ce document et ce qui en a été généré. Cliquez pour naviguer.')}</h2></div><div class="card-b">
          ${chain.map(d => `<div class="flow-item ${d.id === doc.id ? 'cur' : ''}"><span class="dot"></span><div class="lbl">${d.id === doc.id ? `<b class="mono">${esc(d.Numero)}</b>` : `<a class="mono" data-doc="${d.id}" href="#">${esc(d.Numero)}</a>`}<small>${esc(d.Type)} · ${fmtDate(d.Date)}</small></div>${badge(d.Statut)}</div>`).join('')}
        </div></div>
      </div>
      ${moves.length ? `<div class="card"><div class="card-h"><h2>Mouvements de stock</h2></div><div class="table-wrap"><table class="grid"><thead><tr><th>Date</th><th>Article</th><th>Type</th><th class="r">Quantité</th><th class="r">Coût unit.</th></tr></thead><tbody>
        ${moves.map(m => `<tr><td>${fmtDate(m.Date)}</td><td>${articleLink(m.Article)}</td><td>${esc(m.Type)}</td><td class="num">${fmtNum(m.Quantite, 3)}</td><td class="num">${fmtMoney(m.Cout_Unitaire)}</td></tr>`).join('')}</tbody></table></div></div>` : ''}
      ${entries.length ? `<div class="card"><div class="card-h"><h2>Écritures comptables</h2><a data-tc="FB03" href="#">Journal</a></div><div class="table-wrap"><table class="grid"><thead><tr><th>Date</th><th>Jnl</th><th>Compte</th><th>Libellé</th><th class="r">Débit</th><th class="r">Crédit</th></tr></thead><tbody>
        ${entries.map(e => `<tr><td>${fmtDate(e.Date)}</td><td>${esc(e.Journal)}</td><td><a data-account="${esc(e.Compte)}" class="mono" href="#" data-tip="Ouvrir le grand livre du compte">${esc(e.Compte)}</a> <span class="muted">${esc(accountLabel(e.Compte))}</span></td><td>${esc(e.Libelle)}</td><td class="num">${num(e.Debit) ? fmtMoney(e.Debit) : ''}</td><td class="num">${num(e.Credit) ? fmtMoney(e.Credit) : ''}</td></tr>`).join('')}</tbody></table></div></div>` : ''}`
  });
  const after = msg => { if (msg) toast(msg, 'ok'); go('doc', {id: doc.id}); };
  const handlers = {
    accept: async () => {
      if (!await confirmDlg('Accepter le devis', `Créer une commande client confirmée à partir du devis <b>${esc(doc.Numero)}</b> ?`)) return;
      const cc = await busy(async () => { const c = await convertDocument(doc, 'CC', {statut: 'Confirmée'}); await setStatus(doc, 'Accepté'); return c; });
      if (cc) { toast(`Commande ${cc.Numero} créée et confirmée`, 'ok'); go('doc', {id: cc.id}); }
    },
    refuse: async () => { if (await confirmDlg('Refuser le devis', 'Marquer ce devis comme refusé ?', 'Refusé')) { await busy(() => setStatus(doc, 'Refusé')); after(); } },
    cancel: async () => { if (await confirmDlg('Annuler la commande', `Annuler <b>${esc(doc.Numero)}</b> ? Cette action est définitive.`, 'Annuler la commande', 'danger')) { await busy(() => setStatus(doc, 'Annulée')); after('Commande annulée'); } },
    deliver: async () => {
      const short = stockShortages(doc);
      const v = await formDialog({title: 'Livraison (sortie de marchandises)', okLabel: 'Livrer', icon: 'send',
        intro: short.length ? `<div class="alert warning" style="margin-bottom:14px">${ic('warn')}<b class="t">Stock insuffisant</b><p>${short.map(esc).join('<br>')}</p><p>La livraison rendra le stock négatif.</p></div>` : `<div class="alert info" style="margin-bottom:14px">${ic('info')}${modOn('S') ? 'Les quantités de la commande seront sorties du stock.' : 'Module Stocks désactivé : seul le statut change.'}</div>`,
        fields: [{key: 'date', label: 'Date de livraison', type: 'date', required: true, help: 'Date des mouvements de sortie de stock.'}], values: {date: todayS()}});
      if (v) { await busy(() => deliverOrder(doc, v.date)); after('Livraison enregistrée'); }
    },
    receive: async () => {
      const v = await formDialog({title: 'Réception (entrée de marchandises)', okLabel: 'Réceptionner', icon: 'download', intro: `<div class="alert info" style="margin-bottom:14px">${ic('info')}Les quantités commandées seront entrées en stock au prix de la commande.</div>`,
        fields: [{key: 'date', label: 'Date de réception', type: 'date', required: true}], values: {date: todayS()}});

        intro: `<div class="alert info" style="margin-bottom:14px">${ic('info')}Montant : <b>${fmtMoney(doc.Total_TTC)}</b> TTC.${modOn('F') ? ` Les écritures seront générées dans le journal ${sale ? 'des ventes (VE)' : 'des achats (AC)'}.` : ''}</div>`});
      if (!v) return;
      const inv = await busy(() => invoiceOrder(doc, v.date, sale ? doc.Reference : v.ref));
      if (inv) { toast(`Facture ${inv.Numero} comptabilisée`, 'ok'); go('doc', {id: inv.id}); }
    },
    pay: async () => {
      const rest = remaining(doc);
      const v = await formDialog({title: sale ? 'Encaissement client' : 'Paiement fournisseur', okLabel: 'Enregistrer', icon: 'euro',
        intro: `<div class="alert info" style="margin-bottom:14px">${ic('info')}Reste dû : <b>${fmtMoney(rest)}</b>. Un montant inférieur enregistre un règlement partiel.</div>`,
        fields: [{key: 'amount', label: 'Montant', type: 'number', required: true}, {key: 'date', label: 'Date', type: 'date', required: true},
          {key: 'mode', label: 'Mode de règlement', type: 'select', options: payModes(), full: true, help: '« Espèces » utilise le compte de caisse, les autres modes le compte de banque.'}],
        values: {amount: rest, date: todayS(), mode: payModes()[0]},
        validate: x => x.amount <= 0 ? 'Le montant doit être positif.' : x.amount > rest + 0.005 ? 'Le montant dépasse le reste dû.' : null});
      if (v) { await busy(() => registerPayment(doc, v.amount, v.date, v.mode)); after('Règlement enregistré'); }
    },
    copy: () => go('doc', {code, id: 'new', copyFrom: doc.id}),
    print: () => printDocument(doc)
  };
  $$('[data-act]', main).forEach(b => { b.onclick = () => handlers[b.dataset.act](); });
}

      <div><h1>${esc(T.print)}</h1><div>N° <b>${esc(doc.Numero)}</b><br>Date : ${fmtDate(doc.Date)}<br>${code === 'FC' ? 'Échéance : ' + fmtDate(doc.Echeance) : code === 'DV' ? 'Valable jusqu\'au : ' + fmtDate(doc.Echeance) : 'Livraison prévue : ' + fmtDate(doc.Echeance)}${doc.Reference ? '<br>Votre réf. : ' + esc(doc.Reference) : ''}</div>
      <div class="addr" style="margin-top:12px"><b>${esc(p.Nom)}</b><br>${esc(p.Adresse)}<br>${esc(p.Code_Postal)} ${esc(p.Ville)}${p.Pays ? '<br>' + esc(p.Pays) : ''}${p.TVA_Intra ? '<br>TVA : ' + esc(p.TVA_Intra) : ''}</div></div></div>
    <table><thead><tr><th>Réf.</th><th>Désignation</th><th class="r">Qté</th><th class="r">P.U. HT</th><th class="r">Remise</th><th class="r">TVA</th><th class="r">Total HT</th></tr></thead>
    <tbody>${lines.map(l => `<tr><td>${esc(artCode(articleOf(l.Article)))}</td><td>${esc(l.Designation)}</td><td class="r">${fmtNum(l.Quantite, 3)} ${esc(l.Unite)}</td><td class="r">${fmtMoney(l.Prix_Unitaire)}</td><td class="r">${num(l.Remise) ? fmtPct(l.Remise) : ''}</td><td class="r">${fmtPct(l.Taux_TVA)}</td><td class="r">${fmtMoney(calcLine(l).ht)}</td></tr>`).join('')}</tbody></table>
    <table class="tot"><tr><td>Total HT</td><td class="r">${fmtMoney(doc.Total_HT)}</td></tr>${tvaBy.map(([r, t]) => `<tr><td>TVA ${fmtPct(r)}</td><td class="r">${fmtMoney(t)}</td></tr>`).join('')}<tr><td><b>Total TTC</b></td><td class="r"><b>${fmtMoney(doc.Total_TTC)}</b></td></tr>
    ${code === 'FC' && num(doc.Montant_Regle) ? `<tr><td>Déjà réglé</td><td class="r">${fmtMoney(doc.Montant_Regle)}</td></tr><tr><td><b>Net à payer</b></td><td class="r"><b>${fmtMoney(remaining(doc))}</b></td></tr>` : ''}</table>
    ${doc.Notes ? `<p style="margin-top:18px">${esc(doc.Notes)}</p>` : ''}
    <div class="foot">${esc(param('Societe'))} ${param('SIRET') ? '· SIRET ' + co('SIRET') : ''} ${param('TVA_Intra') ? '· TVA ' + co('TVA_Intra') : ''} ${param('IBAN') ? '· IBAN ' + co('IBAN') : ''}<br>${esc(param('Mentions', 'En cas de retard de paiement, pénalités au taux légal et indemnité forfaitaire de 40 € pour frais de recouvrement.'))}</div></div>`;
  setTimeout(() => window.print(), 50);
}

async function reorderProposal() {
  const st = stockInfo();
  const need = DB.ERP_Articles.filter(a => a.Type !== 'Service' && !a.Inactif).map(a => { const s = st.get(a.id), proj = s.qty - s.reserved + s.ordered; return {a, qty: proj < num(a.Stock_Min) ? round3(num(a.Stock_Min) * 2 - proj) : 0}; }).filter(x => x.qty > 0);
  if (!need.length) { toast('Aucun besoin : tous les stocks projetés sont au-dessus des seuils.', 'ok'); return; }
  const noSup = need.filter(x => !x.a.Fournisseur), bySup = groupBy(need.filter(x => x.a.Fournisseur), x => x.a.Fournisseur);
  const ok = await confirmDlg('Proposition de réapprovisionnement',
    `<p style="margin-top:0">Stock projeté = stock − réservé + en commande. Quantité proposée = 2 × seuil − stock projeté.</p>
     <table class="grid"><thead><tr><th>Article</th><th>Fournisseur</th><th class="r">Qté proposée</th></tr></thead><tbody>${need.map(x => `<tr><td>${esc(artCode(x.a))} ${esc(x.a.Designation)}</td><td>${x.a.Fournisseur ? esc(partnerName(x.a.Fournisseur)) : '<span class="neg">aucun</span>'}</td><td class="num">${fmtNum(x.qty, 3)} ${esc(x.a.Unite)}</td></tr>`).join('')}</tbody></table>
     ${noSup.length ? `<div class="alert warning" style="margin-top:12px">${ic('warn')}Les articles sans fournisseur principal sont ignorés.</div>` : ''}`,
    `Créer ${bySup.size} commande(s) d'achat`);
  if (!ok || !bySup.size) return;
  const created = await busy(async () => {
    const out = [];
    for (const [sid, xs] of bySup) out.push(await createDocument('CF', {Partenaire: sid, Date: todayS(), Notes: 'Proposition de réapprovisionnement automatique'}, xs.map(x => ({Article: x.a.id, Designation: x.a.Designation, Quantite: x.qty, Unite: x.a.Unite, Prix_Unitaire: num(x.a.Prix_Achat), Remise: 0, Taux_TVA: num(x.a.Taux_TVA)}))));
    return out;
  });
  if (created) { toast(`${created.length} commande(s) d'achat créée(s) en brouillon`, 'ok'); go('docs', {code: 'CF'}); }
}

  mountList($('#listHost'), {rows: DB.ERP_Mouvements, columns: mvColumns(true), sort: 0, dir: -1, empty: 'Aucun mouvement', exportName: 'Mouvements', filters: [{label: 'Type', options: ['Entrée', 'Sortie', 'Inventaire'], get: r => r.Type}]});
};
async function stockMovementDialog(articleId, type = 'Entrée') {
  if (!modOn('S')) { toast('Module Stocks désactivé.', 'warning'); return; }
  const arts = DB.ERP_Articles.filter(a => a.Type !== 'Service' && !a.Inactif);
  if (!arts.length) { toast('Créez d\'abord un article stockable.', 'err'); return; }
  const st = stockInfo();
  const fields = [
    {key: 'Article', label: 'Article', type: 'select', numeric: true, required: true, full: true, options: [[0, '— Sélectionner —'], ...arts.map(a => [a.id, `${artCode(a)} · ${a.Designation} (stock : ${fmtNum(st.get(a.id).qty, 3)} ${a.Unite})`])]},
    {key: 'Type', label: 'Type de mouvement', type: 'select', options: [['Entrée', 'Entrée (501)'], ['Sortie', 'Sortie / consommation (201)'], ['Inventaire', 'Inventaire – quantité comptée (701)']], help: 'Entrée : ajoute au stock. Sortie : retire du stock. Inventaire : saisissez la quantité réellement comptée, l\'ERP enregistre l\'écart.'},
    {key: 'Date', label: 'Date', type: 'date', required: true},
    {key: 'Quantite', label: 'Quantité', type: 'number', required: true, help: 'Pour un inventaire : la quantité physiquement comptée.'},
    {key: 'Cout_Unitaire', label: 'Coût unitaire (entrées)', type: 'number', help: 'Laissez vide pour utiliser le coût moyen actuel.'},
    {key: 'Motif', label: 'Motif', full: true}
  ];
  const v = await formDialog({title: type === 'Inventaire' ? 'Inventaire physique' : 'Mouvement de stock', fields, icon: 'stock', values: {Article: articleId || 0, Type: type, Date: todayS(), Quantite: '', Cout_Unitaire: '', Motif: ''},
    validate: x => !x.Article ? 'Sélectionnez un article.' : (x.Type !== 'Inventaire' && x.Quantite <= 0) ? 'La quantité doit être positive.' : x.Quantite < 0 ? 'Quantité invalide.' : null});
  if (!v) return;
  const s = st.get(v.Article), a = articleOf(v.Article);
  let q = v.Quantite;
  if (v.Type === 'Sortie') q = -q;
  if (v.Type === 'Inventaire') { q = round3(v.Quantite - s.qty); if (!q) { toast('Aucun écart d\'inventaire.', 'ok'); return; } }
  const cost = v.Type === 'Entrée' && v.Cout_Unitaire ? v.Cout_Unitaire : round2(s.cmp || num(a.Prix_Achat));
  const r = await busy(() => run([['AddRecord', 'ERP_Mouvements', null, {Date: v.Date, Article: v.Article, Type: v.Type, Quantite: q, Cout_Unitaire: cost, Document: 0, Motif: v.Motif || (v.Type === 'Inventaire' ? `Écart d'inventaire (compté : ${fmtNum(v.Quantite, 3)})` : 'Mouvement manuel')}]]));
  if (r) { toast(`Mouvement enregistré (${q > 0 ? '+' : ''}${fmtNum(q, 3)} ${a.Unite})`, 'ok'); render(); }
}

VIEWS.balance = (main, params) => {
  const year = params.year || String(yearOf(todayS()));
  const es = DB.ERP_Ecritures.filter(e => e.Date && String(yearOf(e.Date)) === year);
  const rows = [...groupBy(es, e => String(e.Compte))].map(([c, xs]) => { const d = round2(sum(xs, e => num(e.Debit))), cr = round2(sum(xs, e => num(e.Credit))); return {id: c, Compte: c, Libelle: accountLabel(c), Debit: d, Credit: cr, SD: d > cr ? round2(d - cr) : 0, SC: cr > d ? round2(cr - d) : 0}; });
  const cls = c => String(c)[0];
  const produits = sum(rows.filter(r => cls(r.Compte) === '7'), r => r.Credit - r.Debit), charges = sum(rows.filter(r => cls(r.Compte) === '6'), r => r.Debit - r.Credit);
  const tresorerie = sum(rows.filter(r => /^5/.test(r.Compte)), r => r.Debit - r.Credit);
  const tvaDue = sum(rows.filter(r => r.Compte === ACC('TVA_Collectee')), r => r.Credit - r.Debit) - sum(rows.filter(r => r.Compte === ACC('TVA_Deductible')), r => r.Debit - r.Credit);
  const columns = [
    {key: 'Compte', label: 'Compte', fmt: v => `<a class="mono" data-account="${esc(v)}" href="#">${esc(v)}</a>`}, {key: 'Libelle', label: 'Intitulé'},
    {key: 'Debit', label: 'Mouvements débit', num: true, fmt: fmtMoney}, {key: 'Credit', label: 'Mouvements crédit', num: true, fmt: fmtMoney},
    {key: 'SD', label: 'Solde débiteur', num: true, fmt: v => v ? fmtMoney(v) : ''}, {key: 'SC', label: 'Solde créditeur', num: true, fmt: v => v ? fmtMoney(v) : ''}
  ];
  main.innerHTML = page({title: 'Balance générale', tc: 'F.01', crumb: crumb('Balance générale'),
    actions: `<label class="sr" for="yearSel">Exercice</label><select class="inp" id="yearSel" style="width:130px" data-tip="Choisir l'exercice (année civile)">${years().map(y => `<option ${y === year ? 'selected' : ''}>${y}</option>`).join('')}</select>`,
    body: `<div class="kpis">
      ${kpi('Produits (classe 7)', fmtMoney(produits), `Exercice ${year}`, {tip: 'Solde créditeur des comptes 7.'})}
      ${kpi('Charges (classe 6)', fmtMoney(charges), `Exercice ${year}`, {tip: 'Solde débiteur des comptes 6.'})}
      ${kpi('Résultat', fmtMoney(produits - charges), produits - charges < 0 ? 'Perte' : 'Bénéfice', {tone: produits - charges < 0 ? 'bad' : 'good', tip: 'Produits − charges.'})}
      ${kpi('Trésorerie (classe 5)', fmtMoney(tresorerie), 'Mouvements de l\'exercice', {tip: 'Variation des comptes de banque et de caisse.'})}
      ${kpi('TVA à décaisser', fmtMoney(tvaDue), `${ACC('TVA_Collectee')} − ${ACC('TVA_Deductible')}`, {tip: 'TVA collectée − TVA déductible de l\'exercice.'})}
    </div><div class="card" id="listHost"></div>`});
  mountList($('#listHost'), {rows, columns, sort: 0, empty: 'Aucune écriture sur cet exercice', onOpen: c => go('ledger', {account: String(c)}), exportName: 'Balance_' + year,
    footer: rs => footRow(columns, ['Total', '', fmtMoney(sum(rs, r => r.Debit)), fmtMoney(sum(rs, r => r.Credit)), fmtMoney(sum(rs, r => r.SD)), fmtMoney(sum(rs, r => r.SC))])});
  $('#yearSel').onchange = e => go('balance', {year: e.target.value});
};
VIEWS.ledger = (main, {account}) => {

  let bal = 0;
  const rows = DB.ERP_Ecritures.filter(e => String(e.Compte) === acc).sort((a, b) => (a.Date || 0) - (b.Date || 0) || a.id - b.id).map(e => { bal = round2(bal + num(e.Debit) - num(e.Credit)); return {...e, Solde: bal}; });

  main.innerHTML = page({title: 'Grand livre', tc: 'FAGLL03', crumb: crumb(`<a data-tc="F.01" href="#">Balance</a>`, 'Grand livre'),
    sub: `Compte <b class="mono">${esc(acc)}</b> ${esc(accountLabel(acc))} · Solde : <b>${money(bal)}</b> ${bal > 0 ? '(débiteur)' : bal < 0 ? '(créditeur)' : ''}`,
    actions: `<label class="sr" for="accSel">Compte</label><select class="inp" id="accSel" style="width:300px;max-width:100%" data-tip="Choisir le compte à afficher">${accounts.map(a => `<option value="${esc(a)}" ${a === acc ? 'selected' : ''}>${esc(a)} – ${esc(accountLabel(a))}</option>`).join('')}</select>`,
    body: '<div class="card" id="listHost"></div>'});
  mountList($('#listHost'), {rows, columns, empty: 'Aucune écriture sur ce compte', exportName: 'Grand_livre_' + acc, footer: rs => footRow(columns, ['Total', '', '', '', '', fmtMoney(sum(rs, r => num(r.Debit))), fmtMoney(sum(rs, r => num(r.Credit))), ''])});
  $('#accSel').onchange = e => go('ledger', {account: e.target.value});
};
VIEWS.openitems = (main, {side}) => {
  const code = side === 'V' ? 'FC' : 'FF', today = todayS();
  const rows = docsOf(code).filter(d => isPostedInvoice(d) && remaining(d) > 0.004);
  const late = d => d.Echeance ? daysBetween(d.Echeance, today) : 0;
  const buckets = [['Non échu', d => late(d) <= 0, 'Échéance pas encore atteinte'], ['1 – 30 jours', d => late(d) > 0 && late(d) <= 30, 'Retard de 1 à 30 jours'], ['31 – 60 jours', d => late(d) > 30 && late(d) <= 60, 'Retard de 31 à 60 jours'], ['> 60 jours', d => late(d) > 60, 'Retard de plus de 60 jours : à relancer en priorité']];
  const columns = [
    {key: 'Numero', label: 'Facture', fmt: v => `<span class="mono">${esc(v)}</span>`}, {label: side === 'V' ? 'Client' : 'Fournisseur', get: r => partnerName(r.Partenaire)},
    {key: 'Reference', label: 'Référence'}, {key: 'Date', label: 'Date', fmt: fmtDate, text: r => fmtDate(r.Date)}, {key: 'Echeance', label: 'Échéance', fmt: fmtDate, text: r => fmtDate(r.Echeance)},
    {label: 'Retard', num: true, tip: 'Nombre de jours depuis l\'échéance', get: late, fmt: v => v > 0 ? `<span class="neg">${v} j</span>` : '<span class="muted">—</span>'},
    {key: 'Total_TTC', label: 'Montant TTC', num: true, fmt: fmtMoney}, {key: 'Montant_Regle', label: 'Réglé', num: true, fmt: fmtMoney},
    {label: 'Reste dû', num: true, get: remaining, fmt: v => `<b>${fmtMoney(v)}</b>`}
  ];
  const tc = side === 'V' ? 'FBL5N' : 'FBL1N';
  main.innerHTML = page({title: side === 'V' ? 'Postes ouverts clients' : 'Postes ouverts fournisseurs', tc, crumb: crumb('Postes ouverts'), sub: `Total restant dû : <b>${fmtMoney(sum(rows, remaining))}</b>`,
    body: `<div class="kpis">${buckets.map(([l, f, t], i) => { const v = sum(rows.filter(f), remaining); return kpi(l, fmtMoney(v), `${rows.filter(f).length} facture(s)`, {tone: i && v ? (i > 1 ? 'bad' : 'warn') : '', tip: t}); }).join('')}</div><div class="card" id="listHost"></div>`});
  mountList($('#listHost'), {rows, columns, sort: 5, dir: -1, empty: 'Aucun poste ouvert', onOpen: id => go('doc', {id}), exportName: 'Postes_ouverts',
    footer: rs => footRow(columns, ['Total', '', '', '', '', '', fmtMoney(sum(rs, r => num(r.Total_TTC))), fmtMoney(sum(rs, r => num(r.Montant_Regle))), fmtMoney(sum(rs, remaining))])});
};
async function odDialog() {
  if (!modOn('F')) { toast('Module Finance désactivé.', 'warning'); return; }
  const rows = [{Compte: '627', Libelle: '', Debit: 0, Credit: 0}, {Compte: ACC('Banque'), Libelle: '', Debit: 0, Credit: 0}];
  const rowHtml = (r, i) => `<tr data-i="${i}"><td><input class="inp mono" list="accList" data-c="Compte" value="${esc(r.Compte)}" style="width:110px" aria-label="Compte"></td><td><input class="inp" data-c="Libelle" value="${esc(r.Libelle)}" aria-label="Libellé"></td>
    <td><input class="inp n" data-c="Debit" value="${r.Debit || ''}" inputmode="decimal" style="width:110px" aria-label="Débit"></td><td><input class="inp n" data-c="Credit" value="${r.Credit || ''}" inputmode="decimal" style="width:110px" aria-label="Crédit"></td><td><button type="button" class="icon-x" data-del aria-label="Supprimer" data-tip="Supprimer la ligne">${ic('delete')}</button></td></tr>`;
  await modal({title: 'Écriture d\'opérations diverses (FB50)', wide: true, icon: 'calc',
    body: `<div class="alert info" style="margin-bottom:16px">${ic('info')}Une écriture doit être <b>équilibrée</b> : total des débits = total des crédits. Exemple : frais bancaires → 627 au débit, ${esc(ACC('Banque'))} au crédit.</div>
      <div class="form cols-3" style="margin-bottom:14px">
        <div class="field"><label for="odDate">Date</label><input type="date" id="odDate" value="${sToIso(todayS())}"></div>
        <div class="field" style="grid-column:span 2"><label for="odLib">Libellé général${hint('Repris sur chaque ligne dont le libellé est vide.')}</label><input id="odLib" placeholder="ex. Frais bancaires du mois"></div></div>
      <datalist id="accList">${Object.keys(PCG).sort().map(a => `<option value="${a}">${esc(PCG[a])}</option>`).join('')}</datalist>
      <table class="lines"><thead><tr><th>Compte</th><th>Libellé (facultatif)</th><th class="r">Débit</th><th class="r">Crédit</th><th></th></tr></thead><tbody id="odBody"></tbody></table>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:10px;flex-wrap:wrap">${btn('Ligne', {sm: true, ic: 'add', id: 'odAdd', key: 'l', tip: 'Ajouter une ligne'})}<span id="odBal"></span></div>`,
    buttons: [{label: 'Annuler', value: null}, {label: 'Comptabiliser', cls: 'pri', ic: 'check', tip: 'Enregistrer l\'écriture (si elle est équilibrée)', onClick: async ({el}) => {
      const date = isoToS($('#odDate', el).value) || todayS(), lib = $('#odLib', el).value.trim() || 'Opération diverse';
      const ls = rows.filter(r => r.Compte && (r.Debit || r.Credit));
      const d = round2(sum(ls, r => r.Debit)), c = round2(sum(ls, r => r.Credit));
      if (ls.length < 2) { toast('Saisissez au moins deux lignes.', 'err'); return false; }
      if (d !== c) { toast('L\'écriture n\'est pas équilibrée.', 'err'); return false; }
      const piece = nextOdPiece(date);
      const r = await busy(() => run([bulkAdd('ERP_Ecritures', ls.map(x => ({Date: date, Journal: 'OD', Piece: piece, Compte: String(x.Compte).trim(), Libelle: x.Libelle || lib, Debit: round2(x.Debit), Credit: round2(x.Credit), Partenaire: 0, Document: 0})))]));
      if (!r) return false;
      toast(`Pièce ${piece} comptabilisée`, 'ok'); render(); return true;
    }}],
    onMount: ({el}) => {
      const body = $('#odBody', el);
      const bal = () => { const d = round2(sum(rows, r => r.Debit)), c = round2(sum(rows, r => r.Credit)); $('#odBal', el).innerHTML = `Débit ${fmtMoney(d)} · Crédit ${fmtMoney(c)} · ${d === c && d ? '<b class="pos">équilibrée</b>' : `<b class="neg">écart ${fmtMoney(d - c)}</b>`}`; };
      const draw = () => { body.innerHTML = rows.map(rowHtml).join(''); bal(); };
      body.addEventListener('input', e => { const tr = e.target.closest('tr'), k = e.target.dataset.c, r = rows[+tr.dataset.i]; r[k] = (k === 'Debit' || k === 'Credit') ? num(e.target.value) : e.target.value; bal(); });
      body.addEventListener('click', e => { if (e.target.closest('[data-del]')) { rows.splice(+e.target.closest('tr').dataset.i, 1); draw(); } });
      $('#odAdd', el).onclick = () => { rows.push({Compte: '', Libelle: '', Debit: 0, Credit: 0}); draw(); };
      draw();
    }});
}

async function afterRawChange(t) {
  await loadExplorer(true);
  if (CFG && ENT_KEYS.some(e => tableOf(e) === t)) await loadTables();

async function editRawRecord(t, id) {
  const raw = EXP.raw, i = id ? raw.id.indexOf(id) : -1, ro = META.tables[t].summary;
  const fields = colsOf(t).map(cm => {
    const [base, target] = String(cm.type).split(':');
    const f = {key: cm.colId, label: cm.label, base, readonly: ro || cm.isFormula || ['RefList', 'Attachments'].includes(base), help: `Colonne ${cm.colId} · ${typeLabel(cm.type)}${cm.isFormula ? ' · formule (lecture seule)' : ''}`};
    if (base === 'Bool') f.type = 'checkbox';
    else if (base === 'Date' && !f.readonly) f.type = 'date';
    else if (base === 'DateTime' && !f.readonly) f.type = 'datetime';
    else if ((base === 'Numeric' || base === 'Int') && !f.readonly) { f.type = 'number'; f.nullable = true; }
    else if (base === 'Choice' && !f.readonly) { f.type = 'select'; f.options = ['', ...choicesOf(cm)]; }
    else if (base === 'Ref' && target && EXP.refs[target] && !f.readonly) { const r = EXP.refs[target], dc = refDisplayCol(cm); f.type = 'select'; f.numeric = true; f.options = [[0, '—'], ...r.id.map((rid, k) => [rid, dc && r[dc] ? cellText(r[dc][k], META.tables[target].cols[dc] || {type: 'Any'}) || `#${rid}` : `#${rid}`])]; }
    else if (base === 'Text' || base === 'Any' || base === 'ChoiceList') f.type = 'text';
    return f;
  });
  const values = {};
  if (i >= 0) for (const f of fields) {
    let v = raw[f.key] ? raw[f.key][i] : null;
    if (f.base === 'ChoiceList' && Array.isArray(v) && v[0] === 'L') v = v.slice(1).join(', ');
    else if (f.readonly && f.type !== 'checkbox') v = cellText(v, META.tables[t].cols[f.key]);
    else if (Array.isArray(v)) v = cellText(v, META.tables[t].cols[f.key]);
    if (f.base === 'Choice' && f.options && v && !f.options.includes(v)) f.options.push(v);
    values[f.key] = v;
  }
  const v = await formDialog({title: id ? `${t} – ligne ${id}` : `${t} – nouvelle ligne`, fields, values, wide: true, icon: 'table', okLabel: id ? 'Enregistrer' : 'Ajouter'});
  if (!v) return;
  const out = {};
  for (const f of fields) {
    if (f.readonly || !(f.key in v)) continue;
    let x = v[f.key];
    if (f.base === 'Int' && x != null) x = Math.round(x);
    if (f.base === 'ChoiceList') x = x ? ['L', ...splitList(x)] : null;
    if (i >= 0) { const old = raw[f.key] ? raw[f.key][i] : null; if (JSON.stringify(old) === JSON.stringify(x) || (old == null && (x === '' || x === null))) continue; }
    out[f.key] = x;
  }
  if (id && !Object.keys(out).length) { toast('Aucune modification.'); return; }
  const ok = await busy(async () => { await B.apply([id ? ['UpdateRecord', t, id, out] : ['AddRecord', t, null, out]]); return true; });
  if (ok) { toast(id ? 'Ligne mise à jour' : 'Ligne ajoutée', 'ok'); afterRawChange(t); }
}

let lastRemote = null;
async function onRemoteOptions(opts) {
  const cfg = opts && opts.erp; if (!cfg || !CFG) return;
  const s = JSON.stringify(cfg); if (s === lastRemote) return;
  lastRemote = s;
  if (s === JSON.stringify(CFG)) return;

function bindGlobal() {
  $('#tcodeList').innerHTML = Object.entries(TCODES).map(([k, t]) => `<option value="${k}">${esc(t.label)}</option>`).join('');
  $('#navToggle').onclick = toggleNav;
  $('#tcodeForm').onsubmit = e => { e.preventDefault(); const v = $('#tcodeInput').value; $('#tcodeInput').value = ''; $('#tcodeInput').blur(); runTcode(v); };
  $('#refreshBtn').onclick = refresh;
  $('#helpBtn').onclick = () => toggleHelp();
  $('#helpClose').onclick = () => toggleHelp(false);
  $('#kbdBtn').onclick = showShortcuts;
  document.addEventListener('click', e => {
    if (e.target.closest('[data-help]')) { toggleHelp(true); return; }
    if (e.target.closest('[data-shortcuts]')) { showShortcuts(); return; }
    const ex = e.target.closest('[data-explore]'); if (ex) { e.preventDefault(); go('explorer', {table: ex.dataset.explore}); return; }
    const t = e.target.closest('[data-tc],[data-doc],[data-partner],[data-article],[data-account]');
    if (!t || t.tagName === 'OPTION') return;
    if (t.closest('#modalRoot') && !t.dataset.tc) return;
    e.preventDefault();
    if (t.closest('#helpPanel') && window.innerWidth < 700) toggleHelp(false);
    if (t.dataset.tc) { $$('#modalRoot .modal-back').forEach(m => m.remove()); runTcode(t.dataset.tc); }
    else if (t.dataset.doc) go('doc', {id: +t.dataset.doc});
    else if (t.dataset.partner) go('partner', {id: +t.dataset.partner});
    else if (t.dataset.article) go('article', {id: +t.dataset.article});
    else if (t.dataset.account) go('ledger', {account: t.dataset.account});
  });
  document.addEventListener('keydown', e => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
    if (e.key === 'Escape') { hideTip(); if (!topModal() && $('#helpPanel').classList.contains('open')) toggleHelp(false); return; }
    if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K' || e.key === '/')) { e.preventDefault(); $('#tcodeInput').focus(); $('#tcodeInput').select(); return; }
    if (e.key === 'F1') { e.preventDefault(); toggleHelp(); return; }
    if (e.key === 'Enter' && !typing && e.target.matches('.kpi[data-tc]')) { e.target.click(); return; }
    if (!typing && !e.ctrlKey && !e.metaKey && !e.altKey && e.key === '?') { e.preventDefault(); showShortcuts(); return; }
    if (!typing && !e.ctrlKey && !e.metaKey && !e.altKey && e.key === '/') { const s = $('#main .list-tools input[type=search]'); if (s) { e.preventDefault(); s.focus(); } return; }
    if (e.altKey && !e.ctrlKey && !e.metaKey) {
      const k = e.code && e.code.startsWith('Key') ? e.code.slice(3).toLowerCase() : e.code === 'ArrowLeft' ? 'left' : null;
      if (!k) return;
      const scope = topModal() || $('#main');
      const el = $$(`[data-key="${k}"]`, scope).find(x => x.offsetParent !== null && !x.disabled);
      if (el) { e.preventDefault(); el.click(); return; }
      if (k === 'x' && !topModal()) { const x = $('#main [data-export]'); if (x) { e.preventDefault(); x.click(); return; } }
      if (topModal()) return;
      const global = {h: () => runTcode('SMEN'), r: refresh, m: toggleNav, left: back};
      if (global[k]) { e.preventDefault(); global[k](); }
    }
  });
}

  try { await loadTables(); }
  catch (e) { console.error(e); toast('Lecture des tables impossible : ' + e.message, 'err'); }
  state.stack = []; go('home'); state.stack = [];
}

bindGlobal();
const inGrist = window.self !== window.top && typeof grist !== 'undefined';
start(inGrist ? GristBackend : LocalBackend);
</script>
