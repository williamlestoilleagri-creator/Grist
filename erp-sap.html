async function loadDemoData() {
  const hasData = DB.ERP_Documents.length || DB.ERP_Articles.length || DB.ERP_Partenaires.length;
  if (!await confirmDlg('Données de démonstration',
    `Un jeu de données (société, 8 partenaires, 9 articles, ~30 documents avec stocks et écritures) va être ajouté${B.mode === 'grist' ? ' aux tables ERP_* de ce document Grist' : ''}.${hasData ? '<div class="msg warn" style="margin-top:10px">Des données existent déjà : la démo s\'y ajoutera.</div>' : ''}`, 'Charger')) return;
  const ok = await busy(async () => {
    const T0 = todayS(), D = n => addDays(T0, -n);
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    if (!param('Societe')) await setParams({Societe: 'Coopérative du Val Fleuri', Adresse: '12 route des Vergers', Code_Postal: '69400', Ville: 'Villefranche-sur-Saône', Telephone: '04 74 00 00 00', Email: 'contact@valfleuri.example', SIRET: '123 456 789 00012', TVA_Intra: 'FR12123456789', IBAN: 'FR76 0000 0000 0000 0000 0000 000', Devise: 'EUR', TVA_Defaut: '20', Delai_Paiement: '30'});
    const P = [
      ['C', 'Boulangerie Martin', 'Client', 'Lyon', '69003', 30], ['C', 'Hôtel du Parc', 'Client', 'Annecy', '74000', 45], ['C', 'SARL Dupont Traiteur', 'Client', 'Grenoble', '38000', 30],
      ['C', 'Mairie de Villefranche', 'Client', 'Villefranche-sur-Saône', '69400', 60], ['C', 'Café des Arts', 'Client', 'Lyon', '69001', 15],
      ['F', 'Rhône Distribution', 'Fournisseur', 'Vénissieux', '69200', 30], ['F', 'Moulins de Savoie', 'Fournisseur', 'Chambéry', '73000', 45], ['F', 'TechnoPack Emballages', 'Fournisseur', 'Saint-Étienne', '42000', 30]
    ];
    const pRecs = P.map(([pre, nom, type, ville, cp, delai]) => ({Code: '', Nom: nom, Type: type, Ville: ville, Code_Postal: cp, Pays: 'France', Delai_Paiement: delai, Inactif: false,
      Adresse: `${Math.floor(rnd() * 80) + 1} rue ${['de la République', 'Victor Hugo', 'des Lilas', 'du Commerce', 'Pasteur'][Math.floor(rnd() * 5)]}`,
      Email: 'contact@' + nom.toLowerCase().normalize('NFD').replace(/[^a-z]/g, '').slice(0, 14) + '.example', Telephone: '0' + (4 + Math.floor(rnd() * 2)) + ' ' + Array.from({length: 4}, () => String(Math.floor(rnd() * 90) + 10)).join(' '), _pre: pre}));
    let cC = 0, cF = 0;
    pRecs.forEach(r => { const pre = r._pre; delete r._pre; r.Code = pre === 'C' ? nextCode('ERP_Partenaires', 'C').replace(/\d+$/, n => String(+n + cC++).padStart(4, '0')) : nextCode('ERP_Partenaires', 'F').replace(/\d+$/, n => String(+n + cF++).padStart(4, '0')); });
    const [pIds] = await B.apply([bulkAdd('ERP_Partenaires', pRecs)]);
    const [cl1, cl2, cl3, cl4, cl5, fo1, fo2, fo3] = pIds;
    const A = [
      ['Farine de blé T65 – sac 25 kg', 'Marchandise', 'Meunerie', 'sac', 18, 27, 5.5, 20, fo2], ['Farine de seigle – sac 25 kg', 'Marchandise', 'Meunerie', 'sac', 22, 33, 5.5, 10, fo2],
      ['Huile de colza – bidon 5 L', 'Marchandise', 'Épicerie', 'U', 9.5, 15.9, 5.5, 15, fo1], ['Miel toutes fleurs – pot 1 kg', 'Produit fini', 'Épicerie', 'U', 8, 13.5, 5.5, 20, fo1],
      ['Pommes de terre – filet 10 kg', 'Marchandise', 'Primeurs', 'U', 6, 10.5, 5.5, 30, fo1], ['Cartons d\'expédition (lot de 50)', 'Matière première', 'Emballages', 'lot', 24, 38, 20, 5, fo3],
      ['Palette bois 120×80', 'Matière première', 'Emballages', 'palette', 9, 15, 20, 10, fo3], ['Livraison sur site', 'Service', 'Services', 'U', 0, 35, 20, 0, 0], ['Conseil / formation', 'Service', 'Services', 'h', 0, 85, 20, 0, 0]
    ];
    const base = DB.ERP_Articles.length;
    const [aIds] = await B.apply([bulkAdd('ERP_Articles', A.map(([des, type, cat, u, pa, pv, tva, min, f], i) => ({Code: 'A' + String(base + i + 1).padStart(4, '0'), Designation: des, Type: type, Categorie: cat, Unite: u, Prix_Achat: pa, Prix_Vente: pv, Taux_TVA: tva, Stock_Min: min, Fournisseur: f, Inactif: false})))]);
    await loadTables(['ERP_Partenaires', 'ERP_Articles']);
    const L = (ai, q, sale, rem = 0) => { const a = get('ERP_Articles', aIds[ai]); return {Article: a.id, Designation: a.Designation, Quantite: q, Unite: a.Unite, Prix_Unitaire: sale ? a.Prix_Vente : a.Prix_Achat, Remise: rem, Taux_TVA: a.Taux_TVA}; };

    // Approvisionnements (commande → réception → facture → paiement)
    const purchase = async (sup, day, ls, {receive = true, invoice = true, pay = true} = {}) => {
      const cf = await createDocument('CF', {Partenaire: sup, Date: D(day), Statut: 'Confirmée'}, ls);
      if (!receive) return;
      await receiveOrder(cf, D(day - 3));
      if (!invoice) return;
      const ff = await invoiceOrder(get('ERP_Documents', cf.id), D(day - 4), 'FA-' + Math.floor(rnd() * 90000 + 10000));
      if (pay) await registerPayment(ff, num(ff.Total_TTC), D(Math.max(0, day - 30)), 'Virement');
    };
    await purchase(fo2, 170, [L(0, 80, false), L(1, 30, false)]);
    await purchase(fo1, 165, [L(2, 60, false), L(3, 70, false), L(4, 120, false)]);
    await purchase(fo3, 160, [L(5, 20, false), L(6, 40, false)]);
    await purchase(fo2, 95, [L(0, 60, false)]);
    await purchase(fo1, 70, [L(4, 80, false), L(2, 30, false)]);
    await purchase(fo2, 25, [L(0, 40, false), L(1, 15, false)], {pay: false});

    // Ventes réparties sur 6 mois
    const clients = [cl1, cl2, cl3, cl4, cl5];
    const sale = async (cli, day, ls, {deliver = true, invoice = true, payRatio = 1} = {}) => {
      const cc = await createDocument('CC', {Partenaire: cli, Date: D(day), Statut: 'Confirmée', Reference: 'BC-' + Math.floor(rnd() * 9000 + 1000)}, ls);
      if (!deliver) return;
      await deliverOrder(cc, D(day - 2));
      if (!invoice) return;
      const fc = await invoiceOrder(get('ERP_Documents', cc.id), D(day - 2));
      if (payRatio > 0) await registerPayment(fc, round2(num(fc.Total_TTC) * payRatio), D(Math.max(0, day - 25)), ['Virement', 'Chèque', 'Carte bancaire'][Math.floor(rnd() * 3)]);
    };
    const plans = [150, 140, 128, 115, 104, 92, 80, 66, 55, 44, 35];
    for (let k = 0; k < plans.length; k++) {
      const cli = clients[k % clients.length], ls = [];
      const picks = [0, 1, 2, 3, 4].filter(() => rnd() > 0.45); if (!picks.length) picks.push(0);
      for (const i of picks) ls.push(L(i, Math.ceil(rnd() * 8) + 2, true, rnd() > 0.7 ? 5 : 0));
      if (rnd() > 0.5) ls.push(L(7, 1, true));
      await sale(cli, plans[k], ls);
    }
    await sale(cl2, 48, [L(3, 12, true), L(8, 3, true)], {payRatio: 0});           // facture en retard
    await sale(cl3, 20, [L(0, 6, true), L(2, 6, true), L(7, 1, true)], {payRatio: 0.5}); // partiellement réglée
    await sale(cl1, 9, [L(0, 10, true), L(1, 4, true)], {payRatio: 0});
    await sale(cl4, 6, [L(4, 20, true), L(6, 5, true)], {invoice: false});         // livrée, à facturer
    await sale(cl5, 2, [L(3, 8, true), L(2, 4, true)], {deliver: false});          // confirmée, à livrer
    // Devis
    const dv1 = await createDocument('DV', {Partenaire: cl2, Date: D(4), Notes: 'Offre saisonnière – valable 30 jours'}, [L(3, 24, true, 10), L(8, 2, true)]);
    await setStatus(dv1, 'Envoyé');
    await createDocument('DV', {Partenaire: cl4, Date: D(1)}, [L(0, 15, true), L(7, 1, true)]);
    // Commande d'achat en attente de réception
    await purchase(fo3, 3, [L(5, 10, false)], {receive: false});
    // OD : frais bancaires et loyer
    for (const [day, acc, lib, amt] of [[120, '627', 'Frais bancaires', 38.5], [90, '613', 'Loyer entrepôt', 950], [60, '613', 'Loyer entrepôt', 950], [30, '613', 'Loyer entrepôt', 950], [15, '627', 'Frais bancaires', 41.2]]) {
      const piece = nextOdPiece(D(day));
      await run([bulkAdd('ERP_Ecritures', [{Date: D(day), Journal: 'OD', Piece: piece, Compte: acc, Libelle: lib, Debit: amt, Credit: 0}, {Date: D(day), Journal: 'OD', Piece: piece, Compte: '512', Libelle: lib, Debit: 0, Credit: amt}])]);
    }
    await loadTables();
    return true;
  });
  if (ok) { toast('Données de démonstration chargées', 'ok'); go('home'); }
}

  $('#refreshBtn').onclick = async () => {
    if (state.editing && !await confirmDlg('Actualiser', 'Les modifications non enregistrées seront perdues.', 'Actualiser')) return;
    await busy(() => loadTables()); state.editing = false; render(); toast('Données actualisées');
  };
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-tc],[data-doc],[data-partner],[data-article],[data-account]');
    if (!t || t.tagName === 'OPTION') return;
    if (t.closest('#modalRoot') && !t.dataset.tc) return;
    if (t.dataset.tc) { e.preventDefault(); const m = t.closest('.modal-back'); if (m) m.remove(); runTcode(t.dataset.tc); }
    else if (t.dataset.doc) go('doc', {id: +t.dataset.doc});
    else if (t.dataset.partner) go('partner', {id: +t.dataset.partner});
    else if (t.dataset.article) go('article', {id: +t.dataset.article});
    else if (t.dataset.account) go('ledger', {account: t.dataset.account});
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('tile')) e.target.click();
    if ((e.ctrlKey || e.metaKey) && e.key === '/') { e.preventDefault(); $('#tcodeInput').focus(); }
  });
}

function showStartError(err) {
  $('#main').innerHTML = `<div class="splash"><div class="card"><div class="card-h"><h2>Connexion au document Grist impossible</h2></div><div class="card-b">
    <p>Ce widget a besoin de l'<b>accès complet au document</b> pour créer et gérer ses tables (<code>ERP_Partenaires</code>, <code>ERP_Articles</code>, <code>ERP_Documents</code>…).</p>
    <ol><li>Dans le panneau de droite du widget, onglet <b>Widget</b>, réglez le niveau d'accès sur <b>Accès complet au document</b>.</li><li>Rechargez la page.</li></ol>
    <div class="msg err">${esc(err && err.message ? err.message : err)}</div>
    <button class="btn" id="localBtn">Continuer en mode démo local</button></div></div></div>`;
  $('#localBtn').onclick = () => start(LocalBackend);
}

async function start(backend) {
  B = backend;
  const badgeEl = $('#modeBadge');
  badgeEl.textContent = B.mode === 'grist' ? 'Grist' : 'Démo locale';
  badgeEl.className = 'mode ' + B.mode;
  badgeEl.title = B.mode === 'grist' ? 'Données stockées dans les tables ERP_* du document' : 'Données stockées dans ce navigateur (hors Grist)';
  try {
    await B.init();
    await B.ensureSchema();
    await loadTables();
  } catch (e) {
    console.error(e);
    if (B.mode === 'grist') return showStartError(e);
    throw e;
  }
  go('home');
}

bindGlobal();
const inGrist = window.self !== window.top && typeof grist !== 'undefined';
start(inGrist ? GristBackend : LocalBackend);
</script>
</body>
