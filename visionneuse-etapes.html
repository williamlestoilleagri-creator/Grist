<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visionneuse d'étapes</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  /* Police officielle de l'État (DSFR). En cas d'indisponibilité du CDN,
     la pile de secours (Arial…) prend le relais automatiquement. */
  @font-face{
    font-family:'Marianne';
    src: url('https://cdn.jsdelivr.net/npm/@gouvfr/dsfr/dist/fonts/Marianne-Regular.woff2') format('woff2');
    font-weight:400; font-style:normal; font-display:swap;
  }
  @font-face{
    font-family:'Marianne';
    src: url('https://cdn.jsdelivr.net/npm/@gouvfr/dsfr/dist/fonts/Marianne-Medium.woff2') format('woff2');
    font-weight:500; font-style:normal; font-display:swap;
  }
  @font-face{
    font-family:'Marianne';
    src: url('https://cdn.jsdelivr.net/npm/@gouvfr/dsfr/dist/fonts/Marianne-Bold.woff2') format('woff2');
    font-weight:700; font-style:normal; font-display:swap;
  }

  /* Jetons de couleur repris du Système de Design de l'État (DSFR) :
     Bleu France (option 113) en primaire, gris DSFR pour le reste. */
  :root{
    --bg: #EEEEEE;
    --surface: #FFFFFF;
    --ink: #161616;
    --ink-soft: #666666;
    --ink-faint: #929292;
    --border: #DDDDDD;
    --primary: #000091;
    --primary-hover: #1212FF;
    --font-body: 'Marianne', Arial, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body);
    font-size:15.5px; line-height:1.6; -webkit-font-smoothing:antialiased;
  }

  .app{ display:flex; flex-direction:column; height:100vh; min-height:360px; }

  /* ---------- header ---------- */
  .app-header{
    display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
    padding:10px 14px; background:var(--primary); color:#fff; flex:0 0 auto;
  }
  .app-header h1{ font-weight:700; font-size:17px; margin:0; letter-spacing:.2px; }
  .app-header .sub{ font-size:12.5px; opacity:.8; margin-top:1px; }
  .controls{ display:flex; gap:8px; flex-wrap:wrap; }
  .controls select, .controls input[type="search"]{
    border:none; background:#FFFFFF; color:var(--ink);
    border-radius:0; padding:7px 10px; font-size:13.5px; outline:none;
  }
  .controls select option{ color:#111; }
  .controls input[type="search"]::placeholder{ color:var(--ink-soft); }
  .controls select:focus, .controls input[type="search"]:focus{
    outline:2px solid #FFFFFF; outline-offset:2px; box-shadow:0 0 0 2px var(--primary) inset;
  }

  /* ---------- body layout: liste + détail ---------- */
  .app-body{ display:flex; flex:1 1 auto; min-height:0; }

  .sidebar{
    width:260px; flex:0 0 260px; overflow-y:auto; background:var(--surface);
    border-right:1px solid var(--border); padding:6px;
  }
  .list-empty{ margin:24px 10px; text-align:center; color:var(--ink-faint); font-size:12px; line-height:1.6; }
  .list-item{
    display:flex; gap:8px; align-items:center; padding:8px 9px; cursor:pointer;
    border-left:3px solid transparent;
  }
  .list-item:hover{ background:var(--bg); }
  .list-item.selected{ background:var(--bg); border-left-color:var(--primary); }
  .li-num{
    flex:0 0 auto; width:20px; height:20px; border-radius:50%; background:var(--ink-faint); color:#fff;
    font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center;
  }
  .list-item.selected .li-num{ background:var(--primary); }
  .li-thumb{
    flex:0 0 auto; width:38px; height:38px; border-radius:0; overflow:hidden; background:var(--bg);
    display:flex; align-items:center; justify-content:center; border:1px solid var(--border);
  }
  .li-thumb img{ width:100%; height:100%; object-fit:cover; }
  .li-thumb .no-img{ color:var(--ink-faint); font-size:9px; text-align:center; }
  .li-body{ min-width:0; flex:1 1 auto; }
  .li-desc{ font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .li-cat{ font-size:11.5px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  @media (max-width: 720px){
    .app-body{ flex-direction:column; }
    .sidebar{ width:100%; flex:0 0 auto; max-height:34%; border-right:none; border-bottom:1px solid var(--border); }
  }

  /* ---------- détail (grand affichage) ---------- */
  .detail{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; padding:16px 20px; overflow-y:auto; }
  .detail-empty{
    margin:auto; text-align:center; color:var(--ink-faint); font-size:13.5px; line-height:1.8; max-width:340px;
  }
  .detail-empty .icon{ font-size:30px; margin-bottom:10px; }

  .detail-head{ display:flex; align-items:center; gap:10px; flex:0 0 auto; margin-bottom:14px; flex-wrap:wrap; }
  .step-index{ font-size:13.5px; color:var(--ink-soft); font-weight:600; }
  .badge{
    font-size:12.5px; font-weight:700; padding:4px 11px; border-radius:999px;
    letter-spacing:.01em; white-space:nowrap; display:inline-block;
  }
  .badge.none{ background:var(--bg); color:var(--ink-soft); border:1px solid var(--border); }

  /* Encart "mise en avant" (composant DSFR) : fond blanc, liseré bleu à gauche, pas d'ombre. */
  .detail-desc-card{
    background:var(--surface); border-left:4px solid var(--primary);
    padding:18px 22px; margin-bottom:20px; flex:0 0 auto;
  }
  .detail-desc{ font-size:18px; line-height:1.65; color:var(--ink); }
  .detail-desc p{ margin:0 0 12px; }
  .detail-desc p:last-child{ margin-bottom:0; }
  .detail-desc ul, .detail-desc ol{ margin:0 0 12px 22px; padding:0; }
  .detail-desc li{ margin-bottom:5px; }
  .detail-desc a{ color:var(--primary); font-weight:600; }
  .detail-desc .empty-desc{ color:var(--ink-faint); font-style:italic; }

  .detail-image{
    flex:1 1 auto; min-height:220px; display:flex; align-items:center; justify-content:center;
    background:var(--bg); border:1px solid var(--border); overflow:hidden; margin-bottom:10px;
  }
  .detail-image img{
    max-width:100%; max-height:100%; width:auto; height:auto; object-fit:contain; cursor:zoom-in; display:block;
  }
  .shot-placeholder{ color:var(--ink-faint); font-size:12.5px; text-align:center; padding:20px; }

  .detail-extra{ display:flex; gap:8px; flex-wrap:wrap; margin:0 0 4px; flex:0 0 auto; }
  .detail-extra img{
    width:64px; height:64px; object-fit:cover; border:1px solid var(--border); cursor:zoom-in;
  }

  /* ---------- lightbox ---------- */
  .lightbox{
    position:fixed; inset:0; background:rgba(15,15,18,.9); display:none;
    align-items:center; justify-content:center; z-index:1000; padding:30px;
  }
  .lightbox.open{ display:flex; }
  .lightbox img{ max-width:100%; max-height:100%; box-shadow:0 20px 60px rgba(0,0,0,.5); }
  .lightbox-close{
    position:absolute; top:16px; right:18px; background:rgba(255,255,255,.12); border:none; color:#fff;
    width:36px; height:36px; border-radius:0; font-size:18px; cursor:pointer; line-height:1;
  }
  .lightbox-close:hover{ background:rgba(255,255,255,.24); }
</style>
</head>
<body>

<div class="app">
  <header class="app-header">
    <div>
      <h1>Visionneuse d'étapes</h1>
      <div class="sub" id="subtitle">Connexion à Grist…</div>
    </div>
    <div class="controls">
      <select id="filter-categorie"><option value="">Toutes catégories</option></select>
      <input type="search" id="filter-search" placeholder="Rechercher…">
    </div>
  </header>

  <div class="app-body">
    <aside class="sidebar" id="sidebar">
      <div class="list-empty">En attente des données…</div>
    </aside>
    <main class="detail" id="detail">
      <div class="detail-empty">
        <div class="icon">👆</div>
        Sélectionne une ligne dans le tableau (ou dans la liste à gauche) pour afficher son aide.
      </div>
    </main>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightbox-close" title="Fermer">×</button>
  <img id="lightbox-img" src="" alt="Capture en grand">
</div>

<script>
(function(){
  'use strict';

  // ============================================================
  // Etat
  // ============================================================
  var state = {
    records: [],       // enregistrements bruts mappés (id, Description, Screenshot, Categorie)
    colMap: null,
    filterCategorie: '',
    filterSearch: '',
    selectedId: null,
    autoSelected: false // évite de forcer une sélection après le tout premier chargement
  };

  var CATEGORY_PALETTE = ['#000091', '#C9184A', '#18753C', '#B34000', '#6E445A', '#007C7C', '#716043', '#3D5A80', '#9A6324', '#2B5797'];
  var categoryColorCache = Object.create(null);
  function colorForCategorie(cat) {
    var key = (cat || '').trim().toLowerCase();
    if (!key) return null;
    if (!categoryColorCache[key]) {
      var n = Object.keys(categoryColorCache).length;
      categoryColorCache[key] = CATEGORY_PALETTE[n % CATEGORY_PALETTE.length];
    }
    return categoryColorCache[key];
  }

  // Tag DSFR : fond teinté clair + texte de la couleur, plutôt qu'une pastille pleine.
  function hexToRgba(hex, alpha) {
    var h = (hex || '').replace('#', '');
    var r = parseInt(h.substring(0, 2), 16), g = parseInt(h.substring(2, 4), 16), b = parseInt(h.substring(4, 6), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
  }

  function normalize(s) {
    try {
      return (s || '').toString().normalize('NFD').replace(/\p{Diacritic}/gu, '').toLowerCase();
    } catch (e) {
      return (s || '').toString().toLowerCase();
    }
  }

  // ============================================================
  // Rendu "texte brut -> HTML", sans balise à écrire dans la cellule
  // ============================================================
  function escapeHtml(s) {
    return (s || '').toString()
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function linkify(escapedText) {
    return escapedText.replace(/((https?:\/\/|www\.)[^\s<]+)/gi, function (match) {
      var trail = '';
      var m = match.match(/[.,;:!?)\]]+$/);
      if (m) { trail = m[0]; match = match.slice(0, match.length - trail.length); }
      var href = /^https?:\/\//i.test(match) ? match : 'https://' + match;
      return '<a href="' + href + '" target="_blank" rel="noopener noreferrer">' + match + '</a>' + trail;
    });
  }

  function inlineFormat(escapedLine) {
    var out = linkify(escapedLine);
    out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    out = out.replace(/(^|[^*])\*([^*]+)\*(?!\*)/g, '$1<em>$2</em>');
    return out;
  }

  function renderDescription(text) {
    var raw = (text || '').toString().replace(/\r\n?/g, '\n').trim();
    if (!raw) return '<p class="empty-desc">(Pas de description)</p>';
    var blocks = raw.split(/\n{2,}/);
    return blocks.map(function (block) {
      var lines = block.split('\n').map(function (l) { return l.trim(); }).filter(function (l) { return l.length; });
      if (!lines.length) return '';
      var isBullet = lines.every(function (l) { return /^[-•*]\s+/.test(l); });
      var isNumbered = !isBullet && lines.every(function (l) { return /^\d+[.)]\s+/.test(l); });
      if (isBullet) {
        return '<ul>' + lines.map(function (l) {
          return '<li>' + inlineFormat(escapeHtml(l.replace(/^[-•*]\s+/, ''))) + '</li>';
        }).join('') + '</ul>';
      }
      if (isNumbered) {
        return '<ol>' + lines.map(function (l) {
          return '<li>' + inlineFormat(escapeHtml(l.replace(/^\d+[.)]\s+/, ''))) + '</li>';
        }).join('') + '</ol>';
      }
      return '<p>' + lines.map(function (l) { return inlineFormat(escapeHtml(l)); }).join('<br>') + '</p>';
    }).join('');
  }

  // ============================================================
  // Pièces jointes Grist (colonne Attachments)
  // ============================================================
  var accessTokenInfo = null; // {token, baseUrl, ttlMsecs, fetchedAt}
  async function getAccessToken() {
    var now = Date.now();
    if (accessTokenInfo && (now - accessTokenInfo.fetchedAt) < (accessTokenInfo.ttlMsecs - 5000)) {
      return accessTokenInfo;
    }
    var info = await grist.docApi.getAccessToken({ readOnly: true });
    accessTokenInfo = Object.assign({ fetchedAt: now }, info);
    return accessTokenInfo;
  }

  function attachmentIds(value) {
    if (!value) return [];
    if (Array.isArray(value)) {
      return value[0] === 'L' ? value.slice(1) : value;
    }
    return [];
  }

  var urlCache = Object.create(null); // attachmentId -> url
  async function attachmentUrl(id) {
    if (urlCache[id]) return urlCache[id];
    var info = await getAccessToken();
    var url = info.baseUrl + '/attachments/' + id + '/download?auth=' + encodeURIComponent(info.token);
    urlCache[id] = url;
    return url;
  }

  // ============================================================
  // Grist : chargement des données + liaison avec la sélection du tableau
  // ============================================================
  grist.ready({
    requiredAccess: 'read table',
    columns: [
      { name: 'Description', title: 'Description', type: 'Text' },
      { name: 'Screenshot', title: 'Screenshot', type: 'Attachments' },
      { name: 'Categorie', title: 'Catégorie', type: 'Text', optional: true }
    ]
  });

  grist.onRecords(function (records, mappings) {
    state.colMap = mappings;
    var mapped = grist.mapColumnNames(records, mappings) || records;
    state.records = mapped;
    refreshCategorieFilter();
    renderSidebar();

    // Si l'id sélectionné n'existe plus, ou si rien n'a encore été sélectionné
    // (ni côté widget, ni côté tableau Grist), on affiche la première ligne
    // pour que le panneau ne reste jamais vide inutilement.
    var stillExists = state.selectedId != null && mapped.some(function (r) { return r.id === state.selectedId; });
    if (!stillExists) {
      if (!state.autoSelected && mapped.length) {
        state.selectedId = mapped[0].id;
      } else {
        state.selectedId = null;
      }
    }
    renderDetail();
  });

  // Se déclenche quand une ligne est sélectionnée dans le tableau Grist lié
  // (curseur déplacé dans la grille, ou widget "lié" par sélection de ligne).
  grist.onRecord(function (record) {
    state.autoSelected = true;
    state.selectedId = record ? record.id : null;
    renderSidebar();
    renderDetail();
  });

  function selectInGrist(id) {
    state.autoSelected = true;
    state.selectedId = id;
    renderSidebar();
    renderDetail();
    if (grist.setCursorPos) {
      grist.setCursorPos({ rowId: id }).catch(function () { /* ignore */ });
    }
  }

  // ============================================================
  // Filtres (n'affectent que la liste, pas la sélection en cours)
  // ============================================================
  var categorieSelect = document.getElementById('filter-categorie');
  var searchInput = document.getElementById('filter-search');
  var subtitleEl = document.getElementById('subtitle');
  var sidebarEl = document.getElementById('sidebar');
  var detailEl = document.getElementById('detail');

  function refreshCategorieFilter() {
    var seen = Object.create(null);
    var cats = [];
    state.records.forEach(function (r) {
      var c = (r.Categorie || '').toString().trim();
      if (c && !seen[c]) { seen[c] = true; cats.push(c); }
    });
    cats.sort(function (a, b) { return a.localeCompare(b, 'fr'); });
    var current = state.filterCategorie;
    categorieSelect.innerHTML = '<option value="">Toutes catégories</option>' +
      cats.map(function (c) { return '<option value="' + escapeHtml(c) + '">' + escapeHtml(c) + '</option>'; }).join('');
    if (cats.indexOf(current) !== -1) categorieSelect.value = current;
    else state.filterCategorie = '';
  }

  categorieSelect.addEventListener('change', function () {
    state.filterCategorie = categorieSelect.value;
    renderSidebar();
  });
  searchInput.addEventListener('input', function () {
    state.filterSearch = searchInput.value;
    renderSidebar();
  });

  function visibleRecords() {
    return state.records.filter(function (r) {
      if (state.filterCategorie && (r.Categorie || '').toString().trim() !== state.filterCategorie) return false;
      if (state.filterSearch) {
        var hay = normalize(r.Description) + ' ' + normalize(r.Categorie);
        if (hay.indexOf(normalize(state.filterSearch)) === -1) return false;
      }
      return true;
    });
  }

  function recordById(id) {
    for (var i = 0; i < state.records.length; i++) {
      if (state.records[i].id === id) return { record: state.records[i], index: i };
    }
    return null;
  }

  // ============================================================
  // Rendu de la liste (colonne de gauche)
  // ============================================================
  var sidebarToken = 0;
  async function renderSidebar() {
    var myToken = ++sidebarToken;
    var all = state.records;
    var visible = visibleRecords();

    var catCount = Object.keys(categoryColorCache).length;
    subtitleEl.textContent = all.length
      ? (visible.length === all.length ? all.length + (all.length > 1 ? ' étapes' : ' étape') : visible.length + ' / ' + all.length + ' étapes')
        + (catCount ? ' · ' + catCount + (catCount > 1 ? ' catégories' : ' catégorie') : '')
      : 'Table vide';

    if (!all.length) {
      sidebarEl.innerHTML = '<div class="list-empty">Aucune étape pour le moment.<br>Ajoutez une ligne (Description, Screenshot, Catégorie) dans la table.</div>';
      return;
    }
    if (!visible.length) {
      sidebarEl.innerHTML = '<div class="list-empty">Aucun résultat pour ces filtres.</div>';
      return;
    }

    sidebarEl.innerHTML = visible.map(function (r) {
      var index = all.indexOf(r);
      var isSel = r.id === state.selectedId;
      var cat = (r.Categorie || '').toString().trim();
      var firstLine = (r.Description || '').toString().replace(/\r\n?/g, '\n').split('\n')[0].trim() || '(Pas de description)';
      return (
        '<div class="list-item' + (isSel ? ' selected' : '') + '" data-id="' + r.id + '">' +
          '<span class="li-num">' + (index + 1) + '</span>' +
          '<div class="li-thumb" data-thumb="' + r.id + '"><span class="no-img">…</span></div>' +
          '<div class="li-body">' +
            '<div class="li-desc">' + escapeHtml(firstLine) + '</div>' +
            (cat ? '<div class="li-cat">' + escapeHtml(cat) + '</div>' : '') +
          '</div>' +
        '</div>'
      );
    }).join('');

    Array.prototype.forEach.call(sidebarEl.querySelectorAll('.list-item'), function (el) {
      el.addEventListener('click', function () { selectInGrist(parseInt(el.dataset.id, 10)); });
    });

    // vignettes (petites, chargées en tâche de fond)
    visible.forEach(async function (r) {
      var ids = attachmentIds(r.Screenshot);
      var thumbEl = sidebarEl.querySelector('.li-thumb[data-thumb="' + r.id + '"]');
      if (!thumbEl) return;
      if (!ids.length) { thumbEl.innerHTML = '<span class="no-img">Pas d\'image</span>'; return; }
      try {
        var url = await attachmentUrl(ids[0]);
        if (myToken !== sidebarToken) return;
        var img = new Image();
        img.src = url;
        img.alt = '';
        img.loading = 'lazy';
        img.onerror = function () { thumbEl.innerHTML = '<span class="no-img">?</span>'; };
        thumbEl.innerHTML = '';
        thumbEl.appendChild(img);
      } catch (e) {
        if (myToken !== sidebarToken) return;
        thumbEl.innerHTML = '<span class="no-img">?</span>';
      }
    });
  }

  // ============================================================
  // Rendu du détail (grand panneau)
  // ============================================================
  var detailToken = 0;
  async function renderDetail() {
    var myToken = ++detailToken;

    if (state.selectedId == null) {
      detailEl.innerHTML =
        '<div class="detail-empty"><div class="icon">👆</div>' +
        (state.records.length
          ? 'Sélectionne une ligne dans le tableau (ou dans la liste à gauche) pour afficher son aide.'
          : 'Aucune donnée à afficher pour le moment.') +
        '</div>';
      return;
    }

    var found = recordById(state.selectedId);
    if (!found) {
      detailEl.innerHTML = '<div class="detail-empty"><div class="icon">🔍</div>Cette ligne n\'existe plus dans la table.</div>';
      return;
    }
    var r = found.record, index = found.index;

    var color = colorForCategorie(r.Categorie);
    var badge = r.Categorie
      ? '<span class="badge" style="background:' + hexToRgba(color, .12) + ';color:' + color + '">' + escapeHtml(r.Categorie) + '</span>'
      : '<span class="badge none">Sans catégorie</span>';

    detailEl.innerHTML =
      '<div class="detail-head">' +
        '<span class="step-index">Étape ' + (index + 1) + ' / ' + state.records.length + '</span>' +
        badge +
      '</div>' +
      '<div class="detail-desc-card"><div class="detail-desc">' + renderDescription(r.Description) + '</div></div>' +
      '<div class="detail-image" data-shot="' + r.id + '"><div class="shot-placeholder">Chargement de la capture…</div></div>' +
      '<div class="detail-extra" data-extra="' + r.id + '"></div>';

    var ids = attachmentIds(r.Screenshot);
    var shotEl = detailEl.querySelector('.detail-image[data-shot="' + r.id + '"]');
    var extraEl = detailEl.querySelector('.detail-extra[data-extra="' + r.id + '"]');

    if (!ids.length) {
      shotEl.innerHTML = '<div class="shot-placeholder">Pas de capture pour cette étape</div>';
      return;
    }

    try {
      var urls = await Promise.all(ids.map(attachmentUrl));
      if (myToken !== detailToken) return;

      var mainImg = document.createElement('img');
      mainImg.src = urls[0];
      mainImg.alt = 'Capture d\'écran';
      mainImg.addEventListener('click', function () { openLightbox(urls[0]); });
      mainImg.addEventListener('error', function () {
        shotEl.innerHTML = '<div class="shot-placeholder">Image introuvable ou pièce jointe supprimée</div>';
      });
      shotEl.innerHTML = '';
      shotEl.appendChild(mainImg);

      if (urls.length > 1) {
        extraEl.innerHTML = urls.slice(1).map(function (u) {
          return '<img src="' + u + '" alt="Capture supplémentaire" loading="lazy">';
        }).join('');
        Array.prototype.forEach.call(extraEl.querySelectorAll('img'), function (img, i) {
          img.addEventListener('click', function () { openLightbox(urls[i + 1]); });
        });
      }
    } catch (e) {
      if (myToken !== detailToken) return;
      shotEl.innerHTML = '<div class="shot-placeholder">Image indisponible</div>';
    }
  }

  // ============================================================
  // Lightbox (zoom plein écran)
  // ============================================================
  var lightboxEl = document.getElementById('lightbox');
  var lightboxImgEl = document.getElementById('lightbox-img');
  function openLightbox(src) {
    lightboxImgEl.src = src;
    lightboxEl.classList.add('open');
  }
  function closeLightbox() {
    lightboxEl.classList.remove('open');
    lightboxImgEl.src = '';
  }
  document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
  lightboxEl.addEventListener('click', function (e) { if (e.target === lightboxEl) closeLightbox(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeLightbox(); });

})();
</script>

</body>
</html>
