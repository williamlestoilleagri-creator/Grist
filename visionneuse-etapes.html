<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visionneuse d'étapes</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  :root{
    --bg: #F5F4F0;
    --surface: #FFFFFF;
    --ink: #1B1B1E;
    --ink-soft: #65656B;
    --ink-faint: #9A9A9F;
    --border: #E2E0D8;
    --primary: #000091;
    --primary-soft: #E5E5FB;
    --radius-card: 10px;
    --shadow: 0 1px 2px rgba(20,20,30,.06), 0 8px 24px -16px rgba(20,20,30,.25);
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body);
    font-size:13.5px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }

  .app{ display:flex; flex-direction:column; height:100vh; min-height:400px; }

  /* ---------- header ---------- */
  .app-header{
    display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
    padding:12px 16px; background:var(--primary); color:#fff; flex:0 0 auto;
  }
  .app-header h1{ font-weight:700; font-size:15.5px; margin:0; letter-spacing:.2px; }
  .app-header .sub{ font-size:11.5px; opacity:.8; margin-top:2px; }
  .controls{ display:flex; gap:8px; flex-wrap:wrap; }
  .controls select, .controls input[type="search"]{
    border:1px solid rgba(255,255,255,.35); background:rgba(255,255,255,.12); color:#fff;
    border-radius:7px; padding:6px 9px; font-size:12.5px; outline:none;
  }
  .controls select option{ color:#111; }
  .controls input[type="search"]::placeholder{ color:rgba(255,255,255,.75); }
  .controls select:focus, .controls input[type="search"]:focus{ background:rgba(255,255,255,.22); }

  /* ---------- timeline ---------- */
  .timeline{ flex:1 1 auto; overflow-y:auto; padding:20px 18px 40px; max-width:820px; margin:0 auto; width:100%; }
  .empty{ margin:40px 14px; text-align:center; color:var(--ink-faint); font-size:13px; line-height:1.7; }

  .step{ display:flex; gap:14px; position:relative; }
  .step:not(:last-child) .step-marker::after{
    content:''; position:absolute; top:30px; bottom:-8px; left:50%; width:2px;
    transform:translateX(-50%); background:var(--border);
  }
  .step-marker{ flex:0 0 auto; width:30px; display:flex; justify-content:center; position:relative; }
  .step-num{
    width:28px; height:28px; border-radius:50%; background:var(--primary); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px;
    flex:0 0 auto; box-shadow:0 0 0 4px var(--bg);
  }
  .step-card{
    flex:1 1 auto; min-width:0; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-card); box-shadow:var(--shadow); margin-bottom:22px; padding:14px 16px;
    cursor:pointer; transition:border-color .12s, box-shadow .12s;
  }
  .step-card:hover{ border-color:var(--primary); }
  .step-card.selected{ border-color:var(--primary); box-shadow:0 0 0 2px var(--primary-soft), var(--shadow); }

  .step-head{ display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
  .badge{
    font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:999px; color:#fff;
    letter-spacing:.02em; white-space:nowrap;
  }
  .badge.none{ background:var(--ink-faint); }

  .step-desc{ font-size:13.5px; color:var(--ink); margin-bottom:10px; }
  .step-desc p{ margin:0 0 8px; }
  .step-desc p:last-child{ margin-bottom:0; }
  .step-desc ul, .step-desc ol{ margin:0 0 8px 18px; padding:0; }
  .step-desc a{ color:var(--primary); }
  .step-desc .empty-desc{ color:var(--ink-faint); font-style:italic; }

  .step-shot{ margin-top:6px; }
  .shot-main{
    display:block; max-width:100%; max-height:360px; border-radius:8px; border:1px solid var(--border);
    cursor:zoom-in; object-fit:contain; background:#F0EFE9;
  }
  .shot-placeholder{
    display:flex; align-items:center; justify-content:center; height:90px; border-radius:8px;
    border:1px dashed var(--border); color:var(--ink-faint); font-size:12px; background:#FAFAF7;
  }
  .shot-extra{ display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
  .shot-extra img{
    width:56px; height:56px; object-fit:cover; border-radius:6px; border:1px solid var(--border);
    cursor:zoom-in;
  }

  /* ---------- lightbox ---------- */
  .lightbox{
    position:fixed; inset:0; background:rgba(15,15,18,.86); display:none;
    align-items:center; justify-content:center; z-index:1000; padding:30px;
  }
  .lightbox.open{ display:flex; }
  .lightbox img{ max-width:100%; max-height:100%; border-radius:6px; box-shadow:0 20px 60px rgba(0,0,0,.5); }
  .lightbox-close{
    position:absolute; top:16px; right:18px; background:rgba(255,255,255,.12); border:none; color:#fff;
    width:34px; height:34px; border-radius:50%; font-size:18px; cursor:pointer; line-height:1;
  }
  .lightbox-close:hover{ background:rgba(255,255,255,.24); }
</style>
</head>
<body>

<div class="app">
  <header class="app-header">
    <div>
      <h1>Visionneuse d'étapes</h1>
      <div class="sub" id="subtitle">Connexion à Grist…</div>
    </div>
    <div class="controls">
      <select id="filter-categorie"><option value="">Toutes catégories</option></select>
      <input type="search" id="filter-search" placeholder="Rechercher dans la description…">
    </div>
  </header>

  <main class="timeline" id="timeline">
    <div class="empty">En attente des données…</div>
  </main>
</div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightbox-close" title="Fermer">×</button>
  <img id="lightbox-img" src="" alt="Capture en grand">
</div>

<script>
(function(){
  'use strict';

  // ============================================================
  // Etat
  // ============================================================
  var state = {
    records: [],      // enregistrements bruts mappés (Description, Screenshot, Categorie, id)
    colMap: null,
    filterCategorie: '',
    filterSearch: '',
    selectedId: null
  };

  var CATEGORY_PALETTE = ['#000091', '#C9184A', '#18753C', '#B34000', '#6E445A', '#007C7C', '#716043', '#3D5A80', '#9A6324', '#2B5797'];
  var categoryColorCache = Object.create(null);
  function colorForCategorie(cat) {
    var key = (cat || '').trim().toLowerCase();
    if (!key) return null;
    if (!categoryColorCache[key]) {
      var n = Object.keys(categoryColorCache).length;
      categoryColorCache[key] = CATEGORY_PALETTE[n % CATEGORY_PALETTE.length];
    }
    return categoryColorCache[key];
  }

  function normalize(s) {
    return (s || '').toString().normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  }

  // ============================================================
  // Rendu "texte brut -> HTML", sans balise à écrire dans la cellule
  // ============================================================
  function escapeHtml(s) {
    return (s || '').toString()
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function linkify(escapedText) {
    return escapedText.replace(/((https?:\/\/|www\.)[^\s<]+)/gi, function (match) {
      var trail = '';
      var m = match.match(/[.,;:!?)\]]+$/);
      if (m) { trail = m[0]; match = match.slice(0, match.length - trail.length); }
      var href = /^https?:\/\//i.test(match) ? match : 'https://' + match;
      return '<a href="' + href + '" target="_blank" rel="noopener noreferrer">' + match + '</a>' + trail;
    });
  }

  function inlineFormat(escapedLine) {
    var out = linkify(escapedLine);
    out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    out = out.replace(/(^|[^*])\*([^*]+)\*(?!\*)/g, '$1<em>$2</em>');
    return out;
  }

  function renderDescription(text) {
    var raw = (text || '').toString().replace(/\r\n?/g, '\n').trim();
    if (!raw) return '<p class="empty-desc">(Pas de description)</p>';
    var blocks = raw.split(/\n{2,}/);
    return blocks.map(function (block) {
      var lines = block.split('\n').map(function (l) { return l.trim(); }).filter(function (l) { return l.length; });
      if (!lines.length) return '';
      var isBullet = lines.every(function (l) { return /^[-•*]\s+/.test(l); });
      var isNumbered = !isBullet && lines.every(function (l) { return /^\d+[.)]\s+/.test(l); });
      if (isBullet) {
        return '<ul>' + lines.map(function (l) {
          return '<li>' + inlineFormat(escapeHtml(l.replace(/^[-•*]\s+/, ''))) + '</li>';
        }).join('') + '</ul>';
      }
      if (isNumbered) {
        return '<ol>' + lines.map(function (l) {
          return '<li>' + inlineFormat(escapeHtml(l.replace(/^\d+[.)]\s+/, ''))) + '</li>';
        }).join('') + '</ol>';
      }
      return '<p>' + lines.map(function (l) { return inlineFormat(escapeHtml(l)); }).join('<br>') + '</p>';
    }).join('');
  }

  // ============================================================
  // Pièces jointes Grist (colonne Attachments)
  // ============================================================
  var accessTokenInfo = null; // {token, baseUrl, ttlMsecs, fetchedAt}
  async function getAccessToken() {
    var now = Date.now();
    if (accessTokenInfo && (now - accessTokenInfo.fetchedAt) < (accessTokenInfo.ttlMsecs - 5000)) {
      return accessTokenInfo;
    }
    var info = await grist.docApi.getAccessToken({ readOnly: true });
    accessTokenInfo = Object.assign({ fetchedAt: now }, info);
    return accessTokenInfo;
  }

  function attachmentIds(value) {
    if (!value) return [];
    if (Array.isArray(value)) {
      return value[0] === 'L' ? value.slice(1) : value;
    }
    return [];
  }

  async function attachmentUrl(id) {
    var info = await getAccessToken();
    return info.baseUrl + '/attachments/' + id + '/download?auth=' + encodeURIComponent(info.token);
  }

  // ============================================================
  // Grist
  // ============================================================
  grist.ready({
    requiredAccess: 'read table',
    columns: [
      { name: 'Description', title: 'Description', type: 'Text' },
      { name: 'Screenshot', title: 'Screenshot', type: 'Attachments' },
      { name: 'Categorie', title: 'Catégorie', type: 'Text', optional: true }
    ]
  });

  grist.onRecords(function (records, mappings) {
    state.colMap = mappings;
    var mapped = grist.mapColumnNames(records, mappings) || records;
    state.records = mapped;
    refreshCategorieFilter();
    render();
  });

  grist.onRecord(function (record) {
    if (!record) return;
    state.selectedId = record.id;
    highlightSelected();
    var card = timelineEl.querySelector('[data-id="' + record.id + '"]');
    if (card) card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  });

  function selectInGrist(id) {
    state.selectedId = id;
    highlightSelected();
    if (grist.setCursorPos) {
      grist.setCursorPos({ rowId: id }).catch(function () { /* ignore */ });
    }
  }

  function highlightSelected() {
    Array.prototype.forEach.call(timelineEl.querySelectorAll('.step-card'), function (el) {
      el.classList.toggle('selected', el.dataset.id === String(state.selectedId));
    });
  }

  // ============================================================
  // Filtres
  // ============================================================
  var categorieSelect = document.getElementById('filter-categorie');
  var searchInput = document.getElementById('filter-search');
  var subtitleEl = document.getElementById('subtitle');
  var timelineEl = document.getElementById('timeline');

  function refreshCategorieFilter() {
    var seen = Object.create(null);
    var cats = [];
    state.records.forEach(function (r) {
      var c = (r.Categorie || '').toString().trim();
      if (c && !seen[c]) { seen[c] = true; cats.push(c); }
    });
    cats.sort(function (a, b) { return a.localeCompare(b, 'fr'); });
    var current = state.filterCategorie;
    categorieSelect.innerHTML = '<option value="">Toutes catégories</option>' +
      cats.map(function (c) { return '<option value="' + escapeHtml(c) + '">' + escapeHtml(c) + '</option>'; }).join('');
    if (cats.indexOf(current) !== -1) categorieSelect.value = current;
    else state.filterCategorie = '';
  }

  categorieSelect.addEventListener('change', function () {
    state.filterCategorie = categorieSelect.value;
    render();
  });
  searchInput.addEventListener('input', function () {
    state.filterSearch = searchInput.value;
    render();
  });

  function visibleRecords() {
    return state.records.filter(function (r) {
      if (state.filterCategorie && (r.Categorie || '').toString().trim() !== state.filterCategorie) return false;
      if (state.filterSearch) {
        var hay = normalize(r.Description) + ' ' + normalize(r.Categorie);
        if (hay.indexOf(normalize(state.filterSearch)) === -1) return false;
      }
      return true;
    });
  }

  // ============================================================
  // Rendu
  // ============================================================
  var renderToken = 0;
  async function render() {
    var myToken = ++renderToken;
    var all = state.records;
    var visible = visibleRecords();

    var n = all.length, nv = visible.length;
    var catCount = Object.keys(categoryColorCache).length || categorieSelect.options.length - 1;
    subtitleEl.textContent = n
      ? (nv === n ? nv + (nv > 1 ? ' étapes' : ' étape') : nv + ' / ' + n + ' étapes affichées') +
        (catCount ? ' · ' + catCount + (catCount > 1 ? ' catégories' : ' catégorie') : '')
      : 'Table vide';

    if (!all.length) {
      timelineEl.innerHTML = '<div class="empty">Aucune étape pour le moment.<br>Ajoutez une ligne dans la table (Description, Screenshot, Catégorie) pour commencer.</div>';
      return;
    }
    if (!visible.length) {
      timelineEl.innerHTML = '<div class="empty">Aucun résultat pour ces filtres.</div>';
      return;
    }

    // Résolution des URLs d'images en parallèle, sans bloquer un affichage texte immédiat.
    var shells = visible.map(function (r, i) { return stepShell(r, i); });
    timelineEl.innerHTML = shells.join('');
    highlightSelected();
    bindCardEvents();

    await Promise.all(visible.map(async function (r) {
      var ids = attachmentIds(r.Screenshot);
      if (!ids.length) return;
      try {
        var urls = await Promise.all(ids.map(attachmentUrl));
        if (myToken !== renderToken) return;
        fillShots(r.id, urls);
      } catch (e) {
        if (myToken !== renderToken) return;
        var shotEl = timelineEl.querySelector('.step-shot[data-id="' + r.id + '"]');
        if (shotEl) shotEl.innerHTML = '<div class="shot-placeholder">Image indisponible</div>';
      }
    }));
  }

  function stepShell(r, index) {
    var color = colorForCategorie(r.Categorie);
    var badge = r.Categorie
      ? '<span class="badge" style="background:' + (color || '#666') + '">' + escapeHtml(r.Categorie) + '</span>'
      : '<span class="badge none">Sans catégorie</span>';
    return (
      '<article class="step">' +
        '<div class="step-marker"><span class="step-num">' + (index + 1) + '</span></div>' +
        '<div class="step-card" data-id="' + r.id + '">' +
          '<div class="step-head">' + badge + '</div>' +
          '<div class="step-desc">' + renderDescription(r.Description) + '</div>' +
          '<div class="step-shot" data-id="' + r.id + '"><div class="shot-placeholder">Chargement de la capture…</div></div>' +
        '</div>' +
      '</article>'
    );
  }

  function fillShots(id, urls) {
    var shotEl = timelineEl.querySelector('.step-shot[data-id="' + id + '"]');
    if (!shotEl) return;
    if (!urls.length) { shotEl.innerHTML = '<div class="shot-placeholder">Pas de capture</div>'; return; }
    var main = urls[0];
    var extra = urls.slice(1);
    shotEl.innerHTML =
      '<img class="shot-main" src="' + main + '" alt="Capture d\'écran" loading="lazy">' +
      (extra.length
        ? '<div class="shot-extra">' + extra.map(function (u) { return '<img src="' + u + '" alt="Capture supplémentaire" loading="lazy">'; }).join('') + '</div>'
        : '');
    shotEl.querySelectorAll('img').forEach(function (img) {
      img.addEventListener('click', function (e) { e.stopPropagation(); openLightbox(img.src); });
      img.addEventListener('error', function () {
        img.replaceWith(Object.assign(document.createElement('div'), {
          className: 'shot-placeholder', textContent: "Image introuvable ou pièce jointe supprimée"
        }));
      });
    });
  }

  function bindCardEvents() {
    Array.prototype.forEach.call(timelineEl.querySelectorAll('.step-card'), function (card) {
      card.addEventListener('click', function () {
        selectInGrist(parseInt(card.dataset.id, 10));
      });
    });
  }

  // ============================================================
  // Lightbox
  // ============================================================
  var lightboxEl = document.getElementById('lightbox');
  var lightboxImgEl = document.getElementById('lightbox-img');
  function openLightbox(src) {
    lightboxImgEl.src = src;
    lightboxEl.classList.add('open');
  }
  function closeLightbox() {
    lightboxEl.classList.remove('open');
    lightboxImgEl.src = '';
  }
  document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
  lightboxEl.addEventListener('click', function (e) { if (e.target === lightboxEl) closeLightbox(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeLightbox(); });

})();
</script>

</body>
</html>
