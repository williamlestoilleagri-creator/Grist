<!DOCTYPE html>
<html lang="fr" data-fr-scheme="light" data-fr-theme="light" data-fr-js="false">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanban · ToDoList</title>

<!-- Spectral : typo de citation/grand titre utilisée par le DSFR en complément de Marianne -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@600;700&display=swap" rel="stylesheet">

<!-- Système de Design de l'État (DSFR) — CDN officiel -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.15.2/dist/dsfr.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.15.2/dist/utility/icons/icons.min.css">
<script type="module" src="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.15.2/dist/dsfr.module.min.js"></script>
<script type="text/javascript" nomodule src="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.15.2/dist/dsfr.nomodule.min.js"></script>

<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

<style>
  /*
    Alias de secours : reprennent les tokens couleur du DSFR quand ils existent
    (chargés depuis dsfr.min.css), sinon retombent sur les teintes officielles
    en dur — le widget reste fidèle même si le CDN est injoignable.
  */
  :root{
    --kb-blue: var(--background-action-high-blue-france, #000091);
    --kb-blue-hover: var(--background-action-high-blue-france-hover, #1212ff);
    --kb-blue-text: var(--text-action-high-blue-france, #000091);
    --kb-blue-soft: var(--background-contrast-blue-france, #f5f5fe);
    --kb-grey-bg: var(--background-default-grey, #ffffff);
    --kb-grey-alt: var(--background-alt-grey, #f6f6f6);
    --kb-grey-contrast: var(--background-contrast-grey, #eeeeee);
    --kb-hover-tint: var(--background-action-low-blue-france-hover, #e8edff);
    --kb-border: var(--border-default-grey, #ddd);
    --kb-title: var(--text-title-grey, #161616);
    --kb-text: var(--text-default-grey, #3a3a3a);
    --kb-mention: var(--text-mention-grey, #666666);
    --kb-success: var(--text-default-success, #18753c);
    --kb-success-bg: var(--background-contrast-success, #dffee0);
    --kb-error: var(--text-default-error, #ce0500);
    --kb-error-bg: var(--background-contrast-error, #ffe9e9);
    --kb-warning: var(--text-default-warning, #b34000);
    --kb-warning-bg: var(--background-contrast-warning, #fff3e0);
    --kb-shadow: 0 6px 18px 0 rgba(0, 0, 18, .16);
    --font-display: 'Spectral', Georgia, serif;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--kb-grey-alt); color:var(--kb-text);
    font-family: Marianne, arial, sans-serif; font-size:13.5px; line-height:1.45;
  }
  button, input, select, textarea{ font-family:inherit; }
  p{ margin:0; }

  .app{ display:flex; flex-direction:column; height:100vh; min-height:420px; }

  /* ---------- en-tête ---------- */
  .app-header{
    display:flex; align-items:center; gap:14px; padding:10px 16px;
    background:var(--kb-grey-bg); border-bottom:2px solid var(--kb-blue); flex:0 0 auto; flex-wrap:wrap;
  }
  .app-header__brand{ display:flex; align-items:center; gap:9px; }
  .app-header__title{
    font-family:var(--font-display); font-weight:700; font-size:16.5px; color:var(--kb-title); margin:0;
    white-space:nowrap;
  }
  .app-header__title small{ font-weight:600; color:var(--kb-mention); font-size:13px; }
  .app-header__tools{ display:flex; align-items:center; gap:8px; flex:1; min-width:260px; flex-wrap:wrap; }

  .fr-search-bar{ flex:1; min-width:170px; }

  .filter-wrap{ position:relative; flex:0 0 auto; }
  .filter-pop{
    position:absolute; top:calc(100% + 6px); right:0; z-index:900; background:var(--kb-grey-bg);
    border:1px solid var(--kb-border); box-shadow:var(--kb-shadow); width:236px;
    max-height:340px; overflow-y:auto; padding:12px; display:none;
  }
  .filter-pop.open{ display:block; }
  .filter-group{ margin-bottom:12px; }
  .filter-group:last-child{ margin-bottom:0; }
  .filter-group .ftitle{
    font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
    color:var(--kb-mention); margin-bottom:7px;
  }
  .fr-tags-group{ display:flex; flex-wrap:wrap; gap:6px; list-style:none; margin:0; padding:0; }
  .filter-clear{
    font-size:11px; color:var(--kb-blue-text); background:none; border:none; cursor:pointer; padding:4px 2px;
    text-decoration:underline;
  }

  /* ---------- planche ---------- */
  .board-wrap{ flex:1 1 auto; min-height:0; overflow-x:auto; overflow-y:hidden; padding:14px; }
  .board{ display:flex; gap:12px; height:100%; align-items:flex-start; }
  .lane{
    flex:0 0 276px; width:276px; background:var(--kb-grey-alt); border:1px solid var(--kb-border);
    display:flex; flex-direction:column; max-height:100%;
  }
  .lane.drag-over{ outline:2px dashed var(--kb-blue); outline-offset:-2px; background:var(--kb-blue-soft); }
  .lane-head{
    display:flex; align-items:center; gap:8px; padding:10px 10px 9px; flex:0 0 auto;
    border-bottom:1px solid var(--kb-border);
  }
  .lane-name{ font-weight:700; font-size:12.5px; color:var(--kb-title); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lane-body{ flex:1 1 auto; overflow-y:auto; padding:9px; display:flex; flex-direction:column; gap:8px; min-height:40px; }
  .lane-empty{ font-size:11.5px; color:var(--kb-mention); text-align:center; padding:14px 6px; }

  /* ---------- carte ---------- */
  .card{
    background:var(--kb-grey-bg); border:1px solid var(--kb-border); padding:10px 11px;
    cursor:grab; transition:background .1s, box-shadow .1s;
  }
  .card:hover{ box-shadow:var(--kb-shadow); background:var(--kb-hover-tint); }
  .card.dragging{ opacity:.4; }
  .card .badges{ display:flex; flex-wrap:wrap; gap:4px; margin-bottom:6px; }
  .card .title{ font-weight:700; font-size:13px; line-height:1.35; color:var(--kb-title); margin-bottom:4px; word-break:break-word; }
  .card .details{
    font-size:11.5px; color:var(--kb-mention); margin-bottom:7px; line-height:1.4;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .card .meta-row{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:6px; }
  .avatars{ display:flex; margin-left:2px; }
  .avatar{
    width:19px; height:19px; border-radius:50%; background:var(--kb-blue); color:#fff;
    font-size:9px; font-weight:700; display:flex; align-items:center; justify-content:center;
    border:1.5px solid var(--kb-grey-bg); margin-left:-6px;
  }
  .avatar:first-child{ margin-left:0; }
  .progress-track{ height:5px; background:var(--kb-grey-contrast); overflow:hidden; }
  .progress-fill{ height:100%; background:var(--kb-success); }
  .progress-label{ font-size:9.5px; color:var(--kb-mention); margin-top:3px; text-align:right; }

  .board-empty{
    margin:60px auto; text-align:center; color:var(--kb-mention); font-size:13px; line-height:1.7; max-width:340px;
  }

  /* ---------- tiroir ---------- */
  .scrim{ position:fixed; inset:0; background:rgba(18,18,18,.4); z-index:1000; display:none; }
  .scrim.open{ display:block; }
  .drawer{
    position:fixed; top:0; right:0; bottom:0; width:392px; max-width:94vw; background:var(--kb-grey-bg);
    z-index:1001; box-shadow:var(--kb-shadow); transform:translateX(100%); transition:transform .18s ease;
    display:flex; flex-direction:column;
  }
  .drawer.open{ transform:translateX(0); }
  .drawer-head{
    display:flex; align-items:flex-start; gap:6px; padding:16px 16px 12px; border-bottom:1px solid var(--kb-border);
    flex:0 0 auto;
  }
  .drawer-title{
    flex:1; border:none; background:none; font-family:var(--font-display); font-weight:700; font-size:18px;
    color:var(--kb-title); resize:none; outline:none; line-height:1.3; padding:2px 0;
  }
  .drawer-body{ flex:1 1 auto; overflow-y:auto; padding:4px 16px 16px; }
  .field-block{ margin-bottom:18px; }
  .field-block .flabel{
    font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
    color:var(--kb-mention); margin-bottom:7px;
  }
  .date-row{ display:flex; gap:10px; }
  .date-row > div{ flex:1; }
  .attach-info{ font-size:12px; color:var(--kb-mention); }
  .drawer-foot{ flex:0 0 auto; padding:12px 16px; border-top:1px solid var(--kb-border); }
  .foot-meta{ font-size:10.5px; color:var(--kb-mention); line-height:1.5; margin-bottom:10px; }
  .foot-actions{ display:flex; gap:8px; }
  .foot-actions .fr-btn{ flex:1; justify-content:center; }
  .btn-danger-text{ color:var(--kb-error) !important; }

  .toast{
    position:fixed; bottom:16px; left:50%; transform:translateX(-50%); z-index:1200;
    background:var(--kb-title); color:#fff; font-size:12.5px; padding:9px 15px;
    box-shadow:var(--kb-shadow); display:none;
  }
  .toast.show{ display:block; }
  .toast.error{ background:var(--kb-error); }
</style>
</head>
<body>

<div class="app">
  <header class="app-header">
    <div class="app-header__brand">
      <p class="app-header__title">Kanban <small>· ToDoList</small></p>
      <p class="fr-badge fr-badge--sm" id="record-count">0 action</p>
    </div>
    <div class="app-header__tools">
      <div class="fr-search-bar" id="search-bar" role="search">
        <label class="fr-label" for="search-input">Rechercher une action</label>
        <input class="fr-input" type="search" id="search-input" placeholder="Rechercher une action…">
        <button class="fr-btn" title="Rechercher">Rechercher</button>
      </div>
      <div class="filter-wrap">
        <button type="button" class="fr-btn fr-btn--secondary fr-btn--sm fr-btn--icon-left fr-icon-filter-line" id="filter-btn" aria-expanded="false">Filtres</button>
        <div class="filter-pop" id="filter-pop"></div>
      </div>
      <button type="button" class="fr-btn fr-btn--sm fr-btn--icon-left fr-icon-add-line" id="add-btn" disabled>Nouvelle action</button>
    </div>
  </header>

  <div class="board-wrap">
    <div class="board" id="board"></div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <textarea class="drawer-title" id="d-title" rows="1" placeholder="Titre de l'action…"></textarea>
    <button type="button" class="fr-btn fr-btn--tertiary-no-outline fr-btn--icon-left fr-icon-close-line" id="d-close" title="Fermer"><span class="fr-sr-only">Fermer</span></button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
  <div class="drawer-foot">
    <div class="foot-meta" id="d-meta"></div>
    <div class="foot-actions">
      <button type="button" class="fr-btn fr-btn--secondary fr-btn--sm fr-btn--icon-left fr-icon-external-link-line" id="d-open-grist">Voir dans Grist</button>
      <button type="button" class="fr-btn fr-btn--secondary fr-btn--sm fr-btn--icon-left fr-icon-delete-line btn-danger-text" id="d-delete">Supprimer</button>
    </div>
  </div>
</aside>

<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';

  // ============================================================
  // Constantes
  // ============================================================
  // Palette illustrative officielle du DSFR (17 teintes), utilisée pour
  // colorer de façon déterministe les badges/tags sans valeur de couleur
  // explicite dans Grist.
  var ACCENT_NAMES = [
    'green-tilleul-verveine','green-bourgeon','green-emeraude','green-menthe','green-archipel',
    'blue-ecume','blue-cumulus','purple-glycine','pink-macaron','pink-tuile',
    'yellow-tournesol','yellow-moutarde','orange-terre-battue','brown-cafe-creme',
    'brown-caramel','brown-opera','beige-gris-galet'
  ];
  var DONE_RE = /termin|✅|fait|clôtur|cloture/i;
  var BLOCKED_RE = /bloq|⛔|annul|abandon/i;
  var WAITING_RE = /attente|pause|⏸|stand.?by/i;
  var PROGRESS_RE = /cours|progress|♻️|🔄/i;

  // ============================================================
  // Etat
  // ============================================================
  var state = {
    records: [],
    mappings: null,
    ready: false,
    tableResolved: false,
    colMeta: { Status:null, Theme:null, Structure:null },
    refLabels: { Assignee:null, Support:null },
    filters: { search:'', theme:new Set(), structure:new Set(), assignee:new Set() },
    openId: null
  };

  function $(id){ return document.getElementById(id); }

  // ============================================================
  // Utils
  // ============================================================
  function escapeHtml(s){
    return (s == null ? '' : s).toString()
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function slug(s){
    return (s == null ? '' : s).toString().toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'x';
  }
  function decodeList(v){
    if (v == null) return [];
    if (Array.isArray(v)) return v[0] === 'L' ? v.slice(1) : v;
    return [v];
  }
  function pad2(n){ return n < 10 ? '0' + n : '' + n; }
  function dateToInput(v){
    if (v == null || v === '') return '';
    var d = new Date(v * 1000);
    return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate());
  }
  function inputToDate(s){
    if (!s) return null;
    var p = s.split('-').map(Number);
    return Math.round(Date.UTC(p[0], p[1] - 1, p[2]) / 1000);
  }
  function formatDateShort(v){
    if (v == null || v === '') return '';
    var d = new Date(v * 1000);
    return pad2(d.getUTCDate()) + '/' + pad2(d.getUTCMonth() + 1);
  }
  function formatDateTime(v){
    if (v == null || v === '') return '—';
    try {
      return new Date(v * 1000).toLocaleString('fr-FR', { dateStyle:'medium', timeStyle:'short', timeZone:'Europe/Paris' });
    } catch(e){ return new Date(v * 1000).toLocaleString('fr-FR'); }
  }
  function daysUntil(v){
    if (v == null || v === '') return null;
    var today = Math.floor(Date.UTC(new Date().getUTCFullYear(), new Date().getUTCMonth(), new Date().getUTCDate()) / 86400000);
    var due = Math.floor(v / 86400);
    return due - today;
  }
  function debounce(fn, ms){
    var t;
    return function(){
      var args = arguments, ctx = this;
      clearTimeout(t);
      t = setTimeout(function(){ fn.apply(ctx, args); }, ms);
    };
  }
  function initials(name){
    var parts = (name || '').trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return '?';
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  }
  function accentFor(value){
    var str = (value || '').toString();
    var hash = 0;
    for (var i = 0; i < str.length; i++) hash = (hash * 31 + str.charCodeAt(i)) >>> 0;
    return ACCENT_NAMES[hash % ACCENT_NAMES.length];
  }
  // Classe/style d'un badge : priorité à la couleur définie dans Grist
  // (choiceOptions du champ Choice/ChoiceList), sinon teinte DSFR déterministe.
  function badgeAppearance(value, meta){
    if (meta && meta.choiceOptions && meta.choiceOptions[value]) {
      var o = meta.choiceOptions[value];
      if (o.fillColor || o.textColor) {
        return { cls: 'fr-badge--no-icon', style: 'background:' + (o.fillColor || '#eee') + ';color:' + (o.textColor || '#3a3a3a') };
      }
    }
    return { cls: 'fr-badge--no-icon fr-badge--' + accentFor(value), style: '' };
  }
  function statusBadgeClass(status){
    if (DONE_RE.test(status)) return 'fr-badge--success';
    if (BLOCKED_RE.test(status)) return 'fr-badge--error';
    if (WAITING_RE.test(status)) return 'fr-badge--warning';
    if (PROGRESS_RE.test(status)) return 'fr-badge--info';
    return 'fr-badge--' + accentFor(status);
  }
  function showToast(msg, isError){
    var t = $('toast');
    t.textContent = msg;
    t.className = 'toast show' + (isError ? ' error' : '');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){ t.classList.remove('show'); }, 3600);
  }

  // ============================================================
  // Grist : configuration & réception des données
  // ============================================================
  grist.ready({
    requiredAccess: 'full',
    columns: [
      { name:'Title', title:'Action', type:'Text' },
      { name:'Status', title:'Statut', type:'Choice' },
      { name:'Assignee', title:'Pilote action', type:'Ref,RefList', optional:true },
      { name:'Support', title:'Appui action', type:'Ref,RefList', optional:true },
      { name:'Theme', title:'Thème', type:'Choice,ChoiceList', optional:true },
      { name:'Structure', title:'Structure ou service', type:'Choice,ChoiceList', optional:true },
      { name:'Details', title:"Détails de l'action", type:'Text', optional:true },
      { name:'Suites', title:'Suites données', type:'Text', optional:true },
      { name:'DateStart', title:'Date de début', type:'Date,DateTime', optional:true },
      { name:'DateDue', title:'Date de fin', type:'Date,DateTime', optional:true },
      { name:'Progress', title:'Progression', type:'Numeric,Int', optional:true },
      { name:'Attachments', title:'Pièces jointes', type:'Attachments', optional:true },
      { name:'LastUpdate', title:'Dernière mise à jour', type:'DateTime,Date', optional:true },
      { name:'LastUpdateBy', title:'Dernière mise à jour par', type:'Text', optional:true }
    ]
  });

  var lastMappingsJson = null;

  grist.onRecords(function(records, mappings){
    state.mappings = mappings || null;
    state.ready = !!(mappings && mappings.Title && mappings.Status);
    var mapped = (mappings && grist.mapColumnNames(records, mappings)) || [];
    state.records = mapped;
    $('add-btn').disabled = !state.ready;

    if (state.ready) {
      var mj = JSON.stringify(mappings);
      if (mj !== lastMappingsJson) {
        lastMappingsJson = mj;
        state.tableResolved = false;
        resolveMeta(mappings).catch(function(e){ console.warn('resolveMeta', e); }).then(renderAll);
      }
    }
    renderAll();
    syncOpenDrawer();
  });

  // ------------------------------------------------------------
  // Résolution des métadonnées (choix, couleurs, libellés de référence)
  // ------------------------------------------------------------
  async function resolveMeta(mappings){
    var neededColIds = [];
    ['Title','Status','Assignee','Support','Theme','Structure','Details','Suites','DateStart','DateDue','Progress'].forEach(function(k){
      if (mappings[k]) neededColIds.push(mappings[k]);
    });

    var columnsData = await grist.docApi.fetchTable('_grist_Tables_column');

    var byParent = {};
    for (var i = 0; i < columnsData.id.length; i++) {
      var p = columnsData.parentId[i];
      (byParent[p] = byParent[p] || []).push(i);
    }
    var matchedParent = null;
    Object.keys(byParent).forEach(function(p){
      if (matchedParent != null) return;
      var idxs = byParent[p];
      var colSet = {};
      idxs.forEach(function(i){ colSet[columnsData.colId[i]] = true; });
      var ok = neededColIds.every(function(c){ return colSet[c]; });
      if (ok) matchedParent = p;
    });
    if (matchedParent == null) { state.tableResolved = false; return; }

    function findIdx(colId){
      var idxs = byParent[matchedParent] || [];
      for (var k = 0; k < idxs.length; k++) if (columnsData.colId[idxs[k]] === colId) return idxs[k];
      return -1;
    }
    function metaFor(colId){
      var idx = findIdx(colId);
      if (idx === -1) return null;
      var opts = {};
      try { opts = JSON.parse(columnsData.widgetOptions[idx] || '{}'); } catch(e){}
      return { choices: opts.choices || [], choiceOptions: opts.choiceOptions || {} };
    }
    async function refLabelsFor(colId){
      var idx = findIdx(colId);
      if (idx === -1) return null;
      var m = /^Ref(?:List)?:(.+)$/.exec(columnsData.type[idx] || '');
      if (!m) return null;
      var targetTableId = m[1];
      var visibleColRef = columnsData.visibleCol[idx];
      var displayColId = null;
      if (visibleColRef) {
        var vIdx = columnsData.id.indexOf(visibleColRef);
        if (vIdx !== -1) displayColId = columnsData.colId[vIdx];
      }
      var targetData;
      try { targetData = await grist.docApi.fetchTable(targetTableId); }
      catch(e){ return null; }
      var labelCol = (displayColId && targetData[displayColId]) ? displayColId :
        ['Acteurs','Name','Nom','Label','Title'].filter(function(c){ return targetData[c]; })[0] || null;
      var map = {};
      targetData.id.forEach(function(rid, i){
        map[rid] = labelCol ? String(targetData[labelCol][i] == null ? ('#' + rid) : targetData[labelCol][i]) : ('#' + rid);
      });
      return map;
    }

    state.colMeta.Status = metaFor(mappings.Status);
    state.colMeta.Theme = mappings.Theme ? metaFor(mappings.Theme) : null;
    state.colMeta.Structure = mappings.Structure ? metaFor(mappings.Structure) : null;
    state.refLabels.Assignee = mappings.Assignee ? await refLabelsFor(mappings.Assignee) : null;
    state.refLabels.Support = mappings.Support ? await refLabelsFor(mappings.Support) : null;
    state.tableResolved = true;
  }

  function assigneeLabel(id, key){
    var map = state.refLabels[key];
    return (map && map[id]) || ('#' + id);
  }

  // ============================================================
  // Ecriture
  // ============================================================
  function updateRecord(id, fields){
    return grist.selectedTable.update({ id: id, fields: fields }).catch(function(err){
      showToast('Enregistrement impossible : ' + (err && err.message ? err.message : err), true);
      throw err;
    });
  }
  function createRecord(fields){
    return grist.selectedTable.create({ fields: fields });
  }
  function deleteRecord(id){
    return grist.selectedTable.destroy([id]);
  }

  // ============================================================
  // Colonnes du kanban (lanes)
  // ============================================================
  function laneList(){
    var seen = {}, order = [];
    var choices = (state.colMeta.Status && state.colMeta.Status.choices) || [];
    choices.forEach(function(c){ if (!seen[c]) { seen[c] = true; order.push(c); } });
    state.records.forEach(function(r){
      var s = r.Status;
      if (s == null || s === '') s = '(Sans statut)';
      if (!seen[s]) { seen[s] = true; order.push(s); }
    });
    if (!order.length) order.push('(Sans statut)');
    return order;
  }

  // ============================================================
  // Filtres
  // ============================================================
  function passesFilter(r){
    var f = state.filters;
    if (f.search) {
      var hay = [r.Title, r.Details, r.Suites].map(function(v){ return (v || '').toString().toLowerCase(); }).join(' ');
      decodeList(r.Assignee).forEach(function(id){ hay += ' ' + assigneeLabel(id, 'Assignee').toLowerCase(); });
      if (hay.indexOf(f.search.toLowerCase()) === -1) return false;
    }
    if (f.theme.size) {
      var th = decodeList(r.Theme);
      if (!th.some(function(t){ return f.theme.has(t); })) return false;
    }
    if (f.structure.size) {
      var st = decodeList(r.Structure);
      if (!st.some(function(t){ return f.structure.has(t); })) return false;
    }
    if (f.assignee.size) {
      var as = decodeList(r.Assignee).map(String);
      if (!as.some(function(id){ return f.assignee.has(id); })) return false;
    }
    return true;
  }

  // ============================================================
  // Rendu — planche
  // ============================================================
  var boardEl = $('board');
  var countEl = $('record-count');

  function renderAll(){
    renderCount();
    renderBoard();
    renderFilterPop();
  }

  function renderCount(){
    var n = state.records.length;
    countEl.textContent = n + (n === 1 ? ' action' : ' actions');
  }

  function renderBoard(){
    if (!state.mappings) {
      boardEl.innerHTML = '<div class="board-empty">Connexion à Grist en cours…</div>';
      return;
    }
    if (!state.ready) {
      boardEl.innerHTML = '<div class="board-empty">Configurez le widget : associez au minimum les colonnes <strong>Action</strong> et <strong>Statut</strong> depuis le panneau de réglage (icône ⚙️ / puzzle).</div>';
      return;
    }

    var visible = state.records.filter(passesFilter);
    var lanes = laneList();

    var byLane = {};
    lanes.forEach(function(l){ byLane[l] = []; });
    visible.forEach(function(r){
      var s = (r.Status == null || r.Status === '') ? '(Sans statut)' : r.Status;
      if (!byLane[s]) byLane[s] = [];
      byLane[s].push(r);
    });

    boardEl.innerHTML = '';
    lanes.forEach(function(status){
      var laneEl = document.createElement('div');
      laneEl.className = 'lane';
      laneEl.dataset.status = status;

      var head = document.createElement('div');
      head.className = 'lane-head';
      head.innerHTML =
        '<span class="lane-name" title="' + escapeHtml(status) + '">' + escapeHtml(status) + '</span>' +
        '<p class="fr-badge fr-badge--sm ' + statusBadgeClass(status) + '">' + byLane[status].length + '</p>' +
        '<button type="button" class="fr-btn fr-btn--tertiary-no-outline fr-btn--sm fr-btn--icon-left fr-icon-add-line" title="Ajouter une action"><span class="fr-sr-only">Ajouter une action</span></button>';
      head.querySelector('button').addEventListener('click', function(){ quickAdd(status); });
      laneEl.appendChild(head);

      var body = document.createElement('div');
      body.className = 'lane-body';
      if (!byLane[status].length) {
        body.innerHTML = '<div class="lane-empty">Aucune action</div>';
      } else {
        byLane[status].forEach(function(r){ body.appendChild(cardEl(r)); });
      }
      laneEl.appendChild(body);

      body.addEventListener('dragover', function(e){ e.preventDefault(); laneEl.classList.add('drag-over'); });
      body.addEventListener('dragleave', function(){ laneEl.classList.remove('drag-over'); });
      body.addEventListener('drop', function(e){
        e.preventDefault();
        laneEl.classList.remove('drag-over');
        var id = parseInt(e.dataTransfer.getData('text/plain'), 10);
        if (!id) return;
        var rec = state.records.find(function(r){ return r.id === id; });
        if (!rec || rec.Status === status) return;
        var fields = {}; fields[state.mappings.Status] = status;
        updateRecord(id, fields);
      });

      boardEl.appendChild(laneEl);
    });
  }

  function cardEl(r){
    var card = document.createElement('div');
    card.className = 'card';
    card.draggable = true;
    card.dataset.id = r.id;

    var badges = '';
    decodeList(r.Theme).forEach(function(t){
      var a = badgeAppearance(t, state.colMeta.Theme);
      badges += '<p class="fr-badge fr-badge--sm ' + a.cls + '" style="' + a.style + '">' + escapeHtml(t) + '</p>';
    });
    decodeList(r.Structure).forEach(function(t){
      var a = badgeAppearance(t, state.colMeta.Structure);
      badges += '<p class="fr-badge fr-badge--sm ' + a.cls + '" style="' + a.style + '">' + escapeHtml(t) + '</p>';
    });

    var metaRow = '';
    if (r.DateDue != null && r.DateDue !== '') {
      var d = daysUntil(r.DateDue);
      var done = DONE_RE.test(r.Status || '');
      var cls = 'fr-badge--no-icon';
      if (!done && d != null) { if (d < 0) cls = 'fr-badge--error'; else if (d <= 7) cls = 'fr-badge--warning'; }
      metaRow += '<p class="fr-badge fr-badge--sm ' + cls + '">' + formatDateShort(r.DateDue) + '</p>';
    }
    var attCount = decodeList(r.Attachments).length;
    if (attCount) metaRow += '<p class="fr-badge fr-badge--sm fr-badge--no-icon">' + attCount + ' pj</p>';

    var assignees = decodeList(r.Assignee);
    var avatars = '';
    if (assignees.length) {
      avatars = '<span class="avatars">' + assignees.slice(0, 4).map(function(id){
        return '<span class="avatar" title="' + escapeHtml(assigneeLabel(id, 'Assignee')) + '">' + escapeHtml(initials(assigneeLabel(id, 'Assignee'))) + '</span>';
      }).join('') + '</span>';
    }

    var progressHtml = '';
    if (r.Progress != null && r.Progress !== '') {
      var pct = Math.max(0, Math.min(100, Number(r.Progress) || 0));
      progressHtml = '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
        '<div class="progress-label">' + Math.round(pct) + '%</div>';
    }

    card.innerHTML =
      (badges ? '<div class="badges">' + badges + '</div>' : '') +
      '<div class="title">' + escapeHtml(r.Title || '(Sans titre)') + '</div>' +
      (r.Details ? '<div class="details">' + escapeHtml(r.Details) + '</div>' : '') +
      ((metaRow || avatars) ? '<div class="meta-row">' + metaRow + avatars + '</div>' : '') +
      progressHtml;

    card.addEventListener('dragstart', function(e){
      card.classList.add('dragging');
      e.dataTransfer.setData('text/plain', String(r.id));
      e.dataTransfer.effectAllowed = 'move';
    });
    card.addEventListener('dragend', function(){ card.classList.remove('dragging'); });
    card.addEventListener('click', function(){ openDrawer(r.id); });

    return card;
  }

  // ============================================================
  // Filtres — popover
  // ============================================================
  var filterBtn = $('filter-btn'), filterPop = $('filter-pop');
  filterBtn.addEventListener('click', function(){ filterPop.classList.toggle('open'); });
  document.addEventListener('click', function(e){
    if (!filterPop.contains(e.target) && e.target !== filterBtn) filterPop.classList.remove('open');
  });

  function optionsFromRecords(getter){
    var seen = {}, out = [];
    state.records.forEach(function(r){
      decodeList(getter(r)).forEach(function(v){ if (v != null && !seen[v]) { seen[v] = true; out.push(v); } });
    });
    return out;
  }

  function renderFilterPop(){
    var groups = [];

    var themeOpts = (state.colMeta.Theme && state.colMeta.Theme.choices.length) ? state.colMeta.Theme.choices : optionsFromRecords(function(r){ return r.Theme; });
    if (state.mappings && state.mappings.Theme && themeOpts.length) groups.push(filterGroupHtml('Thème', 'theme', themeOpts, function(v){ return v; }));

    var structOpts = (state.colMeta.Structure && state.colMeta.Structure.choices.length) ? state.colMeta.Structure.choices : optionsFromRecords(function(r){ return r.Structure; });
    if (state.mappings && state.mappings.Structure && structOpts.length) groups.push(filterGroupHtml('Structure / service', 'structure', structOpts, function(v){ return v; }));

    if (state.mappings && state.mappings.Assignee) {
      var assigneeIds = optionsFromRecords(function(r){ return r.Assignee; });
      if (assigneeIds.length) groups.push(filterGroupHtml('Pilote', 'assignee', assigneeIds, function(id){ return assigneeLabel(id, 'Assignee'); }));
    }

    filterPop.innerHTML = groups.join('') + '<button type="button" class="filter-clear" id="filter-clear">Réinitialiser les filtres</button>';

    ['theme','structure','assignee'].forEach(function(key){
      filterPop.querySelectorAll('input[data-fkey="' + key + '"]').forEach(function(cb){
        cb.checked = state.filters[key].has(cb.value);
        cb.addEventListener('change', function(){
          if (cb.checked) state.filters[key].add(cb.value); else state.filters[key].delete(cb.value);
          updateFilterBtnState();
          renderBoard();
        });
      });
    });
    var clearBtn = $('filter-clear');
    if (clearBtn) clearBtn.addEventListener('click', function(){
      state.filters.theme.clear(); state.filters.structure.clear(); state.filters.assignee.clear();
      updateFilterBtnState();
      renderAll();
    });
    updateFilterBtnState();
  }

  function filterGroupHtml(label, key, values, labelFn){
    return '<div class="filter-group"><div class="ftitle">' + escapeHtml(label) + '</div>' +
      '<ul class="fr-tags-group">' + values.map(function(v, i){
        var id = 'filt-' + key + '-' + slug(String(v)) + '-' + i;
        return '<li><input type="checkbox" class="fr-tag" id="' + id + '" data-fkey="' + key + '" value="' + escapeHtml(String(v)) + '">' +
          '<label class="fr-tag" for="' + id + '">' + escapeHtml(labelFn(v)) + '</label></li>';
      }).join('') + '</ul></div>';
  }

  function updateFilterBtnState(){
    var active = state.filters.theme.size || state.filters.structure.size || state.filters.assignee.size;
    filterBtn.classList.toggle('fr-btn--secondary', !active);
    filterBtn.textContent = active ? 'Filtres (' + (state.filters.theme.size + state.filters.structure.size + state.filters.assignee.size) + ')' : '';
    if (!active) filterBtn.textContent = 'Filtres';
  }

  $('search-input').addEventListener('input', function(e){
    state.filters.search = e.target.value.trim();
    renderBoard();
  });
  $('search-bar').querySelector('button').addEventListener('click', function(e){ e.preventDefault(); });

  // ============================================================
  // Ajout rapide
  // ============================================================
  async function quickAdd(status){
    if (!state.ready) return;
    var m = state.mappings;
    var fields = {}; fields[m.Title] = 'Nouvelle action'; fields[m.Status] = status;
    try {
      var res = await createRecord(fields);
      var newId = res && (res.id || (Array.isArray(res) && res[0] && res[0].id));
      if (newId) setTimeout(function(){ openDrawer(newId); }, 150);
    } catch(err){
      showToast("Création impossible : " + (err && err.message ? err.message : err), true);
    }
  }
  $('add-btn').addEventListener('click', function(){
    var lanes = laneList();
    quickAdd(lanes[0]);
  });

  // ============================================================
  // Tiroir de détail
  // ============================================================
  var scrim = $('scrim'), drawer = $('drawer'), drawerBody = $('drawer-body');
  var dTitle = $('d-title');

  function currentRecord(){
    return state.records.find(function(r){ return r.id === state.openId; }) || null;
  }

  function openDrawer(id){
    state.openId = id;
    scrim.classList.add('open');
    drawer.classList.add('open');
    renderDrawer();
  }
  function closeDrawer(){
    state.openId = null;
    scrim.classList.remove('open');
    drawer.classList.remove('open');
  }
  scrim.addEventListener('click', closeDrawer);
  $('d-close').addEventListener('click', closeDrawer);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && state.openId != null) closeDrawer(); });

  function syncOpenDrawer(){
    if (state.openId == null) return;
    if (!currentRecord()) { closeDrawer(); return; }
    renderDrawer();
  }

  var saveTitleDebounced = debounce(function(id, value){
    var fields = {}; fields[state.mappings.Title] = value;
    updateRecord(id, fields);
  }, 500);
  var saveTextDebounced = debounce(function(id, field, value){
    var fields = {}; fields[field] = value;
    updateRecord(id, fields);
  }, 500);

  function renderDrawer(){
    var r = currentRecord();
    if (!r) return;
    var m = state.mappings;

    if (document.activeElement !== dTitle) dTitle.value = r.Title || '';
    dTitle.oninput = function(){
      autoGrow(dTitle);
      saveTitleDebounced(r.id, dTitle.value);
    };
    autoGrow(dTitle);

    var html = '';

    // Statut
    html += '<div class="field-block fr-select-group"><label class="fr-label" for="f-status">Statut</label><select class="fr-select" id="f-status">' +
      laneList().map(function(s){ return '<option value="' + escapeHtml(s) + '"' + (s === r.Status ? ' selected' : '') + '>' + escapeHtml(s) + '</option>'; }).join('') +
      '</select></div>';

    // Thème
    if (m.Theme) {
      var themeChoices = (state.colMeta.Theme && state.colMeta.Theme.choices.length) ? state.colMeta.Theme.choices : optionsFromRecords(function(x){ return x.Theme; });
      html += fieldTagToggle('Thème', 'theme', themeChoices, decodeList(r.Theme), state.colMeta.Theme, function(v){ return v; });
    }

    // Structure
    if (m.Structure) {
      var structChoices = (state.colMeta.Structure && state.colMeta.Structure.choices.length) ? state.colMeta.Structure.choices : optionsFromRecords(function(x){ return x.Structure; });
      html += fieldTagToggle('Structure / service', 'structure', structChoices, decodeList(r.Structure), state.colMeta.Structure, function(v){ return v; });
    }

    // Pilote
    if (m.Assignee && state.refLabels.Assignee) {
      var allAssignees = Object.keys(state.refLabels.Assignee);
      html += fieldTagToggle("Pilote de l'action", 'assignee', allAssignees, decodeList(r.Assignee).map(String), null, function(id){ return assigneeLabel(id, 'Assignee'); });
    }

    // Appui
    if (m.Support && state.refLabels.Support) {
      var allSupport = Object.keys(state.refLabels.Support);
      html += fieldTagToggle('Appui action', 'support', allSupport, decodeList(r.Support).map(String), null, function(id){ return assigneeLabel(id, 'Support'); });
    }

    // Dates
    if (m.DateStart || m.DateDue) {
      html += '<div class="field-block"><div class="date-row">';
      if (m.DateStart) html += '<div class="fr-input-group"><label class="fr-label" for="f-date-start">Début</label><input class="fr-input" type="date" id="f-date-start" value="' + dateToInput(r.DateStart) + '"></div>';
      if (m.DateDue) html += '<div class="fr-input-group"><label class="fr-label" for="f-date-due">Échéance</label><input class="fr-input" type="date" id="f-date-due" value="' + dateToInput(r.DateDue) + '"></div>';
      html += '</div></div>';
    }

    // Progression
    if (m.Progress) {
      var pct = Math.max(0, Math.min(100, Number(r.Progress) || 0));
      html += '<div class="field-block fr-range-group"><label class="fr-label" for="f-progress">Progression — <span id="f-progress-num">' + Math.round(pct) + '%</span></label>' +
        '<div class="fr-range"><input type="range" id="f-progress" min="0" max="100" step="5" value="' + pct + '"></div></div>';
    }

    // Détails
    if (m.Details) {
      html += '<div class="field-block fr-input-group"><label class="fr-label" for="f-details">Détails de l\'action</label><textarea class="fr-input" id="f-details" rows="3" placeholder="…">' + escapeHtml(r.Details) + '</textarea></div>';
    }

    // Suites
    if (m.Suites) {
      html += '<div class="field-block fr-input-group"><label class="fr-label" for="f-suites">Suites données</label><textarea class="fr-input" id="f-suites" rows="3" placeholder="…">' + escapeHtml(r.Suites) + '</textarea></div>';
    }

    // Pièces jointes
    if (m.Attachments) {
      var n = decodeList(r.Attachments).length;
      html += '<div class="field-block"><div class="flabel">Pièces jointes</div><div class="attach-info">' +
        (n ? n + (n > 1 ? ' pièces jointes' : ' pièce jointe') + ' — à gérer depuis la table Grist' : 'Aucune pièce jointe') + '</div></div>';
    }

    drawerBody.innerHTML = html;

    // handlers
    var statusEl = $('f-status');
    if (statusEl) statusEl.addEventListener('change', function(){
      var f = {}; f[m.Status] = statusEl.value; updateRecord(r.id, f);
    });

    bindTagToggle('theme', function(values){ var f = {}; f[m.Theme] = ['L'].concat(values); updateRecord(r.id, f); });
    bindTagToggle('structure', function(values){ var f = {}; f[m.Structure] = ['L'].concat(values); updateRecord(r.id, f); });
    bindTagToggle('assignee', function(values){ var f = {}; f[m.Assignee] = ['L'].concat(values.map(Number)); updateRecord(r.id, f); });
    bindTagToggle('support', function(values){ var f = {}; f[m.Support] = ['L'].concat(values.map(Number)); updateRecord(r.id, f); });

    var dsEl = $('f-date-start');
    if (dsEl) dsEl.addEventListener('change', function(){ var f = {}; f[m.DateStart] = inputToDate(dsEl.value); updateRecord(r.id, f); });
    var ddEl = $('f-date-due');
    if (ddEl) ddEl.addEventListener('change', function(){ var f = {}; f[m.DateDue] = inputToDate(ddEl.value); updateRecord(r.id, f); });

    var progEl = $('f-progress');
    if (progEl) {
      var progNum = $('f-progress-num');
      progEl.addEventListener('input', function(){ progNum.textContent = progEl.value + '%'; });
      progEl.addEventListener('change', function(){
        var f = {}; f[m.Progress] = Number(progEl.value); updateRecord(r.id, f);
      });
    }

    var detEl = $('f-details');
    if (detEl) detEl.addEventListener('input', function(){ saveTextDebounced(r.id, m.Details, detEl.value); });
    var suiEl = $('f-suites');
    if (suiEl) suiEl.addEventListener('input', function(){ saveTextDebounced(r.id, m.Suites, suiEl.value); });

    // pied
    var metaBits = [];
    if (m.LastUpdate) metaBits.push('Mise à jour : ' + formatDateTime(r.LastUpdate));
    if (m.LastUpdateBy && r.LastUpdateBy) metaBits.push('par ' + escapeHtml(r.LastUpdateBy));
    $('d-meta').textContent = metaBits.join(' — ');

    $('d-open-grist').onclick = function(){
      grist.setCursorPos({ rowId: r.id }).catch(function(){});
    };
    $('d-delete').onclick = function(){
      if (!confirm('Supprimer « ' + (r.Title || 'cette action') + ' » ? Cette action est irréversible.')) return;
      deleteRecord(r.id).then(closeDrawer).catch(function(err){
        showToast('Suppression impossible : ' + (err && err.message ? err.message : err), true);
      });
    };
  }

  function fieldTagToggle(label, key, choices, selectedValues, meta, labelFn){
    var selSet = {};
    selectedValues.forEach(function(v){ selSet[v] = true; });
    return '<div class="field-block"><div class="flabel">' + escapeHtml(label) + '</div><ul class="fr-tags-group">' +
      choices.map(function(v, i){
        var on = !!selSet[v];
        var id = 'd-' + key + '-' + slug(String(v)) + '-' + i;
        var a = meta ? badgeAppearance(v, meta) : { cls:'', style:'' };
        var style = on && a.style ? ' style="' + a.style + '"' : '';
        return '<li><input type="checkbox" class="fr-tag" id="' + id + '" data-fkey="' + key + '" value="' + escapeHtml(String(v)) + '"' + (on ? ' checked' : '') + '>' +
          '<label class="fr-tag" for="' + id + '"' + style + '>' + escapeHtml(labelFn(v)) + '</label></li>';
      }).join('') + '</ul></div>';
  }

  function bindTagToggle(key, onChange){
    var els = drawerBody.querySelectorAll('input[data-fkey="' + key + '"]');
    if (!els.length) return;
    els.forEach(function(el){
      el.addEventListener('change', function(){
        var values = [];
        drawerBody.querySelectorAll('input[data-fkey="' + key + '"]:checked').forEach(function(x){ values.push(x.value); });
        onChange(values);
      });
    });
  }

  function autoGrow(el){
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 160) + 'px';
  }

})();
</script>

</body>
</html>
