  /* ================= Jetons DSFR ================= */
  :root{
    --bf:#000091; --bf-hover:#1212ff; --bf-active:#2323ff;
    --bf-975:#f5f5fe; --bf-950:#ececfe; --bf-925:#e3e3fd; --bf-850:#cacafb;
    --rm:#e1000f;
    --title:#161616; --text:#3a3a3a; --mention:#666666; --disabled:#929292;
    --border:#dddddd; --alt:#f6f6f6; --contrast:#eeeeee; --contrast-hover:#dddddd; --surface:#ffffff;
    --success:#18753c; --success-bg:#b8fec9; --success-soft:#dffee6;
    --error:#ce0500; --error-bg:#ffe9e9;
    --warning:#b34000; --warning-bg:#ffe9e6;
    --info:#0063cb; --info-bg:#e8edff;
    --new:#695240; --new-bg:#feebd0;
    --grey-bg:#eeeeee;
    --focus:#0a76f6;
    --shadow:0 1px 3px rgba(0,0,18,.16);
    --shadow-lg:0 6px 18px rgba(0,0,18,.16),0 2px 6px rgba(0,0,18,.12);
    --font:Marianne,arial,sans-serif;
    --hour:44px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--surface);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit;color:inherit}
  a{color:var(--bf);text-underline-offset:3px}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  h1,h2,h3{color:var(--title);margin:0;font-weight:700}
  .muted{color:var(--mention)}
  .sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  [hidden]{display:none!important}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.fr-logo--sm:before{background-position:0 -.046875rem,0 0,0 0;background-size:2.0625rem .84375rem,2.0625rem .75rem,0;height:.75rem;margin-bottom:.25rem;width:2.0625rem}

  /* ================= En-tête ================= */
  .hdr{background:var(--surface);box-shadow:0 2px 6px rgba(0,0,18,.12);position:relative;z-index:20}
  .hdr-in{display:flex;align-items:center;gap:16px;padding:10px 20px;min-height:72px;flex-wrap:wrap}
  .svc{border-left:1px solid var(--border);padding-left:16px;min-width:0}
  .svc-title{margin:0;font-weight:700;font-size:1.1rem;color:var(--title);line-height:1.3}
  .svc-tag{margin:0;font-size:.8rem;color:var(--mention)}
  .hdr-tools{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .demo{background:var(--info-bg);color:var(--info);font-size:.8rem;padding:6px 20px;display:flex;gap:8px;align-items:center}

  /* ================= Onglets ================= */
  .tabs{display:flex;gap:4px;padding:0 20px;border-bottom:1px solid var(--border);overflow-x:auto;background:var(--surface)}
  .tab{border:0;background:var(--bf-950);color:var(--title);padding:.6rem 1rem;font-weight:500;font-size:.9rem;cursor:pointer;margin-top:8px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
  .tab:hover{background:var(--bf-925)}
  .tab[aria-selected="true"]{background:var(--surface);color:var(--bf);box-shadow:inset 0 2px 0 var(--bf),inset 1px 0 0 var(--border),inset -1px 0 0 var(--border);margin-bottom:-1px}
  .tab .count{font-size:.72rem;background:var(--contrast);color:var(--mention);border-radius:99px;padding:0 7px}

  main{padding:18px 20px 40px;max-width:1400px;margin:0 auto}

  /* ================= Boutons ================= */
  .btn{display:inline-flex;align-items:center;gap:.4rem;border:0;cursor:pointer;font-weight:500;font-size:.875rem;line-height:1.5rem;padding:.25rem .75rem;min-height:2rem;background:var(--bf);color:#f5f5fe;text-decoration:none;white-space:nowrap}
  .btn:hover{background:var(--bf-hover)}
  .btn:active{background:var(--bf-active)}
  .btn:disabled{background:var(--contrast);color:var(--disabled);cursor:not-allowed}
  .btn.sec{background:transparent;color:var(--bf);box-shadow:inset 0 0 0 1px var(--bf)}
  .btn.sec:hover{background:var(--bf-975)}
  .btn.ter{background:transparent;color:var(--bf);box-shadow:inset 0 0 0 1px var(--border)}
  .btn.ter:hover{background:var(--alt)}
  .btn.ghost{background:transparent;color:var(--bf);box-shadow:none}
  .btn.ghost:hover{background:var(--alt)}
  .btn.danger{background:transparent;color:var(--error);box-shadow:inset 0 0 0 1px var(--error)}
  .btn.danger:hover{background:var(--error-bg)}
  .btn.lg{font-size:1rem;padding:.5rem 1.5rem;min-height:2.5rem}
  .btn.icon{padding:.25rem .5rem}
  .btn-group{display:inline-flex}
  .btn-group .btn{box-shadow:inset 0 0 0 1px var(--bf);background:transparent;color:var(--bf)}
  .btn-group .btn+.btn{margin-left:-1px}
  .btn-group .btn[aria-pressed="true"]{background:var(--bf);color:#fff}

  /* ================= Formulaires ================= */
  label.lbl{display:block;color:var(--title);font-size:.875rem;margin-bottom:.35rem}
  label.lbl .hint{display:block;color:var(--mention);font-size:.75rem}
  .input,.select{display:block;width:100%;border:0;border-radius:.25rem .25rem 0 0;background:var(--contrast);box-shadow:inset 0 -2px 0 0 var(--text);padding:.5rem .75rem;font-size:.9rem;min-height:2.5rem;color:var(--title)}
  .select{appearance:none;padding-right:2rem;background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%23161616' d='m12 13.1 5-4.9 1.4 1.4-6.4 6.3-6.4-6.4L7 8.1l5 5z'/></svg>");background-repeat:no-repeat;background-position:right .5rem center;background-size:1rem}
  textarea.input{min-height:5rem;resize:vertical}
  .input:focus,.select:focus{outline:2px solid var(--focus);outline-offset:2px}
  .input:disabled,.select:disabled{color:var(--disabled);box-shadow:inset 0 -2px 0 0 var(--border)}
  .grp{margin-bottom:1rem;min-width:0}
  .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 16px}
  .chk{display:flex;gap:8px;align-items:center;font-size:.875rem;cursor:pointer}
  .chk input{width:1.1rem;height:1.1rem;accent-color:var(--bf)}

  /* ================= Badges / tags / alertes ================= */
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:700;text-transform:uppercase;padding:0 .5rem;line-height:1.5rem;border-radius:.25rem;background:var(--grey-bg);color:var(--text);white-space:nowrap}
  .badge.st-prevu{background:var(--info-bg);color:var(--info)}
  .badge.st-confirm{background:var(--new-bg);color:var(--new)}
  .badge.st-fait{background:var(--success-bg);color:var(--success)}
  .badge.st-report{background:var(--bf-925);color:var(--bf)}
  .badge.st-annule{background:var(--error-bg);color:var(--error)}
  .tag{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;background:var(--bf-950);color:var(--bf);border-radius:99px;padding:.1rem .6rem;white-space:nowrap}
  .alert{border:1px solid var(--border);border-left:2.5rem solid var(--info);padding:.75rem 1rem;position:relative;margin:0 0 1rem;font-size:.875rem;background:var(--surface)}
  .alert::before{content:"";position:absolute;left:-1.85rem;top:.8rem;width:1.2rem;height:1.2rem;background:#fff;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;--m:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 22C6.477 22 2 17.523 2 12S6.477 2 12 2s10 4.477 10 10-4.477 10-10 10Zm0-2a8 8 0 1 0 0-16 8 8 0 0 0 0 16ZM11 7h2v2h-2V7Zm0 4h2v6h-2v-6Z'/></svg>")}
  .alert.warn{border-left-color:var(--warning)}
  .alert.err{border-left-color:var(--error)}
  .alert.ok{border-left-color:var(--success)}
  .alert h3{font-size:1rem;margin-bottom:.25rem}
  .alert p{margin:.25rem 0}

  /* ================= Barre d'outils calendrier ================= */
  .toolbar{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;margin-bottom:14px}
  .period{font-size:1.35rem;font-weight:700;color:var(--title);min-width:13ch;text-transform:capitalize}
  .filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 14px;margin-bottom:14px;padding:12px 14px;background:var(--alt)}
  .filters .input,.filters .select{min-height:2.2rem;padding:.35rem .7rem;background-color:var(--surface)}
  .filters label.lbl{font-size:.78rem;margin-bottom:.15rem;color:var(--mention)}
  .legend{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
  .spacer{flex:1}

  /* ================= Vue mois ================= */
  .wd-row{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:2px solid var(--bf)}
  .wd-row div{font-size:.78rem;font-weight:700;color:var(--title);padding:6px;text-transform:uppercase}
  .month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(118px,auto);border-left:1px solid var(--border)}
  .cell{border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:4px 5px 6px;display:flex;flex-direction:column;gap:3px;min-width:0;cursor:pointer;background:var(--surface)}
  .cell:hover{background:var(--bf-975)}
  .cell.out{background:var(--alt)}
  .cell.out .dnum{color:var(--disabled)}
  .cell.we{background:#fafafa}
  .cell-top{display:flex;justify-content:space-between;align-items:center}
  .dnum{font-size:.8rem;font-weight:500;color:var(--text);width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%}
  .cell.today .dnum{background:var(--bf);color:#fff;font-weight:700}
  .cell .nb{font-size:.7rem;color:var(--mention)}
  .ev{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--info);background:var(--info-bg);color:var(--title);font-size:.75rem;line-height:1.3;padding:2px 5px;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .ev:hover{filter:brightness(.96)}
  .ev b{font-weight:700;margin-right:4px}
  .ev .who{color:var(--mention)}
  .ev.st-confirm{border-color:var(--new);background:var(--new-bg)}
  .ev.st-fait{border-color:var(--success);background:var(--success-soft)}
  .ev.st-report{border-color:var(--bf);background:var(--bf-950)}
  .ev.st-annule{border-color:var(--error);background:var(--error-bg);text-decoration:line-through;color:var(--mention)}
  .ev.st-none{border-color:var(--disabled);background:var(--grey-bg)}
  .more{border:0;background:none;color:var(--bf);font-size:.75rem;text-align:left;padding:1px 5px;cursor:pointer;font-weight:500}

  /* ================= Vue semaine ================= */
  .week{display:grid;grid-template-columns:52px repeat(7,minmax(0,1fr));border:1px solid var(--border);border-top:0}
  .week-head{display:grid;grid-template-columns:52px repeat(7,minmax(0,1fr));border-bottom:2px solid var(--bf);position:sticky;top:0;background:var(--surface);z-index:2}
  .week-head div{padding:6px;font-size:.8rem;color:var(--title);text-transform:capitalize}
  .week-head div b{display:block;font-size:1.15rem}
  .week-head div.today b{color:var(--bf)}
  .hours{position:relative}
  .hours span{position:absolute;right:6px;font-size:.7rem;color:var(--mention);transform:translateY(-.55em)}
  .wcol{position:relative;border-left:1px solid var(--border);background:repeating-linear-gradient(to bottom,var(--surface) 0,var(--surface) calc(var(--hour) - 1px),var(--border) calc(var(--hour) - 1px),var(--border) var(--hour));cursor:copy}
  .wcol.today{background-color:var(--bf-975);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--hour) - 1px),var(--border) calc(var(--hour) - 1px),var(--border) var(--hour))}
  .wev{position:absolute;border:0;border-left:3px solid var(--info);background:var(--info-bg);color:var(--title);font-size:.72rem;line-height:1.25;padding:2px 4px;text-align:left;overflow:hidden;cursor:pointer;box-shadow:0 0 0 1px #fff}
  .wev:hover{z-index:3;box-shadow:var(--shadow-lg)}

  .wev .who{color:var(--mention)}
  .wev.st-confirm{border-color:var(--new);background:var(--new-bg)}
  .wev.st-fait{border-color:var(--success);background:var(--success-soft)}
  .wev.st-report{border-color:var(--bf);background:var(--bf-950)}
  .wev.st-annule{border-color:var(--error);background:var(--error-bg);color:var(--mention)}
  .wev.st-none{border-color:var(--disabled);background:var(--grey-bg)}
  .nowline{position:absolute;left:0;right:0;height:2px;background:var(--rm);z-index:2;pointer-events:none}

  /* ================= Liste / agenda ================= */
  .agenda-day{margin-bottom:18px}
  .agenda-day h3{font-size:1rem;padding-bottom:6px;border-bottom:1px solid var(--border);margin-bottom:6px;display:flex;justify-content:space-between;align-items:baseline}
  .agenda-item{display:grid;grid-template-columns:86px 1fr auto;gap:12px;align-items:center;padding:8px 10px;border-left:3px solid var(--info);background:var(--surface);cursor:pointer;width:100%;text-align:left;border-top:0;border-right:0;border-bottom:1px solid var(--alt)}
  .agenda-item:hover{background:var(--bf-975)}
  .agenda-item .h{font-weight:700;color:var(--title)}
  .agenda-item .n{color:var(--title);font-weight:500}
  .agenda-item .s{font-size:.8rem;color:var(--mention);display:flex;gap:12px;flex-wrap:wrap}
  .agenda-item.st-confirm{border-left-color:var(--new)}
  .agenda-item.st-fait{border-left-color:var(--success)}
  .agenda-item.st-report{border-left-color:var(--bf)}
  .agenda-item.st-annule{border-left-color:var(--error)}
  .agenda-item.st-none{border-left-color:var(--disabled)}
  .empty{text-align:center;color:var(--mention);padding:40px 10px}

  /* ================= Tableaux ================= */
  .tbl-wrap{overflow-x:auto;border:1px solid var(--border)}
  table.tbl{width:100%;border-collapse:collapse;font-size:.875rem}
  .tbl th{background:var(--contrast);color:var(--title);text-align:left;font-weight:700;padding:.6rem .75rem;white-space:nowrap;border-bottom:2px solid var(--text)}
  .tbl td{padding:.55rem .75rem;border-bottom:1px solid var(--border);vertical-align:top}
  .tbl tr:nth-child(even) td{background:var(--alt)}
  .tbl tr.click{cursor:pointer}
  .tbl tr.click:hover td{background:var(--bf-975)}
  .tbl .act{white-space:nowrap;text-align:right}
  .tbl .strong{color:var(--title);font-weight:500}
  .sub{font-size:.78rem;color:var(--mention)}
  .section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .section-head h2{font-size:1.35rem}

  /* ================= Modale ================= */
  .overlay{position:fixed;inset:0;background:rgba(22,22,22,.64);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow-y:auto}
  .modal{background:var(--surface);width:min(640px,100%);box-shadow:var(--shadow-lg);padding:0 0 1.5rem;position:relative}
  .modal.wide{width:min(940px,100%)}
  .modal-close{position:sticky;top:0;display:flex;justify-content:flex-end;padding:.75rem .75rem 0;background:var(--surface);z-index:2}
  .modal-body{padding:0 2rem}
  .modal h2{font-size:1.4rem;margin-bottom:.25rem;display:flex;gap:10px;align-items:center}
  .modal .lead{color:var(--mention);font-size:.9rem;margin:0 0 1rem}
  .modal-foot{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;padding:1rem 2rem 0;border-top:1px solid var(--border);margin-top:1rem}
  .modal-foot .left{margin-right:auto;display:flex;gap:10px;flex-wrap:wrap}

  /* ================= Fiche exploitation ================= */
  .fiche-head{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center;margin:.25rem 0 1rem}
  .fsec{margin-top:1.4rem}
  .fsec h3{font-size:1rem;color:var(--bf);display:flex;gap:8px;align-items:center;padding-bottom:.35rem;border-bottom:1px solid var(--border);margin-bottom:.75rem}

  .fld .k{font-size:.75rem;color:var(--mention)}
  .fld .v{font-size:.9rem;color:var(--title);word-break:break-word;white-space:pre-wrap}
  .fld .v.na{color:var(--disabled);font-style:italic}
  .fld.full{grid-column:1/-1}
  .fld .ro{font-size:.68rem;color:var(--disabled)}
  .rdv-mini{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:.5rem .75rem;border-left:3px solid var(--info);background:var(--alt);margin-bottom:6px;cursor:pointer}
  .rdv-mini:hover{background:var(--bf-975)}
  .rdv-mini.st-confirm{border-left-color:var(--new)}
  .rdv-mini.st-fait{border-left-color:var(--success)}
  .rdv-mini.st-report{border-left-color:var(--bf)}
  .rdv-mini.st-annule{border-left-color:var(--error)}
  .rdv-mini.st-none{border-left-color:var(--disabled)}

  /* ================= Panneau jour ================= */
  .daylist{display:flex;flex-direction:column;gap:6px}

  /* ================= Toast / chargement ================= */
  #toastRoot{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
  .toast{background:var(--title);color:#fff;padding:.7rem 1rem;font-size:.875rem;box-shadow:var(--shadow-lg);display:flex;gap:8px;align-items:center;max-width:min(420px,90vw)}
  .toast.err{background:var(--error)}
  .loading{padding:60px 20px;text-align:center;color:var(--mention)}
  .setup{max-width:760px;margin:20px auto}
  .setup h2{font-size:1.6rem;margin-bottom:.5rem}
  .setup ul{padding-left:1.2rem}
  .setup li{margin:.3rem 0}
  code{font-size:.85em;background:var(--alt);padding:0 4px}

  @media (max-width:720px){
    .hdr-in{padding:8px 12px}
    .svc{display:none}
    main{padding:14px 12px 30px}
    .tabs{padding:0 12px}
    .modal-body{padding:0 1rem}
    .modal-foot{padding:1rem 1rem 0}
    .agenda-item{grid-template-columns:64px 1fr}
    .agenda-item>:last-child{grid-column:2}
    .legend{display:none}
  }
  @media print{
    .hdr,.tabs,.toolbar .btn,.filters,.demo{display:none!important}
    .ev,.wev{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
</head>

<header class="hdr" role="banner">

</header>

<script>
(function () {
'use strict';

/* ============================================================
   CONFIGURATION
   ============================================================ */
const T_RDV = 'RDV_Prelevements', T_PREL = 'Preleveurs', T_INSP = 'Inspecteurs_FAM';
// Structure du fichier Excel reçu chaque jour : identifiants = ceux que Grist génère à partir des en-têtes,

const RDV_SCHEMA = [
  ['N_dossier', 'N° dossier', 'Numeric'], ['Raison_Sociale', 'Raison Sociale', 'Text'], ['ilot', 'ilot', 'Text'], ['Surface', 'Surface', 'Text'],

const DUREES = [15, 30, 45, 60, 90, 120, 180];
const DEFAULT_CFG = {rdvTable: '', map: null, ficheTable: '', ficheKey: '', hourStart: 8, hourEnd: 19, duree: 45};

// Champs logiques de la table des prélèvements (une ligne = une parcelle à prélever).
// syn : intitulés reconnus automatiquement (comparés sans accents ni ponctuation).
const STATUT_CHOICE_OPTS = {}; STATUTS.forEach(s => { STATUT_CHOICE_OPTS[s] = {fillColor: STATUT_COLORS[s][0], textColor: STATUT_COLORS[s][1]}; });
const FIELDS = [
  {k: 'exploitation', label: 'Exploitation (raison sociale)', req: true, syn: ['raison sociale', 'nom ou raison sociale', 'nom raison sociale', 'exploitation', 'nom']},

  {k: 'dossier', label: 'N° dossier', syn: ['n dossier', 'no dossier', 'numero dossier', 'dossier', 'dossier number']},
  {k: 'parcelle', label: 'Îlot-parcelle', syn: ['ilot', 'ilot parcelle', 'parcelle']},
  {k: 'surface', label: 'Surface', syn: ['surface']},
  {k: 'numPrelev', label: 'N° prélèvement', syn: ['n prelev', 'no prelev', 'n prelevement', 'numero de prelevement']},
  {k: 'type', label: 'Type', syn: ['type']},
  {k: 'culture', label: 'Culture', syn: ['culture', 'culture en place']},
  {k: 'adresse', label: 'Adresse', syn: ['adresse', 'adresse complete']},
  {k: 'cp', label: 'Code postal', syn: ['code postal', 'cp']},
  {k: 'commune', label: 'Commune', syn: ['commune', 'ville']},
  {k: 'tel', label: 'Téléphone', syn: ['telephone', 'telephone fixe', 'tel']},
  {k: 'portable', label: 'Portable', syn: ['portable', 'mobile', 'telephone portable']},
  {k: 'bassin', label: 'Bassin versant', syn: ['bassin versant', 'bassin']},
  {k: 'observations', label: 'Observations', syn: ['observations', 'observation']}
];
const FIELD = Object.fromEntries(FIELDS.map(f => [f.k, f]));

// Fiche de prélèvement détaillée (table DATA_Lab, facultative), libellés repris de l'export CSV
const FICHE_SECTIONS = [
  {title: 'Exploitation', icon: 'plant', fields: [
    ['Pacage', 'Pacage'], ['Nom_ou_Raison_sociale', 'Nom ou raison sociale'], ['dossier_number', 'N° de dossier (DN)'],
    ['Adresse_complete', 'Adresse complète', true], ['Departement', 'Département'], ['Code_departement', 'Code département']]},
  {title: 'Prise de contact', icon: 'time', fields: [
    ['Date_heure_appel_1', 'Date/heure appel 1'], ['Date_heure_appel_2', 'Date/heure appel 2'], ['Date_heure_appel_3', 'Date/heure appel 3'],
    ['Statut', 'Statut'], ['Presence_souhaitee_de_l_agriculteur', 'Présence souhaitée de l\'agriculteur'], ['Date_Heure_RDV', 'Date/heure RDV']]},
  {title: 'Prélèvement', icon: 'user', fields: [
    ['Nom_prenom_du_preleveur', 'Nom prénom du préleveur'], ['Nom_du_preleveur', 'Nom du préleveur'],
    ['Date_et_heure_de_prelevement', 'Date et heure de prélèvement'], ['Lieu_du_depot_des_echantillons', 'Lieu du dépôt des échantillons'],
    ['Culture_en_place', 'Culture en place'], ['Nature_du_couvert_en_place', 'Nature du couvert en place'],
    ['Developpement_vegetatif_de_la_culture_en_placeDeveloppement_vegetatif_de_la_culture_en_place', 'Développement végétatif de la culture en place'],
    ['Absence_de_fertilisation_recente', 'Absence de fertilisation récente']]},
  {title: 'Sol et horizons', icon: 'plant', fields: [
    ['Profondeur_du_sol_preleve_en_cm_', 'Profondeur du sol prélevé (cm)'], ['Type_de_sol', 'Type de sol'], ['Nombre_d_horizons_preleves', 'Nombre d\'horizons prélevés'],

}

function readDate(v, type) {

    const x = new Date(v * 1000); return {y: x.getUTCFullYear(), m: x.getUTCMonth() + 1, d: x.getUTCDate(), h: null, mi: null};

  r = /^(\d{1,2})\/(\d{1,2})\/(\d{2,4})(?:\s+(\d{1,2})[:h](\d{2}))?/.exec(s);

function parseMeta(T, C) {
  const tables = {}, byRow = {};
  T.id.forEach((rid, i) => {
    const tid = T.tableId[i]; if (!tid || tid.startsWith('_grist')) return;
    byRow[rid] = tid; tables[tid] = {rowId: rid, cols: {}, order: [], summary: !!(T.summarySourceTable && T.summarySourceTable[i])};
  });
  const idx = C.id.map((_, i) => i).sort((a, b) => ((C.parentPos || [])[a] ?? 0) - ((C.parentPos || [])[b] ?? 0));
  for (const i of idx) {
    const tid = byRow[C.parentId[i]]; if (!tid) continue;
    const colId = C.colId[i];
    if (colId === 'manualSort' || colId.startsWith('gristHelper_')) continue;
    let wo = {}; try { wo = JSON.parse((C.widgetOptions || [])[i] || '{}') || {}; } catch (e) { wo = {}; }
    tables[tid].cols[colId] = {rowId: C.id[i], colId, label: (C.label || [])[i] || colId, type: C.type[i] || 'Any',
      isFormula: !!(C.isFormula || [])[i], formula: (C.formula || [])[i] || '', visibleCol: (C.visibleCol || [])[i] || 0, choices: wo.choices || []};
    tables[tid].order.push(colId);
  }
  return tables;
}
function toRows(d) {
  const keys = Object.keys(d);
  return (d.id || []).map((_, i) => { const r = {}; keys.forEach(k => { r[k] = d[k][i]; }); return r; });
}

const LocalBackend = {
  mode: 'local', db: {}, cfg: null,
  async meta() {
    const T = {id: [], tableId: [], summarySourceTable: []}, C = {id: [], parentId: [], parentPos: [], colId: [], label: [], type: [], isFormula: [], formula: [], visibleCol: [], widgetOptions: []};
    let tr = 0, cr = 0;
    for (const [tid, t] of Object.entries(this.db)) {
      tr++; T.id.push(tr); T.tableId.push(tid); T.summarySourceTable.push(0);
      t.cols.forEach((c, i) => { cr++; C.id.push(cr); C.parentId.push(tr); C.parentPos.push(i); C.colId.push(c.id); C.label.push(c.label || c.id); C.type.push(c.type || 'Any');
        C.isFormula.push(!!c.isFormula); C.formula.push(c.formula || ''); C.visibleCol.push(0); C.widgetOptions.push(c.widgetOptions || ''); });
    }
    return parseMeta(T, C);
  },
  calc(t, r) {
    const out = Object.assign({}, r);
    for (const c of t.cols) {
      if (c.id === 'Nom_complet') out[c.id] = [String(r.Nom || '').toUpperCase(), r.Prenom].filter(Boolean).join(' ');
      else if (!(c.id in out)) out[c.id] = c.type === 'Bool' ? false : (c.type.startsWith('Ref:') ? 0 : null);
    }

  },
  async fetch(tid) {
    const t = this.db[tid]; if (!t) throw new Error('Table inconnue : ' + tid);
    return t.rows.map(r => this.calc(t, r));
  },
  async apply(actions) {
    const ret = [];
    for (const a of actions) {
      const [op, tid] = a, t = this.db[tid];
      if (op === 'AddTable') { this.db[tid] = {next: 1, rows: [], cols: a[2].map(c => Object.assign({}, c))}; ret.push({table_id: tid}); continue; }
      if (op === 'AddColumn') { t.cols.push(Object.assign({id: a[2]}, a[3])); ret.push({colId: a[2]}); continue; }
      if (op === 'ModifyColumn') { Object.assign(t.cols.find(c => c.id === a[2]), a[3]); ret.push(null); continue; }
      if (op === 'AddRecord') { const id = t.next++; const r = {id}; t.cols.forEach(c => { if (!c.isFormula && c.formula === 'True') r[c.id] = true; }); t.rows.push(Object.assign(r, a[3])); ret.push(id); continue; }
      if (op === 'UpdateRecord') { if (!t) { ret.push(null); continue; } const r = t.rows.find(x => x.id === a[2]); if (r) Object.assign(r, a[3]); ret.push(null); continue; }
      if (op === 'RemoveRecord') { t.rows = t.rows.filter(x => x.id !== a[2]); ret.push(null); continue; }
      ret.push(null);
    }
    return ret;
  },
  async getConfig() { return this.cfg; },
  async setConfig(cfg) { this.cfg = cfg; return true; }
};

function buildModel() {

  for (const r of S.rows) {

    if (!f) { f = {key: fk, name: val(r, 'exploitation'), rows: [], visits: []}; S.farms.set(fk, f); }
    f.rows.push(r);
    for (const k of ['adresse', 'cp', 'commune', 'tel', 'portable', 'bassin']) if (!f[k] && val(r, k)) f[k] = val(r, k);
    const st = rowStart(r); if (!st) continue;
    const vk = fk + '@' + dkey(st.date) + (st.hasTime ? 'T' + toInputTime(st.date) : '');
    let v = S.visitByKey.get(vk);
    if (!v) { v = {key: vk, farm: f, start: st.date, hasTime: st.hasTime, rows: []}; S.visitByKey.set(vk, v); S.visits.push(v); f.visits.push(v); }

}

    const ret = await B.apply([['AddColumn', draft.rdvTable, f.create.id, colInfo(f.create)]]);
    draft.map[f.k] = (ret[0] && ret[0].colId) || f.create.id;
  }
  S.meta = await B.meta();
  // affichage lisible de la référence vers les inspecteurs
  const refCol = S.meta[draft.rdvTable].cols[draft.map.inspecteur], show = S.meta[T_INSP] && S.meta[T_INSP].cols.Nom_complet;
  if (refCol && show && refCol.type === 'Ref:' + T_INSP && !refCol.visibleCol) {
    try { await B.apply([['UpdateRecord', '_grist_Tables_column', refCol.rowId, {visibleCol: show.rowId}], ['SetDisplayFormula', draft.rdvTable, null, refCol.rowId, `$${refCol.colId}.Nom_complet`]]); }
    catch (e) { console.warn('Affichage de la référence non configuré', e); }
  }
  // import des préleveurs déjà saisis en texte (ex. « KERMAREC Olivier »)
  if (seedPeople && draft.map.preleveur) {
    const existing = new Set((await B.fetch(T_PREL)).map(p => normKey(personName(p))));
    const rows = await B.fetch(draft.rdvTable), names = new Map();
    rows.forEach(r => { const s = clean(r[draft.map.preleveur]); if (s && !/^<?\s*aucun\s*>?$/i.test(s) && !existing.has(normKey(s))) names.set(normKey(s), s); });
    const acts = Array.from(names.values()).map(s => {
      const w = s.split(/\s+/), up = w.filter(x => x === x.toUpperCase() && /[A-Z]/.test(x)), rest = w.filter(x => !up.includes(x));
      return ['AddRecord', T_PREL, null, up.length && rest.length ? {Nom: up.join(' '), Prenom: rest.join(' '), Actif: true} : {Nom: s, Actif: true}];
    });
    if (acts.length) await B.apply(acts);
  }
  S.cfg = draft;
  await B.setConfig(S.cfg);
}

function filteredVisits() {

function navigate(n) {

const timeLabel = v => v.hasTime ? hm(v.start) : '––h––';
function evTitle(v) {

function renderMonth(list) {

  for (let i = 0; i < total; i++) {

function nearestHint(list) {

  const t = S.cursor.getTime(), nx = list.find(v => v.start.getTime() > t) || list[list.length - 1];
  return ` — ${nx.start.getTime() > t ? 'prochain' : 'dernier'} : <a href="#" data-goto="${nx.start.getTime()}">${esc(fullDate(nx.start))}</a>`;
}
function layoutDay(evs) {
  const items = evs.map(v => ({v, s: v.start.getTime(), e: v.end.getTime(), lane: 0, lanes: 1}));
  let cluster = [], end = -1;
  const flush = () => { const n = Math.max(1, ...cluster.map(x => x.lane + 1)); cluster.forEach(x => { x.lanes = n; }); cluster = []; };
  for (const it of items) {
    if (it.s >= end && cluster.length) flush();
    const used = new Set(cluster.filter(x => x.e > it.s).map(x => x.lane));
    let l = 0; while (used.has(l)) l++;
    it.lane = l; cluster.push(it); end = Math.max(end, it.e);

}
const hourPx = () => parseInt(getComputedStyle(document.documentElement).getPropertyValue('--hour'), 10) || 44;
function renderWeek(list) {
  const a = startOfWeek(S.cursor), map = byDay(list), today = dkey(new Date());
  let h0 = S.cfg.hourStart, h1 = S.cfg.hourEnd;
  for (let i = 0; i < 7; i++) (map[dkey(addDays(a, i))] || []).filter(v => v.hasTime).forEach(v => { h0 = Math.min(h0, v.start.getHours()); h1 = Math.max(h1, v.end.getHours() + (v.end.getMinutes() ? 1 : 0)); });

  for (let h = h0 + 1; h < h1; h++) body += `<span style="top:${(h - h0) * H}px">${pad(h)}h</span>`;
  body += '</div>';

    body += `<div class="wcol${k === today ? ' today' : ''}" data-wday="${k}" data-h0="${h0}">`;
    const untimed = evs.filter(v => !v.hasTime);

    });
    untimed.forEach((v, j) => { body += `<div class="wev ${stClass(v.statut)}" role="button" tabindex="0" data-visit="${esc(v.key)}" title="${esc(evTitle(v))}" style="top:${j * 22}px;height:20px;left:1px;width:calc(100% - 3px);opacity:.85"><b>Heure ? ${esc(v.farm.name)}</b></div>`; });
    if (k === today) { const n = new Date(); const t = ((n.getHours() - h0) * 60 + n.getMinutes()) * ppm; if (t >= 0 && t <= height) body += `<div class="nowline" style="top:${t}px"></div>`; }
    body += '</div>';
  }
  $('#calBody').innerHTML = head + '</div>' + body + '</div><p class="sub" style="margin-top:6px">Cliquez sur une plage libre pour créer un rendez-vous à cette heure.</p>';
}
function renderList(list) {

function nextFreeSlot(date, evs) {
  const d = new Date(date.getFullYear(), date.getMonth(), date.getDate(), Math.max(8, S.cfg.hourStart), 0);
  const active = evs.filter(v => !isCancelled(v.statut) && v.hasTime);
  if (active.length) { const last = Math.max(...active.map(v => v.end.getTime())); if (last > d.getTime()) d.setTime(Math.ceil(last / 900000) * 900000); }
  return d;
}

function renderFarms() {
  const q = norm(S.expQ), now = Date.now();
  const all = Array.from(S.farms.values());
  const rows = all.map(f => {
    const planned = f.rows.filter(r => rowStart(r)).length, active = f.visits.filter(v => !isCancelled(v.statut));
    return {f, planned, next: active.find(v => v.start.getTime() >= now) || null, last: active[active.length - 1] || null};
  }).filter(x => (!q || norm([x.f.name, x.f.commune, x.f.cp, x.f.adresse].concat(x.f.rows.map(r => val(r, 'dossier'))).join(' ')).includes(q))
    && (!S.expBassin || x.f.bassin === S.expBassin)
    && (S.expFilter !== 'todo' || x.planned < x.f.rows.length) && (S.expFilter !== 'none' || !x.planned))
    .sort((a, b) => a.f.name.localeCompare(b.f.name));

  $('#main').innerHTML = `<div class="section-head"><h2>Exploitations</h2>

      <div><label class="lbl" for="ef">Planification</label><select class="select" id="ef">${optList([['todo', 'Parcelles restant à planifier'], ['none', 'Aucun rendez-vous']], S.expFilter, 'Toutes')}</select></div>
    </div>
    ${rows.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Exploitation</th><th>Commune</th>${M('bassin') ? '<th>Bassin versant</th>' : ''}<th>Parcelles</th><th>Prochain / dernier RDV</th><th></th></tr></thead><tbody>
    ${shown.map(x => { const v = x.next || x.last;
      return `<tr class="click" data-farm="${esc(x.f.key)}"><td><span class="strong">${esc(x.f.name)}</span>${x.f.portable || x.f.tel ? `<div class="sub">${esc(x.f.portable || x.f.tel)}</div>` : ''}</td>
      <td>${esc([x.f.cp, x.f.commune].filter(Boolean).join(' '))}</td>${M('bassin') ? `<td>${esc(x.f.bassin)}</td>` : ''}
      <td><span class="tag">${x.planned} / ${x.f.rows.length} planifiée(s)</span></td>
      <td>${v ? `${esc(shortDate(v.start))}${v.hasTime ? ' à ' + hm(v.start) : ''} <span class="badge ${stClass(v.statut)}">${esc(v.statut || 'Sans statut')}</span>${v.prel ? `<div class="sub">${esc(v.prel.name)}</div>` : ''}` : '<span class="sub">—</span>'}</td>
      <td class="act"><button class="btn sec" data-plan="${esc(x.f.key)}">${ic('add')}Planifier</button></td></tr>`; }).join('')}
    </tbody></table></div>${rows.length > shown.length ? `<p class="sub">${rows.length - shown.length} exploitation(s) supplémentaire(s) : affinez la recherche.</p>` : ''}` : '<p class="empty">Aucune exploitation ne correspond.</p>'}`;
  $('#eq').addEventListener('input', e => { S.expQ = e.target.value; clearTimeout(renderFarms.t); renderFarms.t = setTimeout(() => { renderFarms(); const i = $('#eq'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }, 250); });

// Valeurs à écrire pour la date et l'heure, selon le type des colonnes
function dateTimeFields(d) {
  const out = {}, dc = M('date'), dt = colType('date'), hc = M('heure'), ht = colType('heure');
  const [y, m, dd, h, mi] = [d.getFullYear(), d.getMonth() + 1, d.getDate(), d.getHours(), d.getMinutes()];
  if (dt === 'Date') out[dc] = Date.UTC(y, m - 1, dd) / 1000;
  else if (dt.startsWith('DateTime')) out[dc] = wallToEpoch(y, m, dd, hc ? 0 : h, hc ? 0 : mi, tzOf(dt));
  else out[dc] = `${y}-${pad(m)}-${pad(dd)}` + (hc ? '' : ` ${pad(h)}:${pad(mi)}`);
  if (hc && writable('heure')) {
    const sample = S.rows.map(r => r[hc]).find(v => v !== null && v !== undefined && v !== '');
    if (ht.startsWith('DateTime')) out[hc] = wallToEpoch(1970, 1, 1, h, mi, tzOf(ht));
    else if (ht === 'Numeric' || ht === 'Int') out[hc] = typeof sample === 'number' && sample >= 1 ? h * 3600 + mi * 60 : (h * 60 + mi) / 1440;
    else out[hc] = /^\d{1,2}:\d{2}:\d{2}$/.test(String(sample || '')) ? `${pad(h)}:${pad(mi)}:00` : `${pad(h)}:${pad(mi)}`;
  }
  return out;
}
function clearFields() {
  const out = {};
  for (const k of ['date', 'heure', 'statut']) if (writable(k)) out[M(k)] = null;
  return out;
}
function personWriteValue(k, v) { return colType(k).startsWith('Ref:') ? (Number(v) || 0) : (v || null); }

        ${M('inspecteur') ? `<div class="grp"><label class="lbl" for="vInsp">Inspecteur FranceAgriMer<span class="hint">Facultatif (contrôle)</span></label><select class="select" id="vInsp" ${ro('inspecteur')}>${optList(inspCh.map(o => [o.value, o.label]), v && v.insp ? v.insp.value : '', '— Aucun —')}</select></div>` : ''}

      </div>

      ${M('remarques') ? `<div class="grp"><label class="lbl" for="vRem">Remarques RDV</label><textarea class="input" id="vRem" ${ro('remarques')}>${esc(v ? v.remarques : '')}</textarea></div>` : ''}
    </form>`, {wide: true, foot: `<div class="left">${v ? `<button class="btn danger" id="vDel" title="Retire la date et l'heure des parcelles de ce rendez-vous">${ic('delete')}Déplanifier</button>` : ''}

    const fields = dateTimeFields(w.date);
    if (!w.hasTime && M('heure') && writable('heure')) fields[M('heure')] = null;
    if ($('#vPrel') && writable('preleveur')) fields[M('preleveur')] = personWriteValue('preleveur', $('#vPrel').value);
    if ($('#vInsp') && writable('inspecteur')) fields[M('inspecteur')] = personWriteValue('inspecteur', $('#vInsp').value);
    if ($('#vSt') && writable('statut')) fields[M('statut')] = $('#vSt').value || null;
    if ($('#vRem') && writable('remarques')) fields[M('remarques')] = $('#vRem').value.trim() || null;
    if ($('#vDur') && writable('duree')) fields[M('duree')] = Number($('#vDur').value);
    const acts = ids.map(id => ['UpdateRecord', S.cfg.rdvTable, id, fields]);
    if (v) v.rows.filter(r => !ids.includes(r.id)).forEach(r => acts.push(['UpdateRecord', S.cfg.rdvTable, r.id, clearFields()]));
    if (await write(acts, v ? 'Rendez-vous mis à jour' : 'Rendez-vous créé')) { if (opts.back) opts.back(); else closeModal(); }
  };
  if (v) $('#vDel').onclick = async () => {
    if ($('#vDel').dataset.confirm !== '1') { $('#vDel').dataset.confirm = '1'; $('#vDel').innerHTML = ic('warning') + 'Confirmer : retirer la date de ' + v.rows.length + ' parcelle(s)'; return; }
    if (await write(v.rows.map(r => ['UpdateRecord', S.cfg.rdvTable, r.id, clearFields()]), 'Rendez-vous déplanifié')) { if (opts.back) opts.back(); else closeModal(); }
  };
}
function miniVisit(v) {
  return `<div class="rdv-mini ${stClass(v.statut)}" data-visit="${esc(v.key)}" role="button" tabindex="0"><b>${esc(fullDate(v.start))}${v.hasTime ? ' · ' + hm(v.start) + '–' + hm(v.end) : ''}</b>
    <span class="badge ${stClass(v.statut)}">${esc(v.statut || 'Sans statut')}</span><span class="sub">${v.rows.length} parcelle(s)</span>
    ${v.prel ? `<span class="sub">${ic('user')} ${esc(v.prel.name)}</span>` : ''}${v.insp ? `<span class="sub">${ic('shield')} ${esc(v.insp.name)}</span>` : ''}${v.remarques ? `<span class="sub">${esc(v.remarques)}</span>` : ''}</div>`;
}

/* ============================================================
   FICHE EXPLOITATION
   ============================================================ */
function openFarm(farmKey) {
  const f = S.farms.get(farmKey); if (!f) return;
  const obs = Array.from(new Set(f.rows.map(r => val(r, 'observations')).filter(Boolean)));
  const fld = (k, v, html) => v ? `<div class="fld"><div class="k">${esc(k)}</div><div class="v">${html || esc(v)}</div></div>` : '';
  const showCols = ['parcelle', 'surface', 'numPrelev', 'type', 'culture', 'dossier'].filter(k => M(k));
  openModal(`<h2>${ic('plant')}${esc(f.name)}</h2>
    <div class="fiche-head">${f.commune ? `<span class="tag">${esc(f.commune)}</span>` : ''}${f.bassin ? `<span class="tag">BV ${esc(f.bassin)}</span>` : ''}<span class="tag">${f.rows.length} parcelle(s)</span></div>
    <section class="fsec"><h3>${ic('pin')}Coordonnées</h3><div class="fgrid">
      ${fld('Adresse', [f.adresse, f.cp, f.commune].filter(Boolean).join(' '))}
      ${fld('Portable', f.portable, `<a href="tel:${esc(f.portable)}">${esc(f.portable)}</a>`)}${fld('Téléphone', f.tel, `<a href="tel:${esc(f.tel)}">${esc(f.tel)}</a>`)}
      ${fld('Bassin versant', f.bassin)}</div>
      ${obs.length ? `<div class="alert warn" style="margin-top:1rem"><h3>Observations</h3>${obs.map(o => `<p>${esc(o)}</p>`).join('')}</div>` : ''}</section>
    <section class="fsec"><h3>${ic('calendar')}Rendez-vous (${f.visits.length})</h3>
      ${f.visits.length ? f.visits.map(miniVisit).join('') : '<p class="muted">Aucun rendez-vous planifié.</p>'}
      <p><button class="btn sec" id="fPlan">${ic('add')}Planifier un rendez-vous</button></p></section>
    <section class="fsec"><h3>${ic('plant')}Parcelles à prélever</h3>
      <div class="tbl-wrap"><table class="tbl"><thead><tr>${showCols.map(k => `<th>${esc(FIELD[k].label)}</th>`).join('')}<th>Rendez-vous</th>${M('preleveur') ? '<th>Préleveur</th>' : ''}<th></th></tr></thead><tbody>
      ${f.rows.map(r => { const st = rowStart(r), p = personOf(r, 'preleveur'), fr = ficheRow(r);
        return `<tr>${showCols.map(k => `<td>${esc(val(r, k))}</td>`).join('')}<td>${st ? esc(shortDate(st.date)) + (st.hasTime ? ' ' + hm(st.date) : '') + (val(r, 'statut') ? ` <span class="badge ${stClass(val(r, 'statut'))}">${esc(val(r, 'statut'))}</span>` : '') : '<span class="sub">À planifier</span>'}</td>
        ${M('preleveur') ? `<td>${esc(p ? p.name : '')}</td>` : ''}<td class="act">${fr ? `<button class="btn ter" data-lab="${fr.id}" data-farm-back="${esc(f.key)}">Fiche prélèvement</button>` : ''}</td></tr>`; }).join('')}
      </tbody></table></div></section>`, {wide: true, foot: `<button class="btn ter" data-close>Fermer</button>`});
  const back = () => openFarm(farmKey);
  $('#fPlan').onclick = () => openVisitForm(null, {farmKey, date: nextFreeSlot(new Date(), []), back});
  $$('.modal [data-visit]').forEach(el => { el.onclick = e => { e.stopPropagation(); openVisitForm(el.dataset.visit, {back}); }; });
  $$('.modal [data-lab]').forEach(el => { el.onclick = e => { e.stopPropagation(); openLabFiche(Number(el.dataset.lab), false, back); }; });
}

/* ---------- Fiche de prélèvement détaillée (ex. DATA_Lab) ---------- */
const TRIVIAL = new Set(['', "''", '""', 'None', 'False', '0']);
function colKind(c) {
  if (!c) return 'ro';
  if (c.isFormula && c.formula.trim()) return TRIVIAL.has(c.formula.trim()) ? 'const' : 'ro';
  if (c.type.startsWith('Ref') || c.type === 'Attachments' || c.type === 'ChoiceList') return 'ro';
  return 'edit';
}
function fmtVal(v, c) {
  if (v === null || v === undefined || v === '' || isErr(v)) return '';
  const t = c ? c.type : 'Any';
  if (t === 'Bool' || typeof v === 'boolean') return v ? 'Oui' : 'Non';
  if (typeof v === 'number' && t.startsWith('DateTime')) { const p = partsInTz(v, tzOf(t)); return `${pad(p.d)}/${pad(p.m)}/${p.y} à ${pad(p.h)}h${pad(p.mi)}`; }
  if (typeof v === 'number' && t === 'Date') return new Date(v * 1000).toLocaleDateString('fr-FR', {timeZone: 'UTC'});
  if (Array.isArray(v)) return v[0] === 'L' ? v.slice(1).join(', ') : '';
  if (typeof v === 'number') return v.toLocaleString('fr-FR', {maximumFractionDigits: 6, useGrouping: !/GPS|dossier/i.test(c ? c.colId : '')});
  return String(v);
}
function editor(k, v, c, full) {
  const t = c.type, id = 'f_' + k;
  if (t === 'Bool') return `<label class="chk"><input type="checkbox" id="${id}" data-k="${k}" ${v ? 'checked' : ''}> Oui</label>`;
  if (t.startsWith('DateTime')) { const p = typeof v === 'number' ? partsInTz(v, tzOf(t)) : null; return `<input class="input" type="datetime-local" id="${id}" data-k="${k}" value="${p ? `${p.y}-${pad(p.m)}-${pad(p.d)}T${pad(p.h)}:${pad(p.mi)}` : ''}">`; }
  if (t === 'Date') { const d = typeof v === 'number' ? new Date(v * 1000).toISOString().slice(0, 10) : ''; return `<input class="input" type="date" id="${id}" data-k="${k}" value="${d}">`; }
  if (t === 'Numeric' || t === 'Int') return `<input class="input" type="number" step="any" id="${id}" data-k="${k}" value="${typeof v === 'number' ? v : ''}">`;
  if (t === 'Choice') { const ch = c.choices.slice(); if (v && !ch.includes(v)) ch.unshift(v); return `<select class="select" id="${id}" data-k="${k}">${optList(ch.map(x => [x, x]), v || '', '—')}</select>`; }
  if (full) return `<textarea class="input" id="${id}" data-k="${k}">${esc(isErr(v) ? '' : v)}</textarea>`;
  return `<input class="input" id="${id}" data-k="${k}" value="${esc(isErr(v) || v == null ? '' : v)}">`;
}
function readEditor(el, c) {
  const t = c.type;
  if (t === 'Bool') return el.checked;
  if (t.startsWith('DateTime')) { if (!el.value) return null; const [a, b] = el.value.split('T'); const [y, m, d] = a.split('-').map(Number), [h, mi] = b.split(':').map(Number); return wallToEpoch(y, m, d, h, mi, tzOf(t)); }
  if (t === 'Date') { if (!el.value) return null; const [y, m, d] = el.value.split('-').map(Number); return Date.UTC(y, m - 1, d) / 1000; }
  if (t === 'Numeric' || t === 'Int') return el.value === '' ? null : Number(el.value);
  return el.value === '' ? null : el.value;
}
async function reloadFiche() { const rows = await B.fetch(S.cfg.ficheTable); S.fiche = new Map(); rows.forEach(x => { const k = clean(x[S.cfg.ficheKey]); if (k && !S.fiche.has(k)) S.fiche.set(k, x); }); return rows; }
function openLabFiche(rowId, editMode, back) {
  const s = Array.from(S.fiche.values()).find(x => x.id === rowId); if (!s) return;
  const c = S.meta[S.cfg.ficheTable].cols, listed = new Set();
  const sections = FICHE_SECTIONS.map(sec => ({title: sec.title, icon: sec.icon, fields: sec.fields.filter(([k]) => { if (c[k]) { listed.add(k); return true; } return false; })}));
  const extra = Object.keys(c).filter(k => !listed.has(k) && !FICHE_HIDDEN.has(k) && !k.startsWith('gristHelper') && !isErr(s[k]) && !(c[k].isFormula && !c[k].formula.trim() && s[k] == null));
  if (extra.length) sections.push({title: 'Autres informations', icon: 'info', fields: extra.map(k => [k, c[k].label || k])});
  const consts = editMode ? Object.keys(c).filter(k => listed.has(k) && colKind(c[k]) === 'const') : [];
  const body = sections.filter(sec => sec.fields.length).map(sec => `<section class="fsec"><h3>${ic(sec.icon)}${esc(sec.title)}</h3><div class="fgrid">
    ${sec.fields.map(([k, label, full]) => {
      const cc = c[k], kind = colKind(cc), v = s[k], f = fmtVal(v, cc);
      if (editMode && kind === 'edit') return `<div class="fld${full ? ' full' : ''}"><label class="lbl" for="f_${k}">${esc(label)}</label>${editor(k, v, cc, full)}</div>`;
      return `<div class="fld${full ? ' full' : ''}"><div class="k">${esc(label)}</div><div class="v${f ? '' : ' na'}">${esc(f || 'Non renseigné')}</div>${editMode && kind !== 'edit' ? `<div class="ro">${kind === 'const' ? 'Formule constante' : 'Calculé (formule)'}</div>` : ''}</div>`;
    }).join('')}</div></section>`).join('');
  openModal(`<h2>${ic('info')}Fiche de prélèvement</h2><p class="lead">Table <code>${esc(S.cfg.ficheTable)}</code> · ${esc(S.cfg.ficheKey)} ${esc(s[S.cfg.ficheKey])}</p>
    ${consts.length ? `<div class="alert warn"><p>${consts.length} champ(s) sont des formules constantes (${esc(consts.map(k => c[k].label || k).join(', '))}) et ne peuvent pas être saisis.</p><p><button class="btn sec" id="convertBtn">Les rendre saisissables</button></p></div>` : ''}
    ${body}`, {wide: true, foot: editMode
    ? `<button class="btn ter" id="lCancel">Annuler</button><button class="btn" id="lSave">${ic('check')}Enregistrer la fiche</button>`
    : `<div class="left">${back ? `<button class="btn ter" id="lBack">${ic('left')}Retour à l'exploitation</button>` : ''}</div><button class="btn ter" data-close>Fermer</button><button class="btn" id="lEdit">${ic('edit')}Modifier la fiche</button>`});
  const reopen = edit => openLabFiche(rowId, edit, back);
  if (!editMode) { $('#lEdit').onclick = () => reopen(true); if ($('#lBack')) $('#lBack').onclick = back; return; }
  $('#lCancel').onclick = () => reopen(false);
  if ($('#convertBtn')) $('#convertBtn').onclick = async () => {
    try { await B.apply(consts.map(k => ['ModifyColumn', S.cfg.ficheTable, k, {isFormula: false}])); S.meta = await B.meta(); await reloadFiche(); toast('Colonnes converties'); reopen(true); }
    catch (e) { toast('Échec : ' + (e.message || e), true); }
  };
  $('#lSave').onclick = async () => {
    const f = {};
    $$('.modal [data-k]').forEach(el => { const k = el.dataset.k, v = readEditor(el, c[k]), old = s[k] ?? null; if (v !== old && !(v === null && old === '')) f[k] = v; });
    if (!Object.keys(f).length) { reopen(false); return; }
    try { await B.apply([['UpdateRecord', S.cfg.ficheTable, rowId, f]]); await reloadFiche(); toast('Fiche enregistrée'); reopen(false); }
    catch (e) { toast('Échec de l\'enregistrement : ' + (e.message || e), true); }
  };
}

/* ============================================================
   MODALE, ÉCRITURE, ÉVÉNEMENTS
   ============================================================ */
let lastFocus = null;
function openModal(html, {foot = '', wide = false} = {}) {
  if (!$('#modalRoot').firstChild) lastFocus = document.activeElement;
  $('#modalRoot').innerHTML = `<div class="overlay" id="overlay"><div class="modal${wide ? ' wide' : ''}" role="dialog" aria-modal="true">
    <div class="modal-close"><button class="btn ghost" data-close>Fermer ${ic('close')}</button></div>
    <div class="modal-body">${html}</div>${foot ? `<div class="modal-foot">${foot}</div>` : ''}</div></div>`;
  const f = $('.modal-body input:not([type=checkbox]):not([disabled]), .modal-body select:not([disabled]), .modal-body textarea') || $('.modal [data-close]');
  if (f) f.focus();
}
function closeModal() { $('#modalRoot').innerHTML = ''; if (lastFocus && lastFocus.focus) lastFocus.focus(); }

async function write(actions, okMsg) {
  try {
    await B.apply(actions);
    await loadData(); render();
    if (okMsg) toast(okMsg);
    return true;
  } catch (e) {
    console.error(e);
    toast('Échec de l\'enregistrement : ' + (e.message || e) + '. Vérifiez que le widget a l\'accès complet au document.', true);
    return false;
  }
}

document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('[data-close]') || t.id === 'overlay') { closeModal(); return; }
  const vis = t.closest('[data-visit]'); if (vis) { openVisitForm(vis.dataset.visit); return; }
  const more = t.closest('[data-day-more]'); if (more) { openDay(more.dataset.dayMore); return; }
  const go = t.closest('[data-goto]'); if (go) { e.preventDefault(); S.cursor = new Date(Number(go.dataset.goto)); renderCalendar(); return; }
  const plan = t.closest('[data-plan]'); if (plan) { e.stopPropagation(); openVisitForm(null, {farmKey: plan.dataset.plan, date: nextFreeSlot(new Date(), [])}); return; }
  const farm = t.closest('[data-farm]'); if (farm) { openFarm(farm.dataset.farm); return; }
  const ep = t.closest('[data-edit-person]'); if (ep) { const [tb, id] = ep.dataset.editPerson.split(':'); openPersonForm(tb, Number(id)); return; }
  const fp = t.closest('[data-filter-person]');
  if (fp) { e.preventDefault(); const i = fp.dataset.filterPerson.indexOf('|'), tb = fp.dataset.filterPerson.slice(0, i), key = fp.dataset.filterPerson.slice(i + 1);
    S.f = {prel: '', insp: '', statut: '', bassin: '', type: '', q: ''}; S.f[tb === T_PREL ? 'prel' : 'insp'] = key; S.tab = 'cal'; S.view = 'list'; render(); return; }
  const cell = t.closest('.cell[data-day]'); if (cell) { openDay(cell.dataset.day); return; }
  const wcol = t.closest('.wcol');
  if (wcol && t === wcol) {
    const R = wcol.getBoundingClientRect(), hh = hourPx();
    const mins = Math.floor((e.clientY - R.top) / hh * 60 / 15) * 15 + Number(wcol.dataset.h0) * 60;
    const [y, m, d] = wcol.dataset.wday.split('-').map(Number);
    openVisitForm(null, {date: new Date(y, m - 1, d, Math.floor(mins / 60), mins % 60)});
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#modalRoot').firstChild) closeModal();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.rdv-mini, .wev')) { e.preventDefault(); e.target.click(); }
});
$$('.tab').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; render(); });
$('#refreshBtn').onclick = async () => { if ($('#tabs').hidden) return; try { await loadData(); render(); toast('Données actualisées'); } catch (e) { toast(e.message || String(e), true); } };
$('#settingsBtn').onclick = () => { closeModal(); renderConfig(); };
let resizeT; window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (S.tab === 'cal' && !$('#tabs').hidden) renderCalendar(); }, 150); });

/* ============================================================
   DÉMARRAGE
   ============================================================ */
async function boot() {
  try {
    S.meta = await B.meta();
    if (!configReady()) { renderConfig(); return; }
    await loadData();
    $('#tabs').hidden = false;
    render();
  } catch (e) {
    console.error(e);
    $('#tabs').hidden = true;
    $('#main').innerHTML = `<div class="setup"><div class="alert err"><h3>Impossible de lire le document</h3><p>${esc(e.message || e)}</p>
      <p>Dans le panneau de droite de Grist, réglez l'<b>accès</b> du widget sur <b>« Accès complet au document »</b>, puis rechargez.</p></div>
      <p><button class="btn" id="cfgBtn">${ic('settings')}Ouvrir la configuration</button></p></div>`;
    $('#cfgBtn').onclick = () => renderConfig();
  }
}
let reloadT;
function scheduleReload() { clearTimeout(reloadT); reloadT = setTimeout(async () => { if ($('#tabs').hidden) return; try { await loadData(); if (!$('#modalRoot').firstChild) render(); } catch (e) { console.warn(e); } }, 400); }

async function start(backend) {
  B = backend;
  const saved = await B.getConfig();
  if (saved && typeof saved === 'object') S.cfg = Object.assign({}, DEFAULT_CFG, saved);
  await boot();
}

if (window.grist && window.self !== window.top) {
  grist.ready({requiredAccess: 'full', allowSelectBy: false, onEditOptions: () => renderConfig()});
  grist.onRecords(() => scheduleReload());
  start(GristBackend);
} else {
  $('#demoBanner').hidden = false;
  B = LocalBackend;
  B.meta().then(async meta => {
    S.meta = meta;
    const draft = Object.assign({}, DEFAULT_CFG, {rdvTable: '__create__'});
    await install(draft, false);
    const rows = demoRows(); Object.assign(LocalBackend.db[T_RDV], {rows, next: rows.length + 1});
    await install(LocalBackend.cfg, true);
    await B.apply([['AddRecord', T_INSP, null, {Nom: 'MARTIN', Prenom: 'Claire', Service: 'FranceAgriMer — Rennes', Departements: '22, 35', Actif: true}],
      ['AddRecord', T_INSP, null, {Nom: 'KERDRAON', Prenom: 'Yann', Service: 'FranceAgriMer — Quimper', Departements: '29, 56', Actif: true}]]);
    await start(LocalBackend);
  });
}
})();
