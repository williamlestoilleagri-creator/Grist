  /* ================= Jetons DSFR ================= */
  :root{
    --bf:#000091; --bf-hover:#1212ff; --bf-active:#2323ff;
    --bf-975:#f5f5fe; --bf-950:#ececfe; --bf-925:#e3e3fd; --bf-850:#cacafb;
    --rm:#e1000f;
    --title:#161616; --text:#3a3a3a; --mention:#666666; --disabled:#929292;
    --border:#dddddd; --alt:#f6f6f6; --contrast:#eeeeee; --contrast-hover:#dddddd; --surface:#ffffff;
    --success:#18753c; --success-bg:#b8fec9; --success-soft:#dffee6;
    --error:#ce0500; --error-bg:#ffe9e9;
    --warning:#b34000; --warning-bg:#ffe9e6;
    --info:#0063cb; --info-bg:#e8edff;
    --new:#695240; --new-bg:#feebd0;
    --grey-bg:#eeeeee;
    --focus:#0a76f6;
    --shadow:0 1px 3px rgba(0,0,18,.16);
    --shadow-lg:0 6px 18px rgba(0,0,18,.16),0 2px 6px rgba(0,0,18,.12);
    --font:Marianne,arial,sans-serif;
    --hour:44px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--surface);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit;color:inherit}
  a{color:var(--bf);text-underline-offset:3px}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  h1,h2,h3{color:var(--title);margin:0;font-weight:700}
  .muted{color:var(--mention)}
  .sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  [hidden]{display:none!important}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.fr-logo--sm:before{background-position:0 -.046875rem,0 0,0 0;background-size:2.0625rem .84375rem,2.0625rem .75rem,0;height:.75rem;margin-bottom:.25rem;width:2.0625rem}

  /* ================= En-tête ================= */
  .hdr{background:var(--surface);box-shadow:0 2px 6px rgba(0,0,18,.12);position:relative;z-index:20}
  .hdr-in{display:flex;align-items:center;gap:16px;padding:10px 20px;min-height:72px;flex-wrap:wrap}
  .svc{border-left:1px solid var(--border);padding-left:16px;min-width:0}
  .svc-title{margin:0;font-weight:700;font-size:1.1rem;color:var(--title);line-height:1.3}
  .svc-tag{margin:0;font-size:.8rem;color:var(--mention)}
  .hdr-tools{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .demo{background:var(--info-bg);color:var(--info);font-size:.8rem;padding:6px 20px;display:flex;gap:8px;align-items:center}

  /* ================= Onglets ================= */
  .tabs{display:flex;gap:4px;padding:0 20px;border-bottom:1px solid var(--border);overflow-x:auto;background:var(--surface)}
  .tab{border:0;background:var(--bf-950);color:var(--title);padding:.6rem 1rem;font-weight:500;font-size:.9rem;cursor:pointer;margin-top:8px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
  .tab:hover{background:var(--bf-925)}
  .tab[aria-selected="true"]{background:var(--surface);color:var(--bf);box-shadow:inset 0 2px 0 var(--bf),inset 1px 0 0 var(--border),inset -1px 0 0 var(--border);margin-bottom:-1px}
  .tab .count{font-size:.72rem;background:var(--contrast);color:var(--mention);border-radius:99px;padding:0 7px}

  main{padding:18px 20px 40px;max-width:1400px;margin:0 auto}

  /* ================= Boutons ================= */
  .btn{display:inline-flex;align-items:center;gap:.4rem;border:0;cursor:pointer;font-weight:500;font-size:.875rem;line-height:1.5rem;padding:.25rem .75rem;min-height:2rem;background:var(--bf);color:#f5f5fe;text-decoration:none;white-space:nowrap}
  .btn:hover{background:var(--bf-hover)}
  .btn:active{background:var(--bf-active)}
  .btn:disabled{background:var(--contrast);color:var(--disabled);cursor:not-allowed}
  .btn.sec{background:transparent;color:var(--bf);box-shadow:inset 0 0 0 1px var(--bf)}
  .btn.sec:hover{background:var(--bf-975)}
  .btn.ter{background:transparent;color:var(--bf);box-shadow:inset 0 0 0 1px var(--border)}
  .btn.ter:hover{background:var(--alt)}
  .btn.ghost{background:transparent;color:var(--bf);box-shadow:none}
  .btn.ghost:hover{background:var(--alt)}
  .btn.danger{background:transparent;color:var(--error);box-shadow:inset 0 0 0 1px var(--error)}
  .btn.danger:hover{background:var(--error-bg)}
  .btn.lg{font-size:1rem;padding:.5rem 1.5rem;min-height:2.5rem}
  .btn.icon{padding:.25rem .5rem}
  .btn-group{display:inline-flex}
  .btn-group .btn{box-shadow:inset 0 0 0 1px var(--bf);background:transparent;color:var(--bf)}
  .btn-group .btn+.btn{margin-left:-1px}
  .btn-group .btn[aria-pressed="true"]{background:var(--bf);color:#fff}

  /* ================= Formulaires ================= */
  label.lbl{display:block;color:var(--title);font-size:.875rem;margin-bottom:.35rem}
  label.lbl .hint{display:block;color:var(--mention);font-size:.75rem}
  .input,.select{display:block;width:100%;border:0;border-radius:.25rem .25rem 0 0;background:var(--contrast);box-shadow:inset 0 -2px 0 0 var(--text);padding:.5rem .75rem;font-size:.9rem;min-height:2.5rem;color:var(--title)}

  /* ================= Panneau jour ================= */
  .daylist{display:flex;flex-direction:column;gap:6px}

  /* ================= Toast / chargement ================= */
  #toastRoot{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:flex-end}

  code{font-size:.85em;background:var(--alt);padding:0 4px}

  @media print{

  }
</style>

</nav>

<script>
(function () {
'use strict';

/* ============================================================
   CONFIGURATION
   ============================================================ */
const T_RDV = 'RDV_Prelevements', T_PREL = 'Preleveurs', T_INSP = 'Inspecteurs_FAM';
const STATUTS = ['Prévu', 'À confirmer', 'Réalisé', 'Reporté', 'Annulé', 'Non retenu'];
const STATUT_COLORS = {'Prévu': ['#e8edff', '#0063cb'], 'À confirmer': ['#feebd0', '#695240'], 'Réalisé': ['#b8fec9', '#18753c'],
  'Reporté': ['#e3e3fd', '#000091'], 'Annulé': ['#ffe9e9', '#ce0500'], 'Non retenu': ['#ffe9e9', '#ce0500']};
const DUREES = [30, 45, 60, 90, 120, 180, 240];
const DEFAULT_CFG = {source: 'DATA_Lab', sync: true, hourStart: 7, hourEnd: 19, duree: 60};

// Fiche exploitation : colonnes de DATA_Lab (libellés repris de l'export CSV)
const FICHE_SECTIONS = [
  {title: 'Exploitation', icon: 'plant', fields: [
    ['Pacage', 'Pacage'], ['Nom_ou_Raison_sociale', 'Nom ou raison sociale'], ['dossier_number', 'N° de dossier (DN)'],
    ['Adresse_complete', 'Adresse complète', true], ['Departement', 'Département'], ['Code_departement', 'Code département']]},
  {title: 'Prise de contact', icon: 'time', fields: [

    ['Statut', 'Statut'], ['Presence_souhaitee_de_l_agriculteur', 'Présence souhaitée de l\'agriculteur'], ['Date_Heure_RDV', 'Date/heure RDV']]},

    ['Nom_prenom_du_preleveur', 'Nom prénom du préleveur'], ['Nom_du_preleveur', 'Nom du préleveur'],
    ['Date_et_heure_de_prelevement', 'Date et heure de prélèvement'], ['Lieu_du_depot_des_echantillons', 'Lieu du dépôt des échantillons'],
    ['Culture_en_place', 'Culture en place'], ['Nature_du_couvert_en_place', 'Nature du couvert en place'],
    ['Developpement_vegetatif_de_la_culture_en_placeDeveloppement_vegetatif_de_la_culture_en_place', 'Développement végétatif de la culture en place'],
    ['Absence_de_fertilisation_recente', 'Absence de fertilisation récente']]},
  {title: 'Sol et horizons', icon: 'plant', fields: [
    ['Profondeur_du_sol_preleve_en_cm_', 'Profondeur du sol prélevé (cm)'], ['Type_de_sol', 'Type de sol'], ['Nombre_d_horizons_preleves', 'Nombre d\'horizons prélevés'],
    ['Estimation_pierrosite_de_l_horizon_1', 'Pierrosité horizon 1'], ['Estimation_pierrosite_de_l_horizon_2', 'Pierrosité horizon 2'], ['Estimation_pierrosite_de_l_horizon_3', 'Pierrosité horizon 3']]},
  {title: 'Géolocalisation (Lambert 93)', icon: 'pin', fields: [
    ['GPS_LAMBERT_93_X_1_', 'X (1)'], ['GPS_LAMBERT_93_Y_1_', 'Y (1)'], ['GPS_LAMBERT_93_X_2_', 'X (2)'], ['GPS_LAMBERT_93_Y_2_', 'Y (2)']]},
  {title: 'Suivi', icon: 'info', fields: [
    ['Commentaire', 'Commentaire', true], ['Motif_Prelevement_non_retenu', 'Motif prélèvement non retenu', true], ['Etiquette_prelevement', 'Étiquette prélèvement']]}
];
const FICHE_HIDDEN = new Set(['manualSort', 'A', 'N_PACAGE_de_l_exploitant_Nom_Raison_sociale', 'Code_dpt']);
const pick = (cols, names) => names.find(n => cols[n]) || null;
const NAME_COLS = ['Nom_ou_Raison_sociale', 'Raison_sociale', 'raison_sociale', 'Nom_Raison_sociale', 'Nom'];
const PACAGE_COLS = ['Pacage', 'PACAGE'];
const DPT_COLS = ['Code_dpt', 'Code_departement', 'Departement'];
const ADDR_COLS = ['Adresse_complete', 'Adresse'];

/* ============================================================
   OUTILS
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const ic = n => `<span class="ic ic-${n}" aria-hidden="true"></span>`;
const pad = n => String(n).padStart(2, '0');
const MONTHS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
const DAYS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
const WD = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
function withTimeout(p, ms, msg) { return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error(msg || 'Délai dépassé')), ms))]); }
const dkey = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const hm = d => pad(d.getHours()) + 'h' + pad(d.getMinutes());
const fullDate = d => DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
const startOfWeek = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const epoch = d => Math.round(d.getTime() / 1000);
const isErr = v => Array.isArray(v) && v[0] === 'E';
function initials(name) { return String(name || '').split(/[\s-]+/).filter(Boolean).map(w => w[0].toUpperCase()).slice(0, 3).join(''); }
function stClass(s) {
  const v = String(s || '').toLowerCase();
  if (!v) return 'st-none';
  if (v.includes('annul') || v.includes('non retenu') || v.includes('refus')) return 'st-annule';
  if (v.includes('réalis') || v.includes('realis') || v.includes('effectu')) return 'st-fait';
  if (v.includes('report')) return 'st-report';
  if (v.includes('confirm') || v.includes('attente')) return 'st-confirm';
  return 'st-prevu';
}
const isCancelled = s => stClass(s) === 'st-annule';
function toast(msg, err) {
  const el = document.createElement('div');
  el.className = 'toast' + (err ? ' err' : '');
  el.innerHTML = ic(err ? 'warning' : 'check') + '<span>' + esc(msg) + '</span>';
  $('#toastRoot').appendChild(el);

function norm(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }

/* ============================================================
   ACCÈS AUX DONNÉES — Grist ou démo locale
   ============================================================ */
function parseMeta(T, C) {
  const tables = {}, byRow = {};
  T.id.forEach((rid, i) => {
    const tid = T.tableId[i]; if (!tid || tid.startsWith('_grist')) return;
    byRow[rid] = tid; tables[tid] = {rowId: rid, cols: {}, order: [], summary: !!(T.summarySourceTable && T.summarySourceTable[i])};
  });
  const idx = C.id.map((_, i) => i).sort((a, b) => ((C.parentPos || [])[a] ?? 0) - ((C.parentPos || [])[b] ?? 0));
  for (const i of idx) {
    const tid = byRow[C.parentId[i]]; if (!tid) continue;
    const colId = C.colId[i];
    if (colId === 'manualSort' || colId.startsWith('gristHelper_')) continue;
    let wo = {}; try { wo = JSON.parse((C.widgetOptions || [])[i] || '{}') || {}; } catch (e) { wo = {}; }
    tables[tid].cols[colId] = {rowId: C.id[i], colId, label: (C.label || [])[i] || colId, type: C.type[i] || 'Any',
      isFormula: !!(C.isFormula || [])[i], formula: (C.formula || [])[i] || '', visibleCol: (C.visibleCol || [])[i] || 0, choices: wo.choices || []};
    tables[tid].order.push(colId);
  }
  return tables;
}
function toRows(d) {
  const keys = Object.keys(d);
  return (d.id || []).map((_, i) => { const r = {}; keys.forEach(k => { r[k] = d[k][i]; }); return r; });
}

const GristBackend = {
  mode: 'grist',
  async meta() {
    const T = await withTimeout(grist.docApi.fetchTable('_grist_Tables'), 15000, 'Pas de réponse de Grist');
    const C = await grist.docApi.fetchTable('_grist_Tables_column');
    return parseMeta(T, C);
  },
  async fetch(t) { return toRows(await grist.docApi.fetchTable(t)); },
  async apply(actions) { const r = await grist.docApi.applyUserActions(actions); return r.retValues; },
  async getConfig() { try { return await withTimeout(grist.getOption('config'), 5000); } catch (e) { return null; } },
  async setConfig(cfg) { try { await withTimeout(grist.setOption('config', cfg), 8000); return true; } catch (e) { console.warn(e); return false; } }
};

// Mini-moteur en mémoire pour l'aperçu hors Grist
const LocalBackend = {
  mode: 'local', db: {}, cfg: null,
  table(t) { return this.db[t]; },
  async meta() {
    const T = {id: [], tableId: [], summarySourceTable: []}, C = {id: [], parentId: [], parentPos: [], colId: [], label: [], type: [], isFormula: [], formula: [], visibleCol: [], widgetOptions: []};
    let tr = 0, cr = 0;
    for (const [tid, t] of Object.entries(this.db)) {
      tr++; T.id.push(tr); T.tableId.push(tid); T.summarySourceTable.push(0);
      t.cols.forEach((c, i) => { cr++; C.id.push(cr); C.parentId.push(tr); C.parentPos.push(i); C.colId.push(c.id); C.label.push(c.id); C.type.push(c.type || 'Any');
        C.isFormula.push(!!c.isFormula); C.formula.push(c.formula || ''); C.visibleCol.push(0); C.widgetOptions.push(c.widgetOptions || ''); });
    }
    return parseMeta(T, C);
  },
  calc(tid, r) {
    const t = this.db[tid], out = Object.assign({}, r);
    for (const c of t.cols) {
      if (!c.isFormula) { if (!(c.id in out)) out[c.id] = c.type === 'Bool' ? false : (c.type.startsWith('Ref:') ? 0 : null); continue; }
      const m = /^\$(\w+)\.(\w+)$/.exec(c.formula || '');
      if (m) { const ref = t.cols.find(x => x.id === m[1]); const tgt = ref && this.db[ref.type.slice(4)]; const row = tgt && tgt.rows.find(x => x.id === r[m[1]]); out[c.id] = row ? this.calc(ref.type.slice(4), row)[m[2]] ?? null : null; }
      else if (c.id === 'Nom_complet') out[c.id] = [r.Prenom, r.Nom].filter(Boolean).join(' ');
      else out[c.id] = r[c.id] ?? null;
    }
    return out;
  },
  async fetch(tid) {
    const t = this.db[tid]; if (!t) throw new Error('Table inconnue : ' + tid);
    const rows = t.rows.map(r => this.calc(tid, r)), d = {id: rows.map(r => r.id)};
    t.cols.forEach(c => { d[c.id] = rows.map(r => r[c.id]); });
    return toRows(d);
  },
  async apply(actions) {
    const ret = [];
    for (const a of actions) {
      const [op, tid] = a, t = this.db[tid];
      if (op === 'AddTable') { this.db[tid] = {next: 1, rows: [], cols: a[2].map(c => Object.assign({}, c))}; ret.push({table_id: tid}); continue; }
      if (op === 'AddColumn') { t.cols.push(Object.assign({id: a[2]}, a[3])); ret.push({colId: a[2]}); continue; }
      if (op === 'ModifyColumn') { Object.assign(t.cols.find(c => c.id === a[2]), a[3]); ret.push(null); continue; }
      if (op === 'AddRecord') { const id = t.next++; const r = {id}; const now = epoch(new Date());
        t.cols.forEach(c => { if (!c.isFormula && c.formula) r[c.id] = c.formula === 'NOW()' ? now : c.formula === 'True' ? true : c.formula === 'user.Name' ? 'Démo' : null; });
        t.rows.push(Object.assign(r, a[3])); ret.push(id); continue; }
      if (op === 'UpdateRecord') { if (!t) { ret.push(null); continue; } const r = t.rows.find(x => x.id === a[2]); if (r) Object.assign(r, a[3]); ret.push(null); continue; }
      if (op === 'RemoveRecord') { t.rows = t.rows.filter(x => x.id !== a[2]); ret.push(null); continue; }
      ret.push(null);
    }
    return ret;
  },
  async getConfig() { return this.cfg; },
  async setConfig(cfg) { this.cfg = cfg; return true; }
};

function schema() {

function missingSchema() {
  const sc = schema(), out = {};
  for (const [t, cols] of Object.entries(sc)) {
    const ex = S.meta[t];
    const miss = ex ? cols.filter(c => !ex.cols[c.id]) : cols;
    if (!ex || miss.length) out[t] = {create: !ex, cols: miss};
  }
  return out;
}
const colInfo = c => ({type: c.type, isFormula: !!c.isFormula, formula: c.formula || '', widgetOptions: c.widgetOptions || ''});
async function install() {
  S.meta = await B.meta();
  const miss = missingSchema();
  for (const t of [T_PREL, T_INSP, T_RDV]) {
    const m = miss[t]; if (!m) continue;
    if (m.create) await B.apply([['AddTable', t, m.cols.map(c => Object.assign({id: c.id}, colInfo(c)))]]);
    else await B.apply(m.cols.map(c => ['AddColumn', t, c.id, colInfo(c)]));
  }
  S.meta = await B.meta();
  // Affichage lisible des références dans Grist (nom plutôt que n° de ligne)
  const refs = [['Exploitation', S.cfg.source, pick(srcCols(), NAME_COLS)], ['Preleveur', T_PREL, 'Nom_complet'], ['Inspecteur', T_INSP, 'Nom_complet']];
  const actions = [];
  for (const [c, target, show] of refs) {
    const cm = S.meta[T_RDV] && S.meta[T_RDV].cols[c], sm = show && S.meta[target] && S.meta[target].cols[show];
    if (!cm || !sm || cm.visibleCol) continue;
    actions.push(['UpdateRecord', '_grist_Tables_column', cm.rowId, {visibleCol: sm.rowId}]);
    actions.push(['SetDisplayFormula', T_RDV, null, cm.rowId, `$${c}.${show}`]);
  }
  if (actions.length) { try { await B.apply(actions); } catch (e) { console.warn('Affichage des références non configuré', e); } }
}

function filteredRdv() {
  const f = S.f, q = norm(f.q);
  return S.rdv.filter(r => {
    if (!rdvDate(r)) return false;
    if (f.prel && String(r.Preleveur) !== f.prel) return false;
    if (f.insp && String(r.Inspecteur) !== f.insp) return false;
    if (f.statut === '__none' ? r.Statut : (f.statut && r.Statut !== f.statut)) return false;
    const s = S.srcById.get(r.Exploitation);
    if (f.dpt && srcDpt(s) !== f.dpt) return false;
    if (q && !norm(srcLabel(s) + ' ' + (r.Objet || '') + ' ' + (r.Lieu || '')).includes(q)) return false;
    return true;
  }).sort((a, b) => a.Date_RDV - b.Date_RDV);
}
function byDay(list) { const m = {}; list.forEach(r => { const k = dkey(rdvDate(r)); (m[k] = m[k] || []).push(r); }); return m; }
function optList(arr, sel, empty) { return `<option value="">${empty}</option>` + arr.map(([v, l]) => `<option value="${esc(v)}" ${String(v) === String(sel) ? 'selected' : ''}>${esc(l)}</option>`).join(''); }

function renderMonth(list) {

function layoutDay(evs) {
  // répartit les rendez-vous qui se chevauchent en colonnes
  const items = evs.map(r => ({r, s: rdvDate(r).getTime(), e: rdvEnd(r).getTime(), lane: 0, lanes: 1}));
  let cluster = [], end = -1;
  const flush = () => { const n = Math.max(1, ...cluster.map(x => x.lane + 1)); cluster.forEach(x => { x.lanes = n; }); cluster = []; };
  for (const it of items) {
    if (it.s >= end && cluster.length) flush();
    const used = new Set(cluster.filter(x => x.e > it.s).map(x => x.lane));
    let l = 0; while (used.has(l)) l++;
    it.lane = l; cluster.push(it); end = Math.max(end, it.e);
  }
  if (cluster.length) flush();
  return items;
}
function renderWeek(list) {
  const a = startOfWeek(S.cursor), map = byDay(list), today = dkey(new Date());
  let h0 = S.cfg.hourStart, h1 = S.cfg.hourEnd;
  for (let i = 0; i < 7; i++) (map[dkey(addDays(a, i))] || []).forEach(r => { const d = rdvDate(r), e = rdvEnd(r); h0 = Math.min(h0, d.getHours()); h1 = Math.max(h1, e.getHours() + (e.getMinutes() ? 1 : 0)); });
  const H = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--hour'), 10) || 44, ppm = H / 60, height = (h1 - h0) * H;
  let head = '<div class="week-head"><div></div>', body = `<div class="week" style="height:${height}px"><div class="hours">`;
  for (let h = h0 + 1; h < h1; h++) body += `<span style="top:${(h - h0) * H}px">${pad(h)}h</span>`;
  body += '</div>';
  for (let i = 0; i < 7; i++) {
    const d = addDays(a, i), k = dkey(d), evs = map[k] || [];
    head += `<div class="${k === today ? 'today' : ''}">${DAYS[d.getDay()].slice(0, 3)}. <b>${d.getDate()}</b><span class="sub">${evs.length ? evs.length + ' RDV' : ''}</span></div>`;
    body += `<div class="wcol${k === today ? ' today' : ''}" data-wday="${k}" data-h0="${h0}">`;
    layoutDay(evs).forEach(it => {
      const r = it.r, d0 = rdvDate(r), top = ((d0.getHours() - h0) * 60 + d0.getMinutes()) * ppm;
      const hgt = Math.max(20, (it.e - it.s) / 60000 * ppm - 2), w = 100 / it.lanes, l = evLabel(r);
      body += `<div class="wev ${stClass(r.Statut)}" role="button" tabindex="0" data-rdv="${r.id}" title="${esc(l.title)}" style="top:${top}px;height:${hgt}px;left:calc(${it.lane * w}% + 1px);width:calc(${w}% - 3px)"><b>${hm(d0)} ${esc(l.name)}</b><span class="who">${esc(l.who)}</span></div>`;
    });
    if (k === today) { const n = new Date(); const t = ((n.getHours() - h0) * 60 + n.getMinutes()) * ppm; if (t >= 0 && t <= height) body += `<div class="nowline" style="top:${t}px"></div>`; }
    body += '</div>';
  }
  $('#calBody').innerHTML = head + '</div>' + body + '</div><p class="sub" style="margin-top:6px">Cliquez sur une plage libre pour créer un rendez-vous à cette heure.</p>';
}
function renderList(list) {
  const c = S.cursor, y = c.getFullYear(), m = c.getMonth();
  const inMonth = list.filter(r => { const d = rdvDate(r); return d.getFullYear() === y && d.getMonth() === m; });
  const map = byDay(inMonth), keys = Object.keys(map).sort();
  if (!keys.length) { $('#calBody').innerHTML = `<p class="empty">Aucun rendez-vous ce mois-ci${nextHint(list)}.</p>`; return; }
  $('#calBody').innerHTML = keys.map(k => `<section class="agenda-day"><h3><span style="text-transform:capitalize">${esc(fullDate(rdvDate(map[k][0])))}</span><span class="sub">${map[k].length} rendez-vous</span></h3>
    ${map[k].map(r => rdvRow(r)).join('')}</section>`).join('');
}
function rdvRow(r) {
  const s = S.srcById.get(r.Exploitation), p = S.prelById.get(r.Preleveur), i = S.inspById.get(r.Inspecteur), e = rdvEnd(r);
  return `<button class="agenda-item ${stClass(r.Statut)}" data-rdv="${r.id}">

    <span><span class="n">${esc(srcName(s))}</span>
      <span class="s">${col.pacage && s && s[col.pacage] ? `<span>PACAGE ${esc(s[col.pacage])}</span>` : ''}${p ? `<span>${ic('user')} ${esc(personName(p))}</span>` : '<span>Préleveur à désigner</span>'}${i ? `<span>${ic('shield')} ${esc(personName(i))}</span>` : ''}${r.Lieu ? `<span>${ic('pin')} ${esc(r.Lieu)}</span>` : ''}</span>

/* ---------- Panneau d'un jour ---------- */
function openDay(k) {
  const evs = filteredRdv().filter(r => dkey(rdvDate(r)) === k);
  const [y, m, d] = k.split('-').map(Number), date = new Date(y, m - 1, d);
  openModal(`<h2>${ic('calendar')}<span style="text-transform:capitalize">${esc(fullDate(date))}</span></h2>
    <p class="lead">${evs.length ? evs.length + ' rendez-vous' : 'Aucun rendez-vous ce jour'}${countByPrel(evs)}</p>
    <div class="daylist">${evs.map(rdvRow).join('')}</div>`,
  {foot: `<button class="btn" id="dayNew">${ic('add')}Ajouter un rendez-vous ce jour</button>`, wide: true});
  $('#dayNew').onclick = () => openRdvForm(null, {date: nextFreeSlot(date, evs)});
}
function countByPrel(evs) {
  const m = {}; evs.forEach(r => { const p = S.prelById.get(r.Preleveur); const n = p ? personName(p) : 'Non désigné'; m[n] = (m[n] || 0) + 1; });
  const parts = Object.entries(m).map(([n, c]) => `${n} : ${c}`);
  return parts.length ? ' · ' + esc(parts.join(' · ')) : '';
}
function nextFreeSlot(date, evs) {
  const d = new Date(date.getFullYear(), date.getMonth(), date.getDate(), Math.max(8, S.cfg.hourStart), 0);
  const active = evs.filter(r => !isCancelled(r.Statut));
  if (active.length) { const last = active.reduce((a, r) => Math.max(a, rdvEnd(r).getTime()), 0); if (last > d.getTime()) d.setTime(Math.ceil(last / 1800000) * 1800000); }
  return d;
}

/* ---------- Exploitations ---------- */
function rdvOf(srcId) { return S.rdv.filter(r => r.Exploitation === srcId && rdvDate(r)).sort((a, b) => a.Date_RDV - b.Date_RDV); }
function renderExploitations() {
  const q = norm(S.expQ), now = Date.now() / 1000;
  const rows = S.src.map(s => {
    const list = rdvOf(s.id), active = list.filter(r => !isCancelled(r.Statut));
    const next = active.find(r => r.Date_RDV >= now) || null;
    return {s, list, active, next};
  }).filter(x => (!q || norm(srcLabel(x.s) + ' ' + (col.addr ? x.s[col.addr] : '')).includes(q)) && (!S.expOnlyFree || !x.active.length) && (!S.expDpt || srcDpt(x.s) === S.expDpt))
    .sort((a, b) => srcName(a.s).localeCompare(srcName(b.s)));
  const withRdv = S.src.filter(s => rdvOf(s.id).some(r => !isCancelled(r.Statut))).length;
  $('#main').innerHTML = `<div class="section-head"><h2>Exploitations</h2>
      <span class="muted">${withRdv} / ${S.src.length} avec au moins un rendez-vous actif · table <code>${esc(S.cfg.source)}</code></span></div>
    <div class="filters">
      <div><label class="lbl" for="eq">Recherche</label><input class="input" id="eq" type="search" placeholder="Nom, PACAGE, n° dossier, adresse…" value="${esc(S.expQ)}"></div>
      <div><label class="lbl" for="edpt">Département</label><select class="select" id="edpt">${optList(dptList().map(d => [d, d]), S.expDpt, 'Tous')}</select></div>
      <div style="display:flex;align-items:flex-end"><label class="chk"><input type="checkbox" id="efree" ${S.expOnlyFree ? 'checked' : ''}> Sans rendez-vous uniquement</label></div>
    </div>
    ${rows.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Exploitation</th><th>Département</th><th>Statut</th><th>Rendez-vous</th><th>Prochain</th><th></th></tr></thead><tbody>
    ${rows.map(x => { const p = x.next && S.prelById.get(x.next.Preleveur), st = x.s.Statut && !isErr(x.s.Statut) ? x.s.Statut : '';
      return `<tr class="click" data-fiche="${x.s.id}"><td><span class="strong">${esc(srcName(x.s))}</span><div class="sub">${esc([col.pacage && x.s[col.pacage] ? 'PACAGE ' + x.s[col.pacage] : '', x.s.dossier_number ? 'Dossier ' + x.s.dossier_number : ''].filter(Boolean).join(' · '))}</div></td>
      <td>${esc(srcDpt(x.s))}</td><td>${st ? `<span class="badge">${esc(st)}</span>` : ''}</td>
      <td>${x.active.length ? `<span class="tag">${x.active.length} actif(s)</span>` : '<span class="sub">Aucun</span>'}${x.list.length > x.active.length ? ` <span class="sub">+${x.list.length - x.active.length} annulé(s)</span>` : ''}</td>
      <td>${x.next ? `${esc(fullDate(rdvDate(x.next)))} à ${hm(rdvDate(x.next))}${p ? `<div class="sub">${esc(personName(p))}</div>` : ''}` : ''}</td>
      <td class="act"><button class="btn sec" data-plan="${x.s.id}">${ic('add')}Planifier</button></td></tr>`; }).join('')}
    </tbody></table></div>` : '<p class="empty">Aucune exploitation ne correspond.</p>'}`;
  $('#eq').addEventListener('input', e => { S.expQ = e.target.value; clearTimeout(renderExploitations.t); renderExploitations.t = setTimeout(() => { renderExploitations(); const i = $('#eq'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }, 250); });
  $('#edpt').onchange = e => { S.expDpt = e.target.value; renderExploitations(); };
  $('#efree').onchange = e => { S.expOnlyFree = e.target.checked; renderExploitations(); };
}

/* ============================================================
   FORMULAIRE RENDEZ-VOUS
   ============================================================ */
function toInputDate(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function toInputTime(d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function openRdvForm(id, opts = {}) {
  const r = id ? S.rdv.find(x => x.id === id) : null;
  const d = r ? rdvDate(r) : (opts.date || new Date());
  if (!r && !opts.date) { d.setMinutes(0, 0, 0); d.setHours(Math.max(d.getHours() + 1, 8)); }
  if (!r && opts.date && opts.date.getHours() === 0) d.setHours(Math.max(8, S.cfg.hourStart), 0, 0, 0);
  const srcId = r ? r.Exploitation : opts.srcId || 0, s = S.srcById.get(srcId);
  const dur = r ? Number(r.Duree_min) || S.cfg.duree : (opts.duree || S.cfg.duree);
  const prel = r ? r.Preleveur : opts.prel || (S.f.prel ? Number(S.f.prel) : 0);
  const insp = r ? r.Inspecteur : opts.insp || (S.f.insp ? Number(S.f.insp) : 0);
  const act = list => list.filter(p => p.Actif !== false);
  const durs = DUREES.includes(dur) ? DUREES : DUREES.concat([dur]).sort((a, b) => a - b);
  const others = srcId ? rdvOf(srcId).filter(x => x.id !== id) : [];
  openModal(`<h2>${ic('calendar')}${r ? 'Rendez-vous de prélèvement' : 'Nouveau rendez-vous'}</h2>
    <p class="lead">${r ? `Créé ${r.Cree_le ? 'le ' + esc(fullDate(new Date(r.Cree_le * 1000))) : ''}${r.Cree_par ? ' par ' + esc(r.Cree_par) : ''}` : 'Plusieurs rendez-vous peuvent être pris le même jour, pour une même exploitation ou pour un même préleveur.'}</p>
    <form id="rdvForm" autocomplete="off">
      <div class="grp"><label class="lbl" for="rSrc">Exploitation<span class="hint">Tapez le nom, le PACAGE ou le n° de dossier puis choisissez dans la liste.</span></label>
        <input class="input" id="rSrc" list="srcList" value="${esc(s ? srcLabel(s) : '')}" placeholder="Rechercher une exploitation…" required>
        <datalist id="srcList">${S.src.map(x => `<option value="${esc(srcLabel(x))}">`).join('')}</datalist>
        <div id="srcInfo" class="sub" style="margin-top:4px"></div></div>
      <div class="row">
        <div class="grp"><label class="lbl" for="rDate">Date</label><input class="input" id="rDate" type="date" value="${toInputDate(d)}" required></div>
        <div class="grp"><label class="lbl" for="rTime">Heure</label><input class="input" id="rTime" type="time" step="300" value="${toInputTime(d)}" required></div>
        <div class="grp"><label class="lbl" for="rDur">Durée</label><select class="select" id="rDur">${durs.map(m => `<option value="${m}" ${m === dur ? 'selected' : ''}>${m < 60 ? m + ' min' : (m / 60) + ' h'}</option>`).join('')}</select></div>
      </div>
      <div class="row">
        <div class="grp"><label class="lbl" for="rPrel">Préleveur</label><select class="select" id="rPrel">${optList(peopleOpts(act(S.prel).concat(S.prel.filter(p => p.id === prel && p.Actif === false))), prel, '— À désigner —')}</select></div>
        <div class="grp"><label class="lbl" for="rInsp">Inspecteur FranceAgriMer<span class="hint">Facultatif (contrôle)</span></label><select class="select" id="rInsp">${optList(peopleOpts(act(S.insp).concat(S.insp.filter(p => p.id === insp && p.Actif === false))), insp, '— Aucun —')}</select></div>
        <div class="grp"><label class="lbl" for="rSt">Statut</label><select class="select" id="rSt">${optList(STATUTS.concat(r && r.Statut && !STATUTS.includes(r.Statut) ? [r.Statut] : []).map(x => [x, x]), r ? r.Statut || '' : 'Prévu', '— Non renseigné —')}</select></div>
      </div>
      <div id="conflicts"></div>
      <div class="grp"><label class="lbl" for="rObj">Parcelles / objet<span class="hint">Ex. : îlot 3 – parcelle 2, contrôle FAM…</span></label><input class="input" id="rObj" value="${esc(r ? r.Objet : '')}"></div>
      <div class="grp"><label class="lbl" for="rLieu">Lieu de rendez-vous</label><input class="input" id="rLieu" value="${esc(r ? r.Lieu : (s && col.addr ? s[col.addr] || '' : ''))}"></div>
      <div class="grp"><label class="lbl" for="rCom">Commentaire</label><textarea class="input" id="rCom">${esc(r ? r.Commentaire : '')}</textarea></div>
      ${others.length ? `<div class="fsec"><h3>${ic('calendar')}Autres rendez-vous de cette exploitation</h3>${others.map(miniRdv).join('')}</div>` : ''}
    </form>`, {foot: `<div class="left">${r ? `<button class="btn danger" id="rDel">${ic('delete')}Supprimer</button><button class="btn ter" id="rDup" title="Créer un autre créneau pour la même exploitation">${ic('copy')}Autre créneau</button>` : ''}
      <button class="btn ter" id="rFiche" ${srcId ? '' : 'disabled'}>${ic('plant')}Fiche exploitation</button></div>
      <button class="btn ter" data-close>Annuler</button><button class="btn" id="rSave">${ic('check')}Enregistrer</button>`, wide: true});

  const resolveSrc = () => { const v = $('#rSrc').value.trim(); const hit = S.src.find(x => srcLabel(x) === v) || S.src.find(x => norm(srcLabel(x)).includes(norm(v)) && v.length > 2); return hit || null; };
  const refreshSrc = () => {
    const hit = resolveSrc();
    $('#srcInfo').innerHTML = hit ? `${ic('pin')} ${esc(col.addr ? hit[col.addr] || 'Adresse non renseignée' : '')}${srcDpt(hit) ? ' · ' + esc(srcDpt(hit)) : ''}` : ($('#rSrc').value ? '<span style="color:var(--error)">Exploitation non trouvée dans la liste</span>' : '');
    $('#rFiche').disabled = !hit;
    if (hit && !$('#rLieu').value && col.addr) $('#rLieu').value = hit[col.addr] || '';
  };
  const when = () => { const [y, m, dd] = $('#rDate').value.split('-').map(Number), [h, mi] = $('#rTime').value.split(':').map(Number); return isNaN(y) || isNaN(h) ? null : new Date(y, m - 1, dd, h, mi); };
  const checkConflicts = () => {
    const w = when(); if (!w) return;
    const s0 = w.getTime(), s1 = s0 + Number($('#rDur').value) * 60000, pr = Number($('#rPrel').value), ins = Number($('#rInsp').value);

    $('#conflicts').innerHTML = clash.length ? `<div class="alert warn"><h3>Chevauchement d'horaires</h3>${clash.map(x => `<p>${hm(rdvDate(x))}–${hm(rdvEnd(x))} : ${esc(srcName(S.srcById.get(x.Exploitation)))} (${esc(x.Preleveur === pr ? personName(S.prelById.get(pr)) : personName(S.inspById.get(ins)))})</p>`).join('')}<p class="sub">Vous pouvez enregistrer quand même.</p></div>` : '';
  };
  refreshSrc(); checkConflicts();
  $('#rSrc').addEventListener('input', refreshSrc);
  ['#rDate', '#rTime', '#rDur', '#rPrel', '#rInsp'].forEach(sel => $(sel).addEventListener('change', checkConflicts));
  $('#rFiche').onclick = () => { const hit = resolveSrc(); if (hit) openFiche(hit.id); };

  $('#rSave').onclick = async () => {
    const hit = resolveSrc(), w = when();
    if (!hit) { toast('Choisissez une exploitation dans la liste.', true); $('#rSrc').focus(); return; }
    if (!w) { toast('Date ou heure invalide.', true); return; }
    const fields = {Exploitation: hit.id, Date_RDV: epoch(w), Duree_min: Number($('#rDur').value), Preleveur: Number($('#rPrel').value) || 0,

function miniRdv(r) {

// Reporte le prochain RDV actif dans la table des exploitations (Date/heure RDV, préleveur, date de prélèvement)
async function syncSource(ids) {
  if (!S.cfg.sync || !S.meta[S.cfg.source]) return;
  const c = srcCols(), now = Date.now() / 1000;
  const writable = k => c[k] && (!c[k].isFormula || !c[k].formula.trim());
  const actions = [];
  for (const sid of ids) {
    if (!S.srcById.has(sid)) continue;
    const list = rdvOf(sid).filter(r => !isCancelled(r.Statut));
    const done = list.filter(r => stClass(r.Statut) === 'st-fait').pop();
    const ref = list.find(r => r.Date_RDV >= now && stClass(r.Statut) !== 'st-fait') || list[list.length - 1] || null;
    const f = {};
    if (writable('Date_Heure_RDV')) f.Date_Heure_RDV = ref ? ref.Date_RDV : null;
    if (writable('Nom_du_preleveur')) f.Nom_du_preleveur = ref && S.prelById.get(ref.Preleveur) ? personName(S.prelById.get(ref.Preleveur)) : null;
    if (writable('Date_et_heure_de_prelevement') && done) f.Date_et_heure_de_prelevement = done.Date_RDV;
    if (Object.keys(f).length) actions.push(['UpdateRecord', S.cfg.source, sid, f]);
  }
  if (!actions.length) return;
  try { await B.apply(actions); await loadData(); render(); }
  catch (e) { console.warn(e); toast('Rendez-vous enregistré, mais la mise à jour de ' + S.cfg.source + ' a échoué.', true); }
}

/* ============================================================
   FICHE EXPLOITATION (métadonnées)
   ============================================================ */
const TRIVIAL = new Set(['', "''", '""', 'None', 'False', '0']);
function colKind(c) {
  if (!c) return 'ro';
  if (c.isFormula && c.formula.trim()) return TRIVIAL.has(c.formula.trim()) ? 'const' : 'ro';
  if (c.type.startsWith('Ref') || c.type === 'Attachments' || c.type === 'ChoiceList') return 'ro';
  return 'edit';
}
function fmtVal(v, c) {
  if (v === null || v === undefined || v === '' || isErr(v)) return '';
  const t = c ? c.type : 'Any';
  if (t === 'Bool' || typeof v === 'boolean') return v ? 'Oui' : 'Non';
  if (typeof v === 'number' && t.startsWith('DateTime')) { const d = new Date(v * 1000); return d.toLocaleDateString('fr-FR') + ' à ' + hm(d); }
  if (typeof v === 'number' && t === 'Date') return new Date(v * 1000).toLocaleDateString('fr-FR', {timeZone: 'UTC'});
  if (Array.isArray(v)) return v[0] === 'L' ? v.slice(1).join(', ') : '';
  if (typeof v === 'number') return v.toLocaleString('fr-FR', {maximumFractionDigits: 6, useGrouping: !/GPS|dossier/i.test(c ? c.colId : '')});
  return String(v);
}
function editor(k, v, c, full) {
  const t = c.type, id = 'f_' + k;
  if (t === 'Bool') return `<label class="chk"><input type="checkbox" id="${id}" data-k="${k}" ${v ? 'checked' : ''}> Oui</label>`;
  if (t.startsWith('DateTime')) { const d = typeof v === 'number' ? new Date(v * 1000) : null; return `<input class="input" type="datetime-local" id="${id}" data-k="${k}" value="${d ? toInputDate(d) + 'T' + toInputTime(d) : ''}">`; }
  if (t === 'Date') { const d = typeof v === 'number' ? new Date(v * 1000).toISOString().slice(0, 10) : ''; return `<input class="input" type="date" id="${id}" data-k="${k}" value="${d}">`; }
  if (t === 'Numeric' || t === 'Int') return `<input class="input" type="number" step="any" id="${id}" data-k="${k}" value="${typeof v === 'number' ? v : ''}">`;
  if (t === 'Choice') { const ch = c.choices.slice(); if (v && !ch.includes(v)) ch.unshift(v); return `<select class="select" id="${id}" data-k="${k}">${optList(ch.map(x => [x, x]), v || '', '—')}</select>`; }
  if (full) return `<textarea class="input" id="${id}" data-k="${k}">${esc(isErr(v) ? '' : v)}</textarea>`;
  return `<input class="input" id="${id}" data-k="${k}" value="${esc(isErr(v) || v == null ? '' : v)}">`;
}
function readEditor(el, c) {
  const t = c.type;
  if (t === 'Bool') return el.checked;
  if (t.startsWith('DateTime')) return el.value ? epoch(new Date(el.value)) : null;
  if (t === 'Date') return el.value ? Date.UTC(...el.value.split('-').map((x, i) => Number(x) - (i === 1 ? 1 : 0))) / 1000 : null;
  if (t === 'Numeric' || t === 'Int') return el.value === '' ? null : Number(el.value);
  return el.value === '' ? null : el.value;
}
function openFiche(srcId, editMode) {
  const s = S.srcById.get(srcId); if (!s) return;
  const c = srcCols(), listed = new Set();
  const sections = FICHE_SECTIONS.map(sec => ({title: sec.title, icon: sec.icon, fields: sec.fields.filter(([k]) => { if (c[k]) { listed.add(k); return true; } return false; })}));
  const extra = Object.keys(c).filter(k => !listed.has(k) && !FICHE_HIDDEN.has(k) && !k.startsWith('gristHelper') && !isErr(s[k]) && !(c[k].isFormula && !c[k].formula.trim() && s[k] == null));
  if (extra.length) sections.push({title: 'Autres informations', icon: 'info', fields: extra.map(k => [k, c[k].label || k])});
  const consts = editMode ? Object.keys(c).filter(k => listed.has(k) && colKind(c[k]) === 'const') : [];
  const list = rdvOf(srcId);
  const st = s.Statut && !isErr(s.Statut) ? s.Statut : '';
  const body = sections.filter(sec => sec.fields.length).map(sec => `<section class="fsec"><h3>${ic(sec.icon)}${esc(sec.title)}</h3><div class="fgrid">
    ${sec.fields.map(([k, label, full]) => {
      const cc = c[k], kind = colKind(cc), v = s[k], f = fmtVal(v, cc);
      if (editMode && kind === 'edit') return `<div class="fld${full ? ' full' : ''}"><label class="lbl" for="f_${k}">${esc(label)}</label>${editor(k, v, cc, full)}</div>`;
      return `<div class="fld${full ? ' full' : ''}"><div class="k">${esc(label)}</div><div class="v${f ? '' : ' na'}">${esc(f || 'Non renseigné')}</div>${editMode && kind !== 'edit' ? `<div class="ro">${kind === 'const' ? 'Formule constante' : 'Calculé (formule)'}</div>` : ''}</div>`;
    }).join('')}</div></section>`).join('');
  openModal(`<h2>${ic('plant')}${esc(srcName(s))}</h2>

    ${consts.length ? `<div class="alert warn"><p>${consts.length} champ(s) de la fiche sont des formules constantes (${esc(consts.map(k => c[k].label || k).join(', '))}) et ne peuvent pas être saisis.</p><p><button class="btn sec" id="convertBtn">Les rendre saisissables</button></p></div>` : ''}
    <section class="fsec"><h3>${ic('calendar')}Rendez-vous de prélèvement (${list.length})</h3>

  const back = () => openFiche(srcId);

  if (!editMode) { $('#fEdit').onclick = () => openFiche(srcId, true); return; }

  };
}

let lastFocus = null;
function openModal(html, {foot = '', wide = false} = {}) {
  if (!$('#modalRoot').firstChild) lastFocus = document.activeElement;
  $('#modalRoot').innerHTML = `<div class="overlay" id="overlay"><div class="modal${wide ? ' wide' : ''}" role="dialog" aria-modal="true">
    <div class="modal-close"><button class="btn ghost" data-close>Fermer ${ic('close')}</button></div>
    <div class="modal-body">${html}</div>${foot ? `<div class="modal-foot">${foot}</div>` : ''}</div></div>`;

  if (f) f.focus();
}
function closeModal() { $('#modalRoot').innerHTML = ''; if (lastFocus && lastFocus.focus) lastFocus.focus(); }

async function write(actions, okMsg) {
  try {
    await B.apply(actions);
    await loadData(); render();
    if (okMsg) toast(okMsg);
    return true;
  } catch (e) {
    console.error(e);
    toast('Échec de l\'enregistrement : ' + (e.message || e) + '. Vérifiez que le widget a l\'accès complet au document.', true);
    return false;
  }

document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('[data-close]') || t.id === 'overlay') { closeModal(); return; }
  const rdv = t.closest('[data-rdv]');
  if (rdv) { openRdvForm(Number(rdv.dataset.rdv)); return; }
  const more = t.closest('[data-day-more]'); if (more) { openDay(more.dataset.dayMore); return; }
  const go = t.closest('[data-goto]'); if (go) { e.preventDefault(); S.cursor = new Date(Number(go.dataset.goto) * 1000); renderCalendar(); return; }
  const plan = t.closest('[data-plan]'); if (plan) { e.stopPropagation(); openRdvForm(null, {srcId: Number(plan.dataset.plan), date: nextFreeSlot(new Date(), [])}); return; }
  const fiche = t.closest('[data-fiche]'); if (fiche) { openFiche(Number(fiche.dataset.fiche)); return; }
  const ep = t.closest('[data-edit-person]'); if (ep) { const [tb, id] = ep.dataset.editPerson.split(':'); openPersonForm(tb, Number(id)); return; }
  const fp = t.closest('[data-filter-person]'); if (fp) { e.preventDefault(); const [tb, id] = fp.dataset.filterPerson.split(':'); S.f = {prel: '', insp: '', statut: '', dpt: '', q: ''}; S.f[tb === T_PREL ? 'prel' : 'insp'] = id; S.tab = 'cal'; S.view = 'list'; render(); return; }
  const cell = t.closest('.cell[data-day]'); if (cell) { openDay(cell.dataset.day); return; }
  const wcol = t.closest('.wcol');
  if (wcol && t === wcol) {
    const H = wcol.getBoundingClientRect(), hh = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--hour'), 10) || 44;
    const mins = Math.floor((e.clientY - H.top) / hh * 60 / 30) * 30 + Number(wcol.dataset.h0) * 60;
    const [y, m, d] = wcol.dataset.wday.split('-').map(Number);
    openRdvForm(null, {date: new Date(y, m - 1, d, Math.floor(mins / 60), mins % 60)});
  }
});

}
