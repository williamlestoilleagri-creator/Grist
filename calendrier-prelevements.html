  /* ================= Jetons DSFR ================= */

    --bf:#000091; --bf-hover:#1212ff; --bf-active:#2323ff;

    --rm:#e1000f;
    --title:#161616; --text:#3a3a3a; --mention:#666666; --disabled:#929292;
    --border:#dddddd; --alt:#f6f6f6; --contrast:#eeeeee; --contrast-hover:#dddddd; --surface:#ffffff;
    --success:#18753c; --success-bg:#b8fec9; --success-soft:#dffee6;
    --error:#ce0500; --error-bg:#ffe9e9;
    --warning:#b34000; --warning-bg:#ffe9e6;
    --info:#0063cb; --info-bg:#e8edff;

    --grey-bg:#eeeeee;
    --focus:#0a76f6;

    --shadow-lg:0 6px 18px rgba(0,0,18,.16),0 2px 6px rgba(0,0,18,.12);
    --font:Marianne,arial,sans-serif;
    --hour:44px;

  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--surface);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit;color:inherit}
  a{color:var(--bf);text-underline-offset:3px}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  h1,h2,h3{color:var(--title);margin:0;font-weight:700}
  .muted{color:var(--mention)}
  .sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  [hidden]{display:none!important}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  /* ================= En-tête ================= */
  .hdr{background:var(--surface);box-shadow:0 2px 6px rgba(0,0,18,.12);position:relative;z-index:20}
  .hdr-in{display:flex;align-items:center;gap:16px;padding:10px 20px;min-height:72px;flex-wrap:wrap}
  .svc{border-left:1px solid var(--border);padding-left:16px;min-width:0}
  .svc-title{margin:0;font-weight:700;font-size:1.1rem;color:var(--title);line-height:1.3}
  .svc-tag{margin:0;font-size:.8rem;color:var(--mention)}
  .hdr-tools{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .demo{background:var(--info-bg);color:var(--info);font-size:.8rem;padding:6px 20px;display:flex;gap:8px;align-items:center}

  /* ================= Onglets ================= */
  .tabs{display:flex;gap:4px;padding:0 20px;border-bottom:1px solid var(--border);overflow-x:auto;background:var(--surface)}
  .tab{border:0;background:var(--bf-950);color:var(--title);padding:.6rem 1rem;font-weight:500;font-size:.9rem;cursor:pointer;margin-top:8px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
  .tab:hover{background:var(--bf-925)}
  .tab[aria-selected="true"]{background:var(--surface);color:var(--bf);box-shadow:inset 0 2px 0 var(--bf),inset 1px 0 0 var(--border),inset -1px 0 0 var(--border);margin-bottom:-1px}
  .tab.insp-tab,.tab.insp-tab[aria-selected="true"]{background:var(--bf);color:#fff}
  .tab.insp-tab:hover{background:var(--bf-hover)}
  .tab.insp-tab[aria-selected="true"]{box-shadow:inset 0 -3px 0 #fff}
  .tab.insp-tab .count{background:#fff;color:var(--bf)}
  .tab .count{font-size:.72rem;background:var(--contrast);color:var(--mention);border-radius:99px;padding:0 7px}

  main{padding:18px 20px 40px;max-width:1400px;margin:0 auto}

  /* ================= Boutons ================= */
  .btn{display:inline-flex;align-items:center;gap:.4rem;border:0;cursor:pointer;font-weight:500;font-size:.875rem;line-height:1.5rem;padding:.25rem .75rem;min-height:2rem;background:var(--bf);color:#f5f5fe;text-decoration:none;white-space:nowrap}
  .btn:hover{background:var(--bf-hover)}
  .btn:active{background:var(--bf-active)}
  .btn:disabled{background:var(--contrast);color:var(--disabled);cursor:not-allowed}
  .btn.sec{background:transparent;color:var(--bf);box-shadow:inset 0 0 0 1px var(--bf)}
  .btn.sec:hover{background:var(--bf-975)}
  .btn.ter{background:transparent;color:var(--bf);box-shadow:inset 0 0 0 1px var(--border)}
  .btn.ter:hover{background:var(--alt)}
  .btn.ghost{background:transparent;color:var(--bf);box-shadow:none}
  .btn.ghost:hover{background:var(--alt)}
  .btn.danger{background:transparent;color:var(--error);box-shadow:inset 0 0 0 1px var(--error)}
  .btn.danger:hover{background:var(--error-bg)}
  .btn.lg{font-size:1rem;padding:.5rem 1.5rem;min-height:2.5rem}
  .btn.icon{padding:.25rem .5rem}
  .btn-group{display:inline-flex}
  .btn-group .btn{box-shadow:inset 0 0 0 1px var(--bf);background:transparent;color:var(--bf)}
  .btn-group .btn+.btn{margin-left:-1px}
  .btn-group .btn[aria-pressed="true"]{background:var(--bf);color:#fff}

  /* ================= Formulaires ================= */
  label.lbl{display:block;color:var(--title);font-size:.875rem;margin-bottom:.35rem}
  label.lbl .hint{display:block;color:var(--mention);font-size:.75rem}
  .input,.select{display:block;width:100%;border:0;border-radius:.25rem .25rem 0 0;background:var(--contrast);box-shadow:inset 0 -2px 0 0 var(--text);padding:.5rem .75rem;font-size:.9rem;min-height:2.5rem;color:var(--title)}
  .select{appearance:none;padding-right:2rem;background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%23161616' d='m12 13.1 5-4.9 1.4 1.4-6.4 6.3-6.4-6.4L7 8.1l5 5z'/></svg>");background-repeat:no-repeat;background-position:right .5rem center;background-size:1rem}
  textarea.input{min-height:5rem;resize:vertical}
  .input:focus,.select:focus{outline:2px solid var(--focus);outline-offset:2px}
  .input:disabled,.select:disabled{color:var(--disabled);box-shadow:inset 0 -2px 0 0 var(--border)}
  .grp{margin-bottom:1rem;min-width:0}
  .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 16px}
  .chk{display:flex;gap:8px;align-items:center;font-size:.875rem;cursor:pointer}
  .chk input{width:1.1rem;height:1.1rem;accent-color:var(--bf)}

  /* ================= Badges / tags / alertes ================= */
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:700;text-transform:uppercase;padding:0 .5rem;line-height:1.5rem;border-radius:.25rem;background:var(--grey-bg);color:var(--text);white-space:nowrap}
  .badge.st-prevu{background:var(--info-bg);color:var(--info)}
  .badge.st-confirm{background:var(--new-bg);color:var(--new)}
  .badge.st-fait{background:var(--success-bg);color:var(--success)}
  .badge.st-report{background:var(--bf-925);color:var(--bf)}
  .badge.st-annule{background:var(--error-bg);color:var(--error)}
  .tag{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;background:var(--bf-950);color:var(--bf);border-radius:99px;padding:.1rem .6rem;white-space:nowrap}
  .alert{border:1px solid var(--border);border-left:2.5rem solid var(--info);padding:.75rem 1rem;position:relative;margin:0 0 1rem;font-size:.875rem;background:var(--surface)}
  .alert::before{content:"";position:absolute;left:-1.85rem;top:.8rem;width:1.2rem;height:1.2rem;background:#fff;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;--m:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 22C6.477 22 2 17.523 2 12S6.477 2 12 2s10 4.477 10 10-4.477 10-10 10Zm0-2a8 8 0 1 0 0-16 8 8 0 0 0 0 16ZM11 7h2v2h-2V7Zm0 4h2v6h-2v-6Z'/></svg>")}
  .alert.warn{border-left-color:var(--warning)}
  .alert.err{border-left-color:var(--error)}
  .alert.ok{border-left-color:var(--success)}
  .alert h3{font-size:1rem;margin-bottom:.25rem}
  .alert p{margin:.25rem 0}

  /* ================= Barre d'outils calendrier ================= */
  .toolbar{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;margin-bottom:14px}
  .period{font-size:1.35rem;font-weight:700;color:var(--title);min-width:13ch;text-transform:capitalize}
  .filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 14px;margin-bottom:14px;padding:12px 14px;background:var(--alt)}
  .filters .input,.filters .select{min-height:2.2rem;padding:.35rem .7rem;background-color:var(--surface)}
  .filters label.lbl{font-size:.78rem;margin-bottom:.15rem;color:var(--mention)}
  .legend{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
  .spacer{flex:1}

  /* ================= Vue mois ================= */
  .wd-row{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:2px solid var(--bf)}
  .wd-row div{font-size:.78rem;font-weight:700;color:var(--title);padding:6px;text-transform:uppercase}
  .month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(118px,auto);border-left:1px solid var(--border)}
  .cell{border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:4px 5px 6px;display:flex;flex-direction:column;gap:3px;min-width:0;cursor:pointer;background:var(--surface)}
  .cell:hover{background:var(--bf-975)}
  .cell.out{background:var(--alt)}
  .cell.out .dnum{color:var(--disabled)}
  .cell.we{background:#fafafa}
  .cell-top{display:flex;justify-content:space-between;align-items:center}
  .dnum{font-size:.8rem;font-weight:500;color:var(--text);width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%}
  .cell.today .dnum{background:var(--bf);color:#fff;font-weight:700}
  .cell .nb{font-size:.7rem;color:var(--mention)}
  .ev{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--info);background:var(--info-bg);color:var(--title);font-size:.75rem;line-height:1.3;padding:2px 5px;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .ev:hover{filter:brightness(.96)}
  .ev b{font-weight:700;margin-right:4px}
  .ev .who{color:var(--mention)}
  .ev.st-confirm{border-color:var(--new);background:var(--new-bg)}
  .ev.st-fait{border-color:var(--success);background:var(--success-soft)}
  .ev.st-report{border-color:var(--bf);background:var(--bf-950)}
  .ev.st-annule{border-color:var(--error);background:var(--error-bg);text-decoration:line-through;color:var(--mention)}
  .ev.st-none{border-color:var(--disabled);background:var(--grey-bg)}
  .cell-evs{display:flex;flex-direction:column;gap:3px;max-height:190px;overflow-y:auto;scrollbar-width:thin}
  .cell-evs .ev{white-space:normal;overflow:visible}
  .more{border:0;background:none;color:var(--bf);font-size:.75rem;text-align:left;padding:1px 5px;cursor:pointer;font-weight:500}
  .more:hover{text-decoration:underline}

  /* ================= Vue semaine ================= */
  .week{display:grid;grid-template-columns:52px repeat(7,minmax(0,1fr));border:1px solid var(--border);border-top:0}
  .week-head{display:grid;grid-template-columns:52px repeat(7,minmax(0,1fr));border-bottom:2px solid var(--bf);position:sticky;top:0;background:var(--surface);z-index:2}
  .week-head div{padding:6px;font-size:.8rem;color:var(--title);text-transform:capitalize}
  .week-head div b{display:block;font-size:1.15rem}
  .week-head div.today b{color:var(--bf)}
  .hours{position:relative}
  .hours span{position:absolute;right:6px;font-size:.7rem;color:var(--mention);transform:translateY(-.55em)}
  .wcol{position:relative;border-left:1px solid var(--border);background:repeating-linear-gradient(to bottom,var(--surface) 0,var(--surface) calc(var(--hour) - 1px),var(--border) calc(var(--hour) - 1px),var(--border) var(--hour));cursor:copy}
  .wcol.today{background-color:var(--bf-975);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--hour) - 1px),var(--border) calc(var(--hour) - 1px),var(--border) var(--hour))}
  .wev{position:absolute;border:0;border-left:3px solid var(--info);background:var(--info-bg);color:var(--title);font-size:.72rem;line-height:1.25;padding:2px 4px;text-align:left;overflow:hidden;cursor:pointer;box-shadow:0 0 0 1px #fff}
  .wev:hover{z-index:3;box-shadow:var(--shadow-lg)}
  .wev b{display:block}
  .wev .who{color:var(--mention)}
  .wev.st-confirm{border-color:var(--new);background:var(--new-bg)}
  .wev.st-fait{border-color:var(--success);background:var(--success-soft)}
  .wev.st-report{border-color:var(--bf);background:var(--bf-950)}
  .wev.st-annule{border-color:var(--error);background:var(--error-bg);color:var(--mention)}
  .wev.st-none{border-color:var(--disabled);background:var(--grey-bg)}
  .nowline{position:absolute;left:0;right:0;height:2px;background:var(--rm);z-index:2;pointer-events:none}

  /* ================= Liste / agenda ================= */
  .agenda-day{margin-bottom:18px}
  .agenda-day h3{font-size:1rem;padding-bottom:6px;border-bottom:1px solid var(--border);margin-bottom:6px;display:flex;justify-content:space-between;align-items:baseline}
  .agenda-item{display:grid;grid-template-columns:86px 1fr auto;gap:12px;align-items:center;padding:8px 10px;border-left:3px solid var(--info);background:var(--surface);cursor:pointer;width:100%;text-align:left;border-top:0;border-right:0;border-bottom:1px solid var(--alt)}
  .agenda-item:hover{background:var(--bf-975)}
  .agenda-item .h{font-weight:700;color:var(--title)}
  .agenda-item .n{color:var(--title);font-weight:500}
  .agenda-item .s{font-size:.8rem;color:var(--mention);display:flex;gap:12px;flex-wrap:wrap}
  .agenda-item.st-confirm{border-left-color:var(--new)}
  .agenda-item.st-fait{border-left-color:var(--success)}
  .agenda-item.st-report{border-left-color:var(--bf)}
  .agenda-item.st-annule{border-left-color:var(--error)}
  .agenda-item.st-none{border-left-color:var(--disabled)}
  .empty{text-align:center;color:var(--mention);padding:40px 10px}

  /* ================= Tableaux ================= */
  .tbl-wrap{overflow-x:auto;border:1px solid var(--border)}
  table.tbl{width:100%;border-collapse:collapse;font-size:.875rem}
  .tbl th{background:var(--contrast);color:var(--title);text-align:left;font-weight:700;padding:.6rem .75rem;white-space:nowrap;border-bottom:2px solid var(--text)}
  .tbl td{padding:.55rem .75rem;border-bottom:1px solid var(--border);vertical-align:top}
  .tbl tr:nth-child(even) td{background:var(--alt)}
  .tbl tr.click{cursor:pointer}
  .tbl tr.click:hover td{background:var(--bf-975)}
  .tbl .act{white-space:nowrap;text-align:right}
  .tbl .strong{color:var(--title);font-weight:500}
  .sub{font-size:.78rem;color:var(--mention)}
  .section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .section-head h2{font-size:1.35rem}

  /* ================= Modale ================= */
  .overlay{position:fixed;inset:0;background:rgba(22,22,22,.64);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow-y:auto}
  .modal{background:var(--surface);width:min(640px,100%);box-shadow:var(--shadow-lg);padding:0 0 1.5rem;position:relative}
  .modal.wide{width:min(940px,100%)}
  .modal-close{position:sticky;top:0;display:flex;justify-content:flex-end;padding:.75rem .75rem 0;background:var(--surface);z-index:2}
  .modal-body{padding:0 2rem}
  .modal h2{font-size:1.4rem;margin-bottom:.25rem;display:flex;gap:10px;align-items:center}
  .modal .lead{color:var(--mention);font-size:.9rem;margin:0 0 1rem}
  .modal-foot{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;padding:1rem 2rem 0;border-top:1px solid var(--border);margin-top:1rem}
  .modal-foot .left{margin-right:auto;display:flex;gap:10px;flex-wrap:wrap}

  /* ================= Fiche exploitation ================= */
  .fiche-head{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center;margin:.25rem 0 1rem}
  .fsec{margin-top:1.4rem}
  .fsec h3{font-size:1rem;color:var(--bf);display:flex;gap:8px;align-items:center;padding-bottom:.35rem;border-bottom:1px solid var(--border);margin-bottom:.75rem}
  .fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.75rem 1.25rem}
  .fld .k{font-size:.75rem;color:var(--mention)}
  .fld .v{font-size:.9rem;color:var(--title);word-break:break-word;white-space:pre-wrap}
  .fld .v.na{color:var(--disabled);font-style:italic}
  .fld.full{grid-column:1/-1}
  .fld .ro{font-size:.68rem;color:var(--disabled)}
  .rdv-mini{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:.5rem .75rem;border-left:3px solid var(--info);background:var(--alt);margin-bottom:6px;cursor:pointer}
  .rdv-mini:hover{background:var(--bf-975)}
  .rdv-mini.st-confirm{border-left-color:var(--new)}
  .rdv-mini.st-fait{border-left-color:var(--success)}
  .rdv-mini.st-report{border-left-color:var(--bf)}
  .rdv-mini.st-annule{border-left-color:var(--error)}
  .rdv-mini.st-none{border-left-color:var(--disabled)}

  /* ================= Panneau jour ================= */
  .daylist{display:flex;flex-direction:column;gap:6px}
  .farmday{border:1px solid var(--border);border-left:4px solid var(--bf);background:var(--surface)}
  .farmday-head{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:start;width:100%;border:0;background:transparent;text-align:left;padding:.55rem .7rem;cursor:pointer;color:var(--title);font:inherit}
  .farmday-head:hover{background:var(--bf-975)}
  .farmday-head .h{font-weight:700}
  .farmday-head .n{font-weight:700}
  .farmday-head .s{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;color:var(--mention);margin-top:2px}
  .farmday-parc{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:0 .7rem .55rem calc(56px + 1.3rem);font-size:.8rem}
  .pslot{border:1px solid var(--border);background:var(--alt);border-radius:4px;padding:2px 8px;cursor:pointer;font-size:.78rem;color:var(--title)}
  .pslot:hover{border-color:var(--bf);color:var(--bf)}
  .pslot .t{font-weight:700;margin-right:6px}
  @media (max-width:600px){.farmday-parc{padding-left:.7rem}}


  /* ================= Statuts d'appel ================= */
  .badge.st-pris{background:var(--success-bg);color:var(--success)}
  .badge.st-injoignable{background:var(--new-bg);color:var(--new)}
  .badge.st-refus{background:var(--error-bg);color:var(--error)}
  .badge.st-faux{background:var(--grey-bg);color:var(--text)}
  .badge.st-none{background:var(--info-bg);color:var(--info)}
  .ic-print{--m:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M6 19H3a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1h3V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v4h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-3v2a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1v-2Zm0-2v-1a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1h2V9H4v8h2ZM8 4v3h8V4H8Zm0 13v3h8v-3H8Zm-3-7h3v2H5v-2Z'/></svg>")}

  /* ================= Calendrier + barre latérale ================= */
  .cal-layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:22px;align-items:start}
  .side{position:sticky;top:10px;max-height:calc(100vh - 20px);overflow-y:auto;border-right:1px solid var(--border);padding-right:14px}
  .side-search{margin-bottom:14px}
  .side-search .input{min-height:2.3rem}
  #qres{display:flex;flex-direction:column;gap:2px;margin-top:6px}
  .qhit{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;border:0;background:var(--alt);padding:.4rem .6rem;cursor:pointer;font-size:.85rem;color:var(--title)}
  .qhit:hover{background:var(--bf-950)}
  .side-sec{margin-bottom:16px}
  .side-fold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;padding:.3rem 0;border-bottom:1px solid var(--border);margin-bottom:6px}
  .side-fold>summary::-webkit-details-marker{display:none}
  .side-fold>summary h3{margin:0;flex:1}
  .side-fold>summary::after{content:"";width:.5rem;height:.5rem;border-right:2px solid var(--bf);border-bottom:2px solid var(--bf);transform:rotate(45deg);margin:0 4px 4px 0;transition:transform .15s}
  .side-fold[open]>summary::after{transform:rotate(-135deg);margin:4px 4px 0 0}
  .side-fold>summary .cur{font-size:.75rem;color:var(--bf);font-weight:700;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .side-sec h3{font-size:.85rem;text-transform:uppercase;letter-spacing:.02em;color:var(--mention);display:flex;gap:6px;align-items:center;margin:0 0 6px}
  .side-item{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;text-align:left;padding:.4rem .5rem;cursor:pointer;font-size:.88rem;color:var(--title);position:relative}
  .side-item:hover{background:var(--alt)}
  .side-item.on{background:var(--bf-950);color:var(--bf);font-weight:700}
  .side-item.on::before{content:"";position:absolute;left:0;top:.35rem;bottom:.35rem;width:3px;background:var(--bf)}
  .side-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .side-item .n{font-size:.75rem;color:var(--mention);background:var(--contrast);border-radius:99px;padding:0 7px}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:0 0 auto;vertical-align:middle}
  .selbar{display:flex;align-items:center;gap:10px;background:var(--bf-975);padding:.4rem .75rem;margin-bottom:10px}
  .select.mini{width:auto;min-height:2rem;padding:.25rem 2rem .25rem .6rem;font-size:.85rem}
  .ev .ic,.wev .ic{--ic:.75rem}
  .inline{display:flex;gap:4px}
  .inline .input{flex:1;min-width:0}
  .parcel{border:1px solid var(--border);border-left:3px solid var(--bf);padding:.75rem 1rem .25rem;margin-bottom:12px}
  .parcel-head{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:.6rem}
  .parcel-head .btn{margin-left:auto}
  .pinfo{background:var(--alt);padding:.75rem 1rem;margin-bottom:.75rem}
  .pinfo h4,.road-p h4{font-size:.85rem;color:var(--bf);margin:.75rem 0 .4rem}
  .pinfo h4.warn{color:var(--warning)}
  .road-day{margin-bottom:1.25rem}
  .road-day>h3{font-size:1.05rem;border-bottom:2px solid var(--bf);padding-bottom:.3rem;margin-bottom:.6rem}
  .road{border:1px solid var(--border);padding:.75rem 1rem;margin-bottom:.75rem;break-inside:avoid}
  .road-h{display:flex;gap:12px;flex-wrap:wrap;align-items:baseline;margin-bottom:.5rem}
  .road-p{border-top:1px dashed var(--border);margin-top:.6rem;padding-top:.2rem}
  @media (max-width:900px){.cal-layout{grid-template-columns:1fr}.side{position:static;max-height:none;border-right:0;padding-right:0}}
  @media print{
    body.printing>*:not(#modalRoot){display:none!important}
    body.printing .overlay{position:static;background:none;padding:0;display:block}
    body.printing .modal{box-shadow:none;width:100%}
    body.printing .modal-close,body.printing .modal-foot,body.printing [data-toggle]{display:none!important}
    body.printing .pinfo[hidden]{display:block!important}
  }

  .esp-row{display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:center;padding:8px 10px;border-left:3px solid var(--info);border-bottom:1px solid var(--alt);cursor:pointer}
  .esp-row:hover{background:var(--bf-975)}
  .esp-row.mine{border-left-color:var(--success);background:var(--success-soft)}
  .esp-row.taken{opacity:.65;border-left-color:var(--disabled)}
  .esp-row .h{font-weight:700;color:var(--title)}
  .esp-row .n{color:var(--title);font-weight:500}
  .esp-row .s{font-size:.8rem;color:var(--mention);display:flex;gap:12px;flex-wrap:wrap}
  @media (max-width:720px){.esp-row{grid-template-columns:60px 1fr}.esp-row .act{grid-column:2}}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:0 0 1rem}
  .kpi{border:1px solid var(--border);border-top:3px solid var(--bf);padding:.75rem 1rem}
  .kpi-l{font-size:.8rem;color:var(--mention)}
  .kpi-v{font-size:2rem;font-weight:700;color:var(--title);line-height:1.2;font-variant-numeric:tabular-nums}
  .kpi-s{font-size:.78rem;color:var(--mention)}
  .tbl .num{text-align:right;font-variant-numeric:tabular-nums}
  .tbl.dash tr.open>td{background:var(--bf-975)}
  .dash-detail>td{background:var(--alt)!important;padding:.5rem 1rem 1rem}
  .bar{height:8px;background:var(--contrast);border-radius:4px;overflow:hidden;width:120px;max-width:100%;margin:.35rem 0 .1rem}
  .bar span{display:block;height:100%;background:var(--bf);border-radius:0 4px 4px 0}
  .tbl.matrix td.heat{background:color-mix(in srgb,var(--bf) calc(var(--h) * 75%),var(--surface))!important;color:var(--title)}
  .tbl.matrix td.heat.dark{color:#fff}
  .tbl.matrix tr.tot td{font-weight:700;border-top:2px solid var(--text)}

  .contacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
  .contact{border:1px solid var(--border);padding:.75rem 1rem}
  .contact h4{font-size:.9rem;color:var(--title);margin:0 0 .6rem;display:flex;gap:6px;align-items:center}

  .stock-h{font-size:.9rem;color:var(--title);margin:1rem 0 .5rem}
  span.click{cursor:pointer;color:var(--bf);text-decoration:underline;text-underline-offset:3px}

  /* ================= Toast / chargement ================= */
  #toastRoot{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
  .toast{background:var(--title);color:#fff;padding:.7rem 1rem;font-size:.875rem;box-shadow:var(--shadow-lg);display:flex;gap:8px;align-items:center;max-width:min(420px,90vw)}
  .toast.err{background:var(--error)}
  .loading{padding:60px 20px;text-align:center;color:var(--mention)}

const PREL_SCHEMA = [{id: 'Nom', type: 'Text'}, {id: 'Prenom', type: 'Text'}, {id: 'Organisme', type: 'Text'}, {id: 'Telephone', type: 'Text'},

// Informations utiles au préleveur : [colonne, libellé] (table des parcelles puis DATA_Parcelles_DEF)
const INFO_PARC = [
  {title: 'Parcelle', fields: [['Parcelle_Labo', 'Îlot-parcelle'], ['Type_parcelle', 'Type de parcelle'], ['Culture_2026', 'Culture 2026 (déclarée)'],
    ['quelle_est_la_prochaine_culture_prevue_sur_cette_parcelle', 'Prochaine culture prévue'], ['quel_type_de_rotation_pratiquez_vous_sur_la_parcelle', 'Rotation'],
    ['cette_parcelle_a_t_elle_subie_un_incident', 'Incident sur la parcelle'], ['precisez_la_nature_de_l_incident_rencontre', 'Nature de l\'incident']]},

  {title: 'Fertilisation', fields: [['epandez_vous_habituellement_des_fertilisants_organiques_sur_cette_parcelle', 'Épandage organique habituel'], ['indiquez_les_types_d_effluents_epandus', 'Effluents épandus'],

  {title: 'Prairie et couvert', fields: [['la_parcelle_est_elle_en_prairie_actuellement', 'En prairie actuellement'], ['quel_est_l_age_de_la_prairie', 'Âge de la prairie'],
    ['quelle_est_la_proportion_estimee_de_trefle', 'Proportion de trèfle'], ['comment_valorisez_vous_cette_prairie', 'Valorisation de la prairie'],
    ['cette_parcelle_etait_elle_en_prairie_avant_sa_mise_en_culture_actuelle', 'Prairie avant la culture actuelle'], ['quelle_etait_l_age_de_la_prairie_au_moment_de_son_retournement', 'Âge au retournement'],
    ['un_couvert_vegetal_a_t_il_ete_implante_entre_la_culture_precedente_et_la_culture_actuelle', 'Couvert végétal implanté'], ['le_couvert_vegetal_a_ete', 'Devenir du couvert']]}
];
const INFO_DEF = [['NUM_ILOT', 'N° îlot'], ['NUM_PARCEL', 'N° parcelle'], ['SURF_CALC', 'Surface (ha)'], ['Numero_de_prelevement', 'N° de prélèvement'],
  ['CULT_2025', 'Culture 2025'], ['CULT_2024', 'Culture 2024'], ['LB_BAV', 'Bassin algues vertes'], ['LB_BVAV', 'Bassin versant'], ['Raison_de_la_selection', 'Raison de la sélection']];

/* ============================================================
   OUTILS
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const ic = n => `<span class="ic ic-${n}" aria-hidden="true"></span>`;
const pad = n => String(n).padStart(2, '0');
const MONTHS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
const DAYS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
const WD = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
function withTimeout(p, ms, msg) { return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error(msg || 'Délai dépassé')), ms))]); }
const dkey = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());

const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const isErr = v => Array.isArray(v) && v[0] === 'E';
const clean = v => (v === null || v === undefined || isErr(v)) ? '' : String(v).trim();
function norm(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
function initials(name) { return String(name || '').split(/[\s-]+/).filter(Boolean).map(w => w[0].toUpperCase()).slice(0, 3).join(''); }
function stClass(s) { return {'Rdv pris': 'st-pris', 'Injoignable': 'st-injoignable', 'Refus': 'st-refus', 'Faux numéro': 'st-faux'}[s] || (s ? 'st-autre' : 'st-none'); }
const stLabel = s => s || 'À appeler';
function toast(msg, err) {
  const el = document.createElement('div');
  el.className = 'toast' + (err ? ' err' : '');
  el.innerHTML = ic(err ? 'warning' : 'check') + '<span>' + esc(msg) + '</span>';
  $('#toastRoot').appendChild(el);
  setTimeout(() => el.remove(), err ? 6000 : 2800);
}
function optList(arr, sel, empty) { return (empty === null ? '' : `<option value="">${empty}</option>`) + arr.map(([v, l]) => `<option value="${esc(v)}" ${String(v) === String(sel) ? 'selected' : ''}>${esc(l)}</option>`).join(''); }
const toInputDate = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const toInputTime = d => pad(d.getHours()) + ':' + pad(d.getMinutes());

/* ---------- Dates Grist (secondes UTC, colonnes DateTime:Europe/Paris) ---------- */
const tzOf = type => (/^DateTime:(.+)$/.exec(type || '') || [])[1] || TZ;
function partsInTz(sec, tz) {
  const o = {}; new Intl.DateTimeFormat('en-GB', {timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23'})
    .formatToParts(new Date(sec * 1000)).forEach(p => { o[p.type] = Number(p.value); });
  return {y: o.year, m: o.month, d: o.day, h: o.hour % 24, mi: o.minute};
}
function wallToEpoch(y, m, d, h, mi, tz) {
  let guess = Date.UTC(y, m - 1, d, h, mi) / 1000;
  for (let i = 0; i < 2; i++) { const p = partsInTz(guess, tz); guess -= (Date.UTC(p.y, p.m - 1, p.d, p.h, p.mi) / 1000 - Date.UTC(y, m - 1, d, h, mi) / 1000); }
  return guess;
}
// Date JS « murale » (heure de Paris) à partir d'une valeur Grist
function toWall(v, type) {
  if (typeof v !== 'number') return null;
  if (type === 'Date') { const x = new Date(v * 1000); return new Date(x.getUTCFullYear(), x.getUTCMonth(), x.getUTCDate()); }
  const p = partsInTz(v, tzOf(type)); return new Date(p.y, p.m - 1, p.d, p.h, p.mi);
}
const fromWall = (d, type) => type === 'Date' ? Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 1000 : wallToEpoch(d.getFullYear(), d.getMonth() + 1, d.getDate(), d.getHours(), d.getMinutes(), tzOf(type));
const dtInput = d => d ? toInputDate(d) + 'T' + toInputTime(d) : '';
function parseDtInput(s) { if (!s) return null; const [a, b] = s.split('T'); const [y, m, d] = a.split('-').map(Number), [h, mi] = (b || '0:0').split(':').map(Number); return new Date(y, m - 1, d, h, mi); }
function fmtAny(v, type) {
  if (v === null || v === undefined || v === '' || isErr(v)) return '';
  if (typeof v === 'boolean' || type === 'Bool') return v ? 'Oui' : 'Non';
  if (typeof v === 'number' && (type === 'Date' || String(type).startsWith('DateTime'))) { const d = toWall(v, type); return type === 'Date' ? shortDate(d) : shortDate(d) + ' ' + hm(d); }
  if (Array.isArray(v)) return v[0] === 'L' ? v.slice(1).join(', ') : '';
  if (typeof v === 'number') return v.toLocaleString('fr-FR', {maximumFractionDigits: 4, useGrouping: false});
  return String(v);
}

/* ============================================================
   ACCÈS AUX DONNÉES — Grist ou démo locale
   ============================================================ */
function parseMeta(T, C) {
  const tables = {}, byRow = {};
  T.id.forEach((rid, i) => {

  C.id.forEach((_, i) => {
    const tid = byRow[C.parentId[i]]; if (!tid) return;
    const colId = C.colId[i]; if (colId === 'manualSort' || colId.startsWith('gristHelper_')) return;
    let wo = {}; try { wo = JSON.parse((C.widgetOptions || [])[i] || '{}') || {}; } catch (e) { wo = {}; }

const GristBackend = {

const LocalBackend = {
  mode: 'local', db: {}, cfg: null,
  async meta() {
    const T = {id: [], tableId: [], summarySourceTable: []}, C = {id: [], parentId: [], colId: [], label: [], type: [], isFormula: [], formula: [], visibleCol: [], widgetOptions: []};
    let tr = 0, cr = 0;
    for (const [tid, t] of Object.entries(this.db)) {
      tr++; T.id.push(tr); T.tableId.push(tid); T.summarySourceTable.push(0); (this.rowOf = this.rowOf || {})[tr] = tid;
      t.cols.forEach(c => { cr++; C.id.push(cr); C.parentId.push(tr); C.colId.push(c.id); C.label.push(c.label || c.id); C.type.push(c.type || 'Any');
        C.isFormula.push(!!c.isFormula); C.formula.push(c.formula || ''); C.visibleCol.push(0); C.widgetOptions.push(c.widgetOptions || ''); });
    }
    return parseMeta(T, C);
  },
  async fetch(tid) {
    const t = this.db[tid]; if (!t) throw new Error('Table inconnue : ' + tid);
    return t.rows.map(r => {
      const o = Object.assign({}, r);
      t.cols.forEach(c => {
        if (c.id === 'Nom_complet') o[c.id] = [r.Prenom, r.Nom].filter(Boolean).join(' ');
        else if (c.id === 'PACAGE' && c.isFormula) o[c.id] = typeof r.Cle_parcelle === 'string' ? r.Cle_parcelle.split('-')[0] : null;
        else if (c.id === 'Code_dpt' && c.isFormula) o[c.id] = typeof r.Cle_parcelle === 'string' ? r.Cle_parcelle.slice(0, 3) : null;
        else if (!(c.id in o)) o[c.id] = c.type === 'Bool' ? false : (c.type.startsWith('Ref:') ? 0 : null);
      });
      return o;
    });
  },
  async apply(actions) {
    const ret = [];
    for (const a of actions) {
      const [op, tid] = a, t = this.db[tid];
      if (op === 'AddTable') { this.db[tid] = {next: 1, rows: [], cols: a[2].map(c => Object.assign({}, c))}; ret.push({table_id: tid}); }
      else if (op === 'UpdateRecord' && tid === '_grist_Tables' && a[3].tableId) {
        const old = this.rowOf[a[2]], nw = a[3].tableId; this.db[nw] = this.db[old]; delete this.db[old];
        Object.values(this.db).forEach(x => x.cols.forEach(c => { if (c.type === 'Ref:' + old) c.type = 'Ref:' + nw; })); ret.push(null);
      }
      else if (op === 'AddColumn') { t.cols.push(Object.assign({id: a[2]}, a[3])); ret.push({colId: a[2]}); }
      else if (op === 'RenameColumn') { const c = t.cols.find(x => x.id === a[2]); c.id = a[3]; t.rows.forEach(r => { r[a[3]] = r[a[2]]; delete r[a[2]]; }); ret.push(null); }
      else if (op === 'RemoveColumn') { t.cols = t.cols.filter(x => x.id !== a[2]); t.rows.forEach(r => { delete r[a[2]]; }); ret.push(null); }
      else if (op === 'ModifyColumn') { Object.assign(t.cols.find(c => c.id === a[2]), a[3]); ret.push(null); }
      else if (op === 'AddRecord') { const id = t.next++; const r = {id}; t.cols.forEach(c => { if (!c.isFormula && c.formula === 'True') r[c.id] = true; }); t.rows.push(Object.assign(r, a[3])); ret.push(id); }
      else if (op === 'UpdateRecord') { const r = t && t.rows.find(x => x.id === a[2]); if (r) Object.assign(r, a[3]); ret.push(null); }
      else if (op === 'RemoveRecord') { t.rows = t.rows.filter(x => x.id !== a[2]); ret.push(null); }
      else ret.push(null);
    }
    return ret;
  },
  async getConfig() { return this.cfg; },
  async setConfig(cfg) { this.cfg = cfg; return true; }
};

function buildModel() {
  S.farms = new Map(); S.visits = []; S.visitByKey = new Map(); S.rdvByKey = new Map(); S.orphans = 0;
  // une ligne RDV par clé parcelle (si doublon : la plus récente)
  for (const r of S.rdv) { const k = rdvKey(r); if (!k) { S.orphans++; continue; } const ex = S.rdvByKey.get(k); if (!ex || r.id > ex.id) S.rdvByKey.set(k, r); }

  const seen = new Set();
  for (const p of S.parc) {
    const key = clean(p[S.cfg.parcKey]); if (!key || seen.has(key)) continue; seen.add(key);
    const f = farmOf(farmKeyOfParc(p), farmName(p));
    for (const k of ['dossier_number', 'Telephone_portable', 'Mail', 'Adresse_complete', 'Departement', 'Code_departement', 'Code_postal', 'Ville']) if (!f[k] && clean(p[k])) f[k] = clean(p[k]);
    const d = S.def.get(key) || null; fillFromDef(f, d);
    f.parcels.push({key, src: p, def: d, rdv: S.rdvByKey.get(key) || null});
  }
  // rendez-vous dont la clé n'est pas (ou plus) dans la table des parcelles
  for (const [k, r] of S.rdvByKey) if (!seen.has(k)) {
    const d = S.def.get(k) || null, f = farmOf(k.split('-')[0], txt(r.Raison_sociale) || txt(r.Nom_exploitation2) || txt(r.Nom_exploitation));
    fillFromDef(f, d); f.parcels.push({key: k, src: null, def: d, rdv: r});
  }
  for (const f of S.farms.values()) {
    if (!f.name) f.name = 'PACAGE ' + f.pacage;
    f.dpt = clean(f.Code_departement) || f.pacage.slice(0, 3);
    const rows = f.parcels.map(x => x.rdv).filter(Boolean);
    const first = k => { for (const r of rows) { const v = r[k]; if (v !== null && v !== undefined && v !== '' && v !== 0 && !isErr(v)) return v; } return null; };
    f.statut = clean(first('Statut')); f.nbAppels = ['Date_heure_appel_1', 'Date_heure_appel_2', 'Date_heure_appel_3'].filter(k => first(k)).length;
    f.preleveur = first('Preleveur') || 0; f.inspecteur = first('Inspecteur') || 0;
    // rendez-vous = parcelles de l'exploitation ayant la même date/heure
    const byTime = new Map();
    for (const x of f.parcels) { const r = x.rdv; if (!r || typeof r.Date_RDV !== 'number') continue; (byTime.get(r.Date_RDV) || byTime.set(r.Date_RDV, []).get(r.Date_RDV)).push(x); }
    f.visits = [];
    for (const [t, ps] of byTime) {
      const r0 = ps[0].rdv, start = toWall(t, typeOf(T_RDV, 'Date_RDV')), dur = Number(r0.Duree_min) || S.cfg.duree;
      const v = {key: f.key + '@' + t, farm: f, parcels: ps, start, end: new Date(start.getTime() + dur * 60000), duree: dur,
        prel: ps.map(x => x.rdv.Preleveur).find(Boolean) || 0, insp: ps.map(x => x.rdv.Inspecteur).find(Boolean) || 0, statut: clean(r0.Statut)};
      // résultat importé (DATA_Resultat_controle) ; son inspecteur vaut association s'il n'y en a pas
      const rr = ps.map(x => S.resByRdv.get(x.rdv.id)).find(Boolean);
      v.res = rr ? clean(rr.Resultat) : ''; v.com = rr ? clean(rr.Commentaire) : '';
      if (!v.insp && rr && rr.Inspecteur) v.insp = rr.Inspecteur;
      f.visits.push(v); S.visits.push(v); S.visitByKey.set(v.key, v);
    }
    f.visits.sort((a, b) => a.start - b.start);
  }

const colInfo = c => Object.assign({type: c.type, isFormula: !!c.isFormula, formula: c.formula || '', widgetOptions: c.widgetOptions || ''},
  c.label ? {label: c.label, untieColIdFromLabel: true} : {});
// Liste des opérations nécessaires, sans rien modifier
function plan() {
  const ops = [];
  for (const t of [T_PREL, T_INSP]) {
    if (S.meta[t] && t === T_PREL) {
      const pc = S.meta[t].cols;
      if (pc.Departements && !pc.Zone_d_action) ops.push({text: `Renommer la colonne <code>Departements</code> de <code>${t}</code> en « Zone d'action » (données conservées)`,
        run: () => B.apply([['RenameColumn', t, 'Departements', 'Zone_d_action'], ['ModifyColumn', t, 'Zone_d_action', {label: 'Zone d\'action'}]])});
      const old = PREL_OBSOLETE.filter(c => pc[c]);
      if (old.length) ops.push({text: `Retirer de <code>${t}</code> les colonnes absentes du fichier de référence : ${old.join(', ')}`, run: () => B.apply(old.map(c => ['RemoveColumn', t, c]))});
    }
    if (S.meta[t]) { const miss = PEOPLE_TABLES[t].filter(c => !S.meta[t].cols[c.id] && !(c.id === 'Zone_d_action' && S.meta[t].cols.Departements)); if (miss.length) ops.push({text: `Ajouter à <code>${t}</code> : ${miss.map(c => c.id).join(', ')}`, run: () => B.apply(miss.map(c => ['AddColumn', t, c.id, colInfo(c)]))}); }
    else if (S.meta[OLD_NAMES[t]]) ops.push({text: `Renommer <code>${OLD_NAMES[t]}</code> en <code>${t}</code> (données conservées)`, run: () => B.apply([['UpdateRecord', '_grist_Tables', S.meta[OLD_NAMES[t]].rowId, {tableId: t}]])});
    else ops.push({text: `Créer la table <code>${t}</code>`, run: () => B.apply([['AddTable', t, PEOPLE_TABLES[t].map(c => Object.assign({id: c.id}, colInfo(c)))]])});
  }
  if (S.meta[T_STOCK]) {
    if (!S.meta[T_CTL]) ops.push({text: `Créer la table <code>${T_CTL}</code> (contrôles inopinés des lieux de stockage)`, run: () => B.apply([['AddTable', T_CTL, ctlSchema().map(c => Object.assign({id: c.id}, colInfo(c)))]])});
    else { const miss = ctlSchema().filter(c => !S.meta[T_CTL].cols[c.id]); if (miss.length) ops.push({text: `Ajouter à <code>${T_CTL}</code> : ${miss.map(c => c.label || c.id).join(', ')}`, run: () => B.apply(miss.map(c => ['AddColumn', T_CTL, c.id, colInfo(c)]))}); }
    const sc0 = S.meta[T_STOCK].cols, empty = k => sc0[k] && sc0[k].isFormula && !sc0[k].formula.trim();
    const typ = Object.keys(STOCK_TYPES).filter(empty), calc = Object.keys(STOCK_FORMULAS).filter(empty);
    if (S.meta[T_CTL] && (typ.length || calc.length)) ops.push({text: `Préparer <code>${T_STOCK}</code> : ${typ.length ? 'colonnes de saisie typées (' + typ.join(', ') + ')' : ''}${typ.length && calc.length ? ' ; ' : ''}${calc.length ? calc.join(', ') + ' calculées à partir des contrôles déclarés' : ''}`,
      run: () => B.apply(typ.map(k => ['ModifyColumn', T_STOCK, k, {type: STOCK_TYPES[k], isFormula: false}]).concat(calc.map(k => ['ModifyColumn', T_STOCK, k, {type: STOCK_FORMULAS[k][0], isFormula: true, formula: STOCK_FORMULAS[k][1]}])))});
  }
  if (!S.meta[T_RES]) ops.push({text: `Créer la table <code>${T_RES}</code> (résultats des contrôles de préleveurs importés depuis Excel)`, run: () => B.apply([['AddTable', T_RES, resSchema().map(c => Object.assign({id: c.id}, colInfo(c)))]])});
  else { const miss = resSchema().filter(c => !S.meta[T_RES].cols[c.id]); if (miss.length) ops.push({text: `Ajouter à <code>${T_RES}</code> : ${miss.map(c => c.label || c.id).join(', ')}`, run: () => B.apply(miss.map(c => ['AddColumn', T_RES, c.id, colInfo(c)]))}); }
  const sc = rdvSchema(), ex = S.meta[T_RDV];
  if (!ex) ops.push({text: `Créer la table <code>${T_RDV}</code> (${sc.filter(c => !c.isFormula && !c.formula).length} champs de saisie)`, run: () => B.apply([['AddTable', T_RDV, sc.map(c => Object.assign({id: c.id}, colInfo(c)))]])});
  else {
    const miss = sc.filter(c => !ex.cols[c.id]);
    if (miss.length) ops.push({text: `Ajouter à <code>${T_RDV}</code> : ${miss.map(c => c.label || c.id).join(', ')}`, run: () => B.apply(miss.map(c => ['AddColumn', T_RDV, c.id, colInfo(c)]))});
    const st = ex.cols.Statut;
    if (st && st.type === 'Choice' && STATUTS.some(s => !st.choices.includes(s))) {
      const wo = Object.assign({}, st.widgetOptions, {choices: STATUTS, choiceOptions: choiceOpts(STATUTS)});
      ops.push({text: `Statuts de <code>${T_RDV}.Statut</code> : ${STATUTS.join(', ')}`, run: () => B.apply([['ModifyColumn', T_RDV, 'Statut', {widgetOptions: JSON.stringify(wo)}]])});
    }
    const cd = ex.cols.Code_dpt, want = sc.find(c => c.id === 'Code_dpt').formula;
    if (cd && cd.isFormula && cd.formula !== want && /\$Exploitation/.test(cd.formula)) ops.push({text: `<code>Code_dpt</code> calculé à partir de la clé parcelle (règles d'accès par département)`, run: () => B.apply([['ModifyColumn', T_RDV, 'Code_dpt', {formula: want}]])});
  }
  return ops;
}
async function runPlan() {
  S.meta = await B.meta();
  for (let i = 0, last = ''; i < 12; i++) {
    const op = plan()[0]; if (!op) return;
    if (op.text === last) throw new Error('Étape impossible : ' + op.text.replace(/<[^>]+>/g, ''));
    last = op.text; await op.run(); S.meta = await B.meta();
  }
}
async function fixRefs() {
  S.meta = await B.meta();
  const acts = [];
  // Préleveur : affiché « Prénom Nom » (DATA_Preleveur n'a pas de colonne Nom_complet) ; inspecteur : Nom_complet
  for (const [c, t, showCol, formula] of [['Preleveur', T_PREL, 'Nom', '" ".join(x for x in [$Preleveur.Prenom, $Preleveur.Nom] if x)'], ['Inspecteur', T_INSP, 'Nom_complet', '$Inspecteur.Nom_complet']]) {
    const cm = cols(T_RDV)[c], show = cols(t)[showCol];
    if (cm && show && cm.type === 'Ref:' + t && cm.visibleCol !== show.rowId) {
      acts.push(['UpdateRecord', '_grist_Tables_column', cm.rowId, {visibleCol: show.rowId}], ['SetDisplayFormula', T_RDV, null, cm.rowId, formula]);
    }
  }
  for (const [t, c, target, show, formula] of [[T_CTL, 'Inspecteur', T_INSP, 'Nom_complet', '$Inspecteur.Nom_complet'], [T_CTL, 'Lieu', T_STOCK, 'Organisme', '$Lieu.Organisme'], [T_STOCK, 'Inspecteur', T_INSP, 'Nom_complet', '$Inspecteur.Nom_complet'],
    [T_RES, 'Inspecteur', T_INSP, 'Nom_complet', '$Inspecteur.Nom_complet'], [T_RES, 'Preleveur', T_PREL, 'Nom', '" ".join(x for x in [$Preleveur.Prenom, $Preleveur.Nom] if x)']]) {
    const cm = cols(t)[c], sh = cols(target)[show];
    if (cm && sh && cm.type === 'Ref:' + target && cm.visibleCol !== sh.rowId) acts.push(['UpdateRecord', '_grist_Tables_column', cm.rowId, {visibleCol: sh.rowId}], ['SetDisplayFormula', t, null, cm.rowId, formula]);
  }
  if (acts.length && B.mode === 'grist') { try { await B.apply(acts); } catch (e) { console.warn('Affichage des références non configuré', e); } }
}

function render() {
  $$('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.tab === S.tab)));
  if (S.cfg.inspectorOnly && S.tab !== 'cal') S.tab = 'espace';
  $$('.tab').forEach(t => { t.hidden = S.cfg.inspectorOnly && !['espace', 'cal'].includes(t.dataset.tab); t.setAttribute('aria-selected', String(t.dataset.tab === S.tab)); });
  if (S.tab === 'cal') renderCalendar();
  else if (S.tab === 'espace') renderEspace();
  else if (S.tab === 'dash') renderDash();
  else if (S.tab === 'res') renderResults();
  else if (S.tab === 'exp') renderFarms();
  else renderPeople(S.tab === 'prel' ? T_PREL : T_INSP);
}

function filteredVisits() {
  const ctl = !S.showCtl || S.sel.kind === 'prel' ? [] : S.controls.filter(v => (S.sel.kind !== 'insp' || S.sel.id === -1 || v.insp === S.sel.id) && (!S.dpt || v.farm.dpt === S.dpt));
  return S.visits.filter(v => {
    if (S.sel.kind === 'prel' && (S.sel.id === -1 ? v.prel : v.prel !== S.sel.id)) return false;
    if (S.sel.kind === 'insp' && (S.sel.id === -1 ? !v.insp : v.insp !== S.sel.id)) return false;
    if (S.statut && v.statut !== S.statut) return false;
    if (S.dpt && v.farm.dpt !== S.dpt) return false;
    return true;
  }).concat(ctl).sort((a, b) => a.start - b.start);
}
const byDay = list => { const m = {}; list.forEach(v => { (m[dkey(v.start)] = m[dkey(v.start)] || []).push(v); }); return m; };
const dptList = () => Array.from(new Set(Array.from(S.farms.values()).map(f => f.dpt).filter(Boolean))).sort();
function periodLabel() {
  const c = S.cursor;
  if (S.view === 'week') { const a = startOfWeek(c), b = addDays(a, 6); return a.getMonth() === b.getMonth() ? `${a.getDate()} – ${b.getDate()} ${MONTHS[b.getMonth()]} ${b.getFullYear()}` : `${a.getDate()} ${MONTHS[a.getMonth()].slice(0, 4)}. – ${b.getDate()} ${MONTHS[b.getMonth()].slice(0, 4)}. ${b.getFullYear()}`; }
  if (S.view === 'day') return fullDate(c);

}
function periodRange() {
  const c = S.cursor;
  if (S.view === 'week') { const a = startOfWeek(c); return [a, addDays(a, 7)]; }
  if (S.view === 'day') { const a = new Date(c.getFullYear(), c.getMonth(), c.getDate()); return [a, addDays(a, 1)]; }
  return [new Date(c.getFullYear(), c.getMonth(), 1), new Date(c.getFullYear(), c.getMonth() + 1, 1)];
}

function searchResults() {
  const q = norm(S.q.trim()); if (q.length < 2) return '';
  const hits = Array.from(S.farms.values()).filter(f => norm([f.name, f.pacage, f.dossier_number, f.Ville, f.Adresse_complete].concat(f.parcels.map(x => x.key)).join(' ')).includes(q)).slice(0, 15);
  if (!hits.length) return '<p class="sub">Aucune exploitation trouvée.</p>';
  const now = Date.now();
  return hits.map(f => { const v = f.visits.find(x => x.start.getTime() >= now) || f.visits[f.visits.length - 1];
    return `<button class="qhit" data-qfarm="${esc(f.key)}"><b>${esc(f.name)}</b><span class="sub">${esc(f.pacage)} · ${v ? 'RDV ' + shortDate(v.start) + ' ' + hm(v.start) : esc(stLabel(f.statut))}</span></button>`; }).join('');
}

function navigate(n) {
  const c = S.cursor;
  if (n === 0) S.cursor = new Date();
  else if (S.view === 'week') S.cursor = addDays(c, 7 * n);
  else if (S.view === 'day') S.cursor = addDays(c, n);
  else S.cursor = new Date(c.getFullYear(), c.getMonth() + n, 1);
  renderCalendar();
}
function evStyle(v) {
  if (v.ctl) return `border-left-color:${CTL_COLOR};background:repeating-linear-gradient(135deg,${CTL_COLOR}26 0 6px,${CTL_COLOR}10 6px 12px)`;
  const c = prelColor(v.prel); return `border-left-color:${c};background:${c}1a`;
}
function evTitle(v) {
  if (v.ctl) return `${hm(v.start)} · Contrôle inopiné · ${v.farm.name}${v.farm.Adresse_complete ? ' (' + v.farm.Adresse_complete + ')' : ''}${v.insp ? ' · Inspecteur : ' + personName(S.inspById.get(v.insp)) : ''}${v.statut ? ' · ' + v.statut : ''}`;
  return `${hm(v.start)}–${hm(v.end)} · ${v.farm.name} (${v.farm.pacage}) · ${v.parcels.length} parcelle(s)${v.prel ? ' · Préleveur : ' + personName(S.prelById.get(v.prel)) : ''}${v.insp ? ' · Inspecteur : ' + personName(S.inspById.get(v.insp)) : ''}`;
}
function renderMonth(list) {
  const c = S.cursor, y = c.getFullYear(), m = c.getMonth();
  const off = (new Date(y, m, 1).getDay() + 6) % 7, dim = new Date(y, m + 1, 0).getDate();
  const total = Math.ceil((off + dim) / 7) * 7, map = byDay(list), today = dkey(new Date());
  let html = '<div class="wd-row">' + WD.map(w => `<div>${w}</div>`).join('') + '</div><div class="month">';
  for (let i = 0; i < total; i++) {
    const d = new Date(y, m, i - off + 1), k = dkey(d), evs = groupByFarm(map[k] || []), nf = evs.filter(g => !g.ctl).length;

      ${evs.length ? `<div class="cell-evs">${evs.map(g => g.ctl ? `<button class="ev" style="${evStyle(g.ctl)}" data-visit="${esc(g.ctl.key)}" title="${esc(evTitle(g.ctl))}"><b>${hm(g.ctl.start)}</b>${ic('search')} ${esc(g.ctl.farm.name)}</button>`
        : `<button class="ev" style="${evStyle(g.visits[0])}" data-visit="${esc(g.visits[0].key)}" title="${esc(g.visits.map(evTitle).join('\n'))}"><b>${hm(g.visits[0].start)}</b>${esc(g.farm.name)} <span class="who">${g.nParc} parc.</span>${g.visits.some(v => v.insp) ? ' ' + ic('shield') : ''}</button>`).join('')}</div>` : ''}</div>`;
  }
  $('#calBody').innerHTML = html + '</div>' + (list.some(v => v.start.getFullYear() === y && v.start.getMonth() === m) ? '' : `<p class="empty">Aucun rendez-vous ce mois-ci${nearestHint(list)}.</p>`);
}
// rendez-vous d'une journée regroupés par exploitation (toutes ses parcelles, même à des heures différentes)
function groupByFarm(evs) {
  const out = [], byFarm = new Map();
  for (const v of evs) {
    if (v.ctl) { out.push({ctl: v, start: v.start}); continue; }
    let g = byFarm.get(v.farm.key);
    if (!g) { g = {farm: v.farm, visits: [], nParc: 0, start: v.start}; byFarm.set(v.farm.key, g); out.push(g); }
    g.visits.push(v); g.nParc += v.parcels.length;
  }
  return out.sort((a, b) => a.start - b.start);
}
function nearestHint(list) {
  if (!list.length) return '';
  const t = S.cursor.getTime(), nx = list.find(v => v.start.getTime() > t) || list[list.length - 1];
  return ` — ${nx.start.getTime() > t ? 'prochain' : 'dernier'} : <a href="#" data-goto="${nx.start.getTime()}">${esc(fullDate(nx.start))}</a>`;
}
function layoutDay(evs) {
  const items = evs.map(v => ({v, s: v.start.getTime(), e: v.end.getTime(), lane: 0, lanes: 1}));
  let cluster = [], end = -1;
  const flush = () => { const n = Math.max(1, ...cluster.map(x => x.lane + 1)); cluster.forEach(x => { x.lanes = n; }); cluster = []; };
  for (const it of items) {
    if (it.s >= end && cluster.length) flush();
    const used = new Set(cluster.filter(x => x.e > it.s).map(x => x.lane)); let l = 0; while (used.has(l)) l++;
    it.lane = l; cluster.push(it); end = Math.max(end, it.e);
  }
  if (cluster.length) flush();
  return items;
}
const hourPx = () => parseInt(getComputedStyle(document.documentElement).getPropertyValue('--hour'), 10) || 44;
function renderWeek(list, ndays) {
  const a = ndays === 7 ? startOfWeek(S.cursor) : new Date(S.cursor.getFullYear(), S.cursor.getMonth(), S.cursor.getDate()), map = byDay(list), today = dkey(new Date());
  let h0 = S.cfg.hourStart, h1 = S.cfg.hourEnd;

async function downloadXlsx(fileBase, sheets) {

      if (sh.levels) ws['!rows'] = sh.levels.map(l => (l ? {level: l} : {}));
      if (sh.filter) ws['!autofilter'] = {ref: XLSX.utils.encode_range({s: {r: 0, c: 0}, e: {r: sh.aoa.length - 1, c: n - 1}})};
      XLSX.utils.book_append_sheet(wb, ws, sh.name.slice(0, 31));

// « 022849239-1-2 », « 22849239 1 2 » ou « 22849239-01-02 » désignent la même parcelle
const keyNorm = s => String(s || '').trim().replace(/[\s|/_.;]+/g, '-').split('-').filter(Boolean).map(p => p.replace(/^0+(?=\d)/, '')).join('-').toLowerCase();

/* ============================================================
   RÉSULTATS DES CONTRÔLES DE PRÉLEVEURS (table DATA_Resultat_controle)
   Fichier Excel à remplir par l'inspecteur -> import groupé dans Grist

const RES_H = ['Réf. (ne pas modifier)', 'Date', 'Heure', 'Laboratoire', 'Préleveur', 'Téléphone préleveur', 'Exploitation', 'PACAGE', 'Commune', 'Parcelles',
  'Inspecteur', 'Contrôlé (Oui / Non)', 'Résultat (Conforme / Avec réserves / Non conforme)', 'Commentaire'];
const RES_LIBRES = 15;   // lignes vides pour les contrôles hors liste
const resKey = (ids, insp) => 'rdv:' + ids.slice().sort((a, b) => a - b).join(';') + '|' + insp;
const resKeyLibre = (date, pacage, prel, insp) => 'libre:' + date + '|' + pacage + '|' + (prel || 0) + '|' + insp;
const refIds = v => Array.isArray(v) ? (v[0] === 'L' ? v.slice(1) : v).filter(n => typeof n === 'number' && n > 0) : (typeof v === 'number' && v > 0 ? [v] : []);
const resDate = r => typeof r.Date_controle === 'number' ? toWall(r.Date_controle, typeOf(T_RES, 'Date_controle') || 'Date') : null;
// résultat déjà saisi pour un rendez-vous et un inspecteur
function resultOf(v, insp) {
  const ids = v.parcels.map(x => x.rdv && x.rdv.id).filter(Boolean), k = resKey(ids, insp);
  return S.res.find(r => clean(r.Cle_import) === k) || null;
}
function normRes(s) {
  const n = norm(s).trim(); if (!n) return '';
  if (n.startsWith('non') || n === 'nc') return 'Non conforme';
  if (n.includes('reserve')) return 'Avec réserves';
  if (n.startsWith('conf') || n === 'c' || n === 'ok') return 'Conforme';
  return clean(s);
}
// rapprochement d'un nom saisi avec un préleveur / inspecteur (« Prénom Nom », « NOM Prénom », e-mail)
function matchPerson(list, txt0) {
  const t = norm(txt0).replace(/\s+/g, ' ').trim(); if (!t) return 0;
  const words = s => norm(s).split(/[\s-]+/).filter(Boolean).sort().join(' ');
  const hit = list.find(p => norm(p.Email).trim() === t) || list.find(p => norm(personName(p)) === t) || list.find(p => words(personName(p)) === words(t))
    || list.find(p => norm(clean(p.Nom)) === t);
  return hit ? hit.id : 0;
}
function parseDateFr(v) {
  if (v instanceof Date && !isNaN(v)) { const d = new Date(v.getTime() + 12 * 3600e3); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  const s = clean(v); let m;
  if ((m = /^(\d{1,2})[/.-](\d{1,2})[/.-](\d{2,4})/.exec(s))) return new Date(m[3].length === 2 ? 2000 + Number(m[3]) : Number(m[3]), m[2] - 1, Number(m[1]));
  if ((m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s))) return new Date(Number(m[1]), m[2] - 1, Number(m[3]));
  return null;
}
const pacageOf = v => { const s = clean(v).replace(/\s/g, ''); return /^\d{8}$/.test(s) ? '0' + s : s; };

// Rendez-vous proposés dans le fichier : jours choisis ; pour un inspecteur, son périmètre et les RDV libres ou déjà à lui
function resVisits(dates, insp, mine) {
  const set = new Set(dates), dpts = insp ? myDpts(S.inspById.get(insp)) : [];
  return S.visits.filter(v => set.has(dkey(v.start)) && (!S.dpt || v.farm.dpt === S.dpt)
    && (!insp || v.insp === insp || resultOf(v, insp) || (!v.insp && (!mine || !dpts.length || dpts.includes(dptNorm(v.farm.dpt))))))
    .sort((a, b) => dkey(a.start).localeCompare(dkey(b.start)) || byLabPrel(a, b) || a.start - b.start);
}

// Lecture du fichier rempli puis aperçu avant enregistrement dans DATA_Resultat_controle
async function importResults(file, {insp = 0} = {}) {
  if (!S.meta[T_RES]) { toast(`Table ${T_RES} absente : ouvrez Paramètres puis Enregistrer pour la créer.`, true); return; }
  let aoa;
  try {
    await loadLib(LIB.xlsx);
    const wb = XLSX.read(await file.arrayBuffer(), {type: 'array', cellDates: true});
    const name = wb.SheetNames.find(n => /r[ée]sultat|contr[ôo]le/i.test(n)) || wb.SheetNames[0];
    aoa = XLSX.utils.sheet_to_json(wb.Sheets[name], {header: 1, defval: '', raw: true});
  } catch (e) { console.error(e); toast('Lecture du fichier impossible : ' + (e.message || e), true); return; }
  const h = aoa.findIndex(r => r.some(c => norm(c).startsWith('ref')) && r.some(c => norm(c).startsWith('controle')));
  if (h < 0) { toast('Colonnes « Réf. » et « Contrôlé » introuvables : utilisez le fichier téléchargé depuis le calendrier.', true); return; }
  const H = aoa[h].map(c => norm(c).trim()), col = p => H.findIndex(c => c.startsWith(p));
  const I = {ref: col('ref'), date: col('date'), lab: col('laboratoire'), prel: col('preleveur'), exp: col('exploitation'), pac: col('pacage'), parc: col('parcelles'),
    insp: col('inspecteur'), ctl: col('controle'), res: col('resultat'), com: col('commentaire')};
  const cell = (row, k) => I[k] >= 0 ? row[I[k]] : '';
  const rdvById = new Map(S.rdv.map(r => [r.id, r])), visitOf = id => S.visits.find(v => v.parcels.some(x => x.rdv && x.rdv.id === id));
  const plan = {add: [], upd: [], del: [], skip: []}, seen = new Set(), assoc = [];
  aoa.slice(h + 1).forEach((row, i) => {
    const line = h + i + 2, c = norm(cell(row, 'ctl')).trim(), res = normRes(cell(row, 'res')), com = clean(cell(row, 'com'));
    const yes = /^(oui|o|x|1|yes|y|vrai|true)\b/.test(c) || (!c && !!res), no = /^(non|n|0|no|faux|false)\b/.test(c);
    if (!yes && !no) return;
    const ref = clean(cell(row, 'ref')), inspId = matchPerson(S.insp, cell(row, 'insp')) || insp;
    const ids = ref ? ref.split(/[;,\s]+/).map(Number).filter(n => rdvById.has(n)) : [];
    let f;
    if (ref && !ids.length) { plan.skip.push({line, label: 'Réf. ' + ref, why: 'rendez-vous introuvable (supprimé depuis ?)'}); return; }
    if (!inspId) { plan.skip.push({line, label: clean(cell(row, 'exp')) || ref, why: 'inspecteur non renseigné ou inconnu (« ' + clean(cell(row, 'insp')) + ' »)'}); return; }
    if (ids.length) {
      const v = visitOf(ids[0]);
      const d = v ? v.start : parseDateFr(cell(row, 'date'));
      f = {Date_controle: d ? fromWall(new Date(d.getFullYear(), d.getMonth(), d.getDate()), typeOf(T_RES, 'Date_controle') || 'Date') : null, Inspecteur: inspId,
        Preleveur: v ? v.prel || 0 : matchPerson(S.prel, cell(row, 'prel')), Laboratoire: v ? labOf(v) : clean(cell(row, 'lab')), PACAGE: v ? v.farm.pacage : pacageOf(cell(row, 'pac')),
        Exploitation: v ? v.farm.name : clean(cell(row, 'exp')), Parcelles: v ? v.parcels.map(x => x.key).join(', ') : clean(cell(row, 'parc')), RDV: ['L'].concat(ids), Cle_import: resKey(ids, inspId)};
      if (yes) ids.forEach(id => { const r = rdvById.get(id); if (r && !r.Inspecteur) assoc.push(['UpdateRecord', T_RDV, id, {Inspecteur: inspId}]); });
    } else {
      const d = parseDateFr(cell(row, 'date')), pac = pacageOf(cell(row, 'pac')), prel = matchPerson(S.prel, cell(row, 'prel')), farm = S.farms.get(pac);
      if (!d || !(pac || clean(cell(row, 'exp')))) { plan.skip.push({line, label: clean(cell(row, 'exp')) || pac || 'ligne ' + line, why: 'date et PACAGE ou exploitation obligatoires pour une ligne hors liste'}); return; }
      const p = S.prelById.get(prel);
      f = {Date_controle: fromWall(d, typeOf(T_RES, 'Date_controle') || 'Date'), Inspecteur: inspId, Preleveur: prel, Laboratoire: clean(cell(row, 'lab')) || clean(p && p.Organisme),
        PACAGE: pac, Exploitation: clean(cell(row, 'exp')) || (farm ? farm.name : ''), Parcelles: clean(cell(row, 'parc')), RDV: null, Cle_import: resKeyLibre(dkey(d), pac, prel, inspId)};
      if (!prel && clean(cell(row, 'prel'))) f.Commentaire = '[Préleveur saisi : ' + clean(cell(row, 'prel')) + '] ';
    }
    if (seen.has(f.Cle_import)) { plan.skip.push({line, label: f.Exploitation, why: 'ligne en double dans le fichier'}); return; }
    seen.add(f.Cle_import);
    const label = `${f.Date_controle ? shortDate(toWall(f.Date_controle, typeOf(T_RES, 'Date_controle') || 'Date')) : '?'} · ${f.Exploitation || f.PACAGE} · ${personName(S.prelById.get(f.Preleveur)) || clean(cell(row, 'prel')) || 'préleveur ?'} · ${personName(S.inspById.get(inspId))}`;
    const ex = S.res.find(r => clean(r.Cle_import) === f.Cle_import);

    (ex ? plan.upd : plan.add).push({line, label, f, id: ex && ex.id, res});
  });
  const li = (arr, extra) => arr.map(x => `<li><span class="sub">l.${x.line}</span> ${esc(x.label)}${extra ? extra(x) : ''}</li>`).join('');
  const n = plan.add.length + plan.upd.length + plan.del.length;
  openModal(`<h2>${ic('upload')}Import des résultats de contrôle</h2><p class="lead">${esc(file.name)} → table <code>${T_RES}</code></p>
    <div class="kpis"><div class="kpi"><div class="kpi-l">Nouveaux résultats</div><div class="kpi-v">${plan.add.length}</div></div>

      <div class="kpi" style="border-top-color:var(--warning)"><div class="kpi-l">Lignes ignorées</div><div class="kpi-v">${plan.skip.length}</div></div></div>
    <div class="imp-list">
    ${plan.add.length ? `<h3 style="font-size:1rem;margin:.5rem 0">${ic('add')} À ajouter</h3><ul>${li(plan.add, x => (x.res ? ' — ' + resBadge(x.res) : '') + (x.f.Commentaire ? `<div class="sub">${esc(x.f.Commentaire)}</div>` : ''))}</ul>` : ''}
    ${plan.upd.length ? `<h3 style="font-size:1rem;margin:.5rem 0">${ic('edit')} À mettre à jour</h3><ul>${li(plan.upd, x => (x.res ? ' — ' + resBadge(x.res) : '') + (x.f.Commentaire ? `<div class="sub">${esc(x.f.Commentaire)}</div>` : ''))}</ul>` : ''}
    ${plan.del.length ? `<h3 style="font-size:1rem;margin:.5rem 0">${ic('delete')} À supprimer</h3><ul>${li(plan.del)}</ul>` : ''}
    ${plan.skip.length ? `<h3 style="font-size:1rem;margin:.5rem 0;color:var(--warning)">${ic('warning')} Ignorées</h3><ul>${li(plan.skip, x => ` — <span class="sub">${esc(x.why)}</span>`)}</ul>` : ''}
    ${!n ? '<p class="muted">Aucune ligne avec « Oui », « Non » ou un résultat : rien à importer.</p>' : ''}</div>`,
  {wide: true, foot: `<button class="btn ter" data-close>Annuler</button>${n ? `<button class="btn" id="rGo">${ic('check')}Importer ${n} ligne(s)</button>` : ''}`});
  if (!$('#rGo')) return;
  $('#rGo').onclick = async () => {
    $('#rGo').disabled = true;
    const rc = cols(T_RES), keep = o => { Object.keys(o).forEach(k => { if (!rc[k]) delete o[k]; }); return o; };
    const acts = plan.add.map(x => ['AddRecord', T_RES, null, keep(x.f)]).concat(plan.upd.map(x => ['UpdateRecord', T_RES, x.id, keep(x.f)]), plan.del.map(x => ['RemoveRecord', T_RES, x.id]));
    // rendez-vous contrôlés : l'inspecteur y est associé s'il n'y en avait pas (tableau de bord, planning)

    if (await write(acts, `${plan.add.length + plan.upd.length} résultat(s) importé(s)${plan.del.length ? ', ' + plan.del.length + ' supprimé(s)' : ''}`)) closeModal();

function dashVisits() {
  const now = new Date(), p = S.dashPeriod;
  let a = null, b = null;
  if (p === 'month') { a = new Date(now.getFullYear(), now.getMonth(), 1); b = new Date(now.getFullYear(), now.getMonth() + 1, 1); }

  else if (p === '30') { a = addDays(now, -30); b = now; }
  return S.visits.filter(v => (!a || v.start >= a) && (!b || v.start < b) && (!S.dashDpt || v.farm.dpt === S.dashDpt));
}
function dashStats() {
  const now = new Date(), list = dashVisits(), rows = new Map();
  const rowOf = id => { if (!rows.has(id)) rows.set(id, {id, p: S.prelById.get(id), rdv: 0, done: 0, todo: 0, byInsp: new Map(), visits: [], last: null}); return rows.get(id); };
  S.prel.filter(p => p.Actif !== false).forEach(p => rowOf(p.id));
  for (const v of list) {
    const r = rowOf(v.prel || 0); r.rdv++; r.visits.push(v);
    if (!v.insp) continue;
    const past = v.start < now; if (past) r.done++; else r.todo++;
    const b = r.byInsp.get(v.insp) || {done: 0, todo: 0}; past ? b.done++ : b.todo++; r.byInsp.set(v.insp, b);
    if (past && (!r.last || v.start > r.last.start)) r.last = v;
  }
  const out = Array.from(rows.values()).filter(r => r.id || r.rdv);
  out.forEach(r => { r.rate = r.rdv ? (r.done + r.todo) / r.rdv : 0; });
  out.sort((x, y) => (!x.id - !y.id) || (x.done + x.todo) - (y.done + y.todo) || personName(x.p).localeCompare(personName(y.p)));
  return {list, rows: out, now};
}

async function toggleAssoc(key, btn) {

    ${list.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Nom</th><th>${P.extra[1]}</th><th>Téléphone</th><th>E-mail</th><th>${P.zone[1]}</th><th>RDV à venir</th>${cols(t).Actif ? '<th>État</th>' : ''}<th></th></tr></thead><tbody>
    ${list.map(p => { const n = upcoming(p);
      return `<tr><td class="strong">${P.k === 'prel' ? `<span class="dot" style="background:${prelColor(p.id)}"></span> ` : ''}${esc(personName(p) || '(sans nom)')}</td><td>${esc(p[P.extra[0]])}</td>
      <td>${p.Telephone ? `<a href="tel:${esc(p.Telephone)}">${esc(p.Telephone)}</a>` : ''}</td><td>${p.Email ? `<a href="mailto:${esc(p.Email)}">${esc(p.Email)}</a>` : ''}</td><td>${esc(fmtAny(p[P.zone[0]], typeOf(t, P.zone[0])))}</td>
      <td>${n ? `<a href="#" data-sel="${P.k}:${p.id}">${n} — voir le planning</a>` : '0'}</td>${cols(t).Actif ? `<td>${p.Actif === false ? '<span class="badge">Inactif</span>' : '<span class="badge st-pris">Actif</span>'}</td>` : ''}
      <td class="act"><button class="btn ter icon" data-edit-person="${t}:${p.id}" title="Modifier">${ic('edit')}<span class="sr">Modifier</span></button></td></tr>`; }).join('')}
    </tbody></table></div>` : `<div class="alert"><p>Aucun ${P.one} pour l'instant.</p></div>`}`;
  $('#addPerson').onclick = () => openPersonForm(t, null);
}
function openPersonForm(t, id) {
  const P = PEOPLE[t], p = id ? (t === T_PREL ? S.prelById : S.inspById).get(id) : {Actif: true};
  const used = id ? S.rdv.some(r => r[t === T_PREL ? 'Preleveur' : 'Inspecteur'] === id) : false;
  openModal(`<h2>${ic(P.icon)}${id ? 'Modifier' : 'Ajouter'} un ${P.one}</h2><p class="lead">Table <code>${t}</code></p>
    <form><div class="row"><div class="grp"><label class="lbl" for="pPrenom">Prénom</label><input class="input" id="pPrenom" value="${esc(p.Prenom)}"></div>
      <div class="grp"><label class="lbl" for="pNom">Nom</label><input class="input" id="pNom" value="${esc(p.Nom)}"></div></div>
      <div class="grp"><label class="lbl" for="pExtra">${P.extra[1]}</label><input class="input" id="pExtra" value="${esc(p[P.extra[0]])}"></div>
      <div class="row"><div class="grp"><label class="lbl" for="pTel">Téléphone</label><input class="input" id="pTel" type="tel" value="${esc(p.Telephone)}"></div>
      <div class="grp"><label class="lbl" for="pMail">E-mail</label><input class="input" id="pMail" type="email" value="${esc(p.Email)}"></div></div>
      <div class="grp"><label class="lbl" for="pDpt">${P.zone[1]}<span class="hint">${P.zone[2]}</span></label><input class="input" id="pDpt" value="${esc(fmtAny(p[P.zone[0]], typeOf(t, P.zone[0])).replace(/, /g, '; '))}"></div>
      ${cols(t).Actif ? `<label class="chk"><input type="checkbox" id="pActif" ${p.Actif !== false ? 'checked' : ''}> Actif (proposé dans les fiches)</label>` : ''}</form>`,
  {foot: `<div class="left">${id ? `<button class="btn danger" id="pDel" ${used ? 'disabled title="Affecté à des rendez-vous"' : ''}>${ic('delete')}Supprimer</button>` : ''}</div>
    <button class="btn ter" data-close>Annuler</button><button class="btn" id="pSave">${ic('check')}Enregistrer</button>`});
  $('#pSave').onclick = async () => {
    const fields = {Prenom: $('#pPrenom').value.trim(), Nom: $('#pNom').value.trim(), [P.extra[0]]: $('#pExtra').value.trim(), Telephone: $('#pTel').value.trim(),
      Email: $('#pMail').value.trim(), [P.zone[0]]: $('#pDpt').value.trim()};
    if ($('#pActif')) fields.Actif = $('#pActif').checked;
    if (typeOf(t, P.zone[0]) === 'ChoiceList') { const z = fields[P.zone[0]]; fields[P.zone[0]] = z ? ['L'].concat(z.split(/\s*[;,]\s*/).filter(Boolean)) : null; }
    Object.keys(fields).forEach(k => { if (!cols(t)[k]) delete fields[k]; });
    if (!fields.Nom && !fields.Prenom) { toast('Indiquez au moins un nom.', true); return; }
    if (await write([id ? ['UpdateRecord', t, id, fields] : ['AddRecord', t, null, fields]], 'Enregistré')) closeModal();
  };
  if (id && $('#pDel')) $('#pDel').onclick = async () => { if (await write([['RemoveRecord', t, id]], 'Supprimé')) closeModal(); };
}

/* ============================================================
   MODALE, ÉCRITURE, ÉVÉNEMENTS
   ============================================================ */
let lastFocus = null;
function openModal(html, {foot = '', wide = false} = {}) {
  if (!$('#modalRoot').firstChild) lastFocus = document.activeElement;
  $('#modalRoot').innerHTML = `<div class="overlay" id="overlay"><div class="modal${wide ? ' wide' : ''}" role="dialog" aria-modal="true">
    <div class="modal-close"><button class="btn ghost" data-close>Fermer ${ic('close')}</button></div>
    <div class="modal-body">${html}</div>${foot ? `<div class="modal-foot">${foot}</div>` : ''}</div></div>`;
  const f = $('.modal-body input[type=search]') || $('.modal [data-close]'); if (f) f.focus();
}
function closeModal() { $('#modalRoot').innerHTML = ''; if (lastFocus && lastFocus.focus) lastFocus.focus(); }
async function write(actions, okMsg) {
  try { await B.apply(actions); await loadData(); render(); if (okMsg) toast(okMsg); return true; }
  catch (e) { console.error(e); toast('Échec de l\'enregistrement : ' + (e.message || e) + '. Vérifiez que le widget a l\'accès complet au document.', true); return false; }
}

document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('[data-close]') || t.id === 'overlay') { closeModal(); return; }
  const ia = t.closest('[data-assoc]'); if (ia) { e.stopPropagation(); toggleAssoc(ia.dataset.assoc, ia); return; }
  const cn = t.closest('[data-ctl-new]'); if (cn) { e.stopPropagation(); openCtlForm(0, {lieuId: Number(cn.dataset.ctlNew) || 0}); return; }
  const vis = t.closest('[data-visit]'); if (vis) { const v = S.visitByKey.get(vis.dataset.visit); if (v && v.ctl) { openCtlForm(v.ctl.id); return; } if (v) { if (S.cfg.inspectorOnly || S.tab === 'espace') openVisitInspect(v.key); else openFiche(v.farm.key); } return; }
  const fi = t.closest('[data-fiche]'); if (fi) { e.stopPropagation(); openFiche(fi.dataset.fiche); return; }
  const qh = t.closest('[data-qfarm]');
  if (qh) { const f = S.farms.get(qh.dataset.qfarm), v = f && (f.visits.find(x => x.start.getTime() >= Date.now()) || f.visits[f.visits.length - 1]);
    if (v) { S.cursor = new Date(v.start); S.view = 'day'; S.sel = {kind: '', id: 0}; renderCalendar(); } openFiche(qh.dataset.qfarm); return; }
  const sel = t.closest('[data-sel]');
  if (sel) {
    e.preventDefault(); const [k, id] = sel.dataset.sel.split(':'); S.sel = {kind: k, id: Number(id)};
    if (S.tab !== 'cal') { S.tab = 'cal'; if (S.view === 'month') S.view = 'week'; }
    // se placer sur le prochain rendez-vous de la personne (ou le dernier s'il n'y en a plus)
    if (k && sel.closest('.side')) {
      const list = filteredVisits().filter(v => !v.ctl || k === 'insp'), t0 = new Date(); t0.setHours(0, 0, 0, 0);
      const nx = list.find(v => v.start >= t0) || list[list.length - 1];
      if (nx) S.cursor = new Date(nx.start);
    }
    render(); return;
  }
  const more = t.closest('[data-day-more]'); if (more) { openDay(more.dataset.dayMore); return; }
  const go = t.closest('[data-goto]'); if (go) { e.preventDefault(); S.cursor = new Date(Number(go.dataset.goto)); renderCalendar(); return; }
  const ep = t.closest('[data-edit-person]'); if (ep) { const [tb, id] = ep.dataset.editPerson.split(':'); openPersonForm(tb, Number(id)); return; }
  const cell = t.closest('.cell[data-day]'); if (cell && !S.cfg.inspectorOnly) { openDay(cell.dataset.day); return; }
  const wcol = t.closest('.wcol');
  if (wcol && t === wcol && !S.cfg.inspectorOnly) {
    const R = wcol.getBoundingClientRect(), mins = Math.floor((e.clientY - R.top) / hourPx() * 60 / 15) * 15 + Number(wcol.dataset.h0) * 60;
    const [y, m, d] = wcol.dataset.wday.split('-').map(Number);
    openPicker(new Date(y, m - 1, d, Math.floor(mins / 60), mins % 60));
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#modalRoot').firstChild) closeModal();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.wev, .esp-row')) { e.preventDefault(); e.target.click(); }
});
$$('.tab').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; render(); });
$('#refreshBtn').onclick = async () => { if ($('#tabs').hidden) return; try { await loadData(); render(); toast('Données actualisées'); } catch (e) { toast(e.message || String(e), true); } };
$('#settingsBtn').onclick = () => { closeModal(); renderSetup(); };
let resizeT; window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (!$('#tabs').hidden && S.tab === 'cal') renderCalendar(); }, 150); });

/* ============================================================
   DÉMARRAGE
   ============================================================ */
async function boot() {
  try {
    S.meta = await B.meta();
    if (!ready()) { $('#tabs').dataset.first = '1'; renderSetup(); return; }
    delete $('#tabs').dataset.first;
    await loadData();
    $('#tabs').hidden = false;
    render();
  } catch (e) {
    console.error(e);
    $('#tabs').hidden = true;
    $('#main').innerHTML = `<div class="setup"><div class="alert err"><h3>Impossible de lire le document</h3><p>${esc(e.message || e)}</p>
      <p>Dans le panneau de droite de Grist, réglez l'<b>accès</b> du widget sur <b>« Accès complet au document »</b>, puis rechargez.</p></div>
      <p><button class="btn" id="cfgBtn">${ic('settings')}Mise en place</button></p></div>`;
    $('#cfgBtn').onclick = () => renderSetup();
  }
}
let reloadT;
function scheduleReload() { clearTimeout(reloadT); reloadT = setTimeout(async () => { if ($('#tabs').hidden) return; try { await loadData(); if (!$('#modalRoot').firstChild) render(); } catch (e) { console.warn(e); } }, 400); }
async function start(backend) {
  B = backend;
  try { S.me = Number(localStorage.getItem('calendrier-inspecteur')) || 0; } catch (e) { S.me = 0; }
  const saved = await B.getConfig();
  if (saved && typeof saved === 'object' && saved.parcTable) S.cfg = Object.assign({}, DEFAULT_CFG, saved);
  await boot();
}

async function seedDemoRdv() {

  const slots = [[-6, 9, 0], [-6, 10, 30], [-2, 14, 0], [1, 9, 0], [1, 9, 30], [1, 14, 0], [2, 10, 0], [5, 8, 30], [6, 9, 0], [8, 11, 0], [12, 14, 0]];
  farms.forEach((f, i) => {
    const s = slots[i], st = s ? 'Rdv pris' : ['Injoignable', 'Refus', 'Faux numéro', null][i % 4];
    f.parcels.forEach((x, j) => acts.push(['AddRecord', T_RDV, null, {Cle_parcelle: cleVal(x.key), N_dossier_DN: Number(x.src.dossier_number), Statut: st,
      Date_heure_appel_1: wallToEpoch(y, m + 1, 1, 10, 0, TZ), Presence_souhaitee_agriculteur: i % 2 ? 'Oui' : 'Non',

  });
  await B.apply(acts);

}
