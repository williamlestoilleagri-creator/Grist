<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio infographies · DSFR</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  /* ================= Police Marianne (DSFR) ================= */
  @font-face{font-family:Marianne;font-style:normal;font-weight:300;font-display:swap;src:url(https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.2/dist/fonts/Marianne-Light.woff2) format("woff2")}
  @font-face{font-family:Marianne;font-style:normal;font-weight:400;font-display:swap;src:url(https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.2/dist/fonts/Marianne-Regular.woff2) format("woff2")}
  @font-face{font-family:Marianne;font-style:italic;font-weight:400;font-display:swap;src:url(https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.2/dist/fonts/Marianne-Regular_Italic.woff2) format("woff2")}
  @font-face{font-family:Marianne;font-style:normal;font-weight:500;font-display:swap;src:url(https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.2/dist/fonts/Marianne-Medium.woff2) format("woff2")}
  @font-face{font-family:Marianne;font-style:normal;font-weight:700;font-display:swap;src:url(https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.2/dist/fonts/Marianne-Bold.woff2) format("woff2")}
  @font-face{font-family:Marianne;font-style:italic;font-weight:700;font-display:swap;src:url(https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.2/dist/fonts/Marianne-Bold_Italic.woff2) format("woff2")}
  @font-face{font-family:Spectral;font-style:normal;font-weight:400;font-display:swap;src:url(https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.2/dist/fonts/Spectral-Regular.woff2) format("woff2")}
  @font-face{font-family:Spectral;font-style:normal;font-weight:700;font-display:swap;src:url(https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.2/dist/fonts/Spectral-ExtraBold.woff2) format("woff2")}

  /* ================= Jetons DSFR (interface) ================= */
  :root{
    --bf:#000091; --bf-hover:#1212ff; --bf-975:#f5f5fe; --bf-950:#ececfe; --bf-925:#e3e3fd; --bf-850:#cacafb;
    --rm:#e1000f; --title:#161616; --text:#3a3a3a; --mention:#666; --disabled:#929292;
    --border:#ddd; --alt:#f6f6f6; --contrast:#eee; --surface:#fff; --canvas:#e5e5e5;
    --success:#18753c; --success-bg:#dffee6; --error:#ce0500; --error-bg:#ffe9e9; --info:#0063cb; --info-bg:#e8edff; --warning:#b34000; --warning-bg:#ffe9e6;
    --focus:#0a76f6; --font:Marianne,arial,sans-serif; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --shadow:0 1px 3px rgba(0,0,18,.16); --shadow-lg:0 6px 18px rgba(0,0,18,.16),0 2px 6px rgba(0,0,18,.12);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--surface);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
  button,input,select,textarea{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .muted{color:var(--mention)} .mono{font-family:var(--mono);font-size:.85em}

  /* ================= Structure ================= */
  #app{display:flex;flex-direction:column;height:100vh}
  .hdr{display:flex;align-items:center;gap:14px;padding:6px 14px;min-height:58px;box-shadow:0 2px 6px rgba(0,0,18,.12);position:relative;z-index:30;background:#fff}
  .hdr .svc{border-left:1px solid var(--border);padding-left:14px;min-width:0}
  .hdr .svc b{display:block;color:var(--title);font-size:1rem;line-height:1.2}
  .hdr .svc span{font-size:.78rem;color:var(--mention);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .hdr .grow{flex:1}
  .hdr .mode{font-size:.75rem;padding:2px 8px;border-radius:4px;background:var(--info-bg);color:var(--info);font-weight:700;text-transform:uppercase;white-space:nowrap}
  .hdr .mode.demo{background:#feecc2;color:#716043}
  .main{flex:1;display:flex;min-height:0}
  .cat{width:290px;flex:0 0 290px;border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;background:#fff}
  .stage{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--canvas)}
  .side{width:380px;flex:0 0 380px;border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0;background:#fff}
  @media (max-width:1250px){.cat{width:240px;flex-basis:240px}.side{width:330px;flex-basis:330px}}
  @media (max-width:980px){.cat{display:none}.cat.open{display:flex;position:absolute;left:0;top:58px;bottom:0;z-index:40;box-shadow:var(--shadow-lg)}}
  .only-narrow{display:none} @media (max-width:980px){.only-narrow{display:inline-flex}}

  /* ================= Boutons & champs (DSFR) ================= */
  .btn{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--bf);color:#fff;padding:.42rem .85rem;font-weight:500;font-size:.85rem;cursor:pointer;line-height:1.3;white-space:nowrap;border-radius:0;text-decoration:none}
  .btn:hover{background:var(--bf-hover)} .btn:disabled{background:var(--contrast);color:var(--disabled);cursor:not-allowed}
  .btn.sec{background:transparent;color:var(--bf);box-shadow:inset 0 0 0 1px var(--bf)} .btn.sec:hover{background:var(--bf-975)}
  .btn.ter{background:transparent;color:var(--bf);box-shadow:inset 0 0 0 1px var(--border)} .btn.ter:hover{background:var(--alt)}
  .btn.ghost{background:transparent;color:var(--title)} .btn.ghost:hover{background:var(--alt)}
  .btn.sm{padding:.25rem .55rem;font-size:.78rem} .btn.icon{padding:.38rem .45rem}
  .btn.on{background:var(--bf-925);color:var(--bf);box-shadow:inset 0 0 0 1px var(--bf)}
  .btn.danger{color:var(--error);box-shadow:inset 0 0 0 1px var(--error);background:transparent}
  .btn svg,.ico{width:1.1em;height:1.1em;fill:currentColor;flex:0 0 auto}
  .fld{display:block;margin:0 0 10px}
  .fld>span{display:block;font-size:.8rem;color:var(--title);margin-bottom:3px;font-weight:500}
  .fld>small{display:block;color:var(--mention);font-size:.72rem;margin-top:2px}
  .inp,select.inp,textarea.inp{width:100%;border:0;background:var(--contrast);border-radius:4px 4px 0 0;box-shadow:inset 0 -2px 0 var(--plain,#3a3a3a);padding:.38rem .55rem;font-size:.84rem;min-width:0}
  textarea.inp{resize:vertical;min-height:58px;line-height:1.4}
  .inp:focus{outline:2px solid var(--focus);outline-offset:1px}
  .row{display:flex;gap:8px;align-items:flex-end} .row>*{flex:1;min-width:0} .row>.shrink{flex:0 0 auto}
  .chk{display:flex;align-items:center;gap:8px;font-size:.83rem;margin:4px 0;cursor:pointer}
  .chk input{accent-color:var(--bf);width:16px;height:16px}
  .seg{display:flex;flex-wrap:wrap;gap:0;box-shadow:inset 0 0 0 1px var(--border)}
  .seg button{flex:1;border:0;background:#fff;padding:.38rem .5rem;font-size:.8rem;cursor:pointer;color:var(--text);border-right:1px solid var(--border)}
  .seg button:last-child{border-right:0}
  .seg button.on{background:var(--bf);color:#fff;font-weight:500}
  .badge{display:inline-block;font-size:.66rem;font-weight:700;text-transform:uppercase;padding:1px 6px;border-radius:4px;background:var(--bf-950);color:var(--bf);letter-spacing:.02em;white-space:nowrap}
  .badge.g{background:var(--success-bg);color:var(--success)} .badge.o{background:#feecc2;color:#716043} .badge.r{background:var(--error-bg);color:var(--error)}
  .hint{font-size:.76rem;color:var(--mention);background:var(--bf-975);border-left:3px solid var(--bf);padding:6px 9px;margin:6px 0 10px}

  /* ================= Catalogue ================= */
  .cat-top{padding:10px 12px 8px;border-bottom:1px solid var(--border)}
  .cat-top h2{font-size:.95rem;margin:0 0 6px;color:var(--title);display:flex;align-items:center;gap:6px}
  .cat-top h2 .n{margin-left:auto}
  .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
  .chip{border:0;background:var(--bf-950);color:var(--bf);font-size:.72rem;padding:3px 8px;border-radius:999px;cursor:pointer;font-weight:500}
  .chip.on{background:var(--bf);color:#fff}
  .cat-list{flex:1;overflow-y:auto;padding:4px 0 20px}
  .fam{margin-top:6px}
  .fam-h{display:flex;align-items:center;gap:7px;padding:8px 12px 4px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mention);position:sticky;top:0;background:#fff;z-index:1}
  .fam-h .ico{width:15px;height:15px;fill:var(--bf)}
  .tpl{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:6px 12px;cursor:pointer;position:relative}
  .tpl:hover{background:var(--alt)}
  .tpl.on{background:var(--bf-975)} .tpl.on::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;background:var(--bf)}
  .tpl .th{flex:0 0 44px;height:36px;border:1px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center}
  .tpl .th svg{width:40px;height:32px}
  .tpl .tx{min-width:0} .tpl b{display:block;font-size:.82rem;color:var(--title);font-weight:500;line-height:1.25}
  .tpl small{display:block;font-size:.7rem;color:var(--mention);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tpl .num{position:absolute;right:10px;top:6px;font-size:.62rem;color:var(--disabled);font-family:var(--mono)}

  /* ================= Scène ================= */
  .tb{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:7px 10px;background:#fff;border-bottom:1px solid var(--border)}
  .tb .sep{width:1px;height:24px;background:var(--border);margin:0 2px}
  .tb select.inp{width:auto;padding:.3rem .5rem;font-size:.8rem}
  .tb .ttl{font-weight:700;color:var(--title);font-size:.88rem;margin-right:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
  .viewport{flex:1;overflow:auto;position:relative}
  .viewport .holder{margin:24px auto;transform-origin:top left;box-shadow:0 8px 30px rgba(0,0,40,.18)}
  .status{position:absolute;left:12px;bottom:10px;font-size:.75rem;background:rgba(255,255,255,.95);padding:4px 10px;box-shadow:var(--shadow);z-index:5;display:none}
  .status.show{display:block}

  /* ================= Panneau latéral ================= */
  .tabs{display:flex;border-bottom:1px solid var(--border);overflow-x:auto;flex:0 0 auto}
  .tabs button{border:0;background:transparent;padding:.65rem .7rem;font-size:.8rem;cursor:pointer;color:var(--text);white-space:nowrap;border-bottom:2px solid transparent;display:flex;align-items:center;gap:5px}
  .tabs button.on{color:var(--bf);border-bottom-color:var(--bf);font-weight:700}
  .tabs .ico{width:14px;height:14px}
  .pane{flex:1;overflow-y:auto;padding:12px 14px 40px}
  .pane h3{font-size:.92rem;margin:14px 0 8px;color:var(--title);display:flex;align-items:center;gap:6px}
  .pane h3:first-child{margin-top:0}
  .slot{border:1px solid var(--border);margin:0 0 12px;background:#fff}
  .slot.focus{box-shadow:0 0 0 2px var(--rm)}
  .slot-h{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--alt);cursor:pointer;user-select:none}
  .slot-h b{font-size:.84rem;color:var(--title);flex:1;min-width:0}
  .slot-h .n{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--rm);color:#fff;font-size:.7rem;font-weight:700;flex:0 0 auto}
  .slot-h .sum{display:block;font-weight:400;font-size:.72rem;color:var(--mention);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .slot-b{padding:10px 10px 4px;display:none}
  .slot.open .slot-b{display:block}
  .flt{display:flex;gap:4px;align-items:center;margin-bottom:6px}
  .flt select,.flt input{flex:1;min-width:0}
  .flt .x{flex:0 0 auto}
  .sub{border-left:3px solid var(--bf-850);padding:6px 0 2px 10px;margin:6px 0 10px}
  .sub>b{font-size:.76rem;color:var(--bf);display:block;margin-bottom:6px}
  details.adv{margin:4px 0 10px} details.adv summary{cursor:pointer;font-size:.8rem;color:var(--bf);font-weight:500;padding:3px 0}
  .preview-data{font-size:.72rem;background:var(--alt);padding:6px 8px;max-height:130px;overflow:auto;font-family:var(--mono);white-space:pre;margin:4px 0 8px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
  .swatches{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
  .sw{border:1px solid var(--border);background:#fff;padding:6px;cursor:pointer;text-align:left;font-size:.74rem}
  .sw.on{box-shadow:0 0 0 2px var(--bf)} .sw .bar{display:flex;height:14px;margin-bottom:4px} .sw .bar i{flex:1}
  .saved{display:flex;gap:8px;align-items:center;border:1px solid var(--border);padding:8px;margin-bottom:6px}
  .saved .tx{flex:1;min-width:0} .saved b{display:block;font-size:.83rem;color:var(--title)} .saved small{color:var(--mention);font-size:.72rem}
  .alt-box{background:var(--alt);padding:10px;font-size:.8rem;white-space:pre-wrap;border-left:3px solid var(--bf);max-height:260px;overflow:auto}
  .check{display:flex;gap:8px;align-items:flex-start;font-size:.8rem;margin:5px 0}
  .check .dot{width:18px;height:18px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.7rem;font-weight:700}
  .marque-prev{border:1px solid var(--border);padding:14px;background:#fff;margin:6px 0 12px}

  /* ================= Fenêtres ================= */
  .modal-bg{position:fixed;inset:0;background:rgba(22,22,22,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
  .modal{background:#fff;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:22px 24px;box-shadow:var(--shadow-lg)}
  .modal h2{margin:0 0 12px;color:var(--title);font-size:1.25rem}
  .modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
  .toast{position:fixed;right:16px;bottom:16px;background:var(--title);color:#fff;padding:9px 14px;font-size:.84rem;z-index:200;box-shadow:var(--shadow-lg);max-width:420px}
  .toast.err{background:var(--error)} .toast.ok{background:var(--success)}
  .help-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;font-size:.84rem}
  .help-grid h4{margin:8px 0 4px;color:var(--bf)}
  code{font-family:var(--mono);font-size:.85em;background:var(--alt);padding:0 4px}

  /* ================= Bloc-marque (DSFR) ================= */
  .bm{display:inline-flex;flex-direction:column;align-items:flex-start;color:#000;font-family:Marianne,arial,sans-serif}
  .bm .bm-flag{display:block;width:2.75em;height:1.125em;margin:0 0 .3em}
  .bm .bm-txt{font-weight:700;text-transform:uppercase;font-size:1.05em;line-height:1.03;letter-spacing:-.01em;margin:0}
  .bm .bm-dev{display:block;width:3.5em;height:2.5em;margin-top:.35em;color:inherit}
  .bm.inv{color:#fff}

  /* ================= Affiche (infographie) ================= */
  .poster{position:relative;overflow:hidden;display:flex;flex-direction:column;font-family:Marianne,arial,sans-serif;background:var(--bg);color:var(--txt);line-height:1.35;-webkit-font-smoothing:antialiased}
  .poster *{box-sizing:border-box}
  .poster svg{overflow:visible}
  .poster svg text{font-family:Marianne,arial,sans-serif}
  .p-head{flex:0 0 auto;position:relative;padding:1.4em 1.8em 1em;display:flex;gap:1.6em;align-items:flex-start}
  .p-head .p-marque{flex:0 0 auto;font-size:1.05em}
  .p-head .p-svc{flex:0 0 auto;border-left:1px solid var(--line);padding-left:1em;font-size:.78em;color:var(--muted);max-width:16em;align-self:center}
  .p-head .p-svc b{display:block;color:var(--ink);font-size:1.1em}
  .p-head .p-tag{margin-left:auto;align-self:flex-start;background:var(--c1);color:var(--on1);font-weight:700;font-size:.7em;text-transform:uppercase;padding:.35em .8em;letter-spacing:.04em}
  .p-titles{flex:0 0 auto;padding:0 1.8em .9em}
  .p-title{margin:0;color:var(--ink);font-weight:700;font-size:2.15em;line-height:1.08;letter-spacing:-.01em}
  .p-title em,.hl{font-style:normal;color:var(--c2)}
  .p-sub{margin:.35em 0 0;color:var(--c1);font-weight:700;font-size:1.1em;text-transform:uppercase;letter-spacing:.02em}
  .p-intro{margin:.55em 0 0;font-size:.95em;color:var(--txt);max-width:60em}
  .p-body{flex:1 1 auto;min-height:0;position:relative;padding:.4em 1.8em 1em;display:flex;flex-direction:column}
  .p-foot{flex:0 0 auto;padding:.7em 1.8em 1em;font-size:.68em;color:var(--muted);display:flex;gap:1.5em;align-items:flex-end;border-top:1px solid var(--line);margin:0 1.8em 0;padding-left:0;padding-right:0}
  .p-foot .src{flex:1;min-width:0} .p-foot .src b{color:var(--ink)}
  .p-foot .notes{margin-top:.3em} .p-foot .notes span{display:inline-block;margin-right:1.2em}
  .p-foot .notes i{font-style:normal;display:inline-flex;align-items:center;justify-content:center;width:1.4em;height:1.4em;border-radius:50%;background:var(--c2);color:#fff;font-weight:700;font-size:.85em;margin-right:.3em}
  .p-foot .right{text-align:right;flex:0 0 auto}
  .p-foot .p-marque-foot{font-size:1.3em}
  .tricolor{position:absolute;left:0;right:0;bottom:0;height:.35em;display:flex}
  .tricolor i{flex:1} .tricolor i:nth-child(1){background:#000091} .tricolor i:nth-child(2){background:#fff} .tricolor i:nth-child(3){background:#e1000f}
  /* en-tête bandeau */
  .poster.h-band .p-head{background:var(--c1);color:var(--on1);padding-bottom:1em}
  .poster.h-band .p-head .p-marque{background:#fff;padding:.7em .8em;margin:-1.4em 0 -1em -.4em;color:#000}
  .poster.h-band .p-head .p-svc{color:var(--on1);border-color:rgba(255,255,255,.5)} .poster.h-band .p-head .p-svc b{color:var(--on1)}
  .poster.h-band .p-head .p-tag{background:#fff;color:var(--c1)}
  .poster.h-band .p-titles{background:var(--c1);padding-top:.2em;padding-bottom:1.3em;margin-bottom:.9em}
  .poster.h-band .p-title{color:var(--on1)} .poster.h-band .p-title em{color:var(--on1);text-decoration:underline;text-decoration-color:var(--c2);text-decoration-thickness:.12em;text-underline-offset:.12em}
  .poster.h-band .p-sub{color:var(--on1);opacity:.85} .poster.h-band .p-intro{color:var(--on1)}
  /* en-tête latéral (paysage) */
  .poster.h-side{flex-direction:row}
  .poster.h-side .p-side{flex:0 0 30%;display:flex;flex-direction:column;background:var(--soft);padding:0 0 1em}
  .poster.h-side .p-side .p-head{padding-bottom:1.6em}
  .poster.h-side .p-side .p-titles{padding-bottom:0}
  .poster.h-side .p-side .p-title{font-size:2.5em}
  .poster.h-side .p-side .p-foot{margin-top:auto;border-top:0;flex-direction:column;align-items:flex-start;gap:.5em}
  .poster.h-side .p-side .p-foot .right{text-align:left}
  .poster.h-side .p-main{flex:1;display:flex;flex-direction:column;min-width:0;padding-top:1.4em}
  /* fond inversé */
  .poster.inv .p-head .p-svc{border-color:rgba(255,255,255,.35)}

  /* --- Briques de contenu --- */
  .blk{position:relative;min-width:0;min-height:0}
  .blk-t{font-weight:700;color:var(--ink);font-size:1em;margin:0 0 .45em;display:flex;align-items:center;gap:.45em;text-transform:uppercase;letter-spacing:.02em}
  .blk-t::after{content:"";flex:1;height:1px;background:var(--c1);opacity:.35;margin-left:.3em}
  .blk-t.plain::after{display:none}
  .chart{position:relative;width:100%;min-height:0;flex:1}
  .chart>svg{display:block;width:100%;height:100%}
  .kpi{display:flex;flex-direction:column;gap:.15em;min-width:0}
  .kpi .v{font-weight:700;color:var(--c1);font-size:2.6em;line-height:1;letter-spacing:-.02em;white-space:nowrap}
  .kpi .v small{font-size:.45em;font-weight:700;margin-left:.15em;letter-spacing:0}
  .kpi .l{font-size:.9em;color:var(--txt);line-height:1.25}
  .kpi .d{font-size:.78em;font-weight:700;display:inline-flex;align-items:center;gap:.25em}
  .kpi .d.up{color:#18753c} .kpi .d.down{color:#ce0500} .kpi .d.eq{color:var(--muted)}
  .pic{display:inline-block;flex:0 0 auto}
  .pic svg{width:100%;height:100%;display:block}
  .flexc{display:flex;flex-direction:column;min-height:0;flex:1}
  .gridf{display:grid;flex:1;min-height:0}
  .card{background:var(--soft);padding:1em 1.1em;position:relative;min-width:0;min-height:0;display:flex;flex-direction:column}
  .card.c1{background:var(--c1);color:var(--on1)} .card.c1 .kpi .v,.card.c1 .kpi .l,.card.c1 h4{color:var(--on1)}
  .card.line{background:transparent;border:1px solid var(--line)}
  .card h4{margin:0 0 .3em;color:var(--ink);font-size:1.02em;line-height:1.2}
  .card p{margin:0;font-size:.86em}
  .legend{display:flex;flex-wrap:wrap;gap:.35em 1.1em;font-size:.78em;color:var(--txt);margin-top:.5em}
  .legend i{display:inline-block;width:.85em;height:.85em;margin-right:.35em;vertical-align:-.1em}
  .quote{font-family:Spectral,Georgia,serif;font-size:1.1em;color:var(--c1);border-left:.25em solid var(--c2);padding-left:.8em}
  .big-num{font-weight:700;color:var(--c1);line-height:.95;letter-spacing:-.03em}
  .stepn{display:inline-flex;align-items:center;justify-content:center;width:2em;height:2em;border-radius:50%;background:var(--c1);color:var(--on1);font-weight:700;flex:0 0 auto}
  .tbl{width:100%;border-collapse:collapse;font-size:.85em}
  .tbl th{background:var(--c1);color:var(--on1);text-align:left;padding:.45em .6em;font-weight:700;font-size:.9em;text-transform:uppercase;letter-spacing:.02em}
  .tbl td{padding:.42em .6em;border-bottom:1px solid var(--line)}
  .tbl tr:nth-child(even) td{background:var(--soft)}
  .tbl td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .empty-slot{display:flex;align-items:center;justify-content:center;flex:1;border:2px dashed var(--line);color:var(--muted);font-size:.85em;padding:1em;text-align:center;min-height:4em}

  /* --- Identification des données --- */
  .poster.ident [data-slot]{outline:2px dashed #e1000f;outline-offset:2px;cursor:pointer}
  .poster.ident [data-slot]:hover{outline-style:solid;background-color:rgba(225,0,15,.04)}
  .poster.ident [data-slot]::before{content:attr(data-ident);position:absolute;z-index:20;left:0;top:0;transform:translateY(-100%);background:#e1000f;color:#fff;font-size:11px;line-height:1.3;font-weight:700;padding:2px 6px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;font-family:Marianne,arial,sans-serif;letter-spacing:0;text-transform:none}
  .poster.ident [data-slot]{position:relative}
  .dn{display:inline-flex;align-items:center;justify-content:center;width:1.35em;height:1.35em;border-radius:50%;background:var(--c2);color:#fff;font-weight:700;font-size:.62em;vertical-align:super;margin-left:.25em;font-style:normal;letter-spacing:0;line-height:1;flex:0 0 auto}
  .tip{position:fixed;pointer-events:none;background:#161616;color:#fff;font-size:12px;padding:6px 9px;z-index:300;max-width:280px;box-shadow:var(--shadow-lg);display:none;line-height:1.35}
  .tip b{display:block}

  @media print{
    @page{margin:0}
    body{overflow:visible;background:#fff}
    #app>*:not(.main),.cat,.side,.tb,.status{display:none!important}
    .main,.stage,.viewport{display:block!important;overflow:visible!important;background:#fff!important;height:auto!important}
    .viewport .holder{transform:none!important;margin:0!important;box-shadow:none!important;width:auto!important;height:auto!important}
    .poster.ident [data-slot]{outline:0!important} .poster.ident [data-slot]::before{display:none!important}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sum = a => a.reduce((s, v) => s + (+v || 0), 0);
const isNum = v => typeof v === 'number' && isFinite(v);
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const withTimeout = (p, ms, msg) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error(msg || 'Délai dépassé')), ms))]);
function toNum(v) {
  if (v == null || v === '') return null;
  if (typeof v === 'number') return isFinite(v) ? v : null;
  if (typeof v === 'boolean') return v ? 1 : 0;
  if (v instanceof Date) return v.getTime();
  const s = String(v).replace(/[\s  ]/g, '').replace(/[€%$]/g, '').replace(',', '.');

}

const hex2rgb = h => { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); };
const rgb2hex = c => '#' + c.map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
const mix = (a, b, t) => { const A = hex2rgb(a), B = hex2rgb(b); return rgb2hex(A.map((v, i) => v + (B[i] - v) * t)); };
const lum = h => { const c = hex2rgb(h).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }); return .2126 * c[0] + .7152 * c[1] + .0722 * c[2]; };
const contrast = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); };

    feats = ids.map(id => ({code: id, name: D[id].n, n: norm(D[id].n), d: D[id].d, c: D[id].c, b: D[id].b}));
    if (scope === 'bzh') {
      const bb = [0, 140, 178, 246]; vb = [bb[0] - 4, bb[1] - 4, bb[2] - bb[0] + 8, bb[3] - bb[1] + 8];
      context = ['50', '53', '44', '49', '61', '14'].map(id => D[id]).filter(Boolean); stroke = .5;
    } else { vb = ASSETS.depViewBox.split(' ').map(Number); stroke = .35; }
  } else {
    const deps = scope === 'bzhcom' ? ['22', '29', '35', '56'] : [String(o.dep || '35')];
    const raw = await loadCommunes(deps); feats = projectGeo(raw, 1000, 1000); vb = [0, 0, 1000, 1000]; stroke = .3;
    const xs = feats.flatMap(f => [f.c[0]]), ys = feats.flatMap(f => [f.c[1]]); vb = [Math.min(...xs) - 30, Math.min(...ys) - 30, Math.max(...xs) - Math.min(...xs) + 60, Math.max(...ys) - Math.min(...ys) + 60];
  }
  const legendW = o.legend === false ? 0 : Math.min(w * .3, fs * 11);
  const mw = w - legendW, sc = Math.min(mw / vb[2], h / vb[3]);
  const ox = (mw - vb[2] * sc) / 2 - vb[0] * sc, oy = (h - vb[3] * sc) / 2 - vb[1] * sc;
  /* valeurs par entité */
  const val = {};
  if (scope === 'frreg') {
    const regFeats = Object.entries(REGIONS).map(([code, [name]]) => ({code, n: norm(name), name}));
    for (const it of items) { const f = matchGeo(it.label, regFeats); if (f) val[f.code] = {v: it.value, label: it.label}; }
  } else for (const it of items) { const f = matchGeo(it.label, feats); if (f) val[f.code] = {v: (val[f.code]?.v || 0) + (it.value || 0), label: it.label}; }
  const keyOf = f => scope === 'frreg' ? DEP2REG[f.code] : f.code;
  const values = Object.values(val).map(x => x.v);
  const k = o.classes || 5, br = classify(values, k, o.method || 'quantile');
  const colorOf = v => { if (!isNum(v)) return C.th.inv ? 'rgba(255,255,255,.12)' : '#ececec'; if (o.method === 'continuous') { const mn = Math.min(...values), mx = Math.max(...values); return C.th.seq(.12 + .88 * (v - mn) / ((mx - mn) || 1)); } let c = 0; while (c < br.length && v >= br[c]) c++; return C.th.seq(.12 + .88 * c / (k - 1)); };
  let s = `<g transform="translate(${r1(ox)} ${r1(oy)}) scale(${sc.toFixed(4)})">`;
  context.forEach(d => { s += `<path d="${d.d}" fill="${C.th.inv ? 'rgba(255,255,255,.06)' : '#f3f3f3'}" stroke="${C.th.inv ? 'rgba(255,255,255,.3)' : '#cfcfcf'}" stroke-width="${stroke / sc * 1.5}"/>`; });
  feats.forEach(f => {
    const e = val[keyOf(f)], fill = mode === 'bubble' ? (C.th.inv ? 'rgba(255,255,255,.12)' : (o.highlight && norm(o.highlight) === f.n ? mix(C.th.c1, '#ffffff', .7) : '#ececec')) : (o.highlight ? (norm(o.highlight) === f.n || o.highlight === f.code ? C.th.c2 : (C.th.inv ? 'rgba(255,255,255,.15)' : mix(C.th.c1, '#ffffff', .82))) : colorOf(e?.v));
    s += `<path d="${f.d}" fill="${fill}" stroke="${C.th.inv ? C.th.base : '#ffffff'}" stroke-width="${r1(stroke * 1.4 / sc * (scope === 'bzh' ? 2.4 : 1.2) * 10) / 10}" stroke-linejoin="round"${tipA(scope === 'frreg' ? (REGIONS[DEP2REG[f.code]] || [''])[0] : f.name, e ? C.f(e.v) : 'pas de donnée')}/>`;
  });
  s += '</g>';
  /* symboles proportionnels */
  if (mode === 'bubble') {
    const mx = Math.max(...values.map(Math.abs), 0) || 1, Rm = Math.min(mw, h) * (scope === 'bzh' ? .13 : .06);
    const pts = feats.map(f => ({f, e: val[keyOf(f)]})).filter(p => p.e && p.e.v > 0).sort((a, b) => b.e.v - a.e.v);
    pts.forEach(p => { const x = ox + p.f.c[0] * sc, y = oy + p.f.c[1] * sc, r = Math.sqrt(p.e.v / mx) * Rm;
      s += `<circle cx="${r1(x)}" cy="${r1(y)}" r="${r1(Math.max(2, r))}" fill="${C.th.c2}" fill-opacity=".78" stroke="#fff" stroke-width="1.2"${tipA(p.f.name, C.f(p.e.v))}/>`;
      if (scope === 'bzh' || r > fs * 1.6) s += T(x, y, C.f(p.e.v), {size: clamp(r * .5, fs * .65, fs * 1.3), weight: 700, anchor: 'middle', fill: '#fff'}); });
  }
  /* étiquettes (Bretagne) */
  if (scope === 'bzh' && o.labels !== false) feats.forEach(f => {
    const e = val[f.code], x = ox + f.c[0] * sc, y = oy + f.c[1] * sc + (mode === 'bubble' ? Math.sqrt((e?.v || 0) / (Math.max(...values) || 1)) * Math.min(mw, h) * .13 + fs * .9 : 0);
    const fill = mode === 'bubble' ? C.th.ink : onColor(o.highlight ? (norm(o.highlight) === f.n || o.highlight === f.code ? C.th.c2 : mix(C.th.c1, '#ffffff', .82)) : colorOf(e?.v));
    s += T(x, y - (mode === 'bubble' ? 0 : fs * .55), f.name, {size: fs * .78, weight: 700, anchor: 'middle', fill: C.th.inv && mode === 'bubble' ? '#fff' : fill});
    if (e && mode !== 'bubble' && !o.highlight) s += T(x, y + fs * .55, C.f(e.v), {size: fs * .95, weight: 700, anchor: 'middle', fill});
  });
  /* légende */
  if (legendW && mode !== 'bubble' && values.length && !o.highlight) {
    const lx = mw + fs * .6; let ly = h / 2 - (k * fs * 1.5) / 2;
    s += T(lx, ly - fs * 1.2, o.legendTitle || 'Légende', {size: fs * .8, weight: 700, fill: C.th.ink});
    if (o.method === 'continuous') {
      const mn = Math.min(...values), mxv = Math.max(...values);
      s += `<defs><linearGradient id="lg_${o.uid || 0}" x1="0" x2="0" y1="1" y2="0"><stop offset="0" stop-color="${C.th.seq(.12)}"/><stop offset="1" stop-color="${C.th.seq(1)}"/></linearGradient></defs><rect x="${r1(lx)}" y="${r1(ly)}" width="${r1(fs)}" height="${r1(fs * 6)}" fill="url(#lg_${o.uid || 0})"/>` + T(lx + fs * 1.4, ly, C.f(mxv), {size: fs * .72, fill: C.th.txt}) + T(lx + fs * 1.4, ly + fs * 6, C.f(mn), {size: fs * .72, fill: C.th.txt});
    } else {
      const mn = Math.min(...values), mxv = Math.max(...values), bounds = [mn, ...br, mxv];
      for (let c = k - 1; c >= 0; c--) { s += `<rect x="${r1(lx)}" y="${r1(ly)}" width="${r1(fs * 1.2)}" height="${r1(fs * 1.1)}" fill="${C.th.seq(.12 + .88 * c / (k - 1))}"/>` + T(lx + fs * 1.6, ly + fs * .55, 'De ' + C.f(bounds[c]) + ' à ' + C.f(bounds[c + 1]), {size: fs * .7, fill: C.th.txt}); ly += fs * 1.5; }
    }
  }
  if (mode === 'bubble' && legendW && values.length) {
    const mx = Math.max(...values), Rm = Math.min(mw, h) * (scope === 'bzh' ? .13 : .06), lx = mw + fs * .6 + Rm, ly = h / 2;
    s += T(mw + fs * .6, ly - Rm * 2 - fs, o.legendTitle || 'Légende', {size: fs * .8, weight: 700, fill: C.th.ink});
    [1, .25].forEach(t => { const r = Math.sqrt(t) * Rm; s += `<circle cx="${r1(lx)}" cy="${r1(ly + Rm - r)}" r="${r1(r)}" fill="none" stroke="${C.th.muted}"/>` + T(lx + Rm + 6, ly + Rm - 2 * r, C.f(mx * t), {size: fs * .7, fill: C.th.txt}); });
  }
  return svg(w, h, s);
}

<script>
/* =====================================================================
   Socle des modèles : familles, liaisons automatiques, aides de rendu
   ===================================================================== */
const FAMILIES = [
  {id: 'kpi', name: 'Chiffres clés', icon: 'award'},
  {id: 'cmp', name: 'Comparer & classer', icon: 'bar-chart-box'},
  {id: 'part', name: 'Répartitions', icon: 'pie-chart'},
  {id: 'time', name: 'Évolutions & temps', icon: 'line-chart'},
  {id: 'geo', name: 'Territoires & cartes', icon: 'map-2'},
  {id: 'inst', name: 'Institutionnel & pédagogie', icon: 'government'},
  {id: 'adv', name: 'Analyses avancées', icon: 'equalizer'}
];
const SLOT_KINDS = {value: 'Chiffre', series: 'Série', multi: 'Séries multiples', xy: 'Nuage de points', rows: 'Liste', profile: 'Profil', geo: 'Carte'};
const TPL = {}; const TPL_ORDER = [];
function defTpl(t) { TPL[t.id] = t; TPL_ORDER.push(t.id); }

/* ---------- Liaison automatique d'un emplacement aux tables du document ---------- */
function autoBind(slot, used = new Set()) {
  const h = slot.hint || {}; const tables = tableList();
  const score = t => { const cs = colsOf(t.id); let s = 0;
    if (h.table && h.table.test(t.id)) s += 100;
    const nNum = cs.filter(c => c.kind === 'num').length, nCat = cs.filter(c => ['choice', 'text', 'ref'].includes(c.kind)).length, nDate = cs.filter(c => c.kind === 'date').length;
    if (slot.kind === 'value') s += nNum ? 3 : 1;
    if (['series', 'geo'].includes(slot.kind)) s += (nCat ? 3 : 0) + (h.dim === 'date' && nDate ? 5 : 0) + (h.dim === 'year' && cs.some(c => /ann/i.test(c.id)) ? 5 : 0);
    if (slot.kind === 'multi') s += (nCat > 1 ? 3 : 0) + (nNum > 1 ? 2 : 0);
    if (slot.kind === 'xy') s += nNum >= 2 ? 5 : -50;
    if (slot.kind === 'rows') s += cs.some(c => c.kind === 'text') ? 2 : 0;
    if (slot.kind === 'geo' && cs.some(c => /d[eé]p|commune|r[eé]gion|insee|territ/i.test(c.id))) s += 6;
    return s; };
  const t = [...tables].sort((a, b) => score(b) - score(a))[0];
  const matched = !h.table || !!(t && h.table.test(t.id));
  const b = {table: t ? t.id : '', filters: [], fmt: {}, label: matched ? (h.label || '') : ''};
  if (!t) return Object.assign(b, clone(h.extra || {}));
  const cs = colsOf(t.id);
  const find = (re, kinds) => { const c = (re ? cs.find(c => re.test(c.id) && (!kinds || kinds.includes(c.kind))) : null) || cs.find(c => !kinds || kinds.includes(c.kind)); return c ? c.id : ''; };
  const numCol = re => find(re, ['num']); const catCol = re => find(re, ['choice', 'ref', 'text', 'list']) || find(re, null);
  const dateCol = re => find(re, ['date']);
  switch (slot.kind) {
    case 'value': {
      const m = h.agg === 'count' ? '' : numCol(h.measure);
      Object.assign(b, {agg: h.agg || (m ? 'sum' : 'count'), measure: m});
      if (h.compare) Object.assign(b, {compare: h.compare, b2: Object.assign({agg: b.agg, measure: b.measure, filters: []}, h.b2 || {})});
      break;
    }
    case 'series': case 'geo': {
      let dim = '', dg = '';
      if (h.dim === 'date') { dim = dateCol(h.dimRe); dg = h.dateGroup || 'year'; if (!dim) { dim = find(/ann[eé]e|year|^an/i, ['num']); dg = ''; } }
      else if (h.dim === 'year') { dim = find(/ann[eé]e|year/i, ['num']) || dateCol(); dg = dim && (colMeta(t.id, dim) || {}).kind === 'date' ? 'year' : ''; }
      if (!dim) dim = catCol(h.dimRe);
      const m = h.agg === 'count' ? '' : numCol(h.measure);
      Object.assign(b, {dim, dateGroup: dg, agg: h.agg || (m ? 'sum' : 'count'), measure: m, sort: h.sort || 'auto', limit: h.limit || 0, others: !!h.others, transform: h.transform || 'none', tokenize: !!h.tokenize});
      break;
    }
    case 'multi': {
      let dim = h.dim === 'date' ? dateCol(h.dimRe) : '', dg = dim ? (h.dateGroup || 'year') : '';
      if (h.dim === 'date' && !dim) dim = find(/ann[eé]e|year/i, ['num']);
      if (!dim) dim = catCol(h.dimRe);
      Object.assign(b, {dim, dateGroup: dg, agg: h.agg || 'sum', sort: h.sort || 'auto', limit: h.limit || 0, transform: h.transform || 'none'});
      if (h.split === 'cols') { const nums = cs.filter(c => c.kind === 'num' && c.id !== dim && (!h.measuresRe || h.measuresRe.test(c.id))).map(c => c.id).slice(0, h.nMeasures || 3); Object.assign(b, {split: 'cols', measures: nums.length ? nums : [numCol()]}); }
      else { const d2 = h.dim2 === 'date' ? dateCol() : (find(h.dim2Re, ['choice', 'ref', 'text']) || ''); Object.assign(b, {split: 'dim', dim2: d2 !== dim ? d2 : (cs.find(c => ['choice', 'text'].includes(c.kind) && c.id !== dim) || {}).id || '', dateGroup2: h.dim2 === 'date' ? (h.dateGroup2 || 'year') : '', limit2: h.limit2 || 5, measure: h.agg === 'count' ? '' : numCol(h.measure)}); if (!b.measure) b.agg = 'count'; }
      break;
    }
    case 'xy': { const nums = cs.filter(c => c.kind === 'num'); Object.assign(b, {x: (h.x && find(h.x, ['num'])) || (nums[0] || {}).id || '', y: (h.y && find(h.y, ['num'])) || (nums[1] || nums[0] || {}).id || '', size: h.size ? find(h.size, ['num']) : '', labelCol: catCol(h.labelRe), agg: 'avg'}); break; }
    case 'rows': {
      const txt = cs.filter(c => ['text', 'choice', 'ref'].includes(c.kind));
      const m = {title: find(h.titleRe, ['text', 'choice', 'ref']) || (txt[0] || {}).id || '', text: find(h.textRe || /desc|texte|detail|r[eé]ponse|mission/i, ['text']) || '', icon: find(/ic[oô]ne|picto|icon/i, ['text', 'choice']) || '',
        date: dateCol(), value: find(h.valueRe || /dur[eé]e|valeur|montant/i, ['num', 'text']) || '', parent: find(/rattach|parent|sup[eé]rieur|manager/i, ['text', 'ref', 'choice']) || '', extra: ''};
      if (m.text === m.title) m.text = (txt[1] || {}).id || ''; if (m.icon === m.title) m.icon = ''; if (m.value === m.title) m.value = '';
      if (!/rattach|parent/i.test(m.parent)) m.parent = '';
      Object.assign(b, {map: m, sortCol: find(/ordre|etape|[eé]tape|rang|num/i, ['num']) || m.date || '', sortDir: 'asc', limit: h.limit || 0});
      if (h.manual) Object.assign(b, {mode: 'manual', manual: h.manual});
      break;
    }
    case 'profile': {
      const lab = catCol(h.labelRe); const rows = DB.mode === 'demo' && DB.demo[t.id] ? DB.demo[t.id].rows : [];
      Object.assign(b, {labelCol: lab, focus: h.focus || (rows[0] ? rows[0][lab] : ''), criteria: cs.filter(c => c.kind === 'num' && !/code|id$/i.test(c.id)).slice(0, 8).map(c => ({col: c.id, dir: /ch[oô]mage|vacant|pauvre|d[eé]c[eè]s/i.test(c.id) ? 'asc' : 'desc', label: c.label.replace(/_/g, ' ')}))});
      break;
    }
  }
  if (h.fmt) b.fmt = Object.assign({}, h.fmt);
  if (h.extra && (matched || h.extra.mode)) Object.assign(b, clone(h.extra));
  return b;
}

/* ---------- Description lisible d'une liaison (pour l'identification) ---------- */
function describeBinding(b, kind) {
  if (!b) return 'non configuré';
  if (b.mode === 'manual') return 'saisie manuelle';
  if (b.mode === 'static') return 'valeur saisie : ' + (b.staticValue ?? '');
  const tl = b.table ? b.table.replace(/_/g, ' ') : '?';
  const col = c => c === '__expr__' ? 'ƒ' : colLabel(b.table, c);
  const flt = (b.filters || []).filter(f => f.col && f.op).map(f => col(f.col) + ' ' + (OPS.find(o => o.id === f.op) || {}).name + ' ' + (f.val ?? '')).join(', ');
  let s = '';
  if (kind === 'value') { s = aggName(b.agg) + (b.agg !== 'count' && b.measure ? ' de ' + col(b.measure) : ''); if (b.compare && b.compare !== 'none') s += ' · ' + ({ratio: 'ratio', pct: 'part en %', diff: 'écart', evol: 'évolution %', trend: 'avec tendance', formula: 'formule'}[b.compare] || ''); }
  else if (kind === 'series' || kind === 'geo') s = aggName(b.agg) + (b.agg !== 'count' && b.measure ? ' de ' + col(b.measure) : '') + ' par ' + col(b.dim) + (b.dateGroup ? ' (' + (DATEGROUPS.find(d => d.id === b.dateGroup) || {}).name.toLowerCase() + ')' : '');
  else if (kind === 'multi') s = aggName(b.agg) + ' par ' + col(b.dim) + (b.split === 'cols' ? ' · colonnes ' + (b.measures || []).map(col).join(', ') : b.dim2 ? ' × ' + col(b.dim2) : '');
  else if (kind === 'xy') s = col(b.x) + ' × ' + col(b.y) + (b.dim ? ' par ' + col(b.dim) : '');
  else if (kind === 'rows') s = 'lignes' + (b.map && b.map.title ? ' (' + col(b.map.title) + ')' : '');
  else if (kind === 'profile') s = col(b.labelCol) + ' = ' + (b.focus || '?') + ' · ' + (b.criteria || []).length + ' critères';
  return tl + ' › ' + s + (flt ? ' · filtre : ' + flt : '');
}
function autoLabel(b, kind) {
  if (!b) return '';
  if (b.label) return b.label;
  if (b.mode === 'manual' || b.mode === 'static') return '';
  if (kind === 'value') {
    if (b.agg === 'count') return 'Nombre de lignes · ' + (b.table || '').replace(/_/g, ' ').toLowerCase();
    return aggName(b.agg) + ' ' + (b.measure ? '« ' + colLabel(b.table, b.measure).replace(/_/g, ' ').toLowerCase() + ' »' : '');
  }
  return (b.agg === 'count' ? 'Nombre' : aggName(b.agg)) + (b.measure && b.agg !== 'count' ? ' de ' + colLabel(b.table, b.measure).replace(/_/g, ' ').toLowerCase() : '') + (b.dim ? ' par ' + colLabel(b.table, b.dim).replace(/_/g, ' ').toLowerCase() : '');
}

/* ---------- Texte enrichi : **mise en avant**, __gras__, retour ligne ---------- */
function rich(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, '<em>$1</em>').replace(/__(.+?)__/g, '<b>$1</b>').replace(/\n/g, '<br>'); }

/* ---------- Contexte de rendu fourni aux modèles ---------- */
function makeCtx(inf, tpl, D, errors, W, H, fs, th) {
  const charts = {}; let cid = 0;
  const slotIdx = {}; tpl.slots.forEach((s, i) => { slotIdx[s.key] = i + 1; });
  const B = k => inf.slots[k] || {};
  const kindOf = k => (tpl.slots.find(s => s.key === k) || {}).kind;
  const fmtOf = k => { const b = B(k), f = Object.assign({}, b.fmt || {}); if (kindOf(k) === 'value' && !f.unit && ['pct', 'evol'].includes(b.compare)) f.unit = '%'; if (b.agg === 'pcttrue' && !f.unit) f.unit = '%'; if (['series', 'geo', 'multi'].includes(kindOf(k)) && b.transform === 'pct' && !f.unit) f.unit = '%'; return f; };
  const ctx = {
    W, H, fs, th, inf, tpl, D, errors, st: inf.style, brand: STATE.doc.brand, land: W > H * 1.15, charts,
    T: k => tokens(inf.texts[k] ?? tpl.texts[k] ?? '', D, inf, tpl),
    R: k => rich(ctx.T(k)),
    B, fmt: fmtOf,
    f: k => { const F = fmtOf(k); return v => fmtNum(v, F); },
    lbl: k => esc(autoLabel(B(k), kindOf(k))),
    n: k => inf.style.numbers && slotIdx[k] ? `<i class="dn">${slotIdx[k]}</i>` : '',
    attr: k => ` data-slot="${k}" data-ident="${esc(slotIdx[k] + '. ' + ((tpl.slots.find(s => s.key === k) || {}).label || k) + ' — ' + describeBinding(B(k), kindOf(k)))}"`,
    ok: k => !errors[k] && D[k] != null && !(D[k].items && !D[k].items.length) && !(D[k].rows && !D[k].rows.length) && !(D[k].cats && !D[k].cats.length) && !(D[k].points && !D[k].points.length),
    empty: k => `<div class="empty-slot"${ctx.attr(k)}>${errors[k] ? '⚠ ' + esc(errors[k]) : 'Aucune donnée pour « ' + esc((tpl.slots.find(s => s.key === k) || {}).label || k) + ' » — configurez-la dans l\'onglet Données.'}</div>`,
    chart: (k, fn, cls = '', style = '') => { const id = 'c' + (++cid); charts[id] = fn; return `<div class="chart ${cls}" data-cid="${id}" style="${style}"${k ? ctx.attr(k) : ''}></div>`; },
    C: k => ({th, fs, f: ctx.f(k), fx: v => fmtNum(v, B(k).fmtx || {}), fy: v => fmtNum(v, B(k).fmt || {})}),
    vis: (name, size, o = {}) => `<span class="pic" style="width:${size};height:${size}">${visual(name, th, Object.assign({style: inf.style.pictos}, o))}</span>`,
    icon: k => resolveIcon(inf.texts['ic_' + k] || (tpl.slots.find(s => s.key === k) || {}).icon || '', autoLabel(B(k), kindOf(k)) + ' ' + (B(k).table || '')),
    val: k => { const d = D[k] || {}; const F = fmtOf(k); const v = d.v; const full = typeof v === 'string' ? v : fmtNum(v, Object.assign({}, F, {unit: ''})); return {raw: v, num: esc(full), unit: esc(F.unit || ''), d, delta: d.delta}; },
    kpi: (k, o = {}) => {
      if (errors[k]) return ctx.empty(k);
      const v = ctx.val(k); const size = o.size || 2.6;
      const delta = isNum(v.delta) ? `<span class="d ${v.delta > 0.05 ? 'up' : v.delta < -0.05 ? 'down' : 'eq'}">${v.delta > 0.05 ? '▲' : v.delta < -0.05 ? '▼' : '■'} ${fmtNum(v.delta, {dec: 1, sign: true})} %${B(k).b2 && B(k).b2.label ? ' <span style="font-weight:400">' + esc(B(k).b2.label) + '</span>' : ''}</span>` : '';
      return `<div class="kpi${o.cls ? ' ' + o.cls : ''}"${ctx.attr(k)} style="${o.align ? 'align-items:' + o.align + ';text-align:' + (o.align === 'center' ? 'center' : 'left') + ';' : ''}${o.style || ''}">${o.icon ? ctx.vis(ctx.icon(k), o.iconSize || '3em', o.iconOpt || {}) : ''}<div class="v fit" style="font-size:${size}em;${o.color ? 'color:' + o.color : ''}">${v.num}${v.unit ? '<small>' + v.unit + '</small>' : ''}${ctx.n(k)}</div><div class="l">${ctx.lbl(k)}</div>${delta}</div>`;
    },
    blkT: (txt, k) => txt ? `<h3 class="blk-t">${rich(txt)}${k ? ctx.n(k) : ''}</h3>` : '',
    legend: (names, o) => legendHTML(names, th, o)
  };

}
/* Jetons dans les textes : {k1} {s1:top} {s1:topv} {s1:total} {s1:n} {date} {annee} {signature} */
function tokens(s, D, inf, tpl) {
  return String(s ?? '').replace(/\{([a-z0-9_]+)(?::([a-z]+))?\}/gi, (m, k, mod) => {
    if (k === 'date') return today(); if (k === 'annee') return '' + new Date().getFullYear(); if (k === 'signature') return marqueSignature(STATE.doc.brand);
    const d = D[k]; if (!d) { const tx = inf.texts[k] ?? (tpl && tpl.texts[k]); return tx != null && !/\{/.test(tx) ? tx : m; } const b = inf.slots[k] || {}; const F = Object.assign({}, b.fmt || {});
    if (d.items) { const it = d.items.slice().sort((a, c) => (c.value ?? -Infinity) - (a.value ?? -Infinity)); if (mod === 'top') return it[0] ? it[0].label : ''; if (mod === 'topv') return it[0] ? fmtNum(it[0].value, F) : ''; if (mod === 'total') return fmtNum(d.total, F); if (mod === 'n') return '' + d.items.length; if (mod === 'last') return d.items.length ? fmtNum(d.items[d.items.length - 1].value, F) : ''; return fmtNum(d.total, F); }
    if ('v' in d) { if (['pct', 'evol'].includes(b.compare) && !F.unit) F.unit = '%'; return typeof d.v === 'string' ? d.v : fmtNum(d.v, F); }
    return m;
  });
}

defTpl({id: 'org', fam: 'inst', name: 'Organigramme', desc: 'Arborescence à partir d\'une colonne « rattachement »', thumb: 'org',
  slots: [RW('r1', 'Organigramme', {table: /organi/i, titleRe: /poste|nom/i, textRe: /mission|r[oô]le/i})],
  texts: {title: 'Organisation **des services**', sub: 'Préfecture de région', intro: 'Chaque ligne indique son rattachement (colonne « parent »).'},
  render: c => { const r = rowsOf(c, 'r1'); if (!r.length) return c.empty('r1');
    const byP = {}; r.forEach(x => { (byP[norm(x.parent)] = byP[norm(x.parent)] || []).push(x); });
    const roots = r.filter(x => !x.parent || !r.some(y => norm(y.title) === norm(x.parent)));
    const box = (x, lvl) => `<div style="background:${lvl === 0 ? c.th.c1 : lvl === 1 ? (c.th.inv ? 'rgba(255,255,255,.15)' : mix(c.th.c1, '#ffffff', .85)) : c.th.soft};color:${lvl === 0 ? c.th.on1 : c.th.ink};padding:.45em .7em;text-align:center;border-top:.25em solid ${lvl === 1 ? c.th.c2 : 'transparent'};min-width:7em"><b style="font-size:${lvl === 0 ? 1.1 : .9}em;display:block">${esc(x.title)}</b>${x.text ? `<small style="font-size:.75em;opacity:.85">${esc(x.text)}</small>` : ''}</div>`;
    const node = (x, lvl, seen) => { const kids = (byP[norm(x.title)] || []).filter(k => !seen.has(k)); kids.forEach(k => seen.add(k));
      if (lvl >= 1 && kids.length) return `<div style="display:flex;flex-direction:column;align-items:stretch;gap:.4em">${box(x, lvl)}<div style="display:flex;flex-direction:column;gap:.35em;border-left:2px solid ${c.th.line};margin-left:1em;padding-left:.7em">${kids.map(k => node(k, lvl + 1, seen)).join('')}</div></div>`;
      if (!kids.length) return box(x, lvl);
      return `<div style="display:flex;flex-direction:column;align-items:center">${box(x, lvl)}<div style="width:2px;height:1.2em;background:${c.th.line}"></div><div style="display:flex;gap:1em;align-items:flex-start;justify-content:center;border-top:2px solid ${c.th.line};padding-top:1.2em">${kids.map(k => node(k, lvl + 1, seen)).join('')}</div></div>`; };
    const seen = new Set(roots); return `<div style="flex:1;display:flex;justify-content:center;align-items:flex-start;gap:2em;padding-top:1em"${c.attr('r1')}>${roots.map(x => node(x, 0, seen)).join('')}${c.n('r1')}</div>`; }});

<script>
/* =====================================================================
   Interface : état, catalogue, rendu de l'affiche, panneaux, exports
   ===================================================================== */
const STOP = new Set('les des une est que qui dans pour par sur avec pas plus mais ont son ses aux sont cette ces leur nous vous ils elles été tout tous très bien fait faire comme aussi être avoir entre sans sous chez donc alors car ainsi the and'.split(' '));
const COMMON_TEXTS = {title: 'Titre', sub: 'Surtitre / sous-titre', intro: 'Chapeau (texte d\'introduction)', source: 'Source (vide = automatique)', note: 'Note de bas de page'};
const OPT_KEYS = {
  scope: {label: 'Fond de carte', type: 'select', options: () => MAP_SCOPES.map(s => [s.id, s.name])},
  dep: {label: 'Département (communes)', type: 'select', options: () => Object.entries(ASSETS.deps).sort((a, b) => a[0].localeCompare(b[0])).map(([k, d]) => [k, k + ' · ' + d.n])},
  method: {label: 'Classes de couleurs', type: 'select', options: () => [['quantile', 'Effectifs égaux (quantiles)'], ['equal', 'Amplitudes égales'], ['continuous', 'Dégradé continu']]},
  classes: {label: 'Nombre de classes', type: 'select', options: () => [3, 4, 5, 6, 7].map(n => ['' + n, '' + n])},
  mode: {label: 'Orientation du radar', type: 'select', options: () => [['lignes', 'Un polygone par ligne'], ['colonnes', 'Un polygone par colonne']]},
  trend: {label: 'Droite de tendance', type: 'select', options: () => [['oui', 'Oui'], ['non', 'Non']]},
  total: {label: 'Ligne de total', type: 'select', options: () => [['oui', 'Oui'], ['non', 'Non']]},
  icon: {label: 'Pictogramme', type: 'icon'}, base: {label: 'Nombre de pictogrammes', type: 'text'}, unit: {label: 'Valeur d\'un pictogramme', type: 'text'}
};
const STATE = {doc: null, ui: {fam: '', q: '', tab: 'data', ident: false, zoom: 'fit', openSlot: null, showSummary: false, narrowCat: false}, last: {D: {}, errors: {}}};
const defaultStyle = () => ({palette: 'institutionnel', bg: 'blanc', header: 'classic', marquePos: 'head', pictos: 'dsfr', numbers: false, notes: false, showSource: true, showDate: true, tricolor: true, density: 1, tag: ''});
const defaultBrand = () => ({genre: 'prefet', territoire: 'region', custom: '', service: '', devise: true, footer: 'www.prefectures-regions.gouv.fr/bretagne'});
function newInf(tplId) { const t = TPL[tplId] || TPL[TPL_ORDER[0]]; return {id: uid(), tpl: t.id, name: '', format: t.format || 'a4p', texts: {}, slots: {}, touched: {}, style: defaultStyle()}; }
const cur = () => STATE.doc.current;
const curTpl = () => TPL[cur().tpl] || TPL[TPL_ORDER[0]];

/* ---------- Mots (nuage) : branchement dans evalSeries ---------- */
const _evalSeries = evalSeries;
evalSeries = async function (b) {
  if (!b.tokenize || b.mode === 'manual' || !b.table || !b.dim) return _evalSeries(b);
  const rows = filterRows(await fetchRows(b.table), b.table, b.filters); const cnt = new Map();
  for (const r of rows) { const seen = new Set(); String(Array.isArray(r[b.dim]) ? r[b.dim].join(' ') : r[b.dim] ?? '').toLowerCase().split(/[^a-zàâäçéèêëîïôöùûüœæ'-]+/i).map(w => w.replace(/^[ldjmnst]'/, '')).filter(w => w.length >= 3 && !STOP.has(w)).forEach(w => { if (!seen.has(w)) { seen.add(w); cnt.set(w, (cnt.get(w) || 0) + 1); } }); }
  let items = [...cnt.entries()].map(([label, value]) => ({key: label, label, value, sort: label})).sort((a, c) => c.value - a.value);
  if (+b.limit) items = items.slice(0, +b.limit);
  return {items, total: sum(items.map(i => i.value))};
};
EVAL.series = evalSeries; EVAL.geo = evalSeries;

/* ---------- Persistance (options du widget Grist ou navigateur) ---------- */
const LS_KEY = () => 'studio-infographies:' + (DB.docName || 'demo');
async function loadDoc() {
  let d = null;
  if (DB.mode === 'grist') { try { d = await withTimeout(grist.getOption('studio'), 5000); if (typeof d === 'string') d = JSON.parse(d); } catch (e) { console.warn(e); } }
  if (!d) { try { d = JSON.parse(localStorage.getItem(LS_KEY()) || 'null'); } catch (e) { d = null; } }
  STATE.doc = Object.assign({version: 1, brand: defaultBrand(), current: null, saved: []}, d || {});
  STATE.doc.brand = Object.assign(defaultBrand(), STATE.doc.brand || {});
  if (!STATE.doc.current || !TPL[STATE.doc.current.tpl]) STATE.doc.current = newInf('kpi-trio');
  STATE.doc.current.style = Object.assign(defaultStyle(), STATE.doc.current.style || {});
  STATE.doc.current.touched = STATE.doc.current.touched || {};
}
let _saving = null;
const saveDoc = debounce(async () => {
  const d = clone(STATE.doc);
  try { localStorage.setItem(LS_KEY(), JSON.stringify(d)); } catch (e) { /* ignoré */ }
  if (DB.mode === 'grist') { try { _saving = true; await withTimeout(grist.setOption('studio', d), 8000); } catch (e) { console.warn('Enregistrement des options impossible (droits d\'édition ?)', e); } finally { setTimeout(() => { _saving = false; }, 400); } }
}, 700);
function onRemoteOptions(o) { if (_saving || !o || !o.studio) return; /* changement distant : on recharge seulement si différent */ const s = typeof o.studio === 'string' ? JSON.parse(o.studio) : o.studio; if (JSON.stringify(s) !== JSON.stringify(STATE.doc)) { STATE.doc = s; STATE.doc.brand = Object.assign(defaultBrand(), s.brand || {}); ensureBindings(cur()); renderAll(); } }

function ensureBindings(inf, force) {
  const t = TPL[inf.tpl]; const used = new Set();
  for (const s of t.slots) {
    const b = inf.slots[s.key];
    if (force || !b || b.__kind !== s.kind || (!inf.touched[s.key] && b.__tpl !== t.id)) { inf.slots[s.key] = Object.assign(autoBind(s, used), {__kind: s.kind, __tpl: t.id}); }
  }
}
function selectTpl(id) {
  const inf = cur(); const t = TPL[id]; if (!t) return;
  inf.tpl = id;
  if (t.format || t.header) { if (t.format) inf.format = t.format; if (t.header) inf.style.header = t.header; inf.autoFormat = true; }
  else if (inf.autoFormat) { inf.format = 'a4p'; inf.style.header = 'classic'; inf.autoFormat = false; }
  ensureBindings(inf); STATE.ui.openSlot = null;
  renderCatalog(); renderToolbar(); renderPane(); render(); saveDoc();
  if (STATE.ui.narrowCat) { $('#cat').classList.remove('open'); STATE.ui.narrowCat = false; }
}

/* ---------- Catalogue ---------- */
function renderCatalog() {
  const q = norm(STATE.ui.q), fam = STATE.ui.fam;
  $('#tplCount').textContent = TPL_ORDER.length + ' modèles';
  $('#famChips').innerHTML = `<button class="chip${!fam ? ' on' : ''}" data-fam="">Toutes</button>` + FAMILIES.map(f => `<button class="chip${fam === f.id ? ' on' : ''}" data-fam="${f.id}">${esc(f.name)}</button>`).join('');
  let n = 0;
  $('#tplList').innerHTML = FAMILIES.filter(f => !fam || f.id === fam).map(f => {
    const ts = TPL_ORDER.map(id => TPL[id]).filter(t => t.fam === f.id && (!q || norm(t.name + ' ' + t.desc + ' ' + f.name).includes(q)));
    if (!ts.length) return '';
    return `<div class="fam"><div class="fam-h"><svg class="ico" viewBox="0 0 24 24"><path d="${ASSETS.icons[f.icon] || ''}"/></svg>${esc(f.name)} <span style="margin-left:auto;font-weight:400">${ts.length}</span></div>${ts.map(t => `<button class="tpl${cur().tpl === t.id ? ' on' : ''}" data-tpl="${t.id}" title="${esc(t.desc)}"><span class="th">${thumb(t.thumb)}</span><span class="tx"><b>${esc(t.name)}</b><small>${esc(t.desc)}</small></span><span class="num">${String(TPL_ORDER.indexOf(t.id) + 1).padStart(2, '0')}</span></button>`).join('')}</div>`;
  }).join('') || '<p class="muted" style="padding:12px">Aucun modèle ne correspond.</p>';
}

/* ---------- Barre d'outils ---------- */
function renderToolbar() {
  const inf = cur(), t = curTpl();
  $('#toolbar').innerHTML = `<span class="ttl" title="${esc(t.desc)}">${String(TPL_ORDER.indexOf(t.id) + 1).padStart(2, '0')} · ${esc(t.name)}</span>
    <select class="inp" id="fmtSel" title="Format">${FORMATS.map(f => `<option value="${f.id}"${inf.format === f.id ? ' selected' : ''}>${esc(f.name)} (${f.w}×${f.h})</option>`).join('')}</select>
    <select class="inp" id="zoomSel" title="Zoom">${[['fit', 'Ajuster'], ['0.5', '50 %'], ['0.75', '75 %'], ['1', '100 %']].map(([v, l]) => `<option value="${v}"${STATE.ui.zoom === v ? ' selected' : ''}>${l}</option>`).join('')}</select>
    <span class="sep"></span>
    <button class="btn sm ${STATE.ui.ident ? 'on' : 'ter'}" id="btnIdent" title="Afficher l'origine de chaque donnée (cliquer pour la configurer)">${ui('eye')}<span>Identifier les données</span></button>
    <button class="btn sm ter" id="btnShuffle" title="Modèle au hasard">${ui('shuffle')}</button>
    <span style="flex:1"></span>
    <button class="btn sm sec" id="btnPng" title="Exporter en image PNG (haute définition)">${ui('image')}<span>PNG</span></button>
    <button class="btn sm sec" id="btnPdf" title="Exporter en PDF">${ui('download')}<span>PDF</span></button>
    <button class="btn sm ter" id="btnPrint" title="Imprimer">${ui('print')}</button>
    <button class="btn sm" id="btnSave" title="Enregistrer dans « Mes infographies »">${ui('save')}<span>Enregistrer</span></button>`;
}

/* ---------- Rendu de l'affiche ---------- */
let renderToken = 0;
async function render() {
  const token = ++renderToken; const inf = cur(), t = curTpl();
  const F = FORMATS.find(f => f.id === inf.format) || FORMATS[0];
  const st = inf.style, th = makeTheme(st), brand = STATE.doc.brand;
  showStatus('Calcul des données…');
  const D = {}, errors = {};
  await Promise.all(t.slots.map(async s => { try { D[s.key] = await EVAL[s.kind](inf.slots[s.key] || {}); } catch (e) { errors[s.key] = e.message || String(e); console.warn(s.key, e); } }));
  if (token !== renderToken) return;
  STATE.last = {D, errors};
  const W = F.w, Hh = F.h; const fs = clamp(Math.min(W, Hh * .78) / 50, 12, 30) * (+st.density || 1);
  const side = st.header === 'side' && W > Hh * 1.15;
  const cls = ['poster', side ? 'h-side' : st.header === 'band' ? 'h-band' : 'h-classic', th.inv ? 'inv' : '', STATE.ui.ident ? 'ident' : ''].join(' ');
  const vars = `--bg:${th.bg};--c1:${th.c1};--c2:${th.c2};--on1:${th.on1};--ink:${th.ink};--txt:${th.txt};--muted:${th.muted};--soft:${th.soft};--line:${th.line}`;
  const ctxT = k => tokens(inf.texts[k] ?? t.texts[k] ?? '', D, inf, t);
  const marqueInv = th.inv && st.header !== 'band';
  const marque = `<div class="p-marque">${marqueHTML(brand, {inv: marqueInv})}</div>`;
  const svc = brand.service ? `<div class="p-svc">${rich(brand.service)}</div>` : '';
  const tag = st.tag ? `<div class="p-tag">${esc(st.tag)}</div>` : '';
  const head = `<div class="p-head">${st.marquePos !== 'foot' ? marque + svc : svc}${tag}</div>`;
  const titles = `<div class="p-titles">${ctxT('sub') ? `<p class="p-sub">${rich(ctxT('sub'))}</p>` : ''}<h1 class="p-title">${rich(ctxT('title'))}</h1>${ctxT('intro') ? `<p class="p-intro">${rich(ctxT('intro'))}</p>` : ''}</div>`;
  const tables = [...new Set(t.slots.map(s => inf.slots[s.key]).filter(b => b && b.table && b.mode !== 'manual' && b.mode !== 'static').map(b => b.table.replace(/_/g, ' ')))];

    else if (d.rows) d.rows.forEach(r => lines.push([s.label, r.title, r.text, r.value].map(q).join(';')));
  });
  return lines.join('\r\n');
}
function copyText(s) { (navigator.clipboard ? navigator.clipboard.writeText(s) : Promise.reject()).then(() => toast('Copié', 'ok')).catch(() => { const ta = document.createElement('textarea'); ta.value = s; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast('Copié', 'ok'); } catch (e) { toast('Copie impossible', 'err'); } ta.remove(); }); }
function download(url, name) { const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
function fileName() { const t = String(tokens(cur().texts.title ?? curTpl().texts.title, STATE.last.D, cur(), curTpl())).replace(/\*\*|__/g, ''); return 'infographie-' + norm(t).replace(/ /g, '-').slice(0, 50); }

/* ---------- Exports PNG / PDF ---------- */
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Chargement impossible : ' + src)); document.head.appendChild(s); }); }
/* Polices embarquées pour l'export (évite la lecture des feuilles de style par html-to-image, défaillante sous Firefox) */
let _fontCSS = null;
async function fontEmbedCSS() {
  if (_fontCSS != null) return _fontCSS;
  const rules = [];
  for (const sh of document.styleSheets) { let rs; try { rs = sh.cssRules; } catch (e) { continue; } for (const r of rs || []) if (r.type === CSSRule.FONT_FACE_RULE) rules.push(r.cssText); }
  const toData = async url => { const blob = await (await fetch(url)).blob(); return await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(blob); }); };
  const out = await Promise.all(rules.map(async css => { const m = /url\(["']?([^"')]+)["']?\)/.exec(css); if (!m) return ''; try { return css.replace(m[0], 'url(' + await toData(m[1]) + ')'); } catch (e) { console.warn('Police non embarquée', m[1], e); return ''; } }));
  _fontCSS = out.filter(Boolean).join('\n');
  return _fontCSS;
}
async function snapshot(type) {
  if (!window.htmlToImage) await loadScript('https://cdn.jsdelivr.net/npm/html-to-image@1.11.13/dist/html-to-image.js');
  const poster = $('#poster'); const F = FORMATS.find(f => f.id === cur().format) || FORMATS[0];
  const wasIdent = poster.classList.contains('ident'); poster.classList.remove('ident');
  try {
    const opt = {pixelRatio: 2, width: F.w, height: F.h, cacheBust: false, fontEmbedCSS: await fontEmbedCSS(), backgroundColor: makeTheme(cur().style).bg, style: {transform: 'none', margin: '0'}};
    return type === 'jpeg' ? await htmlToImage.toJpeg(poster, Object.assign(opt, {quality: .93})) : await htmlToImage.toPng(poster, opt);
  } finally { if (wasIdent) poster.classList.add('ident'); }
}
async function exportPng() {
  showStatus('Génération de l\'image…');
  try { const url = await snapshot('png'); showStatus(''); exportModal(url, fileName() + '.png', 'Image PNG'); } catch (e) { showStatus(''); console.error(e); toast('Export impossible : ' + (e.message || e), 'err'); }
}
async function exportPdf() {
  showStatus('Génération du PDF…');
  try {
    const url = await snapshot('jpeg'); const F = FORMATS.find(f => f.id === cur().format) || FORMATS[0];
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const bytes = Uint8Array.from(atob(url.split(',')[1]), c => c.charCodeAt(0));
    const pdf = buildPdf(bytes, img.naturalWidth, img.naturalHeight, F.w * .75, F.h * .75, altText().split('\n')[0]);
    const blobUrl = URL.createObjectURL(new Blob([pdf], {type: 'application/pdf'}));
    showStatus(''); exportModal(blobUrl, fileName() + '.pdf', 'Document PDF', url);
  } catch (e) { showStatus(''); console.error(e); toast('Export PDF impossible : ' + (e.message || e), 'err'); }
}
/* PDF minimal : une page, une image JPEG pleine page */
function buildPdf(jpg, iw, ih, pw, ph, title) {
  const enc = new TextEncoder(); const parts = []; const offs = []; let len = 0;
  const push = d => { const b = typeof d === 'string' ? enc.encode(d) : d; parts.push(b); len += b.length; };
  const obj = (n, body) => { offs[n] = len; push(n + ' 0 obj\n'); body.forEach(push); push('\nendobj\n'); };
  const t = String(title || '').replace(/[()\\]/g, ' ').replace(/[^\x20-\x7e]/g, c => ({'é': 'e', 'è': 'e', 'ê': 'e', 'à': 'a', 'ç': 'c', 'ô': 'o', 'î': 'i', 'û': 'u', 'É': 'E'}[c] || ' ')).slice(0, 200);
  push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  obj(1, ['<< /Type /Catalog /Pages 2 0 R /Lang (fr-FR) >>']);
  obj(2, ['<< /Type /Pages /Kids [3 0 R] /Count 1 >>']);
  obj(3, [`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw.toFixed(2)} ${ph.toFixed(2)}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`]);
  obj(4, [`<< /Type /XObject /Subtype /Image /Width ${iw} /Height ${ih} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`, jpg, '\nendstream']);
  const content = `q ${pw.toFixed(2)} 0 0 ${ph.toFixed(2)} 0 0 cm /Im0 Do Q`;
  obj(5, [`<< /Length ${content.length} >>\nstream\n${content}\nendstream`]);
  obj(6, [`<< /Title (${t}) /Producer (Studio infographies DSFR - Grist) >>`]);
  const xref = len; push('xref\n0 7\n0000000000 65535 f \n' + offs.slice(1).map(o => String(o).padStart(10, '0') + ' 00000 n \n').join(''));
  push(`trailer\n<< /Size 7 /Root 1 0 R /Info 6 0 R >>\nstartxref\n${xref}\n%%EOF`);
  const out = new Uint8Array(len); let p = 0; parts.forEach(b => { out.set(b, p); p += b.length; }); return out;
}
function exportModal(url, name, label, preview) {
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="Export"><h2>${esc(label)} prête</h2><p class="muted" style="margin-top:0">Si le téléchargement ne démarre pas, faites un clic droit sur l'aperçu puis « Enregistrer l'image sous… ».</p><div style="background:var(--canvas);padding:12px;text-align:center;max-height:55vh;overflow:auto"><img src="${preview || url}" alt="${esc(altText().split('\n')[0])}" style="max-width:100%;max-height:50vh;box-shadow:var(--shadow-lg)"></div><div class="fld" style="margin-top:12px"><span>Texte alternatif à joindre</span><div class="alt-box" style="max-height:90px">${esc(altText().split('\n')[0])}</div></div><div class="acts"><button class="btn ter" data-close>Fermer</button>${label.startsWith('Image') ? `<button class="btn sec" data-clip>${ui('copy')}Copier l'image</button>` : ''}<a class="btn" href="${url}" download="${esc(name)}">${ui('download')}Télécharger</a></div></div>`;
  document.body.appendChild(bg);
  bg.addEventListener('click', async e => { if (e.target === bg || e.target.closest('[data-close]')) bg.remove(); if (e.target.closest('[data-clip]')) { try { const blob = await (await fetch(url)).blob(); await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]); toast('Image copiée', 'ok'); } catch (err) { toast('Copie refusée par le navigateur', 'err'); } } });
  bg.querySelector('a[download]').click();
}

/* ---------- Aide ---------- */
function showHelp() {
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="Aide"><h2>Studio infographies · mode d'emploi</h2><div class="help-grid">
    <div><h4>1. Choisir un modèle</h4>${TPL_ORDER.length} modèles en ${FAMILIES.length} familles : chiffres clés, comparaisons, répartitions, évolutions, cartes de la Bretagne et de la France, fiches pédagogiques, analyses avancées.</div>
    <div><h4>2. Relier les données</h4>Onglet <b>Données</b> : pour chaque emplacement numéroté, choisissez la table, les colonnes, le calcul (somme, moyenne, médiane, nombre…), les filtres, une comparaison (tendance, part, ratio) ou une <b>formule</b> (<code>$Montant / $Population * 1000</code>).</div>
    <div><h4>3. Identifier les données</h4>Le bouton <b>Identifier les données</b> encadre chaque élément de l'affiche avec sa provenance (table › calcul › colonne › filtres). Cliquez dessus pour l'éditer. Dans <b>Style</b>, la numérotation ①②③ et les notes de pied de page documentent l'infographie imprimée.</div>
    <div><h4>4. Signer</h4>Onglet <b>Signature</b> : Préfet ou Préfète, région Bretagne ou département, nom du service. Le bloc-marque officiel (Marianne + devise) est généré automatiquement.</div>
    <div><h4>Textes dynamiques</h4><code>**mot**</code> = mise en avant colorée · <code>{k1}</code> valeur d'un chiffre · <code>{s1:top}</code> catégorie en tête · <code>{s1:topv}</code> sa valeur · <code>{s1:total}</code> · <code>{s1:last}</code> · <code>{date}</code> · <code>{signature}</code>.</div>
    <div><h4>Cartes</h4>Bretagne, France (départements ou régions) intégrées ; communes chargées depuis geo.api.gouv.fr. Les territoires sont reconnus par leur <b>code</b> (35, 35238) ou leur <b>nom</b>.</div>
    <div><h4>Exporter</h4>PNG haute définition, PDF, impression, texte alternatif et transcription (onglet Accessibilité), données en CSV.</div>
    <div><h4>Dans Grist</h4>Réglez l'accès du widget sur <b>Accès complet au document</b> pour lister toutes les tables. Les infographies sont enregistrées dans les options du widget.</div>
    </div><div class="acts"><button class="btn" data-close>Fermer</button></div></div>`;
  document.body.appendChild(bg); bg.addEventListener('click', e => { if (e.target === bg || e.target.closest('[data-close]')) bg.remove(); });
}

/* ---------- Initialisation ---------- */
function paintAppMarque() { $('#appMarque').innerHTML = marqueHTML(Object.assign({}, STATE.doc.brand, {devise: false})); $('#appSvc').textContent = marqueSignature(STATE.doc.brand) + ' · charte de l\'État (DSFR)'; }
function renderAll() { renderCatalog(); renderToolbar(); renderTabs(); renderPane(); paintAppMarque(); render(); }
function bindEvents() {
  $('#btnHelp').innerHTML = ui('help') + '<span>Aide</span>'; $('#btnRefresh').innerHTML = ui('refresh') + '<span>Actualiser</span>'; $('#btnCat').innerHTML = ui('catalog');
  $('#btnHelp').onclick = showHelp;
  $('#btnRefresh').onclick = async () => { try { await dbMeta(); renderPane(); render(); toast('Données relues'); } catch (e) { toast(e.message, 'err'); } };
  $('#btnCat').onclick = () => { STATE.ui.narrowCat = !STATE.ui.narrowCat; $('#cat').classList.toggle('open', STATE.ui.narrowCat); };
  $('#tplSearch').addEventListener('input', e => { STATE.ui.q = e.target.value; renderCatalog(); });
  $('#famChips').addEventListener('click', e => { const b = e.target.closest('[data-fam]'); if (b) { STATE.ui.fam = b.dataset.fam; renderCatalog(); } });
  $('#tplList').addEventListener('click', e => { const b = e.target.closest('[data-tpl]'); if (b) selectTpl(b.dataset.tpl); });
  $('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) setTab(b.dataset.tab); });
  $('#toolbar').addEventListener('change', e => {
    if (e.target.id === 'fmtSel') { cur().format = e.target.value; cur().autoFormat = false; saveDoc(); render(); }
    if (e.target.id === 'zoomSel') { STATE.ui.zoom = e.target.value; applyZoom(); }
  });
  $('#toolbar').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.id === 'btnIdent') { STATE.ui.ident = !STATE.ui.ident; renderToolbar(); const p = $('#poster'); if (p) p.classList.toggle('ident', STATE.ui.ident); if (STATE.ui.ident) setTab('data'); }
    if (b.id === 'btnShuffle') selectTpl(TPL_ORDER[Math.floor(Math.random() * TPL_ORDER.length)]);
    if (b.id === 'btnPng') exportPng();
    if (b.id === 'btnPdf') exportPdf();
    if (b.id === 'btnPrint') { const p = $('#poster'); const was = p && p.classList.contains('ident'); if (was) p.classList.remove('ident'); window.print(); if (was) p.classList.add('ident'); }
    if (b.id === 'btnSave') saveCopy();
  });
  const pane = $('#pane');
  pane.addEventListener('input', e => { if (e.target.dataset.bp) return onBrandField(e); if (e.target.matches('input:not([type=checkbox]),textarea')) onField(e, false); });
  pane.addEventListener('change', e => {
    if (e.target.dataset.act === 'importJson') return importJson(e.target);
    if (e.target.dataset.act === 'measure' || e.target.dataset.act === 'summary') return onAction(e.target, e);
    if (e.target.dataset.bp) return onBrandField(e);
    onField(e, true);
  });
  pane.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && b.tagName !== 'INPUT' && b.tagName !== 'LABEL') { e.preventDefault(); onAction(b, e); } });
  const holder = $('#holder'), tip = $('#tip');
  holder.addEventListener('mousemove', e => { const t = e.target.closest('[data-tip]'); if (!t || STATE.ui.ident) { tip.style.display = 'none'; return; } tip.innerHTML = `<b>${esc(t.dataset.tip)}</b>${esc(t.dataset.tipv || '')}`; tip.style.display = 'block'; tip.style.left = Math.min(e.clientX + 14, innerWidth - 290) + 'px'; tip.style.top = (e.clientY + 14) + 'px'; });
  holder.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
  holder.addEventListener('click', e => { if (!STATE.ui.ident) return; const s = e.target.closest('[data-slot]'); if (!s) return; STATE.ui.openSlot = s.dataset.slot; setTab('data'); const ed = $(`[data-slot-ed="${s.dataset.slot}"]`); if (ed) { ed.scrollIntoView({behavior: 'smooth', block: 'start'}); ed.classList.add('focus'); setTimeout(() => ed.classList.remove('focus'), 1600); } });
  window.addEventListener('resize', debounce(applyZoom, 120));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') $$('.modal-bg').forEach(m => m.remove()); });
}
function importJson(input) {
  const f = input.files[0]; if (!f) return; const r = new FileReader();
  r.onload = () => { try { const d = JSON.parse(r.result); if (d.current && d.saved) { STATE.doc.saved = [...(d.saved || []), ...STATE.doc.saved]; if (d.brand) STATE.doc.brand = Object.assign(defaultBrand(), d.brand); } else if (d.tpl) STATE.doc.saved.unshift(d); else throw new Error('Format non reconnu'); saveDoc(); renderPane(); toast('Import réussi', 'ok'); } catch (e) { toast('Import impossible : ' + e.message, 'err'); } };
  r.readAsText(f);
}
(async function init() {
  bindEvents();
  try { await dbInit(); }
  catch (e) { console.error(e); toast('Connexion à Grist impossible (' + e.message + ') — passage en démonstration', 'err'); DB.mode = 'demo'; DB.demo = buildDemo(); await dbMeta(); }
  $('#modeBadge').textContent = DB.mode === 'demo' ? 'Démonstration' : 'Grist'; $('#modeBadge').classList.toggle('demo', DB.mode === 'demo');
  $('#modeBadge').title = DB.mode === 'demo' ? 'Données fictives : ouvrez ce fichier comme widget personnalisé dans Grist pour utiliser vos tables' : 'Connecté au document ' + (DB.docName || '');
  await loadDoc(); ensureBindings(cur());
  try { await withTimeout(document.fonts.ready, 3000); } catch (e) { /* ignoré */ }
  renderAll();
  if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', debounce(() => render(), 300));
})();
