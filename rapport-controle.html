<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rapport de contrôle</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@9.7.1/dist/index.iife.js"></script>
<style>
  @font-face{font-family:Marianne;src:url(https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.12.1/dist/fonts/Marianne-Regular.woff2) format("woff2");font-weight:400}
  @font-face{font-family:Marianne;src:url(https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.12.1/dist/fonts/Marianne-Medium.woff2) format("woff2");font-weight:500}
  @font-face{font-family:Marianne;src:url(https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.12.1/dist/fonts/Marianne-Bold.woff2) format("woff2");font-weight:700}
  :root{
    --bf:#000091; --bf-hover:#1212FF; --bf-soft:#E3E3FD; --rouge:#E1000F;
    --bg:#F6F6F6; --surface:#FFFFFF; --ink:#161616; --ink-soft:#666666; --border:#DDDDDD;
    --ok:#18753C; --ok-soft:#B8FEC9; --err:#CE0500; --err-soft:#FFE9E9; --warn:#B34000; --warn-soft:#FFE9E6;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bf:#8585F6; --bf-hover:#A5A5F8; --bf-soft:#21213F; --bg:#161616; --surface:#1E1E1E; --ink:#EEEEEE;
      --ink-soft:#AAAAAA; --border:#353535; --ok:#27A658; --ok-soft:#19402A; --err:#FF5655; --err-soft:#3B1E1E; --warn:#FC5D00; --warn-soft:#3E2515; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Marianne,Arial,sans-serif}
  main{max-width:980px;margin:0 auto;padding:16px}
  header.top{display:flex;align-items:center;gap:14px;margin-bottom:16px}
  .marque{font-weight:700;font-size:12px;line-height:1.05;text-transform:uppercase;letter-spacing:.02em;border-left:4px solid;border-image:linear-gradient(#000091 33%,#fff 33% 66%,#E1000F 66%) 1;padding-left:8px}
  .marque i{display:block;font-weight:400;font-style:italic;text-transform:none;font-size:10px;letter-spacing:0;margin-top:3px}
  h1{font-size:22px;margin:0}
  .sub{color:var(--ink-soft);margin:2px 0 0;font-size:13px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:16px;margin-bottom:12px}
  .card h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
  .step{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--bf);color:#fff;font-size:12px}
  .drop{display:block;border:2px dashed var(--border);border-radius:4px;padding:18px;text-align:center;color:var(--ink-soft);cursor:pointer}
  .drop.over{border-color:var(--bf);background:var(--bf-soft)}
  .drop b{color:var(--bf)}
  input[type=file]{display:none}
  .info{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .kpi{flex:1 1 130px;background:var(--bg);border-left:4px solid var(--bf);padding:8px 10px}
  .kpi b{display:block;font-size:20px}
  .kpi span{font-size:12px;color:var(--ink-soft)}
  .kpi.err{border-color:var(--err)}
  .schemas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
  @media (max-width:720px){.schemas{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .opt{border:2px solid var(--border);border-radius:4px;padding:6px;cursor:pointer;background:var(--surface);text-align:center;font-size:13px}
  .opt:hover{border-color:var(--bf-hover)}
  .opt.sel{border-color:var(--bf);box-shadow:0 0 0 2px var(--bf-soft)}
  .opt .th{height:96px;display:grid;place-items:center;background:#fff;border-radius:2px;overflow:hidden;margin-bottom:6px}
  .opt .th svg{width:100%;height:100%}
  .opt .none{color:#999;font-size:12px}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
  .field{flex:1 1 200px}
  .field label{display:block;font-size:13px;font-weight:500;margin-bottom:4px}
  .field input[type=text]{width:100%;font:inherit;padding:8px;border:0;border-bottom:2px solid var(--ink);background:#EEEEEE;color:#161616;border-radius:4px 4px 0 0}
  .chk{display:flex;gap:6px;align-items:center;font-size:14px}
  .btns{display:flex;gap:10px;flex-wrap:wrap}
  button{font:inherit;font-weight:500;border:0;padding:10px 18px;cursor:pointer;background:var(--bf);color:#fff;border-radius:0}
  button.sec{background:transparent;color:var(--bf);box-shadow:inset 0 0 0 1px var(--bf)}
  button:hover:not(:disabled){background:var(--bf-hover);color:#fff}
  button:disabled{opacity:.45;cursor:not-allowed}
  .msg{padding:8px 10px;margin-top:10px;font-size:13px;border-left:4px solid}
  .msg.ok{background:var(--ok-soft);border-color:var(--ok)} .msg.err{background:var(--err-soft);border-color:var(--err)}
  iframe.preview{width:100%;height:720px;border:1px solid var(--border);background:#fff}
  .hidden{display:none}
</style>
</head>
<body>
<main>
  <header class="top">
    <div class="marque">République<br>Française<i>Liberté<br>Égalité<br>Fraternité</i></div>
    <div><h1>Rapport de contrôle de reconnaissance</h1><p class="sub">À partir d'un fichier de contrôle rempli (grille par filière)</p></div>
  </header>

  <section class="card">
    <h2><span class="step">1</span>Fichier de contrôle</h2>
    <label class="drop" id="drop"><input type="file" id="file" accept=".xlsx">Glissez le fichier Excel rempli ici ou <b>choisissez un fichier</b></label>
    <div id="summary"></div>
  </section>

  <section class="card" id="cardOpts">
    <h2><span class="step">2</span>Schéma fonctionnel de l'OP</h2>
    <div class="schemas" id="schemas"></div>
    <div class="row" style="margin-top:14px">
      <div class="field"><label for="lieu">Fait à</label><input type="text" id="lieu" placeholder="Rennes"></div>
      <div class="field"><label for="date">Le</label><input type="text" id="date"></div>
      <label class="chk"><input type="checkbox" id="annexe" checked> Constats détaillés : pour chaque point, « avec quoi », description du contrôle, réponse et précisions</label>
    </div>
  </section>

  <section class="card">
    <h2><span class="step">3</span>Rapport</h2>
    <div class="btns">
      <button id="bPdf" disabled>Télécharger en PDF</button>
      <button id="bDocx" disabled>Télécharger en Word</button>
      <button id="bPrev" class="sec" disabled>Aperçu</button>
    </div>
    <div id="out"></div>
    <iframe class="preview hidden" id="preview" title="Aperçu du rapport"></iframe>
  </section>
</main>

<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const clean = v => String(v == null ? "" : v).replace(/ /g," ").replace(/[ \t]+/g," ").replace(/\s*\n\s*/g,"\n").trim();
const one = v => clean(v).replace(/\n/g," ");
const state = { data:null, schema:"flux", fileName:"" };
const FONT_URL = w => `https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.12.1/dist/fonts/Marianne-${w}.woff2`;

/* =====================================================================
   1. LECTURE DU FICHIER DE CONTRÔLE
   ===================================================================== */
function sheetGrid(ws){
  const rng = XLSX.utils.decode_range(ws["!ref"] || "A1:A1");
  const merges = (ws["!merges"] || []).map(m => ({ r1:m.s.r+1, c1:m.s.c+1, r2:m.e.r+1, c2:m.e.c+1 }));
  const get = (r, c) => { const cell = ws[XLSX.utils.encode_cell({ r:r-1, c:c-1 })]; return cell ? (cell.w != null && typeof cell.v === "number" ? cell.v : cell.v) : null; };
  const txt = (r, c) => clean(get(r, c));
  const mergeAt = (r, c) => merges.find(m => m.r1 === r && m.c1 === c);
  return { maxR: rng.e.r+1, maxC: Math.min(rng.e.c+1, 30), get, txt, mergeAt };
}
const findSheet = (wb, re) => wb.SheetNames.find(n => re.test(n));

function parseControl(wb){
  const D = { cover:{}, fiche:[], filiales:[], personnes:[], controleurs:[], onglets:[], sondages:[], rendements:[], stades:[], capital:[], producteurs:[], conventions:[] };
  const after = s => one(s).split(":").slice(1).join(":").trim();
  // ---- page de garde (libellés en colonne B, valeur à droite ou dans le libellé « Libellé : valeur »)
  const gName = findSheet(wb, /garde/i);
  if (gName){
    const g = sheetGrid(wb.Sheets[gName]);
    const right = (r, from=3) => { for (let c = from; c <= g.maxC; c++){ const t = g.txt(r, c); if (t && !/^(du|au)$/i.test(t)) return t; } return ""; };
    const val = (r, b) => right(r, 3) || after(b);
    let mode = null, cols = null;
    for (let r = 1; r <= g.maxR; r++){
      const b = g.txt(r, 2), B = one(b).toUpperCase();
      if (/^SERVICE TERRITORIAL/.test(B) && !mode) D.cover.service = (v => v ? (/^service/i.test(v) ? v : "Service territorial " + v) : "")(val(r, b));
      else if (/^RAISON SOCIALE/.test(B)){ mode = null; D.cover.rs = val(r, b); }
      else if (/^N° DE RECONNAISSANCE/.test(B)) D.cover.reco = val(r, b);
      else if (/^SECTEUR CONCERN/.test(B)) D.cover.secteur = val(r, b);
      else if (/^CONTR[ÔO]LE DE RECONNAISSANCE/.test(B) && /secteur\s+/i.test(b) && !D.cover.secteur) D.cover.secteur = one(b).replace(/^.*secteur\s+/i, "").trim();
      else if (/^N° DE DEMANDE/.test(B)) D.cover.demande = val(r, b);
      else if (/^OBJET/.test(B)){ const v = []; for (let c = 3; c <= g.maxC; c++){ const t = g.txt(r, c); if (/^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(t) || typeof g.get(r,c) === "number") v.push(typeof g.get(r,c) === "number" ? xlDate(g.get(r,c)) : t); } D.cover.du = v[0] || ""; D.cover.au = v[1] || ""; }
      else if (/^PERSONNE/.test(B) || /^CONTR[ÔO]LEUR/.test(B)){
        mode = /^PERSONNE/.test(B) ? "p" : "c"; cols = null;
        for (let k = r + 1; k <= Math.min(r + 3, g.maxR); k++){ // ligne d'en-tête « Fonction » / « Nom »
          let cf = 0, cn = 0; for (let c = 1; c <= g.maxC; c++){ const t = one(g.txt(k, c)); if (/^fonction|^service/i.test(t)) cf = cf || c; else if (/^nom/i.test(t)) cn = cn || c; }
          if (cf || cn){ cols = { f:cf, n:cn }; r = k; break; }
        }
      }
      else if (mode){
        const f = cols && cols.f ? g.txt(r, cols.f) : b, n = cols && cols.n ? g.txt(r, cols.n) : (right(r, 6) || g.txt(r, 6));
        if (f || n) (mode === "p" ? D.personnes : D.controleurs).push({ fonction:one(f), nom:one(n) });
      }
    }
  }
  // ---- fiche signalétique (libellés en colonne A ou B, valeur dans la colonne suivante)
  const fName = findSheet(wb, /fiche/i);
  if (fName){
    const g = sheetGrid(wb.Sheets[fName]); let inFil = false, n1 = 0, n2 = 0;
    for (let r = 1; r <= g.maxR; r++){ if (g.txt(r, 1) && g.txt(r, 2)) n1++; if (g.txt(r, 2) && g.txt(r, 3)) n2++; }
    const L = n1 > n2 ? 1 : 2, V = L + 1;
    for (let r = 1; r <= g.maxR; r++){
      const b = g.txt(r, L), raw = g.get(r, V);
      let c = g.txt(r, V);
      if (typeof raw === "number" && raw > 20000 && raw < 80000 && /date/i.test(b)) c = xlDate(raw);
      if (/^Filiales et participations/i.test(b) && (L === 2 || !c)){ inFil = L === 2; continue; }
      if (inFil && L === 2){
        if (g.txt(r,2) && !/^Filiales/.test(g.txt(r,2))) inFil = false;
        else { if (c && !/^Raison sociale$/i.test(c)) D.filiales.push({ nom:c, pct:g.get(r,4), objet:g.txt(r,5) }); continue; }
      }
      inFil = false;
      if (b && c && !/^SANS OBJET/i.test(b)) D.fiche.push({ label:one(b), value:c });
    }
  }
  // ---- onglets de critères, contrôles par sondage, producteurs
  for (const name of wb.SheetNames){
    if (name === gName || name === fName) continue;
    const nm = name.trim(), g = sheetGrid(wb.Sheets[name]);
    if (/^CTRL/i.test(nm)){ // contrôles par sondage (format de la grille de base)
      const rows = [];
      for (let r = 4; r <= g.maxR; r++){ const v = [1,2,3,4,5,6].map(c => g.txt(r, c)); if (v.some(Boolean)) rows.push(v); }
      const head = [1,2,3,4,5,6].map(c => one(g.txt(3, c)));
      D.sondages.push({ titre: one(g.txt(1, 1)) || nm, head, rows });
      continue;
    }
    if (/sondage|ctrl/i.test(nm)){ D.sondages.push(parseTableau(nm, g)); continue; }
    if (/^4\.1/.test(nm)){
      for (let r = 8; r <= g.maxR; r++){ const a = g.txt(r,1); if (a && !/^Le cas|^Ex\./i.test(a)) D.capital.push({ adherent:a, activite:g.txt(r,2), membres:g.txt(r,3), parts:g.get(r,4), voix:g.get(r,5) }); }
      continue;
    }
    if (!/^\d|^producteur/i.test(nm)) continue;
    const og = parseOnglet(nm, g, D);
    if (og && (og.items.length || og.observations.length)) D.onglets.push(og);
  }
  return D;
}
function xlDate(n){ const d = new Date(Math.round((n - 25569) * 864e5)); return d.toLocaleDateString("fr-FR", { timeZone:"UTC" }); }

/* tableau libre (ex. contrôle par sondage des bulletins d'adhésion) : en-tête = 1re ligne d'au moins 3 cellules */
function parseTableau(name, g){
  let hr = 0; for (let r = 1; r <= Math.min(g.maxR, 8) && !hr; r++){ let k = 0; for (let c = 1; c <= g.maxC; c++) if (g.txt(r, c)) k++; if (k >= 3) hr = r; }
  const titre = one(g.txt(1, 1) || g.txt(1, 2)) || name;
  if (!hr) return { titre, head:[], rows:[] };
  let cols = []; for (let c = 1; c <= g.maxC; c++) if (g.txt(hr, c)) cols.push(c);
  const rows = [];
  for (let r = hr + 1; r <= g.maxR; r++){
    const v = cols.map(c => { const x = g.get(r, c), h = g.txt(hr, c); return typeof x === "number" && /date/i.test(h) && x > 20000 ? xlDate(x) : one(g.txt(r, c)); });
    if (v.some(Boolean)) rows.push(v);
  }
  // colonnes vides ou identiques sur toutes les lignes : retirées (valeur commune indiquée dans le titre)
  const keep = [], communs = [];
  cols.forEach((c, i) => { const s = new Set(rows.map(r => r[i])); if (!rows.some(r => r[i])) return; if (rows.length > 1 && s.size === 1){ communs.push(one(g.txt(hr, c)) + " : " + rows[0][i]); return; } keep.push(i); });
  return { titre, communs, head:keep.map(i => one(g.txt(hr, cols[i]))), rows:rows.map(r => keep.map(i => r[i])) };
}

function parseOnglet(name, g, D){
  const og = { sheet:name, code:(name.match(/^[\d.\-]+/) || [""])[0].replace(/[.\-]+$/,"").replace(/-/g, "."), titre:"", items:[], observations:[] };
  for (let r = 1; r <= 3 && !og.titre; r++) for (let c = 1; c <= 4; c++){ const t = clean(g.txt(r, c)).split("\n")[0].trim(); if (/^ONGLET/i.test(t)){ og.titre = t.replace(/\s+(voir fiche|Le point \d).*$/i,"").replace(/\s+\(.*$/,"").trim(); break; } }
  const prod = /^13\.|^producteur/i.test(name);
  if (prod){ const nom = g.txt(1,3); og.titre = "Contrôle en exploitation – " + (nom || name.replace(/^13\.\s*/, "")); D.producteurs.push({ nom, produits:/^13\./.test(name) ? g.txt(2,3) : (g.txt(2,4) || g.txt(2,3)), sheet:name }); }
  if (!og.titre) og.titre = name;
  const YES = ["OUI","C","01/01/N-1"], NO = ["NON","NC","01/01/N"];
  const readHdr = r => {
    const U = {}; for (let c = 1; c <= g.maxC; c++){ const t = g.txt(r, c); if (t) U[c] = one(t).toUpperCase(); }
    const uv = Object.values(U); if (!(uv.some(v => YES.includes(v)) && uv.some(v => NO.includes(v)))) return null;
    const h = { crit:2 };
    for (const [c, v] of Object.entries(U)){
      if (/^CRIT|^LES MEMBRES|^ELEMENTS/.test(v)) h.crit = +c; else if (/^AVEC QUOI/.test(v)) h.avec = +c; else if (/^DESCRIPTION/.test(v)) h.desc = +c;
      else if (YES.includes(v)){ h.yes = +c; h.mode = { "OUI":"yn", "C":"cnc", "01/01/N-1":"num" }[v]; }
      else if (NO.includes(v)) h.no = +c; else if (/^SANS OBJET/.test(v)) h.so = +c; else if (/^OBSERVATION|^SI N/.test(v)) h.obs = +c;
    }
    return h;
  };
  let firstHdr = null, firstR = 0;
  for (let r = 1; r <= g.maxR && !firstHdr; r++){ const h = readHdr(r); if (h){ firstHdr = h; firstR = r; } }
  let hdr = null, section = "", obsNext = false;
  for (let r = 1; r <= g.maxR; r++){
    const h = readHdr(r); if (h){ hdr = h; continue; }
    // tableau des rendements (onglet 7)
    if (one(g.txt(r, 2)) === "Produits" && /Rendement AGRESTE/i.test(g.txt(r, 5))){
      for (let k = r + 1; k <= g.maxR && g.txt(k, 2); k++){
        const a = +g.get(k, 5), o = +g.get(k, 6);
        D.rendements.push({ produit:g.txt(k,2), annee:g.txt(k,3), dept:g.txt(k,4), agreste:a, op:o, variation: a ? (o - a) / a : null, justif:g.txt(k,8) });
      }
      while (r + 1 <= g.maxR && g.txt(r + 1, 2) && (g.get(r + 1, 5) != null || g.get(r + 1, 6) != null || /^=/.test(String(g.get(r + 1, 7) || "")) || g.txt(r + 1, 7))) r++;
      continue;
    }
    // stades de mise en marché (onglet 12)
    if (/^(Vrac|Brut de cueille|Conditionné|Destiné à la transformation|Transformé|Autres)$/.test(g.txt(r, 3)) && (g.txt(r,4) || g.get(r,5))){
      D.stades.push({ stade:g.txt(r,3), produits:g.txt(r,4), pct:+g.get(r,5) || 0 }); continue;
    }
    // ligne cochée située avant l'en-tête (ex. « Description des produits… » des feuilles Producteur)
    const H = hdr || (prod && firstHdr && r < firstR && [firstHdr.yes, firstHdr.no, firstHdr.so].some(c => c && g.txt(r, c)) ? firstHdr : null);
    if (!H) continue;
    const crit = g.txt(r, H.crit), low = one(crit).toLowerCase();
    const num = one(g.txt(r, 1) || (H.crit > 2 ? g.txt(r, H.crit - 1) : ""));
    if (obsNext){ const m = g.mergeAt(r, H.crit);
      if (!crit || (m && m.c2 >= (H.obs || 7) - 1)){ const t = m ? g.txt(r, H.crit) : ""; if (t) og.observations.push(t); obsNext = false; continue; }
      obsNext = false; }
    if (!crit) continue;
    if (/observations complémentaires|^observations du contr/.test(low)){ obsNext = true; continue; }
    const item = { num, critere:crit, section, type:"text", avec:"", desc:"", res:null, obs:"", v1:null, v2:null, texte:"" };
    if (/^nom du prestataire/.test(low)){
      const v = one(crit).split(":").slice(1).join(":").split(/fonction\s*:/i)[0].replace(/[.…]+/g,"").trim(); if (v) D.conventions.push({ sheet:name, nom:v });
    }
    if (/^(i|ii|iii|iv|v|vi)\s*[-–.]/.test(low) || /^(secteur |op sans|op avec|a- |b- |a\) |b\) |c\) |achats extérieurs|respect de l.apport|cas des op)/.test(low)){ section = one(crit); continue; }
    if (/^(point de vigilance|précision|observation :|→|è|etablir la vpc|contrôle du respect des dispositions|remarque|>|r[ée]f[ée]rences? r[ée]glementaire|\(\*\))/.test(low)) continue;
    const right = g.mergeAt(r, H.crit + 1) || g.mergeAt(r, H.crit + 2);
    if (right && right.c2 >= (H.obs || 7) - 1){ item.texte = g.txt(r, right.c1); if (item.texte || num) og.items.push(item); else if (one(crit).length <= 110) section = one(crit); continue; }
    item.type = H.mode;
    if (H.avec) item.avec = g.txt(r, H.avec);
    if (H.desc) item.desc = g.txt(r, H.desc);
    if (H.obs) item.obs = g.txt(r, H.obs);
    if (H.mode === "num"){ item.v1 = g.get(r, H.yes); item.v2 = g.get(r, H.no); }
    else {
      const y = g.txt(r, H.yes), n = g.txt(r, H.no), so = H.so ? g.txt(r, H.so) : "";
      if (n) item.res = H.mode === "cnc" ? "NC" : "NON"; else if (y) item.res = H.mode === "cnc" ? "C" : "OUI"; else if (so) item.res = "SO";
      else if (/^sans objet\b/i.test(one(item.avec || item.desc))) item.res = "SO";
    }
    // ligne sans numéro ni aucune réponse : intitulé de section (court) ou consigne (long)
    if (!num && !item.res && !item.avec && !item.desc && !item.obs && item.v1 == null && item.v2 == null && !/^si\s|\?\s*$|^nom du prestataire/i.test(one(crit))){
      if (one(crit).length <= 110 && one(crit).length > 3) section = one(crit);
      continue;
    }
    item.section = section;
    og.items.push(item);
  }
  return og;
}

/* ---- indicateurs */
function isAnomalie(it){ return it.res === "NC" || (it.res === "NON" && !!it.obs); }
function isAExaminer(it){ return (it.res === "NON" && !it.obs) || it.res === "NCL"; }
function kind(it){ return isAnomalie(it) ? "ko" : isAExaminer(it) ? "av" : it.res === "SO" ? "so" : it.res ? "ok" : (it.texte || it.desc || it.avec || it.v1 != null || it.v2 != null) ? "txt" : "nr"; }
/* identification : toute la fiche signalétique, libellés raccourcis */
function shortLabel(l){ return one(l).replace(/\s*\([^)]*\)?/g, " ").replace(/\s+-\s*Exemples?\b.*$/i, "").replace(/,\s*et,.*$/i, "").replace(/\s*:\s*$/, "").replace(/\s+/g, " ").trim().slice(0, 90); }
function identRows(D){
  const base = [["Raison sociale", D.cover.rs], ["N° de reconnaissance", D.cover.reco], ["Filière", D.cover.secteur]].filter(x => x[1]);
  const vu = new Set([D.cover.rs, D.cover.reco].filter(Boolean).map(v => one(v)));
  const fiche = D.fiche.filter(f => !/^[-–—\s.]*$/.test(f.value) && !vu.has(one(f.value))).map(f => [shortLabel(f.label), f.value]);
  return [...base, ...fiche];
}
function isAnswered(it){ return !!(it.res || it.texte || it.desc || it.avec || it.v1 != null || it.v2 != null); }
function stats(D){
  const s = { points:0, repondus:0, anomalies:0, parOnglet:[] };
  for (const og of D.onglets){
    const pts = og.items.filter(i => i.type !== "text" || i.texte);
    const rep = og.items.filter(isAnswered), an = og.items.filter(isAnomalie);
    if (!og.items.length && !og.observations.length) continue;
    s.points += og.items.length; s.repondus += rep.length; s.anomalies += an.length;
    s.parOnglet.push({ og, points:og.items.length, repondus:rep.length, anomalies:an.length });
    void pts;
  }
  s.conformes = s.repondus - s.anomalies; s.nonRenseignes = s.points - s.repondus;
  const all = D.onglets.flatMap(o => o.items);
  s.sansObjet = all.filter(i => i.res === "SO").length; s.aExaminer = all.filter(isAExaminer).length;
  return s;
}

/* ---- données du schéma fonctionnel */
function schemaData(D){
  const f = l => (D.fiche.find(x => new RegExp(l, "i").test(x.label)) || {}).value || "";
  const nbAdh = (f("Nombre d'adhérents").match(/\d[\d\s]*/) || [""])[0].trim();
  const etp = {};
  const o2 = D.onglets.find(o => o.code === "2");
  if (o2) for (const it of o2.items){
    const l = one(it.critere).toLowerCase();
    if (/secteur administratif/.test(l)) etp.adm = it.texte; else if (/secteur technique/.test(l)) etp.tech = it.texte; else if (/secteur commercial/.test(l)) etp.com = it.texte;
    else if (/nombre de saisonniers/.test(l)) etp.saison = it.texte; else if (/préciser par qui/.test(l)) etp.mad = it.texte;
  }
  const fonctions = [["9","Appui technique"],["10","Tri, stockage, conditionnement"],["11","Agréage"],["12","Mise en marché"]].map(([code, label]) => {
    const og = D.onglets.find(o => o.code === code); const who = new Set();
    if (og) for (const it of og.items){ if (it.res !== "OUI") continue; const l = one(it.critere).toLowerCase();
      if (/personnel qualifié|propre service commercial|assuré par l'op \?/.test(l)) who.add("OP"); if (/\baop\b/.test(l)) who.add("AOP");
      if (/filiale/.test(l)) who.add("Filiale"); if (/adhérents de l'op|via ses membres/.test(l)) who.add("Adhérents"); if (/prestataire/.test(l)) who.add("Prestataire"); }
    const presta = D.conventions.filter(c => c.sheet.startsWith(code + ".")).map(c => c.nom);
    presta.forEach(() => who.add("Prestataire"));
    return { label, who:[...who], presta };
  }).filter(x => x.who.length);
  const aop = f("Raison\\(s\\) sociale\\(s\\) AOP");
  return {
    op: D.cover.rs || f("Raison sociale"), filiere: D.cover.secteur || f("Secteur concerné"), statut: f("Statut juridique"),
    adherents: nbAdh, etp, filiales: D.filiales, aop: /sans objet/i.test(aop) ? "" : aop,
    stades: D.stades.filter(s => s.pct || s.produits), fonctions,
    producteurs: D.producteurs.filter(p => p.nom).map(p => p.nom)
  };
}

const C = { bf:"#000091", bfSoft:"#E3E3FD", bfMid:"#6A6AF4", rouge:"#E1000F", gris:"#3A3A3A", grisClair:"#F6F6F6", vert:"#18753C", vertSoft:"#B8FEC9", ocre:"#B34000", ocreSoft:"#FEECC2", trait:"#929292" };
const wrap = (s, n) => { const out = []; let line = ""; for (const w of String(s).split(/\s+/)){ if ((line + " " + w).trim().length > n){ if (line) out.push(line); line = w; } else line = (line + " " + w).trim(); } if (line) out.push(line); return out; };
function tspan(x, y, lines, lh, attrs = ""){ return `<text x="${x}" y="${y}" ${attrs}>${lines.map((l, i) => `<tspan x="${x}" dy="${i ? lh : 0}">${esc(l)}</tspan>`).join("")}</text>`; }
function box(x, y, w, h, fill, stroke, title, lines, opts = {}){
  const tc = opts.tc || C.gris, tt = opts.ttc || stroke;
  let s = `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="${fill}" stroke="${stroke}" stroke-width="${opts.sw || 1.5}"/>`;
  if (opts.band) s += `<rect x="${x}" y="${y}" width="5" height="${h}" fill="${stroke}"/>`;
  s += tspan(x + 14, y + 22, wrap(title, opts.wt || 26), 16, `font-size="${opts.fs || 14}" font-weight="700" fill="${tt}"`);
  const tl = wrap(title, opts.wt || 26).length;
  if (lines && lines.length) s += tspan(x + 14, y + 24 + tl * 16, lines.flatMap(l => wrap(l, opts.wl || 34)), 14, `font-size="11.5" fill="${tc}"`);
  return s;
}
const arrow = (x1, y1, x2, y2, dash) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${C.trait}" stroke-width="1.6" ${dash ? 'stroke-dasharray="5 4"' : ""} marker-end="url(#ar)"/>`;
const defs = `<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${C.trait}"/></marker></defs>`;
function opLines(S){ const l = []; if (S.statut) l.push(S.statut); if (S.filiere) l.push("Filière : " + S.filiere);
  const e = [S.etp.adm && "adm. " + S.etp.adm, S.etp.tech && "tech. " + S.etp.tech, S.etp.com && "com. " + S.etp.com].filter(Boolean);
  if (e.length) l.push("Salariés : " + e.join(" · ")); return l; }
function pct(v){ return v == null || v === "" || isNaN(v) ? "" : (v <= 1 ? Math.round(v * 100) : Math.round(v)) + " %"; }
function svgWrap(w, h, inner, fontCss){ return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" font-family="Marianne, Arial, sans-serif">${fontCss ? `<style>${fontCss}</style>` : ""}${defs}<rect width="${w}" height="${h}" fill="#fff"/>${inner}</svg>`; }

/* police Marianne intégrée aux SVG (pour les images du Word) */
let fontCssCache = null;
async function marianneCss(){
  if (fontCssCache !== null) return fontCssCache;
  try {
    const b64 = async w => { const buf = await (await fetch(FONT_URL(w))).arrayBuffer(); let s = ""; const u = new Uint8Array(buf); for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
    const [r, b] = await Promise.all([b64("Regular"), b64("Bold")]);
    fontCssCache = `@font-face{font-family:Marianne;font-weight:400;src:url(data:font/woff2;base64,${r}) format("woff2")}@font-face{font-family:Marianne;font-weight:700;src:url(data:font/woff2;base64,${b}) format("woff2")}`;
  } catch(e){ fontCssCache = ""; }
  return fontCssCache;
}
async function svgToPng(svg, scale = 2){
  const m = svg.match(/viewBox="0 0 (\d+) (\d+)"/); const w = +m[1], h = +m[2];
  const img = new Image(); const url = URL.createObjectURL(new Blob([svg], { type:"image/svg+xml" }));
  await new Promise((ok, ko) => { img.onload = ok; img.onerror = ko; img.src = url; });
  await new Promise(r => setTimeout(r, 60));
  const cv = document.createElement("canvas"); cv.width = w * scale; cv.height = h * scale;
  const ctx = cv.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height); ctx.drawImage(img, 0, 0, cv.width, cv.height);
  URL.revokeObjectURL(url);
  const blob = await new Promise(r => cv.toBlob(r, "image/png"));
  return { data:new Uint8Array(await blob.arrayBuffer()), w, h };
}

  if (it.texte || it.desc || it.avec) return "Renseigné";

}

}
function detailHtml(D){
  return D.onglets.filter(o => o.items.length).map(og => {

    new TableCell({ borders:noB(d), children:[P([T(D.cover.service || "Service territorial", { bold:true })], { align:AlignmentType.RIGHT, after:0 }), P([T("Contrôle de reconnaissance des organisations de producteurs", { color:"666666", size:16 })], { align:AlignmentType.RIGHT })] }) ] })] }));
  children.push(P("", { after:300 }));
  children.push(P([T("RAPPORT DE CONTRÔLE DE RECONNAISSANCE", { bold:true, color:BF, size:18 })], { after:60, border:{ left:{ style:BorderStyle.SINGLE, size:36, color:BF, space:10 } } }));
  children.push(P([T(D.cover.rs || "Organisation de producteurs", { bold:true, size:44 })], { after:100, border:{ left:{ style:BorderStyle.SINGLE, size:36, color:BF, space:10 } } }));
  children.push(P([T(["Filière " + (D.cover.secteur || "–"), D.cover.reco && "N° " + D.cover.reco, D.cover.du && "Contrôle du " + D.cover.du + (D.cover.au ? " au " + D.cover.au : ""), D.cover.demande && "Demande " + D.cover.demande].filter(Boolean).join("   ·   "), { color:BF, size:17, bold:true })], { after:200, border:{ left:{ style:BorderStyle.SINGLE, size:36, color:BF, space:10 } } }));

  children.push(H2b("Synthèse"));
  children.push(table(null, [[
    { t:`${S.points}\npoints contrôlés`, fill:"F6F6F6", big:true }, { t:`${S.conformes}\nsans anomalie`, fill:"F6F6F6", big:true, color:"18753C" },
    { t:`${S.anomalies}\nanomalie(s) relevée(s)`, fill:"F6F6F6", big:true, color:"CE0500" }, { t:`${S.nonRenseignes}\nnon renseigné(s)`, fill:"F6F6F6", big:true, color:"666666" } ]], [25, 25, 25, 25]));
  children.push(P([T(S.anomalies ? `Le contrôle a porté sur ${S.points} points répartis sur ${S.parOnglet.length} thèmes. ${S.anomalies} anomalie(s) ont été relevée(s) ; elles sont détaillées dans la partie « Anomalies relevées » et appellent des actions correctives de la part de l'OP, dont la mise en œuvre sera vérifiée.` : `Le contrôle a porté sur ${S.points} points répartis sur ${S.parOnglet.length} thèmes. Aucune anomalie n'a été relevée.`)],
    { before:120, shading:{ type:ShadingType.CLEAR, fill:S.anomalies ? "FFE9E9" : "B8FEC9", color:"auto" }, border:{ left:{ style:BorderStyle.SINGLE, size:30, color:S.anomalies ? "CE0500" : "18753C", space:8 } } }));
  children.push(P([T("Une anomalie correspond à une réponse « Non » ou « Non conforme » assortie d'une précision du contrôleur." + (S.aExaminer ? ` ${S.aExaminer} autre(s) réponse(s) « Non » sans précision ou non conclusive(s) sont reprises dans « Réponses à examiner ».` : "") + (S.sansObjet ? ` ${S.sansObjet} point(s) sans objet.` : ""), { size:15, color:"666666", italics:true })]));

  children.push(H2b("Identification de l'organisation de producteurs"));
  children.push(kv(ident));
  if (D.filiales.length){ children.push(H3("Filiales et participations")); children.push(table(["Raison sociale", "Participation", "Objet"], D.filiales.map(f => [f.nom, pct(f.pct), f.objet]), [45, 15, 40])); }

  children.push(H2b("Déroulement du contrôle"));
  children.push(kv([["Période", D.cover.du ? "Du " + D.cover.du + (D.cover.au ? " au " + D.cover.au : "") : "–"], ["Service", D.cover.service || "–"]]));
  children.push(H3("Personnes rencontrées")); children.push(table(["Fonction", "Nom"], D.personnes.map(p => [p.fonction, p.nom]), [50, 50]));
  children.push(H3("Contrôleur(s)")); children.push(table(["Service", "Nom"], D.controleurs.map(p => [p.fonction, p.nom]), [60, 40]));

  if (opts.schemaPng){
    children.push(H2b("Schéma fonctionnel de l'OP"));
    const wpx = 620, hpx = Math.round(wpx * opts.schemaPng.h / opts.schemaPng.w);
    children.push(new Paragraph({ children:[new ImageRun({ type:"png", data:opts.schemaPng.data, transformation:{ width:wpx, height:hpx } })], alignment:AlignmentType.CENTER, spacing:{ after:60 } }));
    children.push(P([T("Schéma établi à partir des éléments relevés lors du contrôle.", { size:15, color:"666666", italics:true })]));
  }

  children.push(H2b("Résultats par thème"));
  children.push(table(["Thème contrôlé", "Points", "Oui / C", "Non", "Sans objet", "Anomalies", "Taux sans anomalie"], S.parOnglet.map(p => { const t = p.repondus ? Math.round((p.repondus - p.anomalies) / p.repondus * 100) + " %" : "–", c = k => p.og.items.filter(i => kind(i) === k).length;
    return [ogTitre(p.og), String(p.points), String(c("ok")), String(c("av") + c("ko")), String(c("so")), { t:String(p.anomalies), color:p.anomalies ? "CE0500" : undefined, bold:!!p.anomalies }, t]; }), [40, 9, 9, 8, 10, 11, 13]));

  children.push(H2b("Anomalies relevées"));
  if (!anomalies.length) children.push(P("Aucune anomalie relevée."));
  anomalies.forEach(({ og, it }) => children.push(...point(it, og)));
  if (aex.length){
    children.push(H2b("Réponses à examiner"));
    children.push(P([T("Réponses « Non » sans précision dans la colonne « Si N ou NC… », et réponses « Non conclusif ». Selon la question, un « Non » peut être normal ou révéler un manquement : à apprécier par le contrôleur.", { size:15, color:"666666", italics:true })]));
    aex.forEach(({ og, it }) => children.push(...point(it, og)));
  }

  const comp = D.rendements.length || D.sondages.some(s => s.rows.length) || D.stades.length;
  if (comp) children.push(H2b("Contrôles complémentaires"));
  if (D.rendements.length){ children.push(H3("Rendements déclarés et références AGRESTE"));
    children.push(table(["Produit", "Année", "Département", "AGRESTE", "OP", "Écart", "Justification"], D.rendements.map(r => [r.produit, r.annee, r.dept, fmtN(r.agreste), fmtN(r.op),
      { t:r.variation == null ? "–" : (r.variation > 0 ? "+" : "") + Math.round(r.variation * 100) + " %", color:Math.abs(r.variation || 0) > .2 ? "CE0500" : undefined, bold:Math.abs(r.variation || 0) > .2 }, r.justif]), [14, 8, 16, 10, 8, 9, 35])); }
  for (const s of D.sondages.filter(s => s.rows.length)){ children.push(H3(s.titre)); if (s.communs && s.communs.length) children.push(P([T(`${s.rows.length} dossiers contrôlés · pour tous : ${s.communs.join(" · ")}`, { size:15, color:"666666" })])); children.push(table(s.head, s.rows.map(r => r.map((v, i) => i === 5 && /^NC$/i.test(v) ? { t:v, color:"CE0500", bold:true } : v)))); }
  if (D.stades.length){ children.push(H3("Mise en marché par stade")); children.push(table(["Stade du produit", "Produits", "Part du CA"], D.stades.map(s => [s.stade, s.produits, pct(s.pct)]), [30, 55, 15])); }

  if (D.onglets.some(o => o.observations.length)){
    children.push(H2b("Observations complémentaires du contrôleur"));
    D.onglets.filter(o => o.observations.length).forEach(o => children.push(P([T(ogTitre(o) + " : ", { bold:true }), T(o.observations.join(" "))])));
  }
  if (opts.annexe){
    children.push(H2b("Constats détaillés par thème"));
    children.push(P([T("Reprise intégrale de la grille : pour chaque point, les éléments utilisés pour le contrôle, la description du contrôle effectué, la réponse et les précisions du contrôleur.", { size:15, color:"666666", italics:true })]));
    for (const og of D.onglets.filter(o => o.items.length)){
      children.push(P([T(ogTitre(og), { bold:true, color:BF, size:22 })], { before:280, after:60, keepNext:true }));
      let sec = null;
      for (const it of og.items){
        if (it.section && it.section !== sec){ sec = it.section; children.push(P([T(sec.toUpperCase(), { bold:true, size:15, color:"3A3A3A" })], { before:160, after:40, keepNext:true })); }
        children.push(...point(it));
      }
      if (og.observations.length) children.push(P([T("Observations complémentaires : ", { bold:true, size:17 }), T(og.observations.join(" "), { size:17 })], { before:120 }));
    }
  }
  children.push(P([T(`Fait à ${opts.lieu || "……………"}, le ${opts.date || new Date().toLocaleDateString("fr-FR")}`)], { before:400, after:600 }));
  D.controleurs.forEach(c => { children.push(P([T(c.nom, { bold:true })], { after:0 })); children.push(P([T(c.fonction, { size:16, color:"666666" })], { after:300 })); });

  const doc = new Document({
    creator:"Grist – rapport de contrôle", title:"Rapport de contrôle – " + (D.cover.rs || ""),
    styles:{ default:{ document:{ run:{ font:F, size:19 } } } },
    sections:[{ properties:{ page:{ margin:{ top:900, bottom:900, left:900, right:900 } } },
      footers:{ default:new Footer({ children:[new Paragraph({ alignment:AlignmentType.RIGHT, children:[T("Rapport de contrôle de reconnaissance – " + (D.cover.rs || "") + "   ·   Page ", { size:15, color:"666666" }), new TextRun({ children:[PageNumber.CURRENT], font:F, size:15, color:"666666" }), T(" / ", { size:15, color:"666666" }), new TextRun({ children:[PageNumber.TOTAL_PAGES], font:F, size:15, color:"666666" })] })] }) },
      children }]
  });
  void Header; void HeadingLevel;
  return Packer.toBlob(doc);
}
function noB(d){ const n = { style:d.BorderStyle.NONE, size:0, color:"FFFFFF" }; return { top:n, bottom:n, left:n, right:n }; }

/* =====================================================================
   5. INTERFACE
   ===================================================================== */
function renderSchemaChoices(){
  const S = state.data ? schemaData(state.data) : null;
  const opts = [["none", "Sans schéma"], ...Object.entries(SCHEMAS).map(([k, v]) => [k, v.label])];
  $("schemas").innerHTML = opts.map(([k, label]) => `<div class="opt ${state.schema === k ? "sel" : ""}" data-k="${k}" role="radio" aria-checked="${state.schema === k}" tabindex="0"><div class="th">${k === "none" ? '<span class="none">Le rapport ne contiendra pas de schéma</span>' : S ? SCHEMAS[k].fn(S, "").replace(/width="\d+" height="\d+"/, "") : '<span class="none">Chargez un fichier</span>'}</div>${label}</div>`).join("");
  for (const el of $("schemas").querySelectorAll(".opt")){
    const pick = () => { state.schema = el.dataset.k; renderSchemaChoices(); if (!$("preview").classList.contains("hidden")) preview(); };
    el.onclick = pick; el.onkeydown = e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); pick(); } };
  }
}
function currentOpts(print){
  const S = state.data ? schemaData(state.data) : null;
  return { lieu:$("lieu").value.trim(), date:$("date").value.trim(), annexe:$("annexe").checked, print,
    schemaSvg: state.schema !== "none" && S ? SCHEMAS[state.schema].fn(S, "") : "" };
}
function msg(kind, t){ $("out").innerHTML = `<div class="msg ${kind}">${t}</div>`; }
function preview(){ const f = $("preview"); f.classList.remove("hidden"); f.srcdoc = reportHtml(state.data, currentOpts(false)); }
function baseName(){ return ("Rapport de controle - " + (state.data.cover.rs || "OP") + " - " + (state.data.cover.secteur || "")).normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[\\/:*?"<>|]/g, "-").replace(/\s+/g, " ").trim(); }
function download(blob, name){ const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 10000); }

async function loadFile(f){
  try {
    const wb = XLSX.read(await f.arrayBuffer(), { type:"array", cellDates:false });
    state.data = parseControl(wb); state.fileName = f.name;
    const S = stats(state.data);
    $("summary").innerHTML = `<div class="info"><div class="kpi"><b>${esc(state.data.cover.rs || "OP ?")}</b><span>${esc(state.data.cover.secteur || "")} · ${esc(f.name)}</span></div>
      <div class="kpi"><b>${S.points}</b><span>points contrôlés</span></div><div class="kpi err"><b>${S.anomalies}</b><span>anomalies relevées</span></div><div class="kpi"><b>${S.parOnglet.length}</b><span>thèmes</span></div></div>`;
    if (!$("lieu").value && state.data.cover.service) $("lieu").placeholder = "Ville";
    ["bPdf", "bDocx", "bPrev"].forEach(id => $(id).disabled = false);
    renderSchemaChoices(); $("out").innerHTML = "";
    if (!$("preview").classList.contains("hidden")) preview();
  } catch(e){ console.error(e); msg("err", "Fichier illisible : " + esc(e.message)); }
}

$("date").value = new Date().toLocaleDateString("fr-FR");
$("file").addEventListener("change", e => e.target.files[0] && loadFile(e.target.files[0]));
const drop = $("drop");
["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => e.dataTransfer.files[0] && loadFile(e.dataTransfer.files[0]));
$("bPrev").onclick = preview;
$("annexe").onchange = () => { if (!$("preview").classList.contains("hidden")) preview(); };
$("bPdf").onclick = () => {
  const html = reportHtml(state.data, currentOpts(true));
  const w = window.open("", "_blank");
  if (w){ w.document.open(); w.document.write(html); w.document.close(); msg("ok", "Le rapport s'ouvre dans un nouvel onglet : choisissez « Enregistrer au format PDF » dans la fenêtre d'impression."); }
  else { download(new Blob([html], { type:"text/html" }), baseName() + ".html"); msg("ok", "Fenêtre bloquée : le rapport a été téléchargé en HTML. Ouvrez-le puis imprimez-le en PDF (Ctrl+P)."); }
};
$("bDocx").onclick = async () => {
  $("bDocx").disabled = true; msg("ok", "Génération du document Word…");
  try {
    const S = schemaData(state.data); let png = null;
    if (state.schema !== "none") png = await svgToPng(SCHEMAS[state.schema].fn(S, await marianneCss()));
    const blob = await buildDocx(state.data, { ...currentOpts(false), schemaPng:png });
    download(blob, baseName() + ".docx"); msg("ok", "Rapport Word téléchargé.");
  } catch(e){ console.error(e); msg("err", "Erreur : " + esc(e.message)); }
  $("bDocx").disabled = false;
};
renderSchemaChoices();
try { grist.ready({ requiredAccess:"none" }); } catch(e){}
</script>
</body>
</html>
