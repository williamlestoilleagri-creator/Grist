<!DOCTYPE html>
<html lang="fr" data-fr-scheme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Import demandes RDV</title>

<!-- Système de Design de l'État (DSFR) : composants, police Marianne, icônes -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.15.3/dist/dsfr.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.15.3/dist/utility/icons/icons.min.css">
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
  body{ background:var(--background-default-grey, #fff); min-height:100vh; }

  /* ---------- en-tête (inspiré du fr-header) ---------- */
  .rdv-header{
    display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap;
    padding:1rem 1.5rem; background:var(--background-default-grey, #fff);
    box-shadow:0 8px 8px -8px rgba(0,0,0,.1), 0 1px 0 0 var(--border-default-grey, #ddd);
    position:relative; z-index:1;
  }
  .rdv-header__title{ margin:0; }
  .rdv-header__sub{ margin:0; color:var(--text-mention-grey, #666); }

  main{ padding:1.5rem; }

  /* ---------- zone de dépôt ---------- */
  .rdv-drop{
    display:flex; flex-direction:column; align-items:center; gap:.25rem; text-align:center;
    padding:2rem 1rem; cursor:pointer;
    border:1px dashed var(--border-action-high-blue-france, #000091);
    background:var(--background-alt-blue-france, #f5f5fe);
    transition:background-color .15s;
  }
  .rdv-drop:hover, .rdv-drop.over{ background:var(--background-action-low-blue-france, #e3e3fd); }
  .rdv-drop.over{ border-style:solid; border-width:2px; }
  .rdv-drop__icon{ color:var(--text-action-high-blue-france, #000091); }
  .rdv-drop__icon::before{ --icon-size:2.5rem; }
  .rdv-drop__title{ font-weight:700; font-size:1.125rem; color:var(--text-title-grey, #161616); }
  .rdv-drop input{ position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }
  .rdv-drop:focus-within{ outline:2px solid #0a76f6; outline-offset:2px; }

  /* ---------- barre d'actions ---------- */
  .rdv-toolbar{ display:flex; align-items:flex-end; justify-content:space-between; gap:1rem; flex-wrap:wrap; margin:1.5rem 0 1rem; }
  .rdv-toolbar .fr-segmented{ margin:0; }
  .rdv-actions{ display:flex; gap:.75rem; flex-wrap:wrap; }

  /* ---------- liste des formulaires ---------- */
  .rdv-list{ border-top:1px solid var(--border-default-grey, #ddd); }
  .rdv-item{
    display:grid; grid-template-columns:8.5rem 1fr auto; gap:.5rem 1rem; align-items:start;
    padding:1rem 0; border-bottom:1px solid var(--border-default-grey, #ddd);
  }
  .rdv-item__who{ font-weight:700; margin:0; color:var(--text-title-grey, #161616); }
  .rdv-item__org, .rdv-item__file{ margin:0; color:var(--text-mention-grey, #666); }
  .rdv-item__file{ font-size:.75rem; overflow-wrap:anywhere; }
  .rdv-item .fr-tags-group{ margin:.5rem 0 -.5rem; }
  .rdv-item .fr-tag.rdv-tag--dup{ text-decoration:line-through; opacity:.6; }
  .rdv-item .fr-message{ margin-top:.25rem; }
  .rdv-empty{ padding:2rem 0; text-align:center; color:var(--text-mention-grey, #666); margin:0; }

  /* ---------- notification ---------- */
  .rdv-toast{
    position:fixed; left:50%; bottom:1.5rem; transform:translate(-50%, 6rem);
    background:var(--background-inverted-grey, #161616); color:var(--text-inverted-grey, #fff);
    padding:.75rem 1.25rem; font-size:.875rem; max-width:90vw; z-index:10;
    box-shadow:0 6px 18px rgba(0,0,18,.16); transition:transform .25s;
  }
  .rdv-toast.show{ transform:translate(-50%, 0); }

  @media (max-width:36em){ main{ padding:1rem; } .rdv-header{ padding:1rem; } }
</style>
</head>
<body>
<header class="rdv-header">
  <div>
    <h1 class="fr-h5 rdv-header__title">Import des demandes de rendez-vous</h1>
    <p class="fr-text--sm rdv-header__sub">Déposez les formulaires PDF remplis pour alimenter la table</p>
  </div>
  <p class="fr-badge fr-badge--info fr-badge--no-icon fr-mb-0" id="status">Connexion…</p>
</header>

<main>
  <div class="fr-alert fr-alert--warning fr-alert--sm fr-mb-3w" id="mapping-warn">
    <p>Associez les colonnes <strong>Nom</strong>, <strong>Prénom</strong>, <strong>Structure</strong> et
       <strong>Date de prise de rendez-vous</strong> dans le panneau de droite de Grist.</p>
  </div>

  <label class="rdv-drop" id="drop">
    <span class="fr-icon-upload-2-line rdv-drop__icon" aria-hidden="true"></span>
    <span class="rdv-drop__title">Glissez les PDF remplis ici</span>
    <span class="fr-hint-text fr-mt-0">Un seul ou des centaines à la fois — ou cliquez pour parcourir. Format accepté : PDF.</span>
    <input type="file" id="file-input" accept=".pdf,application/pdf" multiple>
  </label>

  <div class="rdv-toolbar">
    <fieldset class="fr-segmented fr-segmented--sm" id="mode">
      <legend class="fr-segmented__legend">Écriture dans Grist</legend>
      <div class="fr-segmented__elements">
        <div class="fr-segmented__element">
          <input value="row" type="radio" id="mode-row" name="mode">
          <label class="fr-label" for="mode-row">1 ligne par créneau</label>
        </div>
        <div class="fr-segmented__element">
          <input value="cell" type="radio" id="mode-cell" name="mode">
          <label class="fr-label" for="mode-cell">1 ligne par personne</label>
        </div>
      </div>
    </fieldset>
    <div class="rdv-actions">
      <button type="button" class="fr-btn fr-btn--secondary fr-btn--icon-left fr-icon-delete-line" id="clear">Vider la liste</button>
      <button type="button" class="fr-btn fr-btn--icon-left fr-icon-download-line" id="import" disabled>Importer dans Grist</button>
    </div>
  </div>

  <ul class="fr-badges-group fr-mb-1w" id="summary"></ul>
  <div class="rdv-list" id="files"></div>
</main>
<div class="rdv-toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  var COLS = {
    nom: 'Nom',
    prenom: 'Prenom',
    structure: 'Structure',
    date: 'Date_RDV'
  };
  var CHUNK = 400;

  var state = {
    colMap: null,
    existing: new Set(),   // clés déjà présentes dans la table
    items: [],             // un item par fichier
    mode: 'row'
  };

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function norm(s) { return String(s == null ? '' : s).trim(); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('show'); }, 3200);
  }

  // ---------- Format "04/01/2027 : 13h00" ----------
  function normDate(v) {
    v = norm(v);
    var m = v.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2}|\d{4})$/);
    if (m) {
      var y = m[3].length === 2 ? '20' + m[3] : m[3];
      return pad(+m[1]) + '/' + pad(+m[2]) + '/' + y;
    }
    m = v.match(/^(\d{4})-(\d{2})-(\d{2})/);
    return m ? m[3] + '/' + m[2] + '/' + m[1] : null;
  }
  function normHeure(v) {
    var m = norm(v).match(/^(\d{1,2})\s*(?:[:hH.]\s*(\d{2})?)?$/);
    if (!m || +m[1] > 23) return null;
    return pad(+m[1]) + 'h' + (m[2] || '00');
  }
  function sortKey(lbl) { // "dd/mm/yyyy : HHhMM" -> "yyyymmddHHMM"
    return lbl.slice(6, 10) + lbl.slice(3, 5) + lbl.slice(0, 2) + lbl.slice(13, 15) + lbl.slice(16, 18);
  }

  function keyOf(nom, prenom, structure, date) {
    return [nom, prenom, structure, date].map(function (s) { return norm(s).toLowerCase(); }).join('\u0001');
  }

  // ---------- Lecture des PDF remplis ----------
  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }

  async function pdfFields(file) {
    var buf = await file.arrayBuffer();
    var doc = await pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
    try {
      var objs = (await doc.getFieldObjects()) || {};
      var vals = {};
      Object.keys(objs).forEach(function (name) {
        var v = (objs[name] || []).map(function (o) { return o.value; })
          .filter(function (x) { return x != null && norm(x) !== '' && x !== 'Off'; })[0];
        vals[name] = norm(Array.isArray(v) ? v[0] : v);
      });
      return vals;
    } finally {
      doc.destroy();
    }
  }

  async function readFile(file) {
    var f;
    try { f = await pdfFields(file); }
    catch (e) { console.error(e); return { file: file.name, error: 'PDF illisible' }; }

    if (!('nom' in f) && !('date_01' in f)) return { file: file.name, error: 'ce PDF n\'est pas le formulaire de rendez-vous' };
    var nom = f.nom || '', prenom = f.prenom || '', structure = f.structure || '';
    if (!nom && !prenom) return { file: file.name, error: 'nom et prénom non renseignés' };

    var seen = {}, slots = [], warnings = [];
    for (var i = 1; ('date_' + pad(i)) in f; i++) {
      var rawD = f['date_' + pad(i)], rawH = f['heure_' + pad(i)];
      if (!rawD && !rawH) continue;
      var d = normDate(rawD), h = normHeure(rawH);
      if (!d) { warnings.push('créneau ' + i + ' : date ' + (rawD ? '« ' + rawD + ' » illisible' : 'manquante')); continue; }
      if (!h) { warnings.push('créneau ' + i + ' : heure ' + (rawH ? '« ' + rawH + ' » illisible' : 'manquante')); continue; }
      var s = d + ' : ' + h;
      if (!seen[s]) { seen[s] = 1; slots.push(s); }
    }
    if (!slots.length) return { file: file.name, error: 'aucun créneau complet (date + heure)' + (warnings.length ? ' — ' + warnings.join(' ; ') : '') };
    slots.sort(function (a, b) { return sortKey(a) < sortKey(b) ? -1 : 1; });
    return { file: file.name, nom: nom, prenom: prenom, structure: structure, slots: slots, warnings: warnings };
  }

  // lecture par petits lots pour ne pas saturer le navigateur avec 100+ PDF
  async function readAll(files, onProgress) {
    var out = new Array(files.length), next = 0, done = 0;
    async function worker() {
      while (next < files.length) {
        var i = next++;
        out[i] = await readFile(files[i]);
        onProgress(++done, files.length);
      }
    }
    var runners = [];
    for (var k = 0; k < Math.min(4, files.length); k++) runners.push(worker());
    await Promise.all(runners);
    return out;
  }

  function addFiles(fileList) {
    var files = Array.prototype.filter.call(fileList, function (f) { return /\.pdf$/i.test(f.name) || f.type === 'application/pdf'; });
    var ignored = fileList.length - files.length;
    if (!files.length) { toast('Aucun fichier PDF détecté.'); return; }
    if (!window.pdfjsLib) { toast('Lecteur PDF non chargé (connexion internet ?)'); return; }
    var dropT = document.querySelector('#drop .rdv-drop__title'), dropLabel = dropT.textContent;
    readAll(files, function (n, total) { dropT.textContent = 'Lecture… ' + n + ' / ' + total; }).then(function (items) {
      dropT.textContent = dropLabel;
      var added = 0, already = 0;
      items.forEach(function (it) {
        // même fichier déposé deux fois dans la file d'attente
        if (!it.error && state.items.some(function (x) {
          return !x.error && keyOf(x.nom, x.prenom, x.structure, x.slots.join('|')) === keyOf(it.nom, it.prenom, it.structure, it.slots.join('|'));
        })) { already++; return; }
        state.items.push(it); added++;
      });
      render();
      var msg = added + ' formulaire' + (added > 1 ? 's' : '') + ' ajouté' + (added > 1 ? 's' : '');
      if (already) msg += ' · ' + already + ' déjà dans la liste';
      if (ignored) msg += ' · ' + ignored + ' fichier(s) non PDF ignoré(s)';
      toast(msg);
    });
  }

  // ---------- Construction des lignes à écrire ----------
  function plan() {
    var rows = [], seenBatch = new Set(), stats = { ok: 0, dup: 0, err: 0, rows: 0 };
    state.items.forEach(function (it) {
      it.dupSlots = {};
      it.allDup = false;
      if (it.error) { stats.err++; return; }
      if (it.done) return;
      if (state.mode === 'row') {
        var fresh = 0;
        it.slots.forEach(function (s) {
          var k = keyOf(it.nom, it.prenom, it.structure, s);
          if (state.existing.has(k) || seenBatch.has(k)) { it.dupSlots[s] = 1; return; }
          seenBatch.add(k); fresh++;
          rows.push({ item: it, nom: it.nom, prenom: it.prenom, structure: it.structure, date: s });
        });
        it.allDup = fresh === 0;
      } else {
        var txt = it.slots.join('\n');
        var k2 = keyOf(it.nom, it.prenom, it.structure, txt);
        if (state.existing.has(k2) || seenBatch.has(k2)) { it.allDup = true; }
        else {
          seenBatch.add(k2);
          rows.push({ item: it, nom: it.nom, prenom: it.prenom, structure: it.structure, date: txt });
        }
      }
      if (it.allDup) stats.dup++; else stats.ok++;
    });
    stats.rows = rows.length;
    return { rows: rows, stats: stats };
  }

  // ---------- Rendu ----------
  function badge(cls, text) {
    var li = el('li');
    li.appendChild(el('p', 'fr-badge fr-badge--sm ' + cls, text));
    return li;
  }

  function render() {
    document.querySelectorAll('#mode input').forEach(function (r) { r.checked = r.value === state.mode; });

    var p = plan();
    var sum = $('summary'); sum.innerHTML = '';
    var done = state.items.filter(function (i) { return i.done; }).length;
    if (state.items.length) {
      sum.appendChild(badge('fr-badge--no-icon', state.items.length + ' formulaire' + (state.items.length > 1 ? 's' : '')));
      if (p.rows.length) sum.appendChild(badge('fr-badge--info', p.rows.length + ' ligne' + (p.rows.length > 1 ? 's' : '') + ' à créer'));
      if (p.stats.dup) sum.appendChild(badge('fr-badge--warning', p.stats.dup + ' déjà dans Grist'));
      if (p.stats.err) sum.appendChild(badge('fr-badge--error', p.stats.err + ' en erreur'));
      if (done) sum.appendChild(badge('fr-badge--success', done + ' importé' + (done > 1 ? 's' : '')));
    }
    $('import').disabled = !p.rows.length || !state.colMap;
    $('import').textContent = p.rows.length ? 'Importer ' + p.rows.length + ' ligne' + (p.rows.length > 1 ? 's' : '') : 'Importer dans Grist';

    var list = $('files'); list.innerHTML = '';
    if (!state.items.length) { list.appendChild(el('p', 'fr-text--sm rdv-empty', 'Aucun formulaire déposé pour le moment.')); return; }

    state.items.forEach(function (it, idx) {
      var row = el('div', 'rdv-item');
      var st;
      if (it.error) st = el('p', 'fr-badge fr-badge--sm fr-badge--error fr-mb-0', 'Erreur');
      else if (it.done) st = el('p', 'fr-badge fr-badge--sm fr-badge--success fr-mb-0', 'Importé');
      else if (it.allDup) st = el('p', 'fr-badge fr-badge--sm fr-badge--warning fr-mb-0', 'Déjà présent');
      else st = el('p', 'fr-badge fr-badge--sm fr-badge--info fr-mb-0', 'Prêt');
      row.appendChild(st);

      var main = el('div');
      if (it.error) {
        main.appendChild(el('p', 'fr-text--sm rdv-item__who', it.file));
        main.appendChild(el('p', 'fr-message fr-message--error', it.error));
      } else {
        main.appendChild(el('p', 'fr-text--md rdv-item__who', (it.prenom + ' ' + it.nom).trim()));
        main.appendChild(el('p', 'fr-text--sm rdv-item__org', it.structure || '—'));
        var tags = el('ul', 'fr-tags-group');
        it.slots.forEach(function (s) {
          var dup = it.dupSlots[s] || (it.allDup && !it.done);
          var li = el('li');
          var tag = el('p', 'fr-tag fr-tag--sm' + (dup ? ' rdv-tag--dup' : ''), s);
          if (dup) tag.title = 'Déjà présent dans la table';
          li.appendChild(tag);
          tags.appendChild(li);
        });
        main.appendChild(tags);
        (it.warnings || []).forEach(function (w) { main.appendChild(el('p', 'fr-message fr-message--warning', w + ' (ignoré)')); });
        main.appendChild(el('p', 'rdv-item__file', it.file));
      }
      row.appendChild(main);

      var rm = el('button', 'fr-btn fr-btn--tertiary-no-outline fr-btn--sm fr-icon-close-line', 'Retirer');
      rm.type = 'button'; rm.title = 'Retirer ' + it.file + ' de la liste';
      rm.addEventListener('click', function () { state.items.splice(idx, 1); render(); });
      row.appendChild(rm);
      list.appendChild(row);
    });
  }

  // ---------- Import ----------
  async function doImport() {
    var p = plan();
    if (!p.rows.length || !state.colMap) return;
    var btn = $('import'); btn.disabled = true;
    try {
      for (var i = 0; i < p.rows.length; i += CHUNK) {
        btn.textContent = 'Import… ' + Math.min(i + CHUNK, p.rows.length) + '/' + p.rows.length;
        var chunk = p.rows.slice(i, i + CHUNK).map(function (r) {
          var f = {};
          f[state.colMap.Nom] = r.nom;
          f[state.colMap.Prenom] = r.prenom;
          f[state.colMap.Structure] = r.structure;
          f[state.colMap.Date_RDV] = r.date;
          return { fields: f };
        });
        await grist.selectedTable.create(chunk);
      }
      p.rows.forEach(function (r) {
        r.item.done = true;
        state.existing.add(keyOf(r.nom, r.prenom, r.structure, r.date));
      });
      toast(p.rows.length + ' ligne(s) ajoutée(s) dans Grist ✔');
    } catch (e) {
      console.error(e);
      toast('Erreur pendant l\'import : ' + (e && e.message ? e.message : e));
    }
    render();
  }

  // ---------- Événements UI ----------
  var drop = $('drop');
  ['dragenter', 'dragover'].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); });
  });
  ['dragleave', 'drop'].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); });
  });
  drop.addEventListener('drop', function (e) { if (e.dataTransfer && e.dataTransfer.files) addFiles(e.dataTransfer.files); });
  // empêche le navigateur d'ouvrir un fichier lâché à côté de la zone
  window.addEventListener('dragover', function (e) { e.preventDefault(); });
  window.addEventListener('drop', function (e) { e.preventDefault(); });

  $('file-input').addEventListener('change', function (e) { addFiles(e.target.files); e.target.value = ''; });
  $('import').addEventListener('click', doImport);
  $('clear').addEventListener('click', function () { state.items = []; render(); });
  $('mode').addEventListener('change', function (e) {
    if (!e.target.value) return;
    state.mode = e.target.value;
    grist.setOption('mode', state.mode).catch(function () {});
    render();
  });

  // ---------- Grist ----------
  grist.ready({
    requiredAccess: 'full',
    columns: [
      { name: COLS.nom, title: 'Nom', type: 'Text' },
      { name: COLS.prenom, title: 'Prénom', type: 'Text' },
      { name: COLS.structure, title: 'Structure', type: 'Text' },
      { name: COLS.date, title: 'Date de prise de rendez-vous', type: 'Text' }
    ]
  });

  grist.onOptions(function (opts) {
    if (opts && (opts.mode === 'row' || opts.mode === 'cell')) { state.mode = opts.mode; render(); }
  });

  grist.onRecords(function (records, mappings) {
    var ok = mappings && mappings.Nom && mappings.Prenom && mappings.Structure && mappings.Date_RDV;
    state.colMap = ok ? mappings : null;
    $('mapping-warn').style.display = ok ? 'none' : 'block';
    $('status').textContent = ok ? records.length + ' ligne' + (records.length > 1 ? 's' : '') + ' dans la table' : 'Colonnes à associer';
    $('status').className = 'fr-badge fr-badge--no-icon fr-mb-0 ' + (ok ? 'fr-badge--info' : 'fr-badge--warning');
    state.existing = new Set();
    if (ok) {
      var mapped = grist.mapColumnNames(records, mappings) || [];
      mapped.forEach(function (r) {
        state.existing.add(keyOf(r.Nom, r.Prenom, r.Structure, r.Date_RDV));
      });
    }
    render();
  });

  render();
})();
</script>
</body>
</html>
